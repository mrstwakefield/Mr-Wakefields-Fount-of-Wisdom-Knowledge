<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr Wakefield's Fount of Knowledge and Wisdom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F7; --card:#FFFFFF; --ink:#18203A; --muted:#566082; --line:#D3D9E6; --soft:#E3E8F2;
  --good:#1C8A5E; --good-bg:#DDF3E8; --warn:#B4531B; --warn-bg:#FBE7D9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121829; --card:#1B233B; --ink:#E9EDF7; --muted:#9CA6C2; --line:#2B3557; --soft:#232C49;
    --good:#4CC896; --good-bg:#153A2E; --warn:#F39A63; --warn-bg:#3E2616; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121829; --card:#1B233B; --ink:#E9EDF7; --muted:#9CA6C2; --line:#2B3557; --soft:#232C49;
  --good:#4CC896; --good-bg:#153A2E; --warn:#F39A63; --warn-bg:#3E2616; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #4D7CFE;outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,56px);line-height:.95;letter-spacing:-.02em;margin:0}
h1 span{display:block;font-size:.42em;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:10px;line-height:1.2}
h1 span b{font-weight:500}
.meter{min-width:220px;flex:0 1 300px}
.meter p{margin:0 0 6px;font-size:15px;color:var(--muted)}
.meter b{color:var(--ink);font-family:var(--display);font-size:22px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:14px;width:max-content;max-width:100%;margin-bottom:18px}
.tabs button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}

/* topics */
.topics{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;margin-bottom:22px}
.topics-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.topics-head h2{font-family:var(--display);font-size:18px;margin:0;font-weight:700}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 6px;font-size:15px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:8px}
.chip{--c:#888;display:flex;flex-direction:column;align-items:stretch;gap:5px;border:2px solid var(--line);background:transparent;border-radius:12px;padding:8px 11px 9px;text-align:left;min-width:0;transition:border-color .15s,background .15s}
.chip .row{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;line-height:1.2}
.chip .dot{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none;opacity:.35}
.chip .foot2{display:flex;align-items:center;gap:8px}
.chip .n{font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap}
.chip .bar{flex:1;height:5px;border-radius:9px;background:var(--soft);overflow:hidden}
.chip .bar i{display:block;height:100%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent)}
.chip[aria-pressed="true"] .dot{opacity:1}
.chip[aria-pressed="false"]{color:var(--muted)}

/* shared */
.panel[hidden]{display:none}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:8px 14px;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:12px;font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.warn{background:transparent;border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.4;cursor:default}
.muted{color:var(--muted)}
kbd{font-family:var(--body);font-size:12px;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.7;margin-left:6px}
.spacer{flex:1}

/* flashcard: the one bold thing */
.stage{perspective:1600px}
.card{--c:#888;position:relative;display:grid;min-height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 34px 30px 46px;display:flex;flex-direction:column}
.face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:var(--c);border-radius:20px 0 0 20px}
.face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--c) 6%,var(--card))}
.tag{font-size:14px;font-weight:700;color:var(--c);display:flex;justify-content:space-between;gap:10px;position:relative}
.tag .muted{font-weight:400}
.q{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.6vw,36px);line-height:1.15;letter-spacing:-.01em;margin:auto 0;padding:20px 0}
.face.back .q-small{font-size:15px;color:var(--muted);margin:14px 0 10px;position:relative}
.a{font-size:clamp(18px,2.2vw,21px);line-height:1.55;position:relative;margin-bottom:auto}
.a ul{margin:0;padding-left:1.1em}
.a li{margin:3px 0}
.a li::marker{color:var(--c)}
.hint{position:relative;margin-top:14px;font-size:14px;color:var(--muted)}
.card-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.card-actions .btn{flex:1 1 120px}
.nav{display:flex;gap:8px}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:44px;height:44px;font-size:20px}
.progressline{height:4px;background:var(--soft);border-radius:4px;margin:0 0 14px;overflow:hidden}
.progressline i{display:block;height:100%;background:var(--ink);transition:width .3s}

.empty{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:40px 28px;text-align:center}
.empty h3{font-family:var(--display);font-size:26px;margin:0 0 8px}
.empty p{margin:0 auto 18px;max-width:46ch;color:var(--muted)}

/* quiz */
.quiz-q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 28px;border-top:10px solid var(--c)}
.quiz-q .q{margin:10px 0 18px;padding:0;font-size:clamp(22px,3vw,30px)}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:12px 14px;resize:vertical;font-size:17px;line-height:1.5}
textarea:focus{border-color:var(--c);outline:none}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.compare > div{border-radius:12px;padding:14px 16px;background:var(--soft)}
.compare h4{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:700}
.compare .model{background:color-mix(in srgb,var(--c) 12%,var(--card))}
@media (max-width:640px){.compare{grid-template-columns:1fr}}
.score{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;margin:0}
.results{list-style:none;padding:0;margin:20px 0;text-align:left;display:grid;gap:8px}
.results li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 44px;position:relative}
.results li::before{position:absolute;left:14px;top:11px;font-weight:800;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.results li.ok::before{content:"✓";background:var(--good-bg);color:var(--good)}
.results li.no::before{content:"✗";background:var(--warn-bg);color:var(--warn)}
.results li .ans{font-size:15px;color:var(--muted);margin-top:4px}
.size-pick{display:flex;gap:10px;justify-content:center;margin:0 0 20px;flex-wrap:wrap}
.size-pick button{width:74px;height:74px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-weight:800;font-size:28px}
.size-pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

/* browse */
.search{flex:1 1 260px;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:10px 14px;font-size:16px}
.search:focus{border-color:var(--ink);outline:none}
.list{display:grid;gap:8px}
.item{--c:#888;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px}
.item summary{list-style:none;padding:13px 16px;cursor:pointer;display:flex;gap:12px;align-items:baseline}
.item summary::-webkit-details-marker{display:none}
.item summary .num{font-size:13px;color:var(--muted);min-width:2.6em}
.item summary .qt{font-weight:700;flex:1}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.k{background:var(--good-bg);color:var(--good)}
.pill.l{background:var(--warn-bg);color:var(--warn)}
.item .body{padding:0 16px 14px calc(16px + 2.6em + 12px)}
.item .body .a{font-size:17px}
.item .body .mini{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.item .body .mini button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:5px 12px;font-size:14px}
.item .body .mini button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
mark{background:#FFE17A;color:#18203A;border-radius:3px;padding:0 1px}
.foot{margin-top:40px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

@media (max-width:560px){
  .wrap{padding:18px 14px 40px}
  .face{padding:24px 20px 24px 34px}
  .face::before{width:10px}
  .card{min-height:300px}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .chip{padding:6px 9px 7px;border-width:1.5px}
  .chip .row{font-size:14px}
  .topics{padding:12px 10px 10px}
  .card-actions .nav{order:3;width:100%;justify-content:center}
  .tabs{width:100%}.tabs button{flex:1;padding:9px 6px}
}
@media (hover:none){kbd{display:none}}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .progressline i{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Mr Wakefield's Fount of Knowledge and Wisdom<span>A-level psychology revision, <b id="totalQ"></b> questions</span></h1>
    <div class="meter" aria-live="polite">
      <p><b id="knownCount">0</b> known · <span id="learningCount">0</span> still learning</p>
      <div class="stack" id="stack" aria-hidden="true"></div>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="Revision mode">
    <button role="tab" aria-selected="true" data-tab="cards" id="tab-cards" aria-controls="p-cards">Flashcards</button>
    <button role="tab" aria-selected="false" data-tab="quiz" id="tab-quiz" aria-controls="p-quiz">Quick quiz</button>
    <button role="tab" aria-selected="false" data-tab="browse" id="tab-browse" aria-controls="p-browse">Browse all</button>
  </div>

  <section class="topics" aria-labelledby="topicsTitle">
    <div class="topics-head">
      <h2 id="topicsTitle">Topics to revise</h2>
      <div><button class="linkbtn" id="allTopics">Select all</button><button class="linkbtn" id="noTopics">Clear</button></div>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <!-- FLASHCARDS -->
  <section class="panel" id="p-cards" role="tabpanel" aria-labelledby="tab-cards">
    <div class="bar-row">
      <div class="seg" role="group" aria-label="Which cards">
        <button aria-pressed="true" data-filter="all">All cards</button>
        <button aria-pressed="false" data-filter="notknown">Not known yet</button>
        <button aria-pressed="false" data-filter="learning">Still learning</button>
      </div>
      <span class="spacer"></span>
      <button class="btn ghost" id="shuffleBtn" style="padding:8px 14px">Shuffle a new deck</button>
    </div>
    <div id="cardArea"></div>
  </section>

  <!-- QUIZ -->
  <section class="panel" id="p-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
    <div id="quizArea"></div>
  </section>

  <!-- BROWSE -->
  <section class="panel" id="p-browse" role="tabpanel" aria-labelledby="tab-browse" hidden>
    <div class="bar-row">
      <input class="search" id="search" type="search" placeholder="Search questions and answers, e.g. Milgram" aria-label="Search questions and answers">
      <span class="muted" id="browseCount"></span>
    </div>
    <div class="list" id="list"></div>
    <p class="muted" id="moreWrap" style="text-align:center"></p>
  </section>

  <footer class="foot">
    <span>Your progress is saved in this browser only.</span>
    <button class="linkbtn" id="resetBtn">Reset my progress</button>
  </footer>
</div>

<script>
const DATA = [{"id":1,"q":"Who was Wundt?","a":"The ‘father of psychology’","t":"Approaches"},{"id":2,"q":"What did Wundt do?","a":"Opened first lab in Leipzig, used introspection to study consciousness","t":"Approaches"},{"id":3,"q":"What is introspection?","a":"A method where subjects analyse their own thoughts and feelings in relation to a stimulus (studies sensation and perception) using a standardised procedure","t":"Approaches"},{"id":4,"q":"What are the limitations of introspection?","a":"Subjective, unfalsifiable","t":"Approaches"},{"id":5,"q":"How did Wundt attempt to make introspection scientific?","a":"He used standardised procedures in a controlled environment","t":"Approaches"},{"id":6,"q":"What features make something a science? (5)","a":"Hypothesis testing, Objectivity, Replicability, Falsifiability, Empirical","t":"Approaches"},{"id":7,"q":"Which approaches take the most scientific (nomothetic) approach to psychology?","a":"Behaviourist, Cognitive, Biological","t":"Approaches"},{"id":8,"q":"Which approaches take the least scientific approach to psychology?","a":"Humanistic, Psychodynamic","t":"Approaches"},{"id":9,"q":"What are the assumptions of the behaviourist approach? (3)","a":"All behaviour is learnt, Animals and humans learn in the same way, We a born a blank slate","t":"Approaches"},{"id":10,"q":"How would you describe the research methods used by the behaviourist approach?","a":"Use experimental method, with animals as subjects, looking for quantifiable behaviour","t":"Approaches"},{"id":11,"q":"Who proposed classical conditioning as a way of learning?","a":"Pavlov","t":"Approaches"},{"id":12,"q":"How was Classical conditioning first identified?","a":"Pavlov’s dogs study – salivating at the sound of a bell that indicated food was coming.","t":"Approaches"},{"id":13,"q":"Describe the process of classical conditioning (you don’t have to use an example).","a":"Unconditioned Stimulus → Unconditioned Response (usually a pre existing reflex, but can be a previously learnt behaviour), Neutral Stimulus → No response, US + NS → UR (repeated pairing of these means eventually the NS becomes…), Conditioned Stimulus → Conditioned Response","t":"Approaches"},{"id":14,"q":"What is generalisation in Classical conditioning?","a":"When stimuli similar to the original CS produce the same response","t":"Approaches"},{"id":15,"q":"What is extinction in classical conditioning?","a":"Where the CR stops being produced by the CS","t":"Approaches"},{"id":16,"q":"Who proposed operant conditioning as a way of learning?","a":"Skinner","t":"Approaches"},{"id":17,"q":"How would you explain the difference between classical and operant conditioning?","a":"Classical conditioning is learning by association, operant conditioning is learning by reinforcement","t":"Approaches"},{"id":18,"q":"List the three types of reinforcement key to explaining operant conditioning.","a":"Positive reinforcement, Negative reinforcement, Punishment","t":"Approaches"},{"id":19,"q":"Outline positive reinforcement in operant conditioning.","a":"Behaviour is more likely to be repeated as a result of reward","t":"Approaches"},{"id":20,"q":"Outline negative reinforcement in operant conditioning.","a":"Behaviour is more likely to be repeated as a result of removing a negative stimulus","t":"Approaches"},{"id":21,"q":"Outline punishment in operant conditioning.","a":"Behaviour is less likely to be repeated as a result of addition of a negative stimulus","t":"Approaches"},{"id":22,"q":"What element of psychopathology have we explained with the behaviourist approach?","a":"Phobias","t":"Approaches"},{"id":23,"q":"What is the strength of the behaviourist approach?","a":"Lots of experimental evidence → scientific credibility, Application to treatment of phobias and modification of problematic behaviour (dealing with offending)","t":"Approaches"},{"id":24,"q":"What are the problems with the behaviourist approach?","a":"Generalising from animal studies, Ethical issues associated with animal research, Reductionist & Deterministic","t":"Approaches"},{"id":25,"q":"Which side of the nature nurture debate is the behaviourist approach on?","a":"Nurture","t":"Approaches"},{"id":26,"q":"What is the name given to psychologists who subscribe to the behaviourist approach?","a":"Empiricists","t":"Approaches"},{"id":27,"q":"What is the learning approach developed by Bandura called?","a":"Social learning theory","t":"Approaches"},{"id":28,"q":"What are the assumptions of Social Learning theory?","a":"The same as the behaviourist approach + addition of the importance of role models","t":"Approaches"},{"id":29,"q":"Describe the key idea behind SLT.","a":"We learn a lot of behaviour through role models using cognitive mediational processes.","t":"Approaches"},{"id":30,"q":"Explain the role of modelling and where our role models come from in SLT.","a":"We observe and imitate a role model, this requires us to identify with that role model. This is more likely if they are the same gender as ourselves, considered attractive, or are of higher social status.","t":"Approaches"},{"id":31,"q":"Describe vicarious reinforcement in SLT.","a":"We learn by seeing others rewarded for a behaviour and then imitate those behaviours that are rewarded.","t":"Approaches"},{"id":32,"q":"What are the 4 mediational processes in SLT?","a":"Attention, Retention, Motor reproduction, Motivation","t":"Approaches"},{"id":33,"q":"Describe how the 4 mediation processes in SLT relate to learning and performing behaviours we have observed.","a":"Learning = attention – see the behaviour, and retention – remember the behaviour and it’s consequences, Performance = motor reproduction – the ability to reproduce the behaviour, and motivation – whether we want to perform the behaviour or not (largely based on whether we saw it reinforced or not)","t":"Approaches"},{"id":34,"q":"Outline the procedure for Bandura’s original research which formed the basis of SLT.","a":"Studied learnt aggression, 36 boys and 36 girls, matched pairs design, 3 conditions, 1) Adult hits BoBo doll, 2) Adult ignores BoBo doll and plays nicely with other toys, 3) No adult models, Children put into play room and observed for 20 minutes","t":"Approaches"},{"id":35,"q":"Outline the findings of Bandura’s original research for SLT.","a":"Children exposed to aggressive role models also played aggressively, children with non-aggressive role models also played non-aggressively. Children without a role model were slightly more aggressive in their play than the non-aggressive children.","t":"Approaches"},{"id":36,"q":"What conclusion was drawn from Bandura’s original research for SLT?","a":"Aggressive behaviour is learnt through imitation of role models.","t":"Approaches"},{"id":37,"q":"As well as his original BoBo doll study, what other versions did Bandura conduct?","a":"Children saw the adults playing aggressively/non-aggressively on TV. Children saw fantasy characters playing aggressively/non-aggressively.","t":"Approaches"},{"id":38,"q":"What conclusions was Bandura able to draw from his extra variations of the BoBo doll study?","a":"The role model does not have to be physically present for imitation to occur. Imitation is more likely when the role model was same gender as the observer, but this is not essential.","t":"Approaches"},{"id":39,"q":"What are the strengths of Bandura’s BoBo doll study?","a":"Well controlled, so high reliability and replication","t":"Approaches"},{"id":40,"q":"What are the weaknesses of Bandura’s BoBo doll study?","a":"Low ecological validity, Hard to generalise (all children from same school), Possible demand characteristics","t":"Approaches"},{"id":41,"q":"Which two approaches is Bandura trying to combine in SLT?","a":"Behaviourist and Cognitive","t":"Approaches"},{"id":42,"q":"What are the implications of SLT?","a":"Need to look carefully at role models provided for children – need for male teachers, look at the media, behaviour of those in high profile positions needs to recognise influence it can have (could link to criminal behaviour)","t":"Approaches"},{"id":43,"q":"What are the strengths of SLT?","a":"Less reductionist than behaviourism – recognises a role for cognitive processes, Has experimental evidence, Can explain cultural differences","t":"Approaches"},{"id":44,"q":"What are the weaknesses of SLT?","a":"Ignores biological factors (still reductionist), Basis in lab studies","t":"Approaches"},{"id":45,"q":"What are the key ideas underlying the cognitive approach?","a":"Behaviour results from cognitive processes e.g. perception, language, attention, memory, Inferences about processes can be made from examining resulting behaviours, Mind functions like a computer, Schemas","t":"Approaches"},{"id":46,"q":"What types of research methods would cognitive psychologists use?","a":"Lab, field and natural experiments, Occasionally introspection, Some use of brain imaging in cog. neuroscience","t":"Approaches"},{"id":47,"q":"Describe the cognitive computer analogy.","a":"Information enters through senses, like computers use a keyboard, Signals are passed through the brain (neurons) like wires in computers, The brain acts like the central processor in a computer, encoding and storing information, Information is passed back out of the brain for action (retrieval) like output to a computer monitor","t":"Approaches"},{"id":48,"q":"What is a schema and what purpose does it have?","a":"A schema is a model that contains all needed information about an object, action of concept, learned through experiences (3 types – role, event and self). These allow us to make mental shortcuts to process information more quickly and to prevent us being overwhelmed by incoming stimuli.","t":"Approaches"},{"id":49,"q":"What are the limitations of the computer analogy used in the cognitive approach?","a":"Ignores role of emotion, Human memory is unreliable, computer memory is not, Humans are thought to have at least some free will, computers do not","t":"Approaches"},{"id":50,"q":"How do schemas change as we learn?","a":"Begin with basic schema’s – sucking and grasping. New information is either assimilated (incorporated into an existing schema – if consistent with existing knowledge) or accommodated (put into a new schema/an existing schema is altered – if inconsistent with existing knowledge)","t":"Approaches"},{"id":51,"q":"What are the problems caused by schemas?","a":"Prejudice and stereotypes can develop which then affect interpretation of new information. Can prevent learning of new information if we ignore information that we cannot fit into an already existing schema.","t":"Approaches"},{"id":52,"q":"What is cognitive neuroscience?","a":"Aims to use brain imaging to map behaviour to brain function in an effort to identify where and how particular mental processes take place.","t":"Approaches"},{"id":53,"q":"Which elements of psychopathology have we explained with the cognitive approach?","a":"Depression, Schizophrenia","t":"Approaches"},{"id":54,"q":"What are the strengths of the cognitive approach?","a":"Application to Cognitive Behaviour therapy, Has experimental evidence","t":"Approaches"},{"id":55,"q":"What are the weaknesses of the cognitive approach?","a":"Machine reductionism, Reliance of inferences","t":"Approaches"},{"id":56,"q":"Outline the biological approach in psychology.","a":"Human behaviour results from biological factors such as hormones, genetics, evolution and the nervous system.","t":"Approaches"},{"id":57,"q":"What are the research methods used by the biological approach?","a":"Brain scanning, Animal studies, Twin and adoption studies","t":"Approaches"},{"id":58,"q":"Define genotype within the biological approach.","a":"The genetic makeup of a person (their alleles)","t":"Approaches"},{"id":59,"q":"Define phenotype within the biological approach.","a":"The resulting characteristics which are a produce of the genotype interacting with the environment.","t":"Approaches"},{"id":60,"q":"What do most biological psychologists believe is the role of genetics in psychopathology?","a":"Genes can make you vulnerable to developing mental illness or addiction (diathesis-stress model), often as a result of altering neurochemistry","t":"Approaches"},{"id":61,"q":"How do biological psychologists describe the role of genes?","a":"Genes code for behaviours in the same way that they code for physical characteristics, genetics can cause mental illness as well as explain traits like gender, intelligence, personality etc.","t":"Approaches"},{"id":62,"q":"What is the role of evolution for a biological psychologist?","a":"Certain behaviours are very common because they are ‘left over’ from processes that previously gave us a survival advantage in our early evolutionary environment e.g. certain phobias, preference for fatty/sugary food, and as a result have been passed down through the generations.","t":"Approaches"},{"id":63,"q":"How do twin studies provide evidence for the biological approach to explaining behaviour?","a":"Higher concordance rates in MZ than DZ twins suggests increased similarity must be a result of the increase in shared genetics (100% for MZ, 50% for DZ) given that it is assumed pairs of twins are raised in the same environments.","t":"Approaches"},{"id":64,"q":"What is a concordance rate (used by the biological approach in twin/family studies)?","a":"A measure of similarity – the rate of probability that two people will show the same characteristic/behaviour.","t":"Approaches"},{"id":65,"q":"What is the major problem for the biological approach caused by results of twin studies?","a":"We never get 100% concordance suggesting that genes alone can never explain a particular illness/behaviour.","t":"Approaches"},{"id":66,"q":"As well as using twin studies what other concordance rates can psychologists examine?","a":"Adopted children with the biological and adoptive parents, Different levels of relation e.g. parents, aunts, uncles etc.","t":"Approaches"},{"id":67,"q":"If a characteristic or a disorder has a higher % occurrence within a family than in the general population (even if the figures are low) what does this suggest to biological psychologists?","a":"That there is likely to be a genetic element to the disorder.","t":"Approaches"},{"id":68,"q":"Why do biological psychologists need to be careful about relying on findings from twin studies/rates of disorder in families?","a":"It is never really possible to fully separate nature and nurture (best option is adoption studies)","t":"Approaches"},{"id":69,"q":"What are the strengths of the biological approach?","a":"Good experimental evidence → scientific credibility, Biological causes allow for development of biological treatments","t":"Approaches"},{"id":70,"q":"What are the weaknesses of the biological approach?","a":"Ignores environmental factors e.g. family/social situation, Deterministic (removing responsibility)","t":"Approaches"},{"id":71,"q":"Who developed the psychodynamic approach?","a":"Freud","t":"Approaches"},{"id":72,"q":"What are the assumptions of the psychodynamic approach?","a":"Behaviour is caused by unconscious forces driven largely by basic biological motivations present from birth (the Id and it’s resulting libido energy), Early childhood experience is particular important in the development of personality and later mental health problems","t":"Approaches"},{"id":73,"q":"List the 3 levels of consciousness identified in the psychodynamic approach. Label them on an iceberg.","a":"Conscious, Preconscious, Unconscious","t":"Approaches"},{"id":74,"q":"Outline Freud’s description of the conscious mind.","a":"What we are aware of at any given time","t":"Approaches"},{"id":75,"q":"Outline Freud’s description of the preconscious mind.","a":"Memories that we can recall when required","t":"Approaches"},{"id":76,"q":"Outline Freud’s description of the unconscious.","a":"Made up of memories, desires and fears that cause anxiety/distress so have been repressed, but they still influence behaviour.","t":"Approaches"},{"id":77,"q":"How did Freud attempt to identify concepts buried in the unconscious mind of his patients?","a":"Free word associations, identifying ‘Freudian slips’ (parapraxis), discussing dreams","t":"Approaches"},{"id":78,"q":"According to Freud, what are the three parts of the personality?","a":"Id, Ego, Superego","t":"Approaches"},{"id":79,"q":"What is the Id in the psychodynamic approach?","a":"The basic, animal instinct part of the personality. Generates the libido (energy resulting from innate, aggressive and sexual instincts).","t":"Approaches"},{"id":80,"q":"What principle does the Id operate on according to Freud?","a":"Operates on the pleasure principle","t":"Approaches"},{"id":82,"q":"According to Freud, when does the Id develop?","a":"Present from birth","t":"Approaches"},{"id":83,"q":"Where is the Id within the 3 levels of consciousness?","a":"Unconscious","t":"Approaches"},{"id":84,"q":"What is the Ego in the psychodynamic approach?","a":"The rational part of the mind that acts as a mediator to balance the demands of the other parts of the personality.","t":"Approaches"},{"id":85,"q":"What principle does the Ego operate on according to Freud?","a":"Reality principle","t":"Approaches"},{"id":86,"q":"According to Freud, when does the Ego develop?","a":"Around 1-2 years old (in the anal phase of development)","t":"Approaches"},{"id":87,"q":"Where is the Ego within the 3 levels of consciousness?","a":"In both the conscious and unconscious mind","t":"Approaches"},{"id":88,"q":"What is the Superego in the psychodynamic approach?","a":"Takes moral considerations, responsible for feelings such as guilt. Includes ideas about appropriate behaviour adopted from the same sex parent.","t":"Approaches"},{"id":89,"q":"What principle does the Superego operate on according to Freud?","a":"Morality principle","t":"Approaches"},{"id":90,"q":"According to Freud, when does the Superego develop?","a":"Around 4-5 years old (at the end of the phallic stage and resolution of the Oedipus/Electra complex)","t":"Approaches"},{"id":91,"q":"Where is the Superego within the 3 levels of consciousness?","a":"Largely unconscious but some conscious (e.g. when making moral decisions/feeling guilt)","t":"Approaches"},{"id":92,"q":"Freud outlined defence mechanisms used by the Ego to cope with the demands of the conflict caused by the Id/superego or traumatic events. Which three do you need to know?","a":"Repression, Denial, Displacement","t":"Approaches"},{"id":93,"q":"Outline the defence mechanism of repression proposed by Freud.","a":"The ego prevents distressing thoughts from entering the conscious mind","t":"Approaches"},{"id":94,"q":"Outline the defence mechanism of denial proposed by Freud.","a":"A threatening event or unwanted reality is ignored/blocked from conscious awareness","t":"Approaches"},{"id":95,"q":"Outline the defence mechanism of displacement proposed by Freud.","a":"A negative impulse is directed onto something else","t":"Approaches"},{"id":96,"q":"What are the 5 stages of psychosexual development outlined by Freud?","a":"Oral, Anal, Phallic, Latent, Gential","t":"Approaches"},{"id":97,"q":"At what age does each stage of psychosexual development take place?","a":"Oral – 0-1 year, Anal – 1-2 years, Phallic – 3-5 years, Latent – 6 years until puberty, Genital – puberty onwards","t":"Approaches"},{"id":98,"q":"Where is the focus of libido at each psychosexual stage of development?","a":"Oral – mouth and sucking behaviours, Anal – anal/bladder control, Phallic – genital differences, Latent – repression of sexual urges, Genital – awakening or sexual urges directed toward intercourse","t":"Approaches"},{"id":99,"q":"Outline the Oedipus complex as explained by Freud, that has to be resolved during the phallic stage of psychosexual development.","a":"Boys develop unconscious sexual desires for their mother and resent their father. Develop castration anxiety as a result. Identify with father to resolve this conflict, taking on his super ego and gender identity.","t":"Approaches"},{"id":100,"q":"What is fixation according to Freud?","a":"Fixation is a failure to resolve the necessary conflict at any psychosexual stage of development, and will result in characteristic behaviours/problems in the adult.","t":"Approaches"},{"id":101,"q":"What are the strengths of the psychodynamic approach?","a":"Highly influential for first half of 19th Century, first approach to look for psychological rather than physical causes of disorders, Applications to successful therapies like psychoanalysis, Emphasis on childhood linking to later development has formed basis for other important theories. Acknowledges nature and nurture","t":"Approaches"},{"id":102,"q":"What are the limitations of the psychodynamic approach?","a":"Based on idiographic evidence – issues of generalisation, Subjective nature of evidence, Unfalsifiable, Emphasis on the past rather than the present (ignores other factors that may be important)","t":"Approaches"},{"id":103,"q":"What are the assumptions of the humanistic approach?","a":"It is inappropriate to use a scientific approach to study human behaviour as it is reductionist. Need for holistic view of the whole person. People are inherently good and are innately driven to try to reach their full potential. People have free will. Behaviour is a result of subjective feelings and thoughts of self, and as a result should be studied as individuals (idiographic)","t":"Approaches"},{"id":104,"q":"Who are the key psychological figures in the Humanistic approach?","a":"Maslow and Rogers","t":"Approaches"},{"id":105,"q":"What are the 5 levels of Maslow’s hierarchy of needsm starting from the bottom of the pyramid?","a":"Physiological needs (basic), Safety needs (basic), Love and belongingness (psychological), Esteem (psychological), Self-actualisation","t":"Approaches"},{"id":106,"q":"What does Maslow’s hierarchy of needs explain about behaviour?","a":"What is motivating an individual’s current behaviour","t":"Approaches"},{"id":107,"q":"How does Maslow explain his hierarchy?","a":"People use their motivation to climb the hierarchy, spending our whole lives trying to reach the top. You can only move up the hierarchy once all needs at the previous levels have been met.","t":"Approaches"},{"id":108,"q":"Explain ‘Self-actualisation’ as outlined by Maslow.","a":"Occurs when all needs are fulfilled, consists of a strong sense of self awareness, full acceptance of self and others, ability to deal with uncertainty, strong sense of creativity.","t":"Approaches"},{"id":109,"q":"What are the strengths and weaknesses of Maslow’s hierarchy of needs?","a":"+ Face validity, - culture biased, - assumes all have the ability to self-actualise, possibly not actually generalizable, - based on an unrepresentative sample, - limited explanatory power","t":"Approaches"},{"id":110,"q":"What were the key humanistic concepts generated by Rogers?","a":"Self-actualisation depends on a person’s thoughts about themselves. Differences (incongruence) between the self-concept (how we see ourselves) and ideal-self (how we wish to be/to be seen) can cause problems such as anxiety and depression. Self-concept is thought to be determined by whether a person receives unconditional positive regard or conditions of worth from others.","t":"Approaches"},{"id":111,"q":"Define the self- concept as explained by Rogers.","a":"How we see ourselves","t":"Approaches"},{"id":112,"q":"Define the ideal-self as explained by Rogers.","a":"How we will to be/to be seen","t":"Approaches"},{"id":113,"q":"What is incongruence in the humanistic approach?","a":"When the self-concept and the ideal self are mismatched","t":"Approaches"},{"id":114,"q":"What was the name of the therapy developed by Rogers based on the humanistic approach?","a":"Client centred therapy","t":"Approaches"},{"id":115,"q":"What does CCT (based on the humanistic approach) aim to do?","a":"Reduce incongruence (to alleviate anxiety and depression but is useful for anyone!)","t":"Approaches"},{"id":116,"q":"How does CCT (based on the humanistic approach) work?","a":"Client is in charge of the discussions, and they have to solve their own problems. The therapist is there to help make the client aware of their thoughts, actions and behaviours by rephrasing sentences and repeating them back, always showing unconditional positive regard throughout the process.","t":"Approaches"},{"id":117,"q":"What are the strengths of the humanistic approach?","a":"Positive approach, Supports idea of free will (good for mental health), Idiographic → in depth understanding (Not reductionist), Therapy (CCT) is successful and applied in a huge number of different settings","t":"Approaches"},{"id":118,"q":"What are the limitations of the humanistic approach?","a":"Lacks objectivity, Cannot generalise, Limited explanatory power","t":"Approaches"},{"id":119,"q":"What are self-report techniques?","a":"Any method in which a person is asked to state their own feelings, opinions, behaviours or experiences related to a given topic.","t":"RM"},{"id":120,"q":"What is a questionnaire?","a":"A set of written questions used to access a persons’ thoughts or experiences.","t":"RM"},{"id":121,"q":"Give a strength of a questionnaire.","a":"Any one from; cost effective, lots of data quickly, completed without research present (easy)","t":"RM"},{"id":122,"q":"Give a weakness of a questionnaire.","a":"Any one from; response bias, misunderstanding questions, Demand characteristics/social desirability","t":"RM"},{"id":123,"q":"What are open questions?","a":"No fixed answer, can have many different kinds of response.","t":"RM"},{"id":124,"q":"What are closed questions?","a":"Fixed answer required, choice of answers is determined by the question setter.","t":"RM"},{"id":125,"q":"What are the benefits of closed questions?","a":"Quick and easy to answer, data is easier to analyse","t":"RM"},{"id":126,"q":"What are the drawbacks of closed questions?","a":"No detail/depth, can’t get the meaning behind an answer","t":"RM"},{"id":127,"q":"What are the benefits of open questions?","a":"More detailed information, more depth in answers","t":"RM"},{"id":128,"q":"What are the drawbacks of open questions?","a":"Harder to analyse, people occasionally miss them out as they can’t be bothered to answer them","t":"RM"},{"id":129,"q":"What is an interview?","a":"A live encounter (face to face or over the phone) where one person asks a set of questions to assess an interviewees thoughts/experiences.","t":"RM"},{"id":130,"q":"What are the three types of interview?","a":"Structured, semi structured or unstructured.","t":"RM"},{"id":131,"q":"What is a structured interview?","a":"Made up of pre-determined questions asked in a fixed order (a face to face questionnaire)","t":"RM"},{"id":132,"q":"What is an unstructured interview?","a":"Works like a conversation, no set questions, a topic is discussed but interaction is free flowing.","t":"RM"},{"id":133,"q":"What is a semi-structured interview?","a":"List of questions worked out in advance but if interviewers wish they can ask follow up questions where they feel it is appropriate.","t":"RM"},{"id":134,"q":"What are the strengths of an unstructured interview?","a":"More detailed answers as people elaborate more, more flexible to gain more insight","t":"RM"},{"id":135,"q":"What are the drawbacks of an unstructured interview?","a":"Not easy to replicate, not easy to analyse, increase risk of experimenter effects","t":"RM"},{"id":136,"q":"Why is ambiguity a problem in questionnaires and interviews?","a":"It means questions can be interpreted in various ways, meaning different things to different people.","t":"RM"},{"id":137,"q":"Why are loaded questions a problem in questionnaires and interviews?","a":"These questions contain emotive language which is likely to produce an emotional reaction in the respondent.","t":"RM"},{"id":138,"q":"What is an aim?","a":"A general statement that the research intends to investigate.","t":"RM"},{"id":139,"q":"What is an hypothesis?","a":"A detailed statement which is clear, precise and operationalized, stating the relationship between the variables being tested.","t":"RM"},{"id":140,"q":"What is a directional hypothesis?","a":"One-tailed – the difference or relationship between the two conditions is stated.","t":"RM"},{"id":141,"q":"What is the non-directional hypothesis?","a":"Two-tailed – simply states that there could be a relationship or difference but does not state what this will be.","t":"RM"},{"id":142,"q":"What is the null hypothesis?","a":"Every experiment has one, it says there will be no relationship between the two variables.","t":"RM"},{"id":143,"q":"What is a meta-analysis?","a":"Data from a large number of studies that used the same research question and method are combined (secondary data)","t":"RM"},{"id":144,"q":"Define quantitative data.","a":"Data in the form of numbers and frequencies, can be counted.","t":"RM"},{"id":145,"q":"Define qualitative data.","a":"Data in the form of words that describes meanings and experiences.","t":"RM"},{"id":146,"q":"Explain what primary data is.","a":"Information obtained first hand by the researcher for the purpose of the current study.","t":"RM"},{"id":147,"q":"Explain what secondary data is.","a":"Information that has previously been collected, not necessarily for the purpose of the current study.","t":"RM"},{"id":148,"q":"Why are ethical guidelines important?","a":"They ensure the protection of participants, researchers and institutions.","t":"RM"},{"id":149,"q":"What are the 4 key ethical guidelines published by the BPS (British Psychological Society)?","a":"Informed consent, avoid deception, right to withdraw, protection from harm","t":"RM"},{"id":150,"q":"Outline what informed consent is?","a":"Making sure participants fully understand what they are letting themselves in for and agree to take part in a study. Must come from parents if participants are under 16.","t":"RM"},{"id":151,"q":"What is the ethical issue of deception?","a":"Information is withheld from participants – they have been misled about the purpose of the study and what will happen during it.","t":"RM"},{"id":152,"q":"What is the right to withdraw?","a":"Participants should be told at the start of the research that they have this right, and no attempts should be made to encourage them to remain.","t":"RM"},{"id":153,"q":"Which ethical issue must be addressed by a debrief if it has been breached for the purpose of the research?","a":"Deception","t":"RM"},{"id":154,"q":"What is a debrief?","a":"Researchers should discuss the aims of the research with the participants, making sure that they understand how they’ve contributed.","t":"RM"},{"id":155,"q":"What is an independent variable?","a":"The aspect of an experimental situation which is changed by the researcher or changes naturally.","t":"RM"},{"id":156,"q":"What is a dependent variable?","a":"The variable that is measured by the researcher, any change should be a result of the change in the IV.","t":"RM"},{"id":157,"q":"What is an extraneous variable?","a":"Variables other than the IV that could have an effect on the DV if not controlled.","t":"RM"},{"id":158,"q":"What is a confounding variable?","a":"A variable that hasn’t been controlled and changes systematically with your IV and DV, meaning it could be an alternative explanation for your results. (Not all extraneous variables are confounding variables.)","t":"RM"},{"id":159,"q":"What does operationalization mean?","a":"Devising a clear way of measuring/changing a variable.","t":"RM"},{"id":161,"q":"What are the features of a lab experiment?","a":"Takes place in a controlled environment where the research changes the IV and records the effect on the DV whilst controlling all extraneous variables. The participants should be randomly allocated to a condition.","t":"RM"},{"id":162,"q":"State the 4 advantages of a lab experiment.","a":"Can establish cause and effect, Few extraneous variables, Easy to replicate, High internal validity","t":"RM"},{"id":163,"q":"State the main disadvantages of a lab experiment.","a":"Lacks ecological validity (often artificial materials/situations). Likely to see demand characteristics. Experimenter effects likely to occur","t":"RM"},{"id":164,"q":"What is a field experiment?","a":"An experiment that takes place in a natural setting where the research manipulates the IV and records the effect on the DV.","t":"RM"},{"id":165,"q":"What are the advantages of a field experiment?","a":"Increased ecological & external validity, Less likely to see demand characteristics, Less likely to get experimenter effects","t":"RM"},{"id":166,"q":"What are the disadvantages of a field experiment?","a":"Less control of extraneous variables, Issues linked to informed consent, Needs a skilled researcher","t":"RM"},{"id":167,"q":"What is a natural experiment?","a":"The change in the IV is not caused by the researcher, it would have happened without them present, but they take the opportunity to record the effect on the DV.","t":"RM"},{"id":168,"q":"State the main advantages of a natural experiment.","a":"No demand characteristics, No researcher effects, Few ethical issues","t":"RM"},{"id":169,"q":"Identify the main issues with natural experiments.","a":"Lack of control of extraneous variables, No random allocation – confounding participant variables? Hard to replicate","t":"RM"},{"id":170,"q":"Define ‘Quasi Experiment’.","a":"The IV has not been determined or changed by anyone, it simply exists e.g. old vs young","t":"RM"},{"id":171,"q":"What is a control condition?","a":"The IV isn’t changed for these participants, it provides a baseline measure which can be compared with the experimental condition results.","t":"RM"},{"id":172,"q":"What is an experimental condition?","a":"The condition in which the IV is changed for the participants.","t":"RM"},{"id":173,"q":"What do psychologists mean by random allocation?","a":"People are chosen randomly for different conditions of an experiment e.g. names from a hat.","t":"RM"},{"id":174,"q":"When psychologists talk about ecological validity they are referring to…","a":"How well methods can be applied to real life.","t":"RM"},{"id":175,"q":"When psychologists talk about external validity they are referring to…","a":"How well the results of a study can be applied to real life.","t":"RM"},{"id":176,"q":"What are demand characteristics?","a":"When participants alter their behaviour because they believe they know the purpose of the investigation.","t":"RM"},{"id":177,"q":"What are experimenter effects?","a":"Where the language or behaviour of the experimenter (unconsciously) affects the behaviour/responses/results of the participant.","t":"RM"},{"id":179,"q":"What is the difference between experimental methods and experimental designs?","a":"Experimental methods are the type of experiment you do e.g. lab/field/quasi/natural, whereas experimental designs are how you carry the experiment out e.g. independent measures, repeated measures, matched pairs","t":"RM"},{"id":180,"q":"What do psychologists do in an independent measures design?","a":"Have participants only complete one condition.","t":"RM"},{"id":181,"q":"What do psychologists do in a repeated measures design?","a":"Have participants complete both the experimental AND control condition.","t":"RM"},{"id":182,"q":"What do psychologists do in a matched pairs design?","a":"Before the experiment match participants based on key characteristics for the investigation, one participant then completes the control condition and the other the experimental condition.","t":"RM"},{"id":183,"q":"State the benefits of using an independent measures design.","a":"Reduces chance demand characteristics, Prevents order effects","t":"RM"},{"id":184,"q":"State the drawbacks of using an independent measures design.","a":"Increased issues with participant variables (individual differences), Requires a lot of participants","t":"RM"},{"id":185,"q":"State the benefits of using a repeated measures design.","a":"No individual differences, Requires fewer participants","t":"RM"},{"id":186,"q":"State the drawbacks of using a repeated measures design.","a":"Increases chance of demand characteristics, Order effects can occur","t":"RM"},{"id":187,"q":"State the benefits of using a matched pairs design.","a":"Reduces chance of demand characteristics, Prevents order effects, Reduces issues linked to participant variables (individual differences)","t":"RM"},{"id":188,"q":"Explain why counterbalancing is used.","a":"To control order effects in a repeated measures design.","t":"RM"},{"id":189,"q":"Explain how counterbalancing is done.","a":"One half of the participants complete condition A and then condition B, the other half complete condition B and then condition A.","t":"RM"},{"id":190,"q":"What are order effects?","a":"A confounding variable linked to the order that participants complete different conditions of an experiment e.g. boredom or fatigue. (repeated measures design only)","t":"RM"},{"id":191,"q":"What is meant by a naturalistic observation?","a":"Observation takes place in a setting where the behaviour would normally occur, no manipulation of variables.","t":"RM"},{"id":192,"q":"What is meant by a controlled observation?","a":"The observer has taken some control over the variables to see how people interact/behave in the particular scenario (can be in a lab or outside).","t":"RM"},{"id":193,"q":"What are the advantages and disadvantages of a naturalistic observation?","a":"+ high external validity - hard to replicate - risk of extraneous variables","t":"RM"},{"id":194,"q":"What are the advantages and disadvantages of a controlled observation?","a":"+ easy to replicate + reduced extraneous variables - lower external validity","t":"RM"},{"id":195,"q":"What is meant by a participant observation?","a":"The researcher is involved in/with the experiment as a member of the group (either overtly or covertly)","t":"RM"},{"id":196,"q":"What are the advantages and disadvantages of participant observations?","a":"+ increased insight to the group (+ if covert, less likely to experience demand characteristics) - loss of objectivity","t":"RM"},{"id":197,"q":"Define what is meant by a covert observation.","a":"The researcher status is not made clear to the group, the researcher doesn’t get consent.","t":"RM"},{"id":198,"q":"What are the advantages and disadvantages of a covert observation?","a":"+ less likely to experience demand characteristics - ethical issues","t":"RM"},{"id":199,"q":"Define what is meant by an overt observation.","a":"The researcher is open about their intentions and gets consent from the participants, who know they are being observed.","t":"RM"},{"id":200,"q":"What are the advantages and disadvantages of an overt observation.","a":"+ ethically acceptable - likely to see demand characteristics","t":"RM"},{"id":201,"q":"Define what is meant by structured and unstructured observations.","a":"Unstructured – everything is recorded, Structured – only specifics are recorded","t":"RM"},{"id":202,"q":"When doing a structured observation researchers develop behavioural categories to use – what must these be?","a":"Observable and measurable (clearly defined/operationalized)","t":"RM"},{"id":203,"q":"Name the 3 types of sampling used in observations.","a":"Event sampling, time sampling, continuous sampling.","t":"RM"},{"id":204,"q":"What is event sampling?","a":"Counting how many times a particular behaviour occurs.","t":"RM"},{"id":205,"q":"What is time sampling?","a":"Recording behaviour within a pre-established time frame.","t":"RM"},{"id":206,"q":"What is continuous sampling?","a":"Recording behaviours throughout the entire period of the observation.","t":"RM"},{"id":207,"q":"How do you check inter-observer reliability? (3 marks)","a":"1) Two researchers observe the same behaviour at the same time and record results 2) Compare results looking for similarity 3) Use Spearman’s rho looking for a correlation of >0.8 to consider it reliable.","t":"RM"},{"id":208,"q":"How do you check test-retest reliability? (3 marks)","a":"1) Re-administer the same test again at a later date 2) Compare the results looking for similarity 3) Use Spearman’s rho looking for a correlation of >0.8 to consider it reliable","t":"RM"},{"id":209,"q":"What is content analysis?","a":"When written (or pictorial) information (articles/transcripts of interviews/media) is examined looking for occurrence of particular pre-identified items. Data is mostly turned from qualitative into quantitative.","t":"RM"},{"id":210,"q":"What is thematic analysis?","a":"When written information (articles/transcripts of interviews) is repeatedly examined looking for emerging patterns and themes and sub-themes. Data remains in qualitative form.","t":"RM"},{"id":211,"q":"What is the difference between data generated by content and thematic analysis.","a":"Content = mostly quantitative WHERES Thematic = qualitative","t":"RM"},{"id":212,"q":"The target population is…","a":"The entire group the researcher is interested in and wishes to be able to draw conclusions about.","t":"RM"},{"id":213,"q":"The sample is…","a":"The people involved in the study drawn from the target population.","t":"RM"},{"id":214,"q":"Name the 5 different sampling techniques.","a":"Opportunity, Random, Volunteer, Systematic, Stratified","t":"RM"},{"id":215,"q":"What is an opportunity sample?","a":"Selecting people most easily available at the time","t":"RM"},{"id":216,"q":"What is a random sample?","a":"Every member of a target population has an equal chance of being selected, sample produced using a random technique e.g. names out of a hat.","t":"RM"},{"id":217,"q":"What is a volunteer sample?","a":"Participants are invited to take part and people choose to join or not.","t":"RM"},{"id":218,"q":"What is a systematic sample?","a":"Selecting every nth participant from a list of the whole population.","t":"RM"},{"id":219,"q":"What is a stratified sample?","a":"Subcultures of a population are identified and then participants are selected in proportion to their frequency in the original population.","t":"RM"},{"id":220,"q":"What do psychologists mean by bias-sampling?","a":"When certain groups are over or under represented within a sample – limits generalizability if sample is not representative.","t":"RM"},{"id":221,"q":"What do psychologists mean by the term ‘generalisation’?","a":"The extent to which findings and conclusions can be drawn from a particular experiment and applied more broadly to the whole population (linked to population validity).","t":"RM"},{"id":222,"q":"What is peer review?","a":"The assessment of work by others who are specialists in the same field.","t":"RM"},{"id":223,"q":"What are the 3 main purposes of peer review?","a":"1) To ensure information being published is correct and accurate (validates the quality of the research) 2) To suggest amendments/improvements before publication 3) To allocate funding properly and appropriately","t":"RM"},{"id":224,"q":"How is psychological research published?","a":"Initially in journals, these can then be translated into textbook information or discussed at conferences.","t":"RM"},{"id":225,"q":"What is the problem of publication bias in relation to psychological research?","a":"Only positive or attention grabbing results are published, skewing our view on the concept being researched.","t":"RM"},{"id":226,"q":"What is a case study?","a":"A research method that involved detailed study of a single individual, institution or event.","t":"RM"},{"id":227,"q":"What is a correlation?","a":"An association between two co-variables","t":"RM"},{"id":228,"q":"Define a positive correlation.","a":"As one variable increases, so does the other.","t":"RM"},{"id":229,"q":"Give an example correlation co-efficient of a weak positive correlation.","a":"0.5","t":"RM"},{"id":230,"q":"Give an example correlation co-efficient of a strong positive correlation.","a":"0.8","t":"RM"},{"id":231,"q":"Define a negative correlation.","a":"As one variable increases, the other decreases.","t":"RM"},{"id":232,"q":"Give an example correlation co-efficient of a weak negative correlation.","a":"-0.5","t":"RM"},{"id":233,"q":"Give an example correlation co-efficient of a strong negative correlation.","a":"-0.8","t":"RM"},{"id":234,"q":"What are the three measures of central tendency?","a":"Mean, Median, Mode","t":"RM"},{"id":235,"q":"What are measures of dispersion? Name the two you are expected to know.","a":"Measures of spread or variation in a set of results. Range and Standard deviation","t":"RM"},{"id":236,"q":"What are descriptive statistics?","a":"Use of graphs, tables and summary statistics (central tendency and dispersion) to analyse sets of data.","t":"RM"},{"id":237,"q":"What are inferential statistics?","a":"Tests used to find out if results are strong enough to reject the null hypothesis – if they are significant rather than due to chance.","t":"RM"},{"id":238,"q":"What is a pilot study? Why are they done?","a":"A small scale trial conducted at the start of an experiment to check for any flaws e.g. does the method work, do the questions make sense","t":"RM"},{"id":239,"q":"Define the mean.","a":"Arithmetic average. Add up all the values and divide by the number of values.","t":"RM"},{"id":240,"q":"Define the median.","a":"Central value when data is ordered from lowest to highest.","t":"RM"},{"id":241,"q":"Define the mode.","a":"Most frequently occurring value.","t":"RM"},{"id":242,"q":"Evaluate the use of the mean.","a":"+ most sensitive as includes all values so more representative - easily distorted by extreme values","t":"RM"},{"id":243,"q":"Evaluate the use of the median.","a":"+ extreme scores don’t distort the value + easy to calculate - not very sensitive as not all values are included","t":"RM"},{"id":244,"q":"Evaluate the use of the mode.","a":"+ easy to calculate + only appropriate measure for categoric data - crude measure, not representative","t":"RM"},{"id":245,"q":"Define ‘range’ in psychology","a":"A basic measure of dispersion of scores. Worked out by minusing the lowest value from the highest value and adding one as a correction for rounding.","t":"RM"},{"id":246,"q":"What does the standard deviation tell us?","a":"How far scores deviate from the mean. The larger the standard deviation the more spread out the data is.","t":"RM"},{"id":247,"q":"Name the 4 types of graph you need to know how to draw and interpret.","a":"Bar chart, Scattergraph, Histogram, Line graph","t":"RM"},{"id":248,"q":"Name the 3 key characteristics required on any graph.","a":"Title mentioning both variables, Labelled X and Y axis, Accurately plotted data","t":"RM"},{"id":249,"q":"When do we use bar charts?","a":"When the data is divided into categories.","t":"RM"},{"id":250,"q":"When do we use scattergraph?","a":"Show associations between co-variables","t":"RM"},{"id":251,"q":"When do we use histograms?","a":"When data is continuous, but divided into (possibly uneven) bands.","t":"RM"},{"id":252,"q":"When do we use line graphs?","a":"When data is continuous but represented by single plottable points.","t":"RM"},{"id":253,"q":"What goes on the X axis of a graph?","a":"The IV","t":"RM"},{"id":254,"q":"What goes on the Y axis of a graph?","a":"The DV","t":"RM"},{"id":255,"q":"Describe a normal distribution.","a":"Symmetrical (bell shaped) spread of data, with the mean, median and mode all in the centre.","t":"RM"},{"id":256,"q":"Describe what is meant by a skewed distribution.","a":"When the spread of data is not symmetrical but instead clusters towards one end of the graph. The mode is located at the highest point, in a different position from the median and from the mean.","t":"RM"},{"id":257,"q":"Describe a positively skewed distribution.","a":"Most of the data is centred on the left hand side of the graph, with the long ‘tail’ on the positive side of the graph.","t":"RM"},{"id":258,"q":"Describe a negatively skewed distribution.","a":"Most of the data is centred on the right hand side of the graph, with the long ‘tail’ on the negative side of the graph.","t":"RM"},{"id":259,"q":"Name the statistical test you need to be able to do in full.","a":"The sign test","t":"RM"},{"id":260,"q":"When do you use the sign test?","a":"Looking for a Difference, Used a repeated measures Design, Data is nominal","t":"RM"},{"id":261,"q":"What is the level of probability used most in Psychology?","a":"0.05 (5%)","t":"RM"},{"id":262,"q":"Why do we use the 5% level of significance?","a":"Compromise between the risk of type 1 and type 2 error.","t":"RM"},{"id":263,"q":"Define type 1 error.","a":"Rejection of the null hypothesis when it should have been accepted (also known as a \"false positive\", finding it significant when it wasn’t).","t":"RM"},{"id":264,"q":"Define type 2 error.","a":"Failure to reject the null hypothesis when it should have been rejected (also known as a \"false negative\", finding it not significant when it was).","t":"RM"},{"id":265,"q":"What are the 3 main different types of data?","a":"Nominal, ordinal, interval","t":"RM"},{"id":266,"q":"What is nominal data? Give an example","a":"Named, distinct categories e.g. male and female","t":"RM"},{"id":267,"q":"What is ordinal data? Give an example","a":"The order of the data matters, but the actual value of the figure isn’t measureable (doesn’t have a unit) e.g. scores out of 10","t":"RM"},{"id":268,"q":"What is interval data? Give an example","a":"Measured along a scale (has units) where the distance between one value and the next is equal and standardised e.g. age in years","t":"RM"},{"id":269,"q":"In statistical tests, what is the calculated value?","a":"The number produced by doing a statistical test. It is compared to the critical value to see whether results are significant.","t":"RM"},{"id":270,"q":"In statistical tests, what is the critical value and how do you find it?","a":"The value that helps you determine if a result is significant. Given in a table. You need to know 1) significance level (usually 0.05) 2) number of participants or degrees of freedom 3) one or two tailed hypothesis","t":"RM"},{"id":271,"q":"What 5 elements must you include when explaining if a result was significant or not?","a":"Whether the calculated value is greater or less than the critical value, The number of participants or degrees of freedom used, The significance level used, One tailed or two tailed, Significant or not","t":"RM"},{"id":272,"q":"What is the argument around idiographic and nomothetic approaches in psychology?","a":"The argument about whether we should focus on studying the individual, or groups in order to generate general laws that apply to most people","t":"Issues and Debates part I"},{"id":273,"q":"Define the idiographic approach to psychology.","a":"Studying behaviour by focusing on the individual and emphasising unique, subjective experience, doesn’t seek to generalise results.","t":"Issues and Debates part I"},{"id":274,"q":"Define the nomothetic approach to psychology.","a":"Concerned with establishing general laws based on the study of large groups of people.","t":"Issues and Debates part I"},{"id":275,"q":"What are the research methods used by a psychologist taking an idiographic approach?","a":"Case studies, unstructured interviews","t":"Issues and Debates part I"},{"id":276,"q":"What are the research methods used by a psychologist taking a nomothetic approach?","a":"Lab/field/natural/quasi experiments, correlational research, statistical and quantitative methods used to analyse data","t":"Issues and Debates part I"},{"id":277,"q":"What are the weaknesses of taking an idiographic approach to psychological research?","a":"- Can’t generalise → can’t predict behaviour and then prevent/treat it - Lacks scientific rigour (likely to have researcher bias) - Time consuming","t":"Issues and Debates part I"},{"id":278,"q":"What are the benefits of taking an idiographic approach to psychological research?","a":"+ Rich and detailed information/understanding + Can develop personalised treatments (CCT)","t":"Issues and Debates part I"},{"id":279,"q":"What are the strengths of taking a nomothetic approach to psychological research?","a":"+ highly scientific + can develop treatments/preventative measures","t":"Issues and Debates part I"},{"id":280,"q":"What are the weaknesses of taking a nomothetic approach to psychological research?","a":"- studying large groups → lose subjective experience - lots of use of experiments → lacking ecological validity","t":"Issues and Debates part I"},{"id":281,"q":"Often, how are idiographic and nomothetic approaches connected and used in Psychology?","a":"On many occasions, idiographic research can generate ideas which can then be researched on a larger scale using nomothetic methods.","t":"Issues and Debates part I"},{"id":282,"q":"Give an example of an approach in Psychology that uses both idiographic and nomothetic methods.","a":"Psychodynamic, Cognitive","t":"Issues and Debates part I"},{"id":283,"q":"Which approaches only use nomothetic research?","a":"Biological, Behaviourist","t":"Issues and Debates part I"},{"id":284,"q":"What is the nature nurture debate?","a":"The argument about how much of a particular behaviour is a result of environment and how much is genetic – which has a greater contribution?","t":"Issues and Debates part I"},{"id":285,"q":"Define the nature view in the nature nurture debate.","a":"The view that behaviour is a product of innate, biological factors present at the point of conception.","t":"Issues and Debates part I"},{"id":286,"q":"Define the nurture view in the nature nurture debate.","a":"The view that behaviour is a product of environmental influences (anything outside the body) e.g. people, events, physical world","t":"Issues and Debates part I"},{"id":287,"q":"Which approach takes the extreme nature view?","a":"Biological","t":"Issues and Debates part I"},{"id":288,"q":"Which approach takes the extreme nurture view?","a":"Behaviourist","t":"Issues and Debates part I"},{"id":289,"q":"What are people who subscribe to the nature view called?","a":"Nativists","t":"Issues and Debates part I"},{"id":290,"q":"What are people who subscribe to the nurture view called?","a":"Empiricists","t":"Issues and Debates part I"},{"id":291,"q":"Which/Who’s ideas are ‘nature explanations’ based on?","a":"Darwin, evolution","t":"Issues and Debates part I"},{"id":292,"q":"Which/Who’s ideas are ‘nurture explanations’ based on?","a":"John Locke, born a blank slate","t":"Issues and Debates part I"},{"id":293,"q":"Define heredity. Explain which part of the nature nurture debate it relates to.","a":"Heredity is the process in which traits are passed down from one generation to the next, links to nature","t":"Issues and Debates part I"},{"id":294,"q":"Often, what is the conclusion of any research involved in the nature vs nurture debate?","a":"That we need to take an interactionist approach – nature and nurture overlap to shape human behaviour – separating it is too simplistic.","t":"Issues and Debates part I"},{"id":295,"q":"What are the strengths of taking an extreme nature view?","a":"+ can identify biological cause → develop biological treatment","t":"Issues and Debates part I"},{"id":296,"q":"What are the weaknesses of taking an extreme nature view?","a":"- ignores possible influence of other important factors (often reductionist) - potential implications in terms of eugenic policies & enhancing racism/sexism - potentially lead to belief in reduction of responsibility for behaviour (biological determinism)","t":"Issues and Debates part I"},{"id":297,"q":"What are the strengths of taking an extreme nurture view?","a":"+ if behaviour is learnt it can be modified/unlearnt → possible therapies/behaviour modification techniques","t":"Issues and Debates part I"},{"id":298,"q":"What are the weaknesses of taking an extreme nurture view?","a":"- ignores possible influence of biological factors (often reductionist) - potential implications for using ideas to manipulate others/societies","t":"Issues and Debates part I"},{"id":299,"q":"What are the responsibilities of governments if all behaviour is a result of nurture? (implication of extreme nurture view)","a":"All children (as this is when key learning takes place) need the same good quality start in life","t":"Issues and Debates part I"},{"id":300,"q":"What are the responsibilities of governments if all behaviour is a result of nature? (implication of extreme nature view)","a":"Need to modify criminal justice system, Finance of research into biological treatments","t":"Issues and Debates part I"},{"id":301,"q":"What is the reductionism holism debate?","a":"Whether we should explain behaviour at the lowest level of explanation possible, or whether we should take into account as many factors as possible when explaining a behaviour.","t":"Issues and Debates part I"},{"id":302,"q":"Define the reductionist view in the RvH debate.","a":"We should break behaviour down into its most basic components, breaking down complex issues into simpler elements.","t":"Issues and Debates part I"},{"id":303,"q":"Define the holistic view in the RvH debate.","a":"We should only try to understand a behaviour or individual by examining all possible influences including the subjective experience of the individual.","t":"Issues and Debates part I"},{"id":304,"q":"Explain what is meant by biological reductionism.","a":"Reduce behaviour to a physical level, focusing on neurotransmitters, neurones or hormones","t":"Issues and Debates part I"},{"id":305,"q":"Explain what is meant by environmental reductionism.","a":"Reduce all behaviour to a series of learnt building blocks so complex behaviours are just a chain of stimulus and response associations","t":"Issues and Debates part I"},{"id":306,"q":"Which approaches tend to be reductionist?","a":"Biological, Behaviourist","t":"Issues and Debates part I"},{"id":307,"q":"Which approach is truly holistic?","a":"Humanistic","t":"Issues and Debates part I"},{"id":308,"q":"What are the strengths of having a reductionist explanation/approach?","a":"+ Allows for scientific testing as can create an IV and DV → credibility + Allows identification of causes → treatments","t":"Issues and Debates part I"},{"id":309,"q":"What are the weaknesses of having a reductionist explanation/approach?","a":"- often misses details → incomplete explanations","t":"Issues and Debates part I"},{"id":310,"q":"What are the strengths of having an holistic explanation/approach?","a":"+ Gives rich and detailed understanding of a concept/person → better designed interventions","t":"Issues and Debates part I"},{"id":311,"q":"What are the weaknesses of having an holistic explanation/approach?","a":"- often vague and unscientific as cannot do scientific testing - difficult to know best places to target limited resources for intervention","t":"Issues and Debates part I"},{"id":312,"q":"What is the free will determinism debate?","a":"The argument about how much choice/free will/control we have over our behaviour vs. how much it is controlled by internal/external factors","t":"Issues and Debates part I"},{"id":313,"q":"Define the free will view in the FWvD debate.","a":"Humans have the ability to make decisions and choose behaviours freely","t":"Issues and Debates part I"},{"id":314,"q":"Define the deterministic view in the FWvD debate.","a":"All behaviour is caused by prior events/internal/external factors, no choice.","t":"Issues and Debates part I"},{"id":315,"q":"What is meant by biological determinism?","a":"Behaviour is innate, controlled by genetics","t":"Issues and Debates part I"},{"id":316,"q":"What is meant by environmental determinism?","a":"All behaviour is a result of previous experiences causing learning via classical and operant conditioning","t":"Issues and Debates part I"},{"id":317,"q":"What is meant by psychic determinism?","a":"All behaviour is caused by innate drives and early childhood experience.","t":"Issues and Debates part I"},{"id":318,"q":"What is meant by hard determinism?","a":"Forces outside of our control (biological or past experiences) shape our behaviour (choice is an illusion)","t":"Issues and Debates part I"},{"id":319,"q":"What is meant by soft determinism?","a":"Behaviour is constrained (choices are limited) by the environment/our biological make up, but only to a certain extent","t":"Issues and Debates part I"},{"id":320,"q":"What are the strengths of having a deterministic explanation?","a":"- allows for scientific testing - target for treatment/modification","t":"Issues and Debates part I"},{"id":321,"q":"What are the weaknesses of having a deterministic explanation?","a":"- problems for legal system/moral responsibility","t":"Issues and Debates part I"},{"id":322,"q":"What are the strengths of believing in a free will standpoint?","a":"Belief in free will is associated with more positive mental health outcomes e.g. internal LOC","t":"Issues and Debates part I"},{"id":323,"q":"What are the problems with believing in a free will standpoint?","a":"- Unfalsifiable - Contradictory evidence e.g. Field/Libet and Soon","t":"Issues and Debates part I"},{"id":324,"q":"What is the gender bias issue in psychology?","a":"Differential representation of males and females in research findings, can result in reinforcing stereotypes/sexism or failure to recognise genuine gender differences.","t":"Issues and Debates part I"},{"id":325,"q":"What is alpha bias in the context of gender?","a":"When the differences between males and females are exaggerated causing reinforcement of gender stereotypes","t":"Issues and Debates part I"},{"id":326,"q":"What is beta bias in the context of gender?","a":"When the differences between males and females are minimised or ignored (e.g. if generalising from an all male sample to men and women) meaning key gender factors that affect behaviour are missed.","t":"Issues and Debates part I"},{"id":327,"q":"What is androcentrism?","a":"When an idea or area is dominated by males/the male view. Most psychologists were male and so theories were often based on male views/priorities. Can result in females being viewed as inferior/lesser versions of males.","t":"Issues and Debates part I"},{"id":328,"q":"What are the implications of gender biased research in psychology?","a":"- publishing scientifically misleading data - upholding stereotypical assumptions/validating sex discrimination - poor population validity of theories","t":"Issues and Debates part I"},{"id":329,"q":"What is the aim of some psychologists when it comes to generating laws/theories, they want them to be ………………..? What does this term mean?","a":"Universal – universality means generating research, theories or explanations which aim to represent human behaviour seen in all individuals/cultures, they aren’t interested in looking for/at differences.","t":"Issues and Debates part I"},{"id":330,"q":"Define the term culture in the context of Psychology.","a":"The beliefs, attitudes, core ideas etc. that a particular group of people share, distinguishing one group from another. Cultures often contain a number of sub-cultures within them.","t":"Issues and Debates part I"},{"id":331,"q":"What is the culture bias issue in psychology?","a":"The risk that if the ‘norm’ or ‘standard’ for a particular behaviour is judged only from the standpoint of a particular culture, then any cultural differences in behaviour that deviate from this will be seen as ‘abnormal’, ‘inferior’ or ‘unusual’","t":"Issues and Debates part I"},{"id":332,"q":"Define the term ethnocentric.","a":"Judging other cultures by the standards/values of your own. If this is specifically from a European standpoint it can be called eurocentricism.","t":"Issues and Debates part I"},{"i
