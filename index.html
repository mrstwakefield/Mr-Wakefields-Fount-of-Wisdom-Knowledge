enders practise their new skills in a controlled environment, e.g. role-play of trigger situations","t":"Forensic Psychology","id":1832},{"q":"What are cognitive, behavioural and physiological skills in anger management?","a":"Cognitive – positive self-talk; Behavioural – assertiveness training; Physiological – relaxation and breathing","t":"Forensic Psychology","id":1833},{"q":"What did Keen et al. (2000) find?","a":"Young offenders aged 17–21 on an anger management programme showed improved awareness and control of anger, although there were initial problems","t":"Forensic Psychology","id":1834},{"q":"Give a strength of anger management compared with behaviour modification.","a":"It addresses the cognitive causes of offending, so it may have longer-lasting effects","t":"Forensic Psychology","id":1835},{"q":"Give a limitation of anger management relating to evidence.","a":"Blacker et al. (2008) found anger was reduced, but it did not reduce reoffending rates","t":"Forensic Psychology","id":1836},{"q":"What did Ireland (2004) find?","a":"92% of prisoners showed improvements in anger after a programme, but there was no clear evidence of long-term behaviour change","t":"Forensic Psychology","id":1837},{"q":"Give a limitation of anger management relating to cost.","a":"It is expensive and requires highly trained specialists, and offenders must be committed","t":"Forensic Psychology","id":1838},{"q":"Why may role-play in anger management lack validity?","a":"Offenders may behave differently in real situations than in controlled role-plays","t":"Forensic Psychology","id":1839},{"q":"Why might anger management not suit all offenders?","a":"Not all crime is caused by anger, e.g. psychopaths may use violence instrumentally","t":"Forensic Psychology","id":1840},{"q":"What is restorative justice?","a":"A system where the offender and victim meet (or communicate), with a trained mediator, to discuss the impact of the crime and repair harm","t":"Forensic Psychology","id":1841},{"q":"What are the aims of restorative justice?","a":"Rehabilitation of offenders, Atonement for wrongdoing, Victims feeling heard and less afraid","t":"Forensic Psychology","id":1842},{"q":"Why does restorative justice focus on the victim?","a":"It gives the victim a voice, which can reduce trauma and help them move on","t":"Forensic Psychology","id":1843},{"q":"How does restorative justice rehabilitate offenders?","a":"Offenders see the effects of their crime from the victim's perspective, increasing empathy and responsibility","t":"Forensic Psychology","id":1844},{"q":"What is 'atonement' in restorative justice?","a":"The offender makes amends for their crime, e.g. apologising, repairing damage or compensating the victim","t":"Forensic Psychology","id":1845},{"q":"Must the victim and offender meet face-to-face in restorative justice?","a":"No – it can also happen through letters or video","t":"Forensic Psychology","id":1846},{"q":"What did the Restorative Justice Council (2011) find?","a":"Restorative justice reduced reoffending by 14% and 85% of victims were satisfied","t":"Forensic Psychology","id":1847},{"q":"Give a strength of restorative justice relating to victims.","a":"High victim satisfaction – victims report feeling less fear and more closure","t":"Forensic Psychology","id":1848},{"q":"Give a limitation of restorative justice relating to offender motivation.","a":"Offenders may take part to get a reduced sentence rather than genuine remorse, so it may not work for them","t":"Forensic Psychology","id":1849},{"q":"Give a limitation of restorative justice relating to victims.","a":"Some victims may find meeting the offender distressing and it could be re-traumatising","t":"Forensic Psychology","id":1850},{"q":"Give a limitation of restorative justice relating to crime type.","a":"It may be unsuitable for some crimes (e.g. serious violent or sexual crimes) or crimes without an identifiable victim","t":"Forensic Psychology","id":1851},{"q":"Why is restorative justice cost-effective?","a":"Shapland et al. (2008) found it saved £9 for every £1 spent by reducing reoffending","t":"Forensic Psychology","id":1852},{"q":"What did Shapland et al. (2008) find?","a":"Restorative justice saved about £9 for every £1 spent","t":"Forensic Psychology","id":1853},{"q":"Why might restorative justice not replace prison?","a":"It may be seen as a 'soft option' that doesn't satisfy retribution","t":"Forensic Psychology","id":1854},{"q":"Which aim of custodial sentencing is least compatible with restorative justice?","a":"Retribution","t":"Forensic Psychology","id":1855},{"q":"A forensic psychologist uses a database of past crimes to identify patterns. Which approach is this?","a":"Bottom-up (investigative psychology)","t":"Forensic Psychology","id":1856},{"q":"A profiler decides that a crime scene is chaotic, with a weapon left behind. What type of offender is this likely to be?","a":"Disorganised","t":"Forensic Psychology","id":1857},{"q":"A murder was clearly planned and the body was carefully hidden. What type of offender is this likely to be?","a":"Organised","t":"Forensic Psychology","id":1858},{"q":"A series of burglaries all occurred within a mile of each other. Which type of profiling would help?","a":"Geographical profiling","t":"Forensic Psychology","id":1859},{"q":"A burglar commits crimes far from home to avoid being recognised. Is he a marauder or a commuter?","a":"A commuter","t":"Forensic Psychology","id":1860},{"q":"An offender wiped the crime scene clean of fingerprints. What does investigative psychology call this?","a":"Forensic awareness","t":"Forensic Psychology","id":1861},{"q":"Jack thinks someone bumped into him on purpose and punches them. Which cognitive distortion is this?","a":"Hostile attribution bias","t":"Forensic Psychology","id":1862},{"q":"A shoplifter says 'Big shops can afford it, nobody gets hurt.' Which cognitive distortion is this?","a":"Minimalisation","t":"Forensic Psychology","id":1863},{"q":"A young man says he steals because he won't get caught. Which level of moral reasoning is this?","a":"Pre-conventional","t":"Forensic Psychology","id":1864},{"q":"A boy starts offending after joining a group of friends who steal. Which theory explains this?","a":"Differential association theory","t":"Forensic Psychology","id":1865},{"q":"A prisoner who has been inside for 15 years can't cope with making his own decisions on release. What is this?","a":"Institutionalisation","t":"Forensic Psychology","id":1866},{"q":"A new prisoner learns he must never tell guards about other inmates. What is this?","a":"Prisonisation (the inmate code)","t":"Forensic Psychology","id":1867},{"q":"A prison gives inmates tokens for tidying their cells which they can swap for phone calls. What is this?","a":"A token economy (behaviour modification)","t":"Forensic Psychology","id":1868},{"q":"An offender role-plays being insulted in a bar and practises calming techniques. Which stage of anger management is this?","a":"Application practice","t":"Forensic Psychology","id":1869},{"q":"A burglar meets the family he stole from and apologises. What is this?","a":"Restorative justice","t":"Forensic Psychology","id":1870},{"q":"A judge gives a long sentence to 'send a message' to others. Which aim of custodial sentencing is this?","a":"General deterrence","t":"Forensic Psychology","id":1871},{"q":"A judge gives a sentence to keep a dangerous offender away from the public. Which aim is this?","a":"Incapacitation","t":"Forensic Psychology","id":1872},{"q":"A person high in extraversion and neuroticism may be more likely to offend according to which theory?","a":"Eysenck's theory of the criminal personality","t":"Forensic Psychology","id":1873},{"q":"Why does Eysenck's theory predict extraverts are harder to condition?","a":"Their underactive nervous system means they don't learn from punishment as easily","t":"Forensic Psychology","id":1874},{"q":"Why does Eysenck's theory predict neurotics may offend?","a":"They are unstable and overreact to threatening situations","t":"Forensic Psychology","id":1875},{"q":"What is the link between Eysenck's theory and the nature–nurture debate?","a":"Interactionist – personality is innate (nature) but socialisation (nurture) affects whether it leads to crime","t":"Forensic Psychology","id":1876},{"q":"What is the link between genetic explanations and the free will debate?","a":"They are deterministic, suggesting offenders have little control over their behaviour","t":"Forensic Psychology","id":1877},{"q":"Why is differential association theory linked to nurture?","a":"It argues offending is learned through social interactions","t":"Forensic Psychology","id":1878},{"q":"What is the link between cognitive distortions and CBT?","a":"CBT for offenders aims to identify and challenge distorted thinking (e.g. minimalisation)","t":"Forensic Psychology","id":1879},{"q":"What is 'white-collar crime'?","a":"Non-violent, financially motivated crime committed by people in professional positions, e.g. fraud","t":"Forensic Psychology","id":1880},{"q":"Why can DAT explain white-collar crime?","a":"Professionals can learn pro-criminal attitudes and techniques from colleagues","t":"Forensic Psychology","id":1881},{"q":"What is the 'nature' view of offending?","a":"Offending is caused by innate factors such as genes and brain structure","t":"Forensic Psychology","id":1882},{"q":"What is the 'nurture' view of offending?","a":"Offending is learned from the environment, e.g. through family or peers","t":"Forensic Psychology","id":1883},{"q":"What is a limitation of using official crime statistics?","a":"They only include reported and recorded crimes, so they underestimate crime (the 'dark figure' of crime)","t":"Forensic Psychology","id":1884},{"q":"What are victim surveys?","a":"Surveys that ask people about crimes they've experienced, whether or not they reported them, e.g. the Crime Survey for England and Wales","t":"Forensic Psychology","id":1885},{"q":"What are offender surveys?","a":"Surveys that ask people to report crimes they have committed","t":"Forensic Psychology","id":1886},{"q":"What is the 'dark figure' of crime?","a":"Crimes that are not reported to or recorded by the police","t":"Forensic Psychology","id":1887},{"q":"Why is it hard to define crime?","a":"It varies by culture and over time, e.g. homosexuality was illegal in the UK until 1967","t":"Forensic Psychology","id":1888},{"q":"Why might a forensic psychologist be interested in recidivism?","a":"It measures whether interventions such as prison or therapy are effective","t":"Forensic Psychology","id":1889},{"q":"What is the difference between retribution and rehabilitation?","a":"Retribution focuses on punishment for the crime; rehabilitation focuses on reform for the future","t":"Forensic Psychology","id":1890},{"q":"Why might short prison sentences be counterproductive?","a":"Offenders may lose jobs and homes and learn new techniques without time for rehabilitation, increasing reoffending","t":"Forensic Psychology","id":1891},{"q":"Why might female prisoners be especially affected by custodial sentencing?","a":"They are more likely to be primary caregivers, and separation from children causes distress","t":"Forensic Psychology","id":1892},{"q":"What is an ethical issue with forensic psychology research?","a":"Offenders may be coerced into taking part or feel they must participate to gain parole","t":"Forensic Psychology","id":1893},{"q":"Why might research on offenders lack generalisability?","a":"It often uses prisoners, who are only those who have been caught and convicted","t":"Forensic Psychology","id":1894},{"q":"Why is it difficult to test the effectiveness of offender treatments?","a":"Many factors affect reoffending, e.g. housing and employment, so it's hard to isolate the treatment's effect","t":"Forensic Psychology","id":1895},{"q":"What is the 'Heinz dilemma' used to measure?","a":"Level of moral reasoning (Kohlberg)","t":"Forensic Psychology","id":1896},{"q":"What did Kohlberg call the highest level of moral reasoning?","a":"Post-conventional – based on universal ethical principles and justice","t":"Forensic Psychology","id":1897},{"q":"What is conventional morality?","a":"Moral reasoning based on social approval and following laws and rules","t":"Forensic Psychology","id":1898},{"q":"What is the relationship between moral reasoning and type of crime?","a":"Pre-conventional reasoning is more linked to crimes for financial gain (e.g. robbery) than impulsive crimes","t":"Forensic Psychology","id":1899},{"q":"Which neurotransmitter is linked to the MAOA gene?","a":"Serotonin (MAOA breaks down serotonin and other neurotransmitters)","t":"Forensic Psychology","id":1900},{"q":"What is the 'warrior gene'?","a":"A nickname for the low-activity MAOA variant linked to aggression","t":"Forensic Psychology","id":1901},{"q":"What did Brunner et al. (1993) find?","a":"A Dutch family where many males had violent criminal behaviour had a mutation in the MAOA gene","t":"Forensic Psychology","id":1902},{"q":"Why is the Brunner family study limited?","a":"It is a single family, so it can't be generalised, and environment may also have played a role","t":"Forensic Psychology","id":1903},{"q":"What is the role of the limbic system in offending?","a":"It is involved in emotion; abnormalities (e.g. in the amygdala) may be linked to aggression and poor emotional control","t":"Forensic Psychology","id":1904},{"q":"Why are prefrontal cortex findings important for explaining offending?","a":"Reduced prefrontal activity may explain poor impulse control and decision-making","t":"Forensic Psychology","id":1905},{"q":"What is 'psychopathy'?","a":"A personality disorder characterised by lack of empathy, guilt and remorse, often linked to antisocial behaviour","t":"Forensic Psychology","id":1906},{"q":"Why is Raine's PET scan study limited?","a":"Participants were murderers pleading insanity, so they may not represent all offenders; correlation doesn't show causation","t":"Forensic Psychology","id":1907},{"q":"What is the biosocial approach to offending?","a":"The idea that biological factors (e.g. brain damage) combined with social factors (e.g. abuse) lead to offending","t":"Forensic Psychology","id":1908},{"q":"What did Raine et al. (1994) find about birth complications?","a":"Birth complications combined with maternal rejection significantly increased the risk of violent offending by age 18","t":"Forensic Psychology","id":1909},{"q":"Why is it important for profilers to consider situational factors?","a":"Offenders' behaviour at a crime scene can be affected by the victim's reactions and circumstances, not just personality","t":"Forensic Psychology","id":1910},{"q":"What is the 'Barnum effect' in profiling?","a":"Profiles may be so vague that they could apply to many people, making them seem accurate when they are not","t":"Forensic Psychology","id":1911},{"q":"What did Alison et al. (2003) find about profiles?","a":"Police officers rated a vague, fake profile as accurate, showing profiles can seem convincing even when general (Barnum effect)","t":"Forensic Psychology","id":1912},{"q":"What is a 'linked crime'?","a":"A crime believed to have been committed by the same offender based on similarities","t":"Forensic Psychology","id":1913},{"q":"Why is linking crimes important for geographical profiling?","a":"Geographical profiling needs a series of linked crimes to map the offender's movements","t":"Forensic Psychology","id":1914},{"q":"What is 'Rigel'?","a":"A computer software system used in geographical profiling to produce a jeopardy surface showing likely offender locations","t":"Forensic Psychology","id":1915},{"q":"What did Kocsis et al. (2000) find?","a":"Trained profilers produced more accurate profiles than police officers, psychologists or students","t":"Forensic Psychology","id":1916},{"q":"What does 'forensic' mean?","a":"Relating to the courts or the law","t":"Forensic Psychology","id":1917},{"q":"What is the difference between a psychologist and a profiler?","a":"A profiler specifically creates offender profiles; forensic psychologists work more broadly, e.g. with offenders in prison","t":"Forensic Psychology","id":1918},{"q":"What is the purpose of CBT programmes in prison, like the Thinking Skills Programme?","a":"To change offenders' thinking and behaviour to reduce reoffending","t":"Forensic Psychology","id":1919},{"q":"Why may cognitive explanations be more optimistic than biological ones?","a":"Thinking can be changed through therapy, whereas genes cannot","t":"Forensic Psychology","id":1920},{"q":"What is universality in psychology?","a":"The idea that a theory or finding applies to all people, irrespective of gender or culture","t":"Issues and Debates part I","id":1921},{"q":"What is gender bias?","a":"The differential treatment or representation of men and women based on stereotypes rather than real differences","t":"Issues and Debates part I","id":1922},{"q":"Give an example of androcentrism.","a":"Premenstrual syndrome (PMS) – the view that women's anger is due to hormones, whereas men's anger is seen as rational; or fight or flight research based on males","t":"Issues and Debates part I","id":1923},{"q":"What is alpha bias?","a":"A bias that exaggerates the differences between men and women","t":"Issues and Debates part I","id":1924},{"q":"What is beta bias?","a":"A bias that ignores or minimises the differences between men and women","t":"Issues and Debates part I","id":1925},{"q":"Give an example of alpha bias.","a":"Freud's psychodynamic theory – he saw women as having weaker superegos (due to penis envy); or sociobiological theories of relationships","t":"Issues and Debates part I","id":1926},{"q":"Give an example of beta bias.","a":"Fight or flight research that used males and assumed findings applied to females; Kohlberg's moral development theory based on male participants","t":"Issues and Debates part I","id":1927},{"q":"How can alpha bias lead to discrimination?","a":"Exaggerating differences can reinforce stereotypes and justify unequal treatment, e.g. women being seen as less rational","t":"Issues and Debates part I","id":1928},{"q":"How can beta bias lead to discrimination?","a":"Ignoring differences means women's experiences are not studied, e.g. Taylor's 'tend and befriend' was missed","t":"Issues and Debates part I","id":1929},{"q":"Why may male researchers produce gender-biased research?","a":"They may be more likely to have their research published and may carry their own assumptions into study design","t":"Issues and Debates part I","id":1930},{"q":"What did Taylor et al. (2000) propose?","a":"That women respond to stress with 'tend and befriend' rather than fight or flight – showing beta bias in earlier research","t":"Issues and Debates part I","id":1931},{"q":"Why may psychological research reinforce gender stereotypes?","a":"Findings that emphasise differences can be used to justify roles, e.g. women being less suited to certain careers","t":"Issues and Debates part I","id":1932},{"q":"What is a feminist approach to psychology?","a":"An approach that highlights the biased way women have been studied and aims to correct it","t":"Issues and Debates part I","id":1933},{"q":"What did Worell (1992) propose to avoid gender bias?","a":"Studying women in real-life contexts, involving participants in research, and using diverse samples/qualitative methods","t":"Issues and Debates part I","id":1934},{"q":"What is reflexivity?","a":"Researchers recognising how their own values and biases may affect their research","t":"Issues and Debates part I","id":1935},{"q":"Why has psychology been accused of a 'male-dominated' history?","a":"Most early researchers and participants were male, and women were under-represented in senior positions","t":"Issues and Debates part I","id":1936},{"q":"What is the gender bias issue with Kohlberg's moral development theory?","a":"It was based on interviews with American boys, then applied to girls – Gilligan argued women have a different 'care' orientation","t":"Issues and Debates part I","id":1937},{"q":"What is culture bias?","a":"The tendency to judge all people in terms of one's own cultural assumptions, ignoring the effects of culture","t":"Issues and Debates part I","id":1938},{"q":"What is ethnocentrism?","a":"Judging other cultures by the standards and values of one's own culture, believing one's own culture is superior","t":"Issues and Debates part I","id":1939},{"q":"Give an example of ethnocentrism in psychology.","a":"The Strange Situation – it assumes that independence (a Western value) is healthy and labels Japanese infants as insecure","t":"Issues and Debates part I","id":1940},{"q":"What is cultural relativism?","a":"The idea that norms and values, as well as ethics and morals, can only be meaningful within specific social and cultural contexts","t":"Issues and Debates part I","id":1941},{"q":"What is an etic approach?","a":"Studying behaviour from outside a culture, looking for universal behaviours","t":"Issues and Debates part I","id":1942},{"q":"What is an emic approach?","a":"Studying behaviour from inside a culture, identifying behaviours specific to that culture","t":"Issues and Debates part I","id":1943},{"q":"What is an imposed etic?","a":"When a technique developed in one culture is used to study another, assuming it applies universally","t":"Issues and Debates part I","id":1944},{"q":"What proportion of psychologists in 1992 were American?","a":"Around 64% of the world's psychologists were American (Rosenzweig, 1992)","t":"Issues and Debates part I","id":1945},{"q":"What does WEIRD stand for in psychology?","a":"Western, Educated, Industrialised, Rich, Democratic","t":"Issues and Debates part I","id":1946},{"q":"What is the difference between individualist and collectivist cultures?","a":"Individualist cultures value independence and personal goals; collectivist cultures value interdependence and group goals","t":"Issues and Debates part I","id":1947},{"q":"Why is it a problem to assume the individualist/collectivist distinction always applies?","a":"Cultures change; Takano and Osaka (1999) found 14 of 15 studies found no difference between USA and Japan on individualism","t":"Issues and Debates part I","id":1948},{"q":"What is indigenous psychology?","a":"Theories developed in a particular culture to explain behaviour within that culture, e.g. African psychology","t":"Issues and Debates part I","id":1949},{"q":"What is cross-cultural research?","a":"Research that compares behaviour across different cultures","t":"Issues and Debates part I","id":1950},{"q":"Give a strength of cross-cultural research.","a":"It challenges ethnocentrism and allows researchers to test whether behaviours are universal","t":"Issues and Debates part I","id":1951},{"q":"Give a limitation of cross-cultural research.","a":"Researchers may misinterpret behaviour; tests may not be translated accurately; samples may not represent whole cultures","t":"Issues and Debates part I","id":1952},{"q":"How can researchers reduce culture bias?","a":"Use emic approaches, use researchers from within the culture, avoid imposed etics, use diverse samples","t":"Issues and Debates part I","id":1953},{"q":"What is the free will side of the debate?","a":"Humans can make choices and are not determined by biological or external forces","t":"Issues and Debates part I","id":1954},{"q":"What is determinism?","a":"The view that behaviour is controlled by internal or external forces rather than our will","t":"Issues and Debates part I","id":1955},{"q":"Who is associated with soft determinism?","a":"William James","t":"Issues and Debates part I","id":1956},{"q":"Which approach is linked to psychic determinism?","a":"The psychodynamic approach","t":"Issues and Debates part I","id":1957},{"q":"Which approach is linked to environmental determinism?","a":"The behaviourist approach","t":"Issues and Debates part I","id":1958},{"q":"Which approach is linked to biological determinism?","a":"The biological approach","t":"Issues and Debates part I","id":1959},{"q":"Which approach argues most strongly for free will?","a":"The humanistic approach","t":"Issues and Debates part I","id":1960},{"q":"What did Skinner say about free will?","a":"It is an illusion – what we think of as free choices are the result of reinforcement histories","t":"Issues and Debates part I","id":1961},{"q":"What is the scientific emphasis on causal explanations?","a":"Science assumes all events have causes and aims to identify them to predict and control behaviour","t":"Issues and Debates part I","id":1962},{"q":"Why is determinism consistent with science?","a":"Science assumes behaviour is orderly and predictable, which allows cause-and-effect relationships to be tested","t":"Issues and Debates part I","id":1963},{"q":"Give a strength of free will.","a":"Face validity – we feel we make choices; Roberts et al. (1987) found adolescents with a strong belief in fatalism were more likely to develop depression","t":"Issues and Debates part I","id":1964},{"q":"What did Roberts et al. (1987) find?","a":"Adolescents with an external locus of control/fatalistic beliefs were at higher risk of depression, suggesting a belief in free will is good for mental health","t":"Issues and Debates part I","id":1965},{"q":"Give a limitation of free will.","a":"Neuroscience evidence, e.g. Libet et al. (1985) found brain activity for a decision happened before participants were aware of making it","t":"Issues and Debates part I","id":1966},{"q":"What did Libet et al. (1985) find?","a":"Brain activity to move a finger started about half a second before participants reported deciding to move it","t":"Issues and Debates part I","id":1967},{"q":"What did Soon et al. (2008) find?","a":"Brain activity predicted a decision up to 10 seconds before participants became aware of it","t":"Issues and Debates part I","id":1968},{"q":"Give a limitation of hard determinism for the legal system.","a":"The law assumes people are responsible for their actions; hard determinism implies criminals are not to blame","t":"Issues and Debates part I","id":1969},{"q":"Why is determinism unfalsifiable?","a":"It is always possible to claim a cause exists even if it hasn't been found yet","t":"Issues and Debates part I","id":1970},{"q":"What is the nature side of the nature–nurture debate?","a":"Behaviour is the product of innate, biological factors (heredity)","t":"Issues and Debates part I","id":1971},{"q":"What is the nurture side of the nature–nurture debate?","a":"Behaviour is the product of environmental influences and learning","t":"Issues and Debates part I","id":1972},{"q":"Who were nativists?","a":"Philosophers who argued humans are born with innate knowledge (e.g. Descartes)","t":"Issues and Debates part I","id":1973},{"q":"Who were empiricists?","a":"Philosophers who argued the mind is a blank slate at birth and knowledge comes from experience (e.g. Locke)","t":"Issues and Debates part I","id":1974},{"q":"What is heritability?","a":"The proportion of differences between individuals in a population that is due to genetic factors","t":"Issues and Debates part I","id":1975},{"q":"What is a heritability coefficient?","a":"A number from 0 to 1 showing how much a trait is genetically determined; 1 means entirely genetic","t":"Issues and Debates part I","id":1976},{"q":"What is the heritability of IQ often estimated as?","a":"About 0.5 (Plomin, 1990)","t":"Issues and Debates part I","id":1977},{"q":"What is Lerner's (1986) levels of the environment?","a":"The environment includes everything from prenatal influences to physical and social environments, so it is broad","t":"Issues and Debates part I","id":1978},{"q":"What is the interactionist approach?","a":"Behaviour results from both nature and nurture working together, which cannot be separated","t":"Issues and Debates part I","id":1979},{"q":"Give an example of the interactionist approach.","a":"The diathesis-stress model, or epigenetics","t":"Issues and Debates part I","id":1980},{"q":"What is epigenetics?","a":"Changes in gene expression caused by the environment, without changes to the DNA sequence itself, which can be passed on to future generations","t":"Issues and Debates part I","id":1981},{"q":"Give an example of epigenetics.","a":"The Dutch Hunger Winter – children of mothers who were pregnant during famine had higher rates of schizophrenia and heart disease","t":"Issues and Debates part I","id":1982},{"q":"What is niche-picking?","a":"Choosing environments that suit our genetic tendencies (e.g. sporty people seek out sports)","t":"Issues and Debates part I","id":1983},{"q":"What is the relative importance of heredity and environment?","a":"The idea of trying to measure how much a behaviour is caused by genes versus environment","t":"Issues and Debates part I","id":1984},{"q":"How do twin studies inform the nature–nurture debate?","a":"If MZ twins have higher concordance than DZ twins, it suggests a genetic influence","t":"Issues and Debates part I","id":1985},{"q":"Why is it hard to separate nature and nurture in twin studies?","a":"MZ twins may be treated more similarly than DZ twins, so shared environment may explain higher concordance","t":"Issues and Debates part I","id":1986},{"q":"Give an example of a 'nature' explanation.","a":"The genetic explanation of OCD or schizophrenia; Bowlby's monotropic theory","t":"Issues and Debates part I","id":1987},{"q":"Give an example of a 'nurture' explanation.","a":"Learning theory of attachment; the two-process model of phobias; SLT","t":"Issues and Debates part I","id":1988},{"q":"Why is the nature–nurture debate socially sensitive?","a":"Nature explanations can be used to justify discrimination (e.g. eugenics), while nurture explanations can lead to control of behaviour","t":"Issues and Debates part I","id":1989},{"q":"What is eugenics?","a":"The idea of 'improving' the human population through selective breeding, historically based on a nature view","t":"Issues and Debates part I","id":1990},{"q":"What is holism?","a":"The argument that it only makes sense to study an indivisible system rather than its parts, as the whole is greater than the sum of its parts","t":"Issues and Debates part I","id":1991},{"q":"What is reductionism?","a":"The belief that behaviour is best explained by breaking it into its smallest constituent parts","t":"Issues and Debates part I","id":1992},{"q":"What is 'levels of explanation'?","a":"Behaviour can be explained at different levels, from socio-cultural (highest) to biological/biochemical (lowest)","t":"Issues and Debates part I","id":1993},{"q":"Give the levels of explanation from highest to lowest.","a":"Socio-cultural, Psychological, Physiological/biological, Neurochemical","t":"Issues and Debates part I","id":1994},{"q":"Give an example of explaining OCD at different levels.","a":"Socio-cultural: impact on daily life; Psychological: obsessive thoughts; Physiological: abnormal OFC; Neurochemical: low serotonin","t":"Issues and Debates part I","id":1995},{"q":"What is biological reductionism?","a":"Reducing behaviour to a physical level, explaining it through genes, neurons, hormones and neurotransmitters","t":"Issues and Debates part I","id":1996},{"q":"What is environmental (stimulus-response) reductionism?","a":"Reducing behaviour to simple stimulus-response links learned through experience","t":"Issues and Debates part I","id":1997},{"q":"What is experimental reductionism?","a":"Reducing complex behaviours to isolated, operationalised variables that can be tested in experiments","t":"Issues and Debates part I","id":1998},{"q":"Give a strength of reductionism.","a":"It allows behaviour to be studied scientifically by operationalising variables; has led to effective treatments (e.g. drug therapy)","t":"Issues and Debates part I","id":1999},{"q":"Give a limitation of reductionism.","a":"It oversimplifies complex behaviour and may lose meaning, e.g. drug therapy may ignore social causes of disorders","t":"Issues and Debates part I","id":2000},{"q":"Give a strength of holism.","a":"It may be more valid, as some behaviours can only be understood at the group level, e.g. deindividuation in crowds or conformity","t":"Issues and Debates part I","id":2001},{"q":"Give a limitation of holism.","a":"It is hard to test scientifically, and it is less useful in producing practical applications","t":"Issues and Debates part I","id":2002},{"q":"Which approach is holistic?","a":"The humanistic approach (and to some extent the cognitive approach, which considers higher-level processes)","t":"Issues and Debates part I","id":2003},{"q":"Give an example of holism in research.","a":"Zimbardo's prison study – the behaviour of the guards/prisoners could only be understood as a result of the whole situation","t":"Issues and Debates part I","id":2004},{"q":"What is the idiographic approach?","a":"An approach to research that focuses on the individual and their unique experiences, using mainly qualitative methods","t":"Issues and Debates part I","id":2005},{"q":"What is the nomothetic approach?","a":"An approach to research that aims to create general laws of behaviour that apply to everyone, using quantitative methods","t":"Issues and Debates part I","id":2006},{"q":"Give research methods used in the idiographic approach.","a":"Case studies, unstructured interviews, qualitative methods","t":"Issues and Debates part I","id":2007},{"q":"Give research methods used in the nomothetic approach.","a":"Lab experiments, large samples, statistical analysis","t":"Issues and Debates part I","id":2008},{"q":"Give an example of idiographic research.","a":"Freud's case study of Little Hans, or the case of HM","t":"Issues and Debates part I","id":2009},{"q":"Give an example of nomothetic research.","a":"Milgram's obedience research or Sperry's split-brain research","t":"Issues and Debates part I","id":2010},{"q":"Which approaches are idiographic?","a":"Humanistic and psychodynamic","t":"Issues and Debates part I","id":2011},{"q":"Which approaches are nomothetic?","a":"Behaviourist, cognitive and biological","t":"Issues and Debates part I","id":2012},{"q":"Give a strength of the idiographic approach.","a":"Provides a rich, in-depth understanding of the individual; findings can generate hypotheses for nomothetic research","t":"Issues and Debates part I","id":2013},{"q":"Give a limitation of the idiographic approach.","a":"Difficult to generalise from; lacks scientific rigour and objectivity","t":"Issues and Debates part I","id":2014},{"q":"Give a strength of the nomothetic approach.","a":"Scientific – uses objective, standardised methods; allows predictions and general laws","t":"Issues and Debates part I","id":2015},{"q":"Give a limitation of the nomothetic approach.","a":"Loses the 'whole person'; findings may not apply to individuals (e.g. knowing 1% of people have schizophrenia says little about living with it)","t":"Issues and Debates part I","id":2016},{"q":"Can the idiographic and nomothetic approaches be combined?","a":"Yes – e.g. Millon and Davis (2000) argued they can complement each other; case studies can suggest hypotheses tested nomothetically","t":"Issues and Debates part I","id":2017},{"q":"What is social sensitivity?","a":"Research where there are potential social consequences or implications, either for participants or the group they represent","t":"Issues and Debates part I","id":2018},{"q":"Who defined socially sensitive research?","a":"Sieber and Stanley (1988)","t":"Issues and Debates part I","id":2019},{"q":"Give four issues Sieber and Stanley identified in socially sensitive research.","a":"Implications, Uses/public policy, Validity, Framing the research question","t":"Issues and Debates part I","id":2020},{"q":"What are 'implications' in socially sensitive research?","a":"The wider effects of research, e.g. whether findings could be used to justify discrimination","t":"Issues and Debates part I","id":2021},{"q":"What is 'framing the research question' in socially sensitive research?","a":"The way a research question is phrased may affect how findings are interpreted, e.g. 'alternative' vs 'deviant' behaviour","t":"Issues and Debates part I","id":2022},{"q":"What is 'uses of findings' in socially sensitive research?","a":"How the findings might be used by governments or others, e.g. to shape policy","t":"Issues and Debates part I","id":2023},{"q":"What is 'validity' in socially sensitive research?","a":"Some past socially sensitive research was flawed, e.g. Burt's IQ research, which was used to justify the 11+","t":"Issues and Debates part I","id":2024},{"q":"Give an example of socially sensitive research.","a":"Research into the genetic basis of criminality, IQ and race, sexual orientation, or Bowlby's maternal deprivation (implications for working mothers)","t":"Issues and Debates part I","id":2025},{"q":"Give a benefit of socially sensitive research.","a":"It can benefit groups who are underrepresented, e.g. research into eyewitness testimony protects people from wrongful convictions","t":"Issues and Debates part I","id":2026},{"q":"Give a limitation of socially sensitive research.","a":"It can lead to discrimination, e.g. research on 'race and IQ' could be used to justify unequal treatment","t":"Issues and Debates part I","id":2027},{"q":"Why shouldn't researchers avoid socially sensitive research?","a":"It would leave important questions unanswered and could be seen as avoiding responsibility; benefits often outweigh costs","t":"Issues and Debates part I","id":2028},{"q":"What was Cyril Burt's research, and why was it socially sensitive?","a":"He claimed intelligence was mostly inherited, which influenced the 11+ exam; his data may have been fabricated","t":"Issues and Debates part I","id":2029},{"q":"What is the 'Bell Curve' controversy?","a":"Herrnstein and Murray (1994) suggested IQ differences between racial groups were partly genetic, which was heavily criticised for promoting discrimination","t":"Issues and Debates part I","id":2030},{"q":"Give an example of research with positive social implications.","a":"Research on attachment and institutionalisation improved care for children in orphanages","t":"Issues and Debates part I","id":2031},{"q":"Explain how the biological approach links to the free will/determinism debate.","a":"It is hard determinist – behaviour is determined by genes, hormones and neurochemistry","t":"Issues and Debates part I","id":2032},{"q":"Explain how the cognitive approach links to the free will/determinism debate.","a":"Soft determinist – our cognitive processes limit our choices, but we have some control over our thinking","t":"Issues and Debates part I","id":2033},{"q":"Explain how SLT links to the free will/determinism debate.","a":"Soft determinist – reciprocal determinism means we are influenced by the environment but also influence it","t":"Issues and Debates part I","id":2034},{"q":"Explain how the humanistic approach links to the reductionism/holism debate.","a":"It is holistic, studying the whole person and rejecting reductionist explanations","t":"Issues and Debates part I","id":2035},{"q":"Explain how the behaviourist approach links to the reductionism debate.","a":"It is environmentally reductionist, reducing behaviour to stimulus-response links","t":"Issues and Debates part I","id":2036},{"q":"Explain how the biological approach links to the nature–nurture debate.","a":"It emphasises nature – genes and biology – though it recognises environment through interaction (e.g. diathesis-stress)","t":"Issues and Debates part I","id":2037},{"q":"Explain how the behaviourist approach links to the nature–nurture debate.","a":"It emphasises nurture – all behaviour is learned","t":"Issues and Debates part I","id":2038},{"q":"Explain how the psychodynamic approach links to the nature–nurture debate.","a":"Interactionist – innate drives (id) plus the influence of childhood experiences","t":"Issues and Debates part I","id":2039},{"q":"Explain how Milgram's research links to the free will/determinism debate.","a":"It suggests obedience is determined by situational factors (environmental determinism), but some participants refused, showing free will","t":"Issues and Debates part I","id":2040},{"q":"Explain how Milgram's research links to the idiographic/nomothetic debate.","a":"It is nomothetic – quantitative data from 40 participants used to draw general conclusions about obedience","t":"Issues and Debates part I","id":2041},{"q":"How does Asch's research show beta bias?","a":"Only males were studied, but the findings were assumed to apply to everyone","t":"Issues and Debates part I","id":2042},{"q":"How does Bowlby's theory link to gender bias?","a":"It focuses on the mother as the primary caregiver, ignoring fathers and potentially reinforcing stereotypes about women's roles","t":"Issues and Debates part I","id":2043},{"q":"How does the Strange Situation link to culture bias?","a":"It is an imposed etic, developed in the USA and applied to other cultures where behaviours have different meanings","t":"Issues and Debates part I","id":2044},{"q":"How does the dopamine hypothesis link to reductionism?","a":"It reduces schizophrenia to a single neurotransmitter, ignoring psychological and social causes","t":"Issues and Debates part I","id":2045},{"q":"How does the diathesis-stress model link to the nature–nurture debate?","a":"It is interactionist – a genetic vulnerability combines with environmental stress","t":"Issues and Debates part I","id":2046},{"q":"How does drug therapy link to the reductionism debate?","a":"It is biologically reductionist, treating symptoms by changing neurochemistry and ignoring psychological causes","t":"Issues and Debates part I","id":2047},{"q":"How does research into HM link to the idiographic approach?","a":"It is a detailed case study of one individual, but was used to develop general theories (nomothetic)","t":"Issues and Debates part I","id":2048},{"q":"How does Sperry's split-brain research link to the nomothetic approach?","a":"It aimed to find general laws about hemispheric lateralisation","t":"Issues and Debates part I","id":2049},{"q":"How does locus of control link to the free will/determinism debate?","a":"Internals believe they control their lives (free will), externals believe events are determined by outside forces","t":"Issues and Debates part I","id":2050},{"q":"What is the difference between 'free will' and 'self-determination'?","a":"Self-determination is the idea that people can choose their own goals and actions, which is key in humanistic psychology","t":"Issues and Debates part I","id":2051},{"q":"Why is the concept of 'moral responsibility' important in the free will debate?","a":"If behaviour is determined, people can't be held fully responsible, which challenges the justice system","t":"Issues and Debates part I","id":2052},{"q":"Why do most psychologists take a soft determinist position?","a":"It allows behaviour to be scientifically studied while recognising people have some choice","t":"Issues and Debates part I","id":2053},{"q":"What is a limitation of the concept of 'heritability'?","a":"It only applies to populations, not individuals, and it varies with environment","t":"Issues and Debates part I","id":2054},{"q":"Why is it misleading to ask 'how much' of a behaviour is due to nature or nurture?","a":"The two interact so closely that they cannot be separated","t":"Issues and Debates part I","id":2055},{"q":"Give an example of an environmental influence on a genetic trait.","a":"Height is genetic but affected by nutrition","t":"Issues and Debates part I","id":2056},{"q":"What did Tienari et al. (2004) find?","a":"Adopted children with a biological mother with schizophrenia were more likely to develop it if their adoptive family was dysfunctional – supporting interactionism","t":"Issues and Debates part I","id":2057},{"q":"What is 'gene-environment interaction'?","a":"When the effect of a gene depends on the environment, and vice versa","t":"Issues and Debates part I","id":2058},{"q":"What is 'culture' in psychology?","a":"The rules, customs, morals and ways of interacting that bind members of a society together","t":"Issues and Debates part I","id":2059},{"q":"What is 'subculture'?","a":"A group within a culture that shares some of its own distinct characteristics","t":"Issues and Debates part I","id":2060},{"q":"Why is it important to be aware of culture bias in diagnosis of mental disorders?","a":"Symptoms (e.g. hearing voices) may be seen as normal in some cultures, leading to over- or underdiagnosis","t":"Issues and Debates part I","id":2061},{"q":"Why may the Asch study show cultural bias?","a":"It was carried out in the USA, an individualist culture, so results may not apply to collectivist cultures where conformity is higher","t":"Issues and Debates part I","id":2062},{"q":"What did Bond and Smith (1996) show about culture and conformity?","a":"Conformity was higher in collectivist cultures, showing Asch's findings are culture-bound","t":"Issues and Debates part I","id":2063},{"q":"Why is the humanistic approach culturally biased?","a":"Self-actualisation and personal growth reflect individualist values","t":"Issues and Debates part I","id":2064},{"q":"Why can research into gender differences be socially sensitive?","a":"It may be used to justify unequal treatment or restrict opportunities for men or women","t":"Issues and Debates part I","id":2065},{"q":"What is 'universality' in relation to attachment research?","a":"Van Ijzendoorn found secure attachment was most common across cultures, suggesting attachment may be universal","t":"Issues and Debates part I","id":2066},{"q":"What is a 'cultural universal'?","a":"A behaviour found in all cultures, e.g. facial expressions of basic emotions (Ekman)","t":"Issues and Debates part I","id":2067},{"q":"What did Ekman find about emotional expressions?","a":"Basic facial expressions of emotion (e.g. happiness, fear) are recognised across cultures, suggesting they are universal","t":"Issues and Debates part I","id":2068},{"q":"What is the difference between the 'person' and the 'situation' in explaining behaviour?","a":"Dispositional explanations focus on internal characteristics; situational explanations focus on external circumstances","t":"Issues and Debates part I","id":2069},{"q":"How does the dispositional/situational debate link to free will?","a":"Situational explanations imply behaviour is determined by the environment; dispositional explanations may imply some self-control","t":"Issues and Debates part I","id":2070},{"q":"What is the main strength of the interactionist approach?","a":"It gives a more complete explanation of behaviour and can lead to combined treatments (e.g. drugs + CBT)","t":"Issues and Debates part I","id":2071},{"q":"What is the main limitation of the interactionist approach?","a":"It is complex and hard to test, and can be difficult to identify the exact contribution of each factor","t":"Issues and Debates part I","id":2072},{"q":"Why is determinism useful for treatment?","a":"If we know the causes of a behaviour, we can develop treatments that target them","t":"Issues and Debates part I","id":2073},{"q":"Why may a belief in free will be important in therapy?","a":"Clients may be more motivated to change if they believe they can control their behaviour, e.g. CBT and client-centred therapy","t":"Issues and Debates part I","id":2074},{"q":"How does Freud's theory show alpha bias?","a":"He argued women have weaker superegos because they don't experience castration anxiety, exaggerating sex differences","t":"Issues and Debates part I","id":2075},{"q":"How does research on the fight or flight response show androcentrism?","a":"Most research used males, and male responses were treated as the norm for everyone","t":"Issues and Debates part I","id":2076},{"q":"How does Milgram's original study show gender bias?","a":"It used only male participants but was generalised to all people (beta bias)","t":"Issues and Debates part I","id":2077},{"q":"How does Kohlberg's theory link to gender bias?","a":"It was based on males, and women tended to score lower, suggesting they were less morally developed (alpha bias)","t":"Issues and Debates part I","id":2078},{"q":"How does Bowlby's maternal deprivation theory link to socially sensitive research?","a":"It implied working mothers damage their children, with implications for women's employment","t":"Issues and Debates part I","id":2079},{"q":"How does the diagnosis of schizophrenia link to culture bias?","a":"African-Caribbean people in the UK are more likely to be diagnosed, possibly because of cultural misunderstanding","t":"Issues and Debates part I","id":2080},{"q":"How does the diagnosis of schizophrenia link to gender bias?","a":"Loring and Powell (1988) found the same symptoms were diagnosed as schizophrenia more in men","t":"Issues and Debates part I","id":2081},{"q":"How does the Strange Situation link to the idiographic/nomothetic debate?","a":"It is nomothetic – it classifies infants into general attachment types","t":"Issues and Debates part I","id":2082},{"q":"How does Freud's Little Hans case link to the idiographic/nomothetic debate?","a":"It is idiographic – an in-depth study of one boy, though Freud generalised it to all boys","t":"Issues and Debates part I","id":2083},{"q":"How does Eysenck's criminal personality link to the nature–nurture debate?","a":"Personality is innate (nature), but socialisation affects whether it leads to crime (nurture)","t":"Issues and Debates part I","id":2084},{"q":"How does differential association theory link to the free will/determinism debate?","a":"It is environmentally deterministic – offending is caused by learning from associates","t":"Issues and Debates part I","id":2085},{"q":"How does the dopamine hypothesis link to the nature–nurture debate?","a":"It is a nature explanation, based on neurochemistry","t":"Issues and Debates part I","id":2086},{"q":"How does the two-process model of phobias link to reductionism?","a":"It is environmentally reductionist, reducing phobias to stimulus-response associations","t":"Issues and Debates part I","id":2087},{"q":"How does the working memory model link to reductionism?","a":"It uses machine reductionism, comparing memory to an information-processing system","t":"Issues and Debates part I","id":2088},{"q":"How does Rusbult's investment model link to the reductionism debate?","a":"It is reductionist, explaining relationships in terms of costs, rewards and investments","t":"Issues and Debates part I","id":2089},{"q":"How do theories of relationships link to culture bias?","a":"Most were developed in individualist Western cultures and may not explain arranged or collectivist relationships","t":"Issues and Debates part I","id":2090},{"q":"How does research into obedience link to socially sensitive research?","a":"It may be used to justify atrocities ('just following orders') or to train people to obey","t":"Issues and Debates part I","id":2091},{"q":"How does the ERA project link to socially sensitive research?","a":"Findings affect adoption policy and may stigmatise adopted children","t":"Issues and Debates part I","id":2092},{"q":"How does research into parasocial relationships link to the idiographic/nomothetic debate?","a":"Most is nomothetic, using questionnaires like the Celebrity Attitude Scale on large samples","t":"Issues and Debates part I","id":2093},{"q":"How does split-brain research link to reductionism?","a":"It reduces cognitive functions to specific brain hemispheres","t":"Issues and Debates part I","id":2094},{"q":"How does plasticity research link to the nature–nurture debate?","a":"The brain's structure (nature) changes with experience (nurture), supporting interactionism","t":"Issues and Debates part I","id":2095},{"q":"How does the humanistic approach link to the nature–nurture debate?","a":"It emphasises nurture – the environment (e.g. conditions of worth) affects personal growth","t":"Issues and Debates part I","id":2096},{"q":"How does SLT link to the reductionism debate?","a":"Less reductionist than behaviourism, as it includes cognitive mediational processes","t":"Issues and Debates part I","id":2097},{"q":"How does SLT link to the nature–nurture debate?","a":"Nurture – behaviour is learned by observing and imitating role models","t":"Issues and Debates part I","id":2098},{"q":"How does the cognitive interview link to real-world applications?","a":"It uses memory research to improve police interviews and eyewitness accuracy","t":"Issues and Debates part I","id":2099},{"q":"What is an 'upward' level of explanation?","a":"A higher level, such as social or cultural explanations","t":"Issues and Debates part I","id":2100},{"q":"What is a 'downward' level of explanation?","a":"A lower level, such as neurochemistry or genes","t":"Issues and Debates part I","id":2101},{"q":"Why might a behaviour need to be explained at multiple levels?","a":"Different levels answer different questions; a complete understanding may need all of them","t":"Issues and Debates part I","id":2102},{"q":"What is 'ethical relativism'?","a":"The idea that ethical standards vary between cultures, making it hard to apply one set of rules universally","t":"Issues and Debates part I","id":2103},{"q":"Why might psychologists avoid cross-cultural comparisons?","a":"Different cultures may interpret tests and questions differently, making comparisons invalid","t":"Issues and Debates part I","id":2104},{"q":"What is 'gynocentrism'?","a":"The opposite of androcentrism – focusing on women's perspectives, sometimes proposed as a corrective","t":"Issues and Debates part I","id":2105},{"q":"Why might women be under-represented in psychology research historically?","a":"Researchers were mostly male and often used male participants for convenience","t":"Issues and Debates part I","id":2106},{"q":"What is a problem with using university students as participants?","a":"They are WEIRD and unrepresentative of the wider population","t":"Issues and Debates part I","id":2107},{"q":"What did Arnett (2008) find?","a":"96% of participants in top psychology journals were from Western industrialised countries, which contain only 12% of the world's population","t":"Issues and Debates part I","id":2108},{"q":"Why can a nomothetic approach be useful for treatment?","a":"General laws allow treatments to be developed that help many people, e.g. drug therapies","t":"Issues and Debates part I","id":2109},{"q":"Why can an idiographic approach be useful for treatment?","a":"It allows therapy to be tailored to the individual, e.g. client-centred therapy","t":"Issues and Debates part I","id":2110},{"q":"What is the 'problem of free will' for science?","a":"Free will can't be measured or tested, so it can't be studied scientifically","t":"Issues and Debates part I","id":2111},{"q":"What is 'compatibilism'?","a":"The view that free will and determinism can coexist – another name for soft determinism","t":"Issues and Debates part I","id":2112},{"q":"What is the 'causal chain' in determinism?","a":"The idea that every event has a cause, which itself has a cause, back in a chain","t":"Issues and Debates part I","id":2113},{"q":"Why is the belief in free will adaptive?","a":"It may encourage responsibility and motivation, and is linked to better mental health","t":"Issues and Debates part I","id":2114},{"q":"What is 'probabilistic determinism'?","a":"The view that behaviour is not caused with certainty but factors make certain behaviours more likely","t":"Issues and Debates part I","id":2115},{"q":"Why is determinism important in the legal system?","a":"Courts can consider mitigating factors (e.g. mental illness) that reduce responsibility","t":"Issues and Debates part I","id":2116},{"q":"What is 'diminished responsibility'?","a":"A legal defence where a person's mental state reduces their responsibility for a crime","t":"Issues and Debates part I","id":2117},{"q":"What is 'gene-environment correlation'?","a":"When genes influence the environments we experience, e.g. an aggressive child provokes hostile responses","t":"Issues and Debates part I","id":2118},{"q":"What is the constructivist view of nature and nurture?","a":"People create their own environments to fit their natures (niche-picking)","t":"Issues and Debates part I","id":2119},{"q":"What does an interactionist view say about schizophrenia?","a":"A genetic vulnerability combined with stressors (e.g. cannabis, family dysfunction) causes the disorder","t":"Issues and Debates part I","id":2120},{"q":"What does an interactionist view say about OCD?","a":"Genetic and neural factors interact with environmental triggers like trauma","t":"Issues and Debates part I","id":2121},{"q":"Why might social sensitivity lead to self-censorship in research?","a":"Researchers may avoid important topics to avoid controversy","t":"Issues and Debates part I","id":2122},{"q":"What guidance does the BPS give about socially sensitive research?","a":"Researchers should consider the consequences for participants and the groups they represent","t":"Issues and Debates part I","id":2123},{"q":"Why is it important to consider who funds research?","a":"Funding may affect the research question and interpretation, e.g. drug companies funding trials","t":"Issues and Debates part I","id":2124},{"q":"What does 'reflexivity' mean for gender bias?","a":"Researchers reflect on how their own gender might affect their research","t":"Issues and Debates part I","id":2125},{"q":"What is the difference between 'sex' and 'gender'?","a":"Sex refers to biological differences; gender refers to social and psychological characteristics","t":"Issues and Debates part I","id":2126},{"q":"How can research avoid beta bias?","a":"Include both males and females in samples and analyse results separately","t":"Issues and Debates part I","id":2127},{"q":"Who proposed the multi-store model of memory?","a":"Atkinson and Shiffrin (1968)","t":"Memory","id":2128},{"q":"Is the multi-store model a structural or process model?","a":"Mainly structural – it describes the stores and how information flows between them","t":"Memory","id":2129},{"q":"What is the sensory register?","a":"The store that briefly holds sensory information from each of the senses","t":"Memory","id":2130},{"q":"What is the coding in the sensory register?","a":"Modality-specific – it depends on the sense (e.g. iconic for visual, echoic for sound)","t":"Memory","id":2131},{"q":"What is the capacity of the sensory register?","a":"Very large","t":"Memory","id":2132},{"q":"What is the duration of the sensory register?","a":"Less than half a second (about 250 milliseconds)","t":"Memory","id":2133},{"q":"What is iconic memory?","a":"The sensory store for visual information","t":"Memory","id":2134},{"q":"What is echoic memory?","a":"The sensory store for auditory information","t":"Memory","id":2135},{"q":"How does information pass from the sensory register to STM?","a":"Through paying attention to it","t":"Memory","id":2136},{"q":"What is the coding of STM?","a":"Mainly acoustic","t":"Memory","id":2137},{"q":"What is the capacity of STM?","a":"About 7 ± 2 items (Miller, 1956), or around 4 chunks (Cowan, 2001)","t":"Memory","id":2138},{"q":"What is the duration of STM?","a":"About 18–30 seconds without rehearsal","t":"Memory","id":2139},{"q":"What is the coding of LTM?","a":"Mainly semantic","t":"Memory","id":2140},{"q":"What is the capacity of LTM?","a":"Potentially unlimited","t":"Memory","id":2141},{"q":"What is the duration of LTM?","a":"Potentially a lifetime","t":"Memory","id":2142},{"q":"What is maintenance rehearsal?","a":"Repeating information over and over to keep it in STM","t":"Memory","id":2143},{"q":"What is elaborative rehearsal?","a":"Processing information more deeply, e.g. linking it to existing knowledge, which transfers it to LTM","t":"Memory","id":2144},{"q":"What is retrieval in the multi-store model?","a":"Information from LTM is transferred back to STM when it is needed","t":"Memory","id":2145},{"q":"What is displacement in STM?","a":"When new information pushes out old information because STM's capacity is limited","t":"Memory","id":2146},{"q":"What is decay in STM?","a":"When information is lost from STM because it is not rehearsed and the memory trace fades","t":"Memory","id":2147},{"q":"Who studied coding in STM and LTM?","a":"Baddeley (1966)","t":"Memory","id":2148},{"q":"Describe Baddeley's (1966) procedure on coding.","a":"Participants were given lists of words that were acoustically similar or dissimilar, or semantically similar or dissimilar, and recalled them either immediately or after 20 minutes","t":"Memory","id":2149},{"q":"What did Baddeley (1966) find about STM coding?","a":"Immediate recall was worse for acoustically similar words, suggesting STM is coded acoustically","t":"Memory","id":2150},{"q":"What did Baddeley (1966) find about LTM coding?","a":"Recall after 20 minutes was worse for semantically similar words, suggesting LTM is coded semantically","t":"Memory","id":2151},{"q":"Give a limitation of Baddeley's (1966) coding study.","a":"It used artificial word lists with no personal meaning, so it may not reflect coding of meaningful everyday memories","t":"Memory","id":2152},{"q":"How did Jacobs (1887) measure STM capacity?","a":"The digit span technique – reading out increasing lists of digits/letters until the participant could not recall them in order","t":"Memory","id":2153},{"q":"What did Jacobs (1887) find?","a":"Mean span was 9.3 digits and 7.3 letters","t":"Memory","id":2154},{"q":"What is chunking?","a":"Grouping information into larger meaningful units to increase the capacity of STM","t":"Memory","id":2155},{"q":"Who suggested STM capacity is more like 4 chunks?","a":"Cowan (2001)","t":"Memory","id":2156},{"q":"Describe Peterson and Peterson's (1959) procedure.","a":"24 students were given consonant syllables (trigrams) to recall after intervals of 3, 6, 9, 12, 15 or 18 seconds, while counting backwards in threes to prevent rehearsal","t":"Memory","id":2157},{"q":"What were Peterson and Peterson's findings?","a":"After 3 seconds about 80% recall, after 18 seconds less than 10% recall – STM duration is about 18 seconds without rehearsal","t":"Memory","id":2158},{"q":"Why did participants count backwards in Peterson and Peterson's study?","a":"To prevent rehearsal","t":"Memory","id":2159},{"q":"Give a limitation of Peterson and Peterson's study.","a":"Counting backwards may have caused interference (displacement) rather than decay; also artificial stimuli","t":"Memory","id":2160},{"q":"Who studied LTM duration using a yearbook?","a":"Bahrick et al. (1975)","t":"Memory","id":2161},{"q":"Describe Bahrick's (1975) procedure.","a":"392 American ex-students aged 17–74 were tested on their memory of classmates with a photo-recognition test and a free recall test","t":"Memory","id":2162},{"q":"What were Bahrick's (1975) findings?","a":"Within 15 years of graduating, 90% accurate on photo recognition; after 48 years about 70%; free recall was lower (60% after 15 years, 30% after 48 years)","t":"Memory","id":2163},{"q":"Give a strength of Bahrick's study.","a":"High ecological validity – it used meaningful real-life memories","t":"Memory","id":2164},{"q":"Give a limitation of Bahrick's study.","a":"Lack of control – participants may have looked at their yearbooks or kept in touch with classmates since","t":"Memory","id":2165},{"q":"Give research support for STM and LTM being separate stores.","a":"Case study of HM (and KF), or Baddeley's coding study","t":"Memory","id":2166},{"q":"What happened to HM?","a":"He had his hippocampus removed to treat epilepsy and could no longer form new long-term memories, but his STM was intact","t":"Memory","id":2167},{"q":"What happened to KF?","a":"After a motorcycle accident his STM for verbal information was poor, but his STM for visual information and his LTM were fine","t":"Memory","id":2168},{"q":"Why does KF challenge the MSM?","a":"It suggests STM is not a single unitary store – there may be separate stores for verbal and visual information","t":"Memory","id":2169},{"q":"What is the unitary store criticism of the MSM?","a":"The MSM says STM and LTM are single stores, but evidence shows there are different types (e.g. working memory, types of LTM)","t":"Memory","id":2170},{"q":"Why is rehearsal not the only way to transfer to LTM?","a":"We remember things we have never rehearsed (e.g. flashbulb memories), and Craik and Watkins (1973) found type of rehearsal matters more than amount","t":"Memory","id":2171},{"q":"What did Craik and Watkins (1973) find?","a":"Elaborative rehearsal is needed for long-term storage; maintenance rehearsal alone was not enough","t":"Memory","id":2172},{"q":"Give a limitation of the evidence for the MSM.","a":"Much of it uses artificial stimuli like digits and letters in lab settings","t":"Memory","id":2173},{"q":"Is the flow of information in the MSM always one-way?","a":"No – it appears to be one-way, but LTM influences STM (e.g. chunking uses knowledge from LTM)","t":"Memory","id":2174},{"q":"Who proposed the working memory model?","a":"Baddeley and Hitch (1974)","t":"Memory","id":2175},{"q":"Why was the working memory model developed?","a":"To explain how STM works as an active store, as the MSM's view of a single STM was too simple","t":"Memory","id":2176},{"q":"What are the four components of the working memory model?","a":"Central executive, Phonological loop, Visuo-spatial sketchpad, Episodic buffer","t":"Memory","id":2177},{"q":"What does the central executive do?","a":"Allocates tasks to the slave systems, directs attention and monitors incoming data","t":"Memory","id":2178},{"q":"What is the capacity of the central executive?","a":"Very limited","t":"Memory","id":2179},{"q":"Does the central executive store information?","a":"No","t":"Memory","id":2180},{"q":"What does the phonological loop do?","a":"Deals with auditory information and preserves the order in which information arrives","t":"Memory","id":2181},{"q":"What are the two parts of the phonological loop?","a":"The phonological store and the articulatory process","t":"Memory","id":2182},{"q":"What is the phonological store?","a":"The 'inner ear' – stores the words you hear","t":"Memory","id":2183},{"q":"What is the capacity of the phonological loop?","a":"About 2 seconds' worth of what you can say","t":"Memory","id":2184},{"q":"What does the visuo-spatial sketchpad do?","a":"Stores visual and/or spatial information when required – the 'inner eye'","t":"Memory","id":2185},{"q":"What is the capacity of the visuo-spatial sketchpad?","a":"About 3–4 objects (Baddeley, 2003)","t":"Memory","id":2186},{"q":"Who divided the visuo-spatial sketchpad into two parts?","a":"Logie (1995)","t":"Memory","id":2187},{"q":"What are Logie's two parts of the visuo-spatial sketchpad?","a":"Visual cache (stores visual data), Inner scribe (records arrangement of objects in space)","t":"Memory","id":2188},{"q":"What is the episodic buffer?","a":"A temporary store that integrates visual, spatial and verbal information and links working memory to LTM","t":"Memory","id":2189},{"q":"When was the episodic buffer added?","a":"2000 (Baddeley)","t":"Memory","id":2190},{"q":"What is the capacity of the episodic buffer?","a":"About 4 chunks","t":"Memory","id":2191},{"q":"Why was the episodic buffer added?","a":"The model needed a general store and a way to link working memory with LTM and integrate information across slave systems","t":"Memory","id":2192},{"q":"What is the word length effect?","a":"People find it harder to remember a list of long words than short words","t":"Memory","id":2193},{"q":"Why does the word length effect support the WMM?","a":"It shows the phonological loop has a limited capacity (about 2 seconds of speech)","t":"Memory","id":2194},{"q":"What is articulatory suppression?","a":"Repeating a word (e.g. 'the the the') which fills the articulatory process and removes the word length effect","t":"Memory","id":2195},{"q":"What is dual task performance?","a":"Doing two tasks at the same time to see whether they use the same component of working memory","t":"Memory","id":2196},{"q":"How does dual task performance support the WMM?","a":"Two tasks using the same slave system (e.g. two visual tasks) are harder to do together than tasks using different systems (e.g. visual and verbal)","t":"Memory","id":2197},{"q":"Describe Baddeley et al.'s (1975) dual task study.","a":"Participants found it harder to do a visual tracking task and describe the angles of a letter F (both visual) at the same time than to track and do a verbal task","t":"Memory","id":2198},{"q":"How does KF support the WMM?","a":"His verbal STM was damaged but visual STM was intact, suggesting separate phonological loop and visuo-spatial sketchpad","t":"Memory","id":2199},{"q":"Why is KF weak evidence for the WMM?","a":"KF's brain injury was traumatic, so it may have affected other cognitive abilities; case studies are hard to generalise","t":"Memory","id":2200},{"q":"Give a limitation of the central executive.","a":"It is vague and unclear – Baddeley himself said it is the least understood component; it may have several components","t":"Memory","id":2201},{"q":"What did Eslinger and Damasio (1985) find about the central executive?","a":"Patient EVR had a brain tumour removed, performed well on reasoning tests but had poor decision-making, suggesting the central executive is not one unitary component","t":"Memory","id":2202},{"q":"Give a strength of the WMM compared with the MSM.","a":"It explains how STM is an active processor and is supported by dual task and brain imaging evidence","t":"Memory","id":2203},{"q":"Give brain scanning evidence for the WMM.","a":"Braver et al. (1997) found more activity in the prefrontal cortex as tasks placed more demands on the central executive","t":"Memory","id":2204},{"q":"What are the two types of interference?","a":"Proactive interference, Retroactive interference","t":"Memory","id":2205},{"q":"What is proactive interference?","a":"When old learning disrupts the recall of new learning","t":"Memory","id":2206},{"q":"What is retroactive interference?","a":"When new learning disrupts the recall of old learning","t":"Memory","id":2207},{"q":"Give an example of proactive interference.","a":"Calling a new partner by an old partner's name","t":"Memory","id":2208},{"q":"Give an example of retroactive interference.","a":"Learning a new phone number means you forget your old one","t":"Memory","id":2209},{"q":"Is interference an explanation of forgetting in STM or LTM?","a":"LTM","t":"Memory","id":2210},{"q":"When is interference most likely?","a":"When the two memories are similar","t":"Memory","id":2211},{"q":"What did McGeoch and McDonald (1931) find?","a":"Participants learned a list of words then a second list; recall was worst when the second list was synonyms of the first – interference is greatest when memories are similar","t":"Memory","id":2212},{"q":"What did Underwood (1957) find?","a":"Participants who had learned many previous word lists forgot more of a new list after 24 hours – evidence for proactive interference","t":"Memory","id":2213},{"q":"What did Baddeley and Hitch (1977) find with rugby players?","a":"Players who had played more games in between forgot more team names than those who missed games through injury – interference in real life","t":"Memory","id":2214},{"q":"Give a limitation of interference research.","a":"Mostly artificial lab tasks with word lists, and the time between learning is short, which doesn't reflect everyday forgetting","t":"Memory","id":2215},{"q":"Why is interference said to explain only some forgetting?","a":"It only explains forgetting when two similar memories compete; most everyday forgetting is probably due to retrieval failure","t":"Memory","id":2216},{"q":"What did Tulving and Psotka (1971) find about interference?","a":"When participants were given cues, the effect of interference disappeared – suggesting the memories were still there but not accessible","t":"Memory","id":2217},{"q":"What is retrieval failure?","a":"Forgetting due to the absence of cues that were present at the time of learning","t":"Memory","id":2218},{"q":"Who proposed the encoding specificity principle?","a":"Tulving (1983)","t":"Memory","id":2219},{"q":"What is a cue in memory?","a":"A trigger of information that allows us to access a memory","t":"Memory","id":2220},{"q":"What are the two types of cue-dependent forgetting?","a":"Context-dependent forgetting, State-dependent forgetting","t":"Memory","id":2221},{"q":"What is context-dependent forgetting?","a":"Forgetting because the external environment at recall is different from that at encoding","t":"Memory","id":2222},{"q":"What is state-dependent forgetting?","a":"Forgetting because the internal state (e.g. mood, drunk, drugged) at recall is different from that at encoding","t":"Memory","id":2223},{"q":"Describe Godden and Baddeley's (1975) procedure.","a":"Deep-sea divers learned word lists either on land or underwater and recalled either on land or underwater (4 conditions)","t":"Memory","id":2224},{"q":"What did Godden and Baddeley (1975) find?","a":"Recall was about 40% lower in the conditions where learning and recall environments did not match","t":"Memory","id":2225},{"q":"What did Carter and Cassaday (1998) find?","a":"Participants who learned and recalled in the same state (both on or both off antihistamine drugs) had better recall – state-dependent forgetting","t":"Memory","id":2226},{"q":"Give a limitation of Godden and Baddeley's study.","a":"Real-life contexts are rarely as different as underwater versus land, so context effects may be weak in everyday life","t":"Memory","id":2227},{"q":"Give a strength of retrieval failure.","a":"Lots of research support (Godden and Baddeley, Carter and Cassaday); real-world applications such as the cognitive interview and revision tips","t":"Memory","id":2228},{"q":"What did Baddeley (1997) say about context-dependent forgetting?","a":"That contexts have to be very different before an effect is seen, so it may not explain much everyday forgetting","t":"Memory","id":2229},{"q":"What did Godden and Baddeley (1980) find about recognition?","a":"Context effects disappeared with a recognition test, so retrieval failure applies to recall but not recognition","t":"Memory","id":2230},{"q":"What is eyewitness testimony (EWT)?","a":"The ability of people to remember the details of events, such as crimes or accidents, which they have observed","t":"Memory","id":2231},{"q":"What three factors affect EWT on the specification?","a":"Leading questions, Post-event discussion, Anxiety","t":"Memory","id":2232},{"q":"What is a leading question?","a":"A question which, because of the way it is phrased, suggests a certain answer","t":"Memory","id":2233},{"q":"Describe Loftus and Palmer's (1974) procedure.","a":"45 students watched film clips of car accidents and were asked 'About how fast were the cars going when they ___ each other?' with different verbs","t":"Memory","id":2234},{"q":"What verbs did Loftus and Palmer use?","a":"Smashed, collided, bumped, hit, contacted","t":"Memory","id":2235},{"q":"What did Loftus and Palmer (1974) find?","a":"'Smashed' gave a mean estimate of 40.5mph and 'contacted' 31.8mph","t":"Memory","id":2236},{"q":"Describe Loftus and Palmer's second experiment.","a":"A week later participants were asked if they had seen broken glass; 32% in the 'smashed' condition said yes compared with 14% for 'hit' – but there was none","t":"Memory","id":2237},{"q":"What is the response-bias explanation of leading questions?","a":"The wording doesn't change the memory, it just influences the kind of answer given","t":"Memory","id":2238},{"q":"What is the substitution explanation of leading questions?","a":"The wording of a leading question actually changes the participant's memory of the event","t":"Memory","id":2239},{"q":"Which experiment supports the substitution explanation?","a":"Loftus and Palmer's second experiment – participants in the 'smashed' condition were more likely to report seeing broken glass","t":"Memory","id":2240},{"q":"Give a limitation of Loftus and Palmer's study.","a":"Watching film clips is less stressful than real accidents, so it lacks ecological validity; students may not be representative","t":"Memory","id":2241},{"q":"What did Foster et al. (1994) find?","a":"Eyewitnesses were more accurate if they thought the crime was real and would affect the trial, suggesting lab studies overstate inaccuracy","t":"Memory","id":2242},{"q":"What did Loftus (1975) find about leading questions and objects?","a":"A leading question about a barn (that wasn't there) led participants to report seeing a barn later","t":"Memory","id":2243},{"q":"What is post-event discussion (PED)?","a":"When co-witnesses discuss the event they saw, which can contaminate their memories","t":"Memory","id":2244},{"q":"What is memory conformity?","a":"When a witness goes along with another witness's account, without it actually changing their memory, to gain social approval or because they think the other is right","t":"Memory","id":2245},{"q":"What did Gabbert et al. (2003) find?","a":"71% of participants who discussed a crime video with a co-witness recalled information they had not seen, compared with 0% in the control group","t":"Memory","id":2246},{"q":"What is memory contamination in PED?","a":"When a co-witness's information becomes combined with a witness's own memory","t":"Memory","id":2247},{"q":"Why does research into PED have practical applications?","a":"The police try to keep witnesses apart and interview them as soon as possible","t":"Memory","id":2248},{"q":"What did Skagerberg and Wright (2008) find?","a":"Real witnesses often discuss events with co-witnesses (about 86%), showing PED is a real issue","t":"Memory","id":2249},{"q":"Give a limitation of research into misleading information (age).","a":"Age differences – Anastasi and Rhodes (2006) found older (55–78) participants were less accurate than younger ones; much research used students","t":"Memory","id":2250},{"q":"How does anxiety affect EWT negatively?","a":"It can narrow attention onto the source of the threat (e.g. a weapon), so peripheral details are not encoded","t":"Memory","id":2251},{"q":"Describe Johnson and Scott's (1976) weapon focus study.","a":"Participants in a waiting room heard an argument; a man came out holding either a pen covered in grease or a knife covered in blood; 49% identified the man in the pen condition versus 33% in the knife condition","t":"Memory","id":2252},{"q":"How does anxiety sometimes improve EWT?","a":"Fight or flight increases alertness, which may improve recall of central details","t":"Memory","id":2253},{"q":"What did Yuille and Cutshall (1986) find?","a":"Witnesses to a real shooting in Canada were still very accurate 4–5 months later, and those with most stress were most accurate (88% vs 75%)","t":"Memory","id":2254},{"q":"What is the Yerkes–Dodson law?","a":"The inverted-U relationship: performance improves as arousal increases up to an optimal point, then declines","t":"Memory","id":2255},{"q":"How was Yerkes–Dodson applied to EWT by Deffenbacher (1983)?","a":"Low and very high anxiety lead to poor recall, while moderate anxiety leads to best recall","t":"Memory","id":2256},{"q":"Give a limitation of Johnson and Scott's weapon focus research.","a":"Pickel (1998) found it may be surprise rather than anxiety that caused weapon focus, as unusual objects (e.g. a raw chicken) also reduced accuracy","t":"Memory","id":2257},{"q":"Give an ethical issue with anxiety research.","a":"Creating anxiety in par
