ticipants may cause psychological harm","t":"Memory","id":2258},{"q":"What is the cognitive interview?","a":"A police interview technique that uses memory research to improve witness recall","t":"Memory","id":2259},{"q":"What are the four main techniques in the cognitive interview?","a":"Report everything, Reinstate the context, Reverse the order, Change perspective","t":"Memory","id":2260},{"q":"What is 'report everything' in the cognitive interview?","a":"Witnesses are encouraged to include every detail, even if it seems unimportant, as it may trigger other memories","t":"Memory","id":2261},{"q":"What is 'reinstate the context' in the cognitive interview?","a":"Witnesses return mentally to the original crime scene and imagine the environment and their feelings","t":"Memory","id":2262},{"q":"What is 'reverse the order' in the cognitive interview?","a":"Events are recalled in a different order from how they occurred, to prevent schemas/expectations shaping recall","t":"Memory","id":2263},{"q":"What is 'change perspective' in the cognitive interview?","a":"Witnesses recall the incident from other people's perspectives, to disrupt the effect of schemas","t":"Memory","id":2264},{"q":"What does the enhanced cognitive interview add?","a":"Social dynamics – e.g. reducing anxiety, minimising distractions, speaking slowly, asking open questions, eye contact","t":"Memory","id":2265},{"q":"What did Kohnken et al. (1999) find?","a":"A meta-analysis of 50+ studies found the cognitive interview produced 41% more correct information than a standard interview","t":"Memory","id":2266},{"q":"Give a limitation of the cognitive interview.","a":"It is time-consuming and requires special training, so police may not use it fully; it can also increase incorrect information","t":"Memory","id":2267},{"q":"What did Milne and Bull (2002) find?","a":"Each technique alone produced more information than a standard interview, but 'report everything' combined with 'reinstate context' was most effective","t":"Memory","id":2268},{"q":"Why may the cognitive interview increase inaccurate information?","a":"Kohnken found an 81% increase in correct information but also a 61% increase in incorrect information in the enhanced version","t":"Memory","id":2269},{"q":"Why is the cognitive interview a 'family' of techniques?","a":"Different police forces use different versions, making it hard to compare effectiveness","t":"Memory","id":2270},{"q":"Why is EWT important in the legal system?","a":"Juries find eyewitnesses very convincing, yet inaccurate EWT has led to wrongful convictions","t":"Memory","id":2271},{"q":"What did the Innocence Project find about EWT?","a":"Mistaken eyewitness identification played a role in around 70% of convictions later overturned by DNA evidence","t":"Memory","id":2272},{"q":"What is a schema in the context of EWT?","a":"A mental framework of expectations that may lead witnesses to fill gaps or distort memories","t":"Memory","id":2273},{"q":"What is the difference between recall and recognition?","a":"Recall means retrieving information without cues; recognition means identifying information when it is presented","t":"Memory","id":2274},{"q":"What is the digit span test used to measure?","a":"The capacity of STM","t":"Memory","id":2275},{"q":"Give one real-world application of the working memory model.","a":"Understanding why it is hard to do two similar tasks at once, e.g. driving (visuo-spatial) while reading directions; explaining learning difficulties","t":"Memory","id":2276},{"q":"What is a limitation of the multi-store model's view of LTM?","a":"It sees LTM as a single store, but there appear to be different types of LTM (episodic, semantic, procedural)","t":"Memory","id":2277},{"q":"Why is the MSM considered influential?","a":"It was the first model to distinguish STM and LTM and led to further research and models","t":"Memory","id":2278},{"q":"Give an example of how LTM helps chunking.","a":"You can remember 'FBIBBCNHS' easily because you recognise FBI, BBC and NHS from LTM","t":"Memory","id":2279},{"q":"What is a limitation of the WMM's evidence from case studies?","a":"Case studies of brain-damaged patients may not generalise and we don't know the person's abilities before the damage","t":"Memory","id":2280},{"q":"Why is the WMM only a model of STM?","a":"It explains how information is processed in the short term; it says little about LTM or sensory memory","t":"Memory","id":2281},{"q":"What is the primacy effect?","a":"Better recall of items at the beginning of a list, as they have been rehearsed and transferred to LTM","t":"Memory","id":2282},{"q":"What is the recency effect?","a":"Better recall of the last few items in a list, as they are still in STM","t":"Memory","id":2283},{"q":"How does the serial position effect support the MSM?","a":"Primacy and recency effects suggest separate STM and LTM stores (Glanzer and Cunitz, 1966)","t":"Memory","id":2284},{"q":"What did Glanzer and Cunitz (1966) find when recall was delayed by 30 seconds?","a":"The recency effect disappeared, but the primacy effect remained – supporting separate STM and LTM","t":"Memory","id":2285},{"q":"What type of experiment was Godden and Baddeley (1975)?","a":"A field experiment with repeated measures design","t":"Memory","id":2286},{"q":"Why is the phonological loop important for learning to read?","a":"It is used to sound out and hold words while reading; Gathercole and Baddeley (1990) found children with reading difficulties had phonological loop problems","t":"Memory","id":2287},{"q":"What is the difference between the MSM and WMM view of STM?","a":"The MSM sees STM as one passive store; the WMM sees STM as an active multi-component system","t":"Memory","id":2288},{"q":"Name one cognitive approach feature shown by memory models.","a":"They use models to make inferences about internal mental processes","t":"Memory","id":2289},{"q":"Which approach to psychology studies memory?","a":"The cognitive approach","t":"Memory","id":2290},{"q":"What is meant by 'coding' in memory?","a":"The format in which information is stored in the memory stores","t":"Memory","id":2291},{"q":"What is meant by 'capacity' in memory?","a":"How much information can be held in a memory store","t":"Memory","id":2292},{"q":"What is meant by 'duration' in memory?","a":"How long information can be held in a memory store","t":"Memory","id":2293},{"q":"What did Miller (1956) call his famous paper on STM capacity?","a":"'The magical number seven, plus or minus two'","t":"Memory","id":2294},{"q":"What is a limitation of Miller's research on capacity?","a":"He may have overestimated STM capacity – Cowan (2001) reviewed evidence and suggested it is about 4 chunks","t":"Memory","id":2295},{"q":"Why may the digit span test lack ecological validity?","a":"Remembering lists of digits is not a typical everyday memory task","t":"Memory","id":2296},{"q":"What did Simon (1974) find about chunk size?","a":"People have a shorter memory span for larger chunks, e.g. 8-word phrases compared with 1-syllable words","t":"Memory","id":2297},{"q":"Give an example of acoustic coding.","a":"Mixing up words that sound similar, e.g. 'cat', 'cab', 'can'","t":"Memory","id":2298},{"q":"Give an example of semantic coding.","a":"Mixing up words with similar meanings, e.g. 'big', 'huge', 'large'","t":"Memory","id":2299},{"q":"What did Sperling (1960) find about the sensory register?","a":"When shown a grid of 12 letters for 50ms, participants recalled about 4 letters overall, but when cued to recall one row they recalled 3 of 4 letters – showing the sensory register holds lots of information that decays quickly","t":"Memory","id":2300},{"q":"What type of research method were HM and KF?","a":"Case studies","t":"Memory","id":2301},{"q":"Why is HM important evidence in memory research?","a":"His damaged hippocampus meant he could not form new LTMs but his STM worked, supporting separate stores","t":"Memory","id":2302},{"q":"What could HM still learn despite his amnesia?","a":"New procedural skills such as mirror drawing, though he did not remember learning them","t":"Memory","id":2303},{"q":"Why does HM's ability to learn mirror drawing matter?","a":"It suggests there are different types of LTM, challenging the MSM's single LTM store","t":"Memory","id":2304},{"q":"What is the 'inner eye'?","a":"The visuo-spatial sketchpad","t":"Memory","id":2305},{"q":"What is the 'inner voice'?","a":"The articulatory process (articulatory control system)","t":"Memory","id":2306},{"q":"What is the 'inner ear'?","a":"The phonological store","t":"Memory","id":2307},{"q":"What are the WMM components apart from the central executive called?","a":"Slave systems","t":"Memory","id":2308},{"q":"Give an example of using the visuo-spatial sketchpad.","a":"Working out how many windows are in your house by picturing it","t":"Memory","id":2309},{"q":"Give an example of using the phonological loop.","a":"Repeating a phone number in your head until you dial it","t":"Memory","id":2310},{"q":"Why is it hard to count the windows in your house while describing them?","a":"Actually counting uses different systems; it is hard to do two visual tasks at once because they compete for the visuo-spatial sketchpad","t":"Memory","id":2311},{"q":"What does the WMM say about doing two tasks from the same modality?","a":"Performance suffers because both compete for the same limited slave system","t":"Memory","id":2312},{"q":"What did Baddeley, Thomson and Buchanan (1975) study?","a":"The word length effect – people recalled more short words than long words in serial order","t":"Memory","id":2313},{"q":"What did Hitch and Baddeley (1976) find using dual tasks?","a":"A task involving the central executive and articulatory loop was slower than one using only the central executive, supporting separate components","t":"Memory","id":2314},{"q":"Why is a lack of clarity about the central executive a problem?","a":"It makes the model hard to test and falsify","t":"Memory","id":2315},{"q":"What is a strength of the WMM in terms of lab evidence?","a":"Well controlled lab experiments (e.g. dual task studies) are replicable and show separate components","t":"Memory","id":2316},{"q":"What is the main difference between proactive and retroactive interference?","a":"Proactive = old interferes with new (forward); retroactive = new interferes with old (backwards)","t":"Memory","id":2317},{"q":"How can you remember which way interference goes?","a":"Pro = forward (old learning affects new); Retro = backward (new learning affects old)","t":"Memory","id":2318},{"q":"Why might a student learning Spanish struggle to remember French vocabulary?","a":"Retroactive interference – the new Spanish words interfere with previously learned French","t":"Memory","id":2319},{"q":"Why might a student who learned French first struggle with Spanish?","a":"Proactive interference – the old French words interfere with learning/recalling Spanish","t":"Memory","id":2320},{"q":"Why does time between learning matter in interference research?","a":"Lab studies often have learning close together, whereas in real life learning is spread out, so interference may be less in everyday life","t":"Memory","id":2321},{"q":"What did Danaher et al. (2008) find about interference?","a":"In advertising, recall of brands was worse when viewers saw two adverts for similar products – a real-world application","t":"Memory","id":2322},{"q":"What is an example of context-dependent forgetting in school?","a":"Forgetting what you revised in your bedroom when sitting the exam in a hall","t":"Memory","id":2323},{"q":"What is an example of state-dependent forgetting?","a":"Forgetting what happened when drunk until you are drunk again","t":"Memory","id":2324},{"q":"What did Abernethy (1940) find?","a":"Students tested in the same room with the same instructor recalled more than those tested in a different room or by a different instructor","t":"Memory","id":2325},{"q":"Give a practical application of research into retrieval failure.","a":"Revising in similar conditions to the exam, or mentally reinstating the context of learning (as in the cognitive interview)","t":"Memory","id":2326},{"q":"What is the 'outshining hypothesis' about cues?","a":"The effect of a cue is overshadowed by stronger cues; context is a weak cue so its effect is easily 'outshone' by other cues","t":"Memory","id":2327},{"q":"Why can the encoding specificity principle be seen as circular?","a":"If a cue helps recall we say it was encoded, but if it doesn't we say it wasn't – it cannot be tested independently","t":"Memory","id":2328},{"q":"What is the 'tip of the tongue' phenomenon?","a":"When you feel you know something but can't retrieve it, showing information is available but not accessible","t":"Memory","id":2329},{"q":"What is the difference between availability and accessibility?","a":"Available = information is stored in memory; accessible = it can be retrieved","t":"Memory","id":2330},{"q":"Which explanation of forgetting focuses on accessibility?","a":"Retrieval failure","t":"Memory","id":2331},{"q":"What was the aim of Loftus and Palmer's (1974) first experiment?","a":"To investigate whether leading questions affect the accuracy of speed estimates in EWT","t":"Memory","id":2332},{"q":"What type of experiment was Loftus and Palmer's study?","a":"Laboratory experiment with independent groups design","t":"Memory","id":2333},{"q":"What is the IV in Loftus and Palmer's first experiment?","a":"The verb used in the critical question","t":"Memory","id":2334},{"q":"What is the DV in Loftus and Palmer's first experiment?","a":"The speed estimate given (mph)","t":"Memory","id":2335},{"q":"Why are students a problem as a sample for EWT studies?","a":"They may be less experienced drivers and so less accurate at estimating speed, and are not representative of all witnesses","t":"Memory","id":2336},{"q":"What is a real-life application of leading questions research?","a":"Police are trained not to ask leading questions; lawyers can object to leading questions in court","t":"Memory","id":2337},{"q":"How does post-event discussion distort memory?","a":"Witnesses combine information from others with their own memories (contamination) or conform to others' accounts","t":"Memory","id":2338},{"q":"Give a limitation of Gabbert's research on PED.","a":"It is a lab study using video clips so may lack ecological validity; real witnesses may be more motivated to be accurate","t":"Memory","id":2339},{"q":"Why might it not be possible to stop post-event discussion?","a":"Witnesses may talk before police arrive, and the media can also spread information","t":"Memory","id":2340},{"q":"What is misleading information?","a":"Incorrect information given to an eyewitness after the event, e.g. through leading questions or PED","t":"Memory","id":2341},{"q":"What does 'weapon focus' mean?","a":"Witnesses focus on a weapon rather than the perpetrator's face, reducing accurate identification","t":"Memory","id":2342},{"q":"What does the tunnel theory of memory suggest?","a":"Anxiety causes attention to narrow on the central details of a stressful event","t":"Memory","id":2343},{"q":"How does Yuille and Cutshall's research contradict weapon focus?","a":"Real witnesses under high stress were very accurate, even after misleading questions","t":"Memory","id":2344},{"q":"Give a limitation of Yuille and Cutshall's study.","a":"No control over what witnesses did after the event, e.g. media exposure or discussion, and witnesses may have been at different distances from the event","t":"Memory","id":2345},{"q":"What does 'central details' mean in EWT?","a":"The key features of the event (e.g. what happened, the weapon)","t":"Memory","id":2346},{"q":"What does 'peripheral details' mean in EWT?","a":"Less important background details (e.g. the colour of a car in the background)","t":"Memory","id":2347},{"q":"What is a problem with the Yerkes–Dodson law as applied to EWT?","a":"It is hard to measure and define 'moderate' anxiety objectively","t":"Memory","id":2348},{"q":"Why might different witnesses respond differently to anxiety?","a":"Individual differences, e.g. Bothwell et al. (1987) found neurotic people were less accurate under high stress","t":"Memory","id":2349},{"q":"What type of questions are used in the cognitive interview?","a":"Open questions","t":"Memory","id":2350},{"q":"What memory research is 'reinstate the context' based on?","a":"Context-dependent forgetting/encoding specificity","t":"Memory","id":2351},{"q":"Why is 'report everything' useful?","a":"Seemingly trivial details may act as cues for more important information","t":"Memory","id":2352},{"q":"Why are schemas a problem in eyewitness recall?","a":"Witnesses may recall what they expected to happen rather than what actually happened","t":"Memory","id":2353},{"q":"Why might the police not use the cognitive interview fully?","a":"It takes a lot of time and training, and there may be limited resources","t":"Memory","id":2354},{"q":"What is the difference between a standard police interview and the cognitive interview?","a":"Standard interviews use closed and leading questions and frequent interruptions; the cognitive interview uses open questions and memory techniques to maximise recall","t":"Memory","id":2355},{"q":"Why is the cognitive interview useful for older witnesses?","a":"Research (e.g. Mello and Fisher, 1996) found it improved recall more for older adults than younger ones","t":"Memory","id":2356},{"q":"Name the model of memory that has a sensory register.","a":"The multi-store model","t":"Memory","id":2357},{"q":"Which memory model includes rehearsal as the key to transferring to LTM?","a":"The multi-store model","t":"Memory","id":2358},{"q":"Which component of working memory is 'modality free'?","a":"The central executive","t":"Memory","id":2359},{"q":"What type of rehearsal is used in the phonological loop?","a":"Maintenance rehearsal (articulatory process)","t":"Memory","id":2360},{"q":"What happens to information in the sensory register that is not attended to?","a":"It decays very quickly","t":"Memory","id":2361},{"q":"How has brain research supported the WMM?","a":"Different brain areas are active for verbal and visual tasks, e.g. Broca's area for the phonological loop","t":"Memory","id":2362},{"q":"What is anterograde amnesia?","a":"Inability to form new memories after an injury, as experienced by HM","t":"Memory","id":2363},{"q":"What is retrograde amnesia?","a":"Inability to recall memories from before an injury","t":"Memory","id":2364},{"q":"What is the main advantage of lab experiments in memory research?","a":"High control and replicability, so cause and effect can be established","t":"Memory","id":2365},{"q":"What is the main disadvantage of lab experiments in memory research?","a":"Low ecological validity/mundane realism, as stimuli are often artificial","t":"Memory","id":2366},{"q":"Why is memory research useful to the economy?","a":"It can improve learning and education, improve police interviews, and reduce wrongful convictions (saving costs)","t":"Memory","id":2367},{"q":"What is the name for this topic in the 2025 AQA specification?","a":"Clinical Psychology and Mental Health","t":"Psychopathology","id":2368},{"q":"What are the four definitions of abnormality on the specification?","a":"Statistical infrequency, Deviation from social/cultural norms, Failure to function adequately, Deviation from ideal mental health","t":"Psychopathology","id":2369},{"q":"Define statistical infrequency.","a":"Behaviour is abnormal if it is statistically rare – usually more than 2 standard deviations from the mean in a normal distribution","t":"Psychopathology","id":2370},{"q":"Give an example of statistical infrequency.","a":"Intellectual disability disorder – an IQ below 70 is found in about 2% of the population","t":"Psychopathology","id":2371},{"q":"Give a strength of statistical infrequency.","a":"It is objective and based on data, so it is easy to apply once data is collected; useful in diagnosis (e.g. IQ assessment)","t":"Psychopathology","id":2372},{"q":"Give a limitation of statistical infrequency.","a":"Some unusual characteristics are desirable, e.g. a very high IQ; rarity doesn't mean something is undesirable","t":"Psychopathology","id":2373},{"q":"Why is labelling someone statistically abnormal potentially harmful?","a":"Someone living a happy life with a low IQ may not benefit from a label, which could affect how others treat them","t":"Psychopathology","id":2374},{"q":"Why can't statistical infrequency identify common disorders?","a":"Some disorders like depression are common (affecting about 1 in 4 people over a lifetime) so would not be 'abnormal'","t":"Psychopathology","id":2375},{"q":"Define deviation from social norms.","a":"Behaviour that goes against the unwritten rules of what is acceptable in a society","t":"Psychopathology","id":2376},{"q":"Give an example of deviation from social norms used in diagnosis.","a":"Antisocial personality disorder – failure to conform to lawful and culturally normative behaviour","t":"Psychopathology","id":2377},{"q":"Give a strength of deviation from social norms.","a":"It considers the effect of behaviour on others and is used in diagnosis (e.g. antisocial personality disorder)","t":"Psychopathology","id":2378},{"q":"Give a limitation of deviation from social norms relating to culture.","a":"Norms vary between cultures, so a person from one culture may be labelled abnormal in another (e.g. hearing voices is normal in some cultures)","t":"Psychopathology","id":2379},{"q":"Give a limitation of deviation from social norms relating to human rights.","a":"It can be used to discriminate against people who don't conform, e.g. drapetomania (slaves wanting to escape) or homosexuality being classed as a disorder","t":"Psychopathology","id":2380},{"q":"Why does deviation from social norms change over time?","a":"Norms change, e.g. homosexuality was classified as a mental disorder until 1973 in the DSM","t":"Psychopathology","id":2381},{"q":"Define failure to function adequately.","a":"When someone cannot cope with the ordinary demands of everyday life","t":"Psychopathology","id":2382},{"q":"Who proposed signs of failure to function adequately?","a":"Rosenhan and Seligman (1989)","t":"Psychopathology","id":2383},{"q":"Give three signs of failing to function adequately (Rosenhan and Seligman).","a":"No longer conforming to interpersonal rules (e.g. maintaining personal space), Experiencing severe personal distress, Behaving in irrational or dangerous ways","t":"Psychopathology","id":2384},{"q":"What is the Global Assessment of Functioning (GAF) scale?","a":"A scale used by clinicians to rate how well a person copes with daily life, used in assessing failure to function","t":"Psychopathology","id":2385},{"q":"Give a strength of failure to function adequately.","a":"It considers the patient's perspective and distress; it is a practical, observable threshold for when people need help","t":"Psychopathology","id":2386},{"q":"Give a limitation of failure to function adequately.","a":"It is subjective – someone has to judge whether a person is failing to function; it may label non-standard lifestyles as abnormal","t":"Psychopathology","id":2387},{"q":"Why could failure to function be confused with deviation from social norms?","a":"Choosing to live differently (e.g. extreme sports, alternative lifestyles) may be judged as failing to function when it is really just unusual","t":"Psychopathology","id":2388},{"q":"Can someone with a mental disorder function adequately?","a":"Yes – e.g. Harold Shipman appeared to function normally while being a serial killer","t":"Psychopathology","id":2389},{"q":"Define deviation from ideal mental health.","a":"Abnormality is seen as a lack of the qualities associated with good mental health","t":"Psychopathology","id":2390},{"q":"Who proposed criteria for ideal mental health?","a":"Marie Jahoda (1958)","t":"Psychopathology","id":2391},{"q":"Give four of Jahoda's criteria for ideal mental health.","a":"No symptoms/distress, Rational and accurate self-perception, Self-actualisation, Coping with stress, Realistic view of the world, High self-esteem and lack of guilt, Independence, Successfully working, loving and enjoying leisure","t":"Psychopathology","id":2392},{"q":"Give a strength of deviation from ideal mental health.","a":"It is comprehensive and positive – it focuses on what is desirable, and helps identify what people need to achieve","t":"Psychopathology","id":2393},{"q":"Give a limitation of deviation from ideal mental health relating to culture.","a":"The criteria are based on Western, individualist ideals like self-actualisation and independence","t":"Psychopathology","id":2394},{"q":"Give a limitation of deviation from ideal mental health relating to standards.","a":"Criteria are unrealistically high – very few people meet them all, so most people would be abnormal","t":"Psychopathology","id":2395},{"q":"Give two behavioural characteristics of phobias.","a":"Panic, Avoidance, Endurance (freezing or fainting)","t":"Psychopathology","id":2396},{"q":"Give two emotional characteristics of phobias.","a":"Anxiety, Fear, Emotional response is unreasonable/disproportionate","t":"Psychopathology","id":2397},{"q":"Give two cognitive characteristics of phobias.","a":"Selective attention to the phobic stimulus, Irrational beliefs, Cognitive distortions","t":"Psychopathology","id":2398},{"q":"What is avoidance in phobias?","a":"Going to a lot of effort to avoid coming into contact with the phobic stimulus","t":"Psychopathology","id":2399},{"q":"What is endurance in phobias?","a":"Remaining in the presence of the phobic stimulus but experiencing high anxiety","t":"Psychopathology","id":2400},{"q":"What is selective attention in phobias?","a":"Finding it hard to look away from the phobic stimulus","t":"Psychopathology","id":2401},{"q":"Give an example of a cognitive distortion in phobias.","a":"A person with ophidiophobia seeing snakes as much more dangerous and aggressive than they really are","t":"Psychopathology","id":2402},{"q":"Name three types of phobia in the DSM-5.","a":"Specific phobia, Social anxiety disorder (social phobia), Agoraphobia","t":"Psychopathology","id":2403},{"q":"What is a specific phobia?","a":"A phobia of an object (e.g. spider) or situation (e.g. flying)","t":"Psychopathology","id":2404},{"q":"What is social anxiety?","a":"A phobia of social situations, such as public speaking or eating in public","t":"Psychopathology","id":2405},{"q":"What is agoraphobia?","a":"A phobia of being outside or in public spaces where escape may be difficult","t":"Psychopathology","id":2406},{"q":"What is depression?","a":"A mood disorder characterised by low mood and low energy levels","t":"Psychopathology","id":2407},{"q":"Name two types of depression.","a":"Major depressive disorder, Persistent depressive disorder (dysthymia), Disruptive mood dysregulation disorder, Premenstrual dysphoric disorder","t":"Psychopathology","id":2408},{"q":"Give two behavioural characteristics of depression.","a":"Change in activity levels (lethargy or psychomotor agitation), Disruption to sleep (insomnia or hypersomnia), Disruption to eating (increased or decreased appetite), Aggression and self-harm","t":"Psychopathology","id":2409},{"q":"Give two emotional characteristics of depression.","a":"Lowered mood, Anger, Lowered self-esteem","t":"Psychopathology","id":2410},{"q":"Give two cognitive characteristics of depression.","a":"Poor concentration, Absolutist thinking, Dwelling on the negative","t":"Psychopathology","id":2411},{"q":"What is absolutist thinking?","a":"'Black and white' thinking – seeing situations as all good or all bad, e.g. a small problem seen as a total disaster","t":"Psychopathology","id":2412},{"q":"What is psychomotor agitation?","a":"Being restless and unable to relax, e.g. pacing up and down","t":"Psychopathology","id":2413},{"q":"What are obsessions?","a":"Recurring, intrusive thoughts, images or impulses that cause anxiety","t":"Psychopathology","id":2414},{"q":"What are compulsions?","a":"Repetitive behaviours or mental acts a person feels driven to do to reduce anxiety","t":"Psychopathology","id":2415},{"q":"Give two behavioural characteristics of OCD.","a":"Compulsions that are repetitive, Compulsions reduce anxiety, Avoidance of situations that trigger anxiety","t":"Psychopathology","id":2416},{"q":"Give two emotional characteristics of OCD.","a":"Anxiety and distress, Accompanying depression, Guilt and disgust","t":"Psychopathology","id":2417},{"q":"Give two cognitive characteristics of OCD.","a":"Obsessive thoughts, Cognitive coping strategies (e.g. praying), Insight into excessive anxiety (knowing obsessions are irrational), Hypervigilance","t":"Psychopathology","id":2418},{"q":"Give an example of an obsession and compulsion.","a":"Obsession: fear of germs; Compulsion: washing hands repeatedly","t":"Psychopathology","id":2419},{"q":"Name two OCD-related disorders.","a":"Hoarding disorder, Trichotillomania (hair pulling), Body dysmorphic disorder","t":"Psychopathology","id":2420},{"q":"Which approach explains phobias?","a":"The behavioural approach","t":"Psychopathology","id":2421},{"q":"Which approach explains depression on the specification?","a":"The cognitive approach","t":"Psychopathology","id":2422},{"q":"Which approach explains OCD on the specification?","a":"The biological approach","t":"Psychopathology","id":2423},{"q":"Who proposed the two-process model of phobias?","a":"Mowrer (1960)","t":"Psychopathology","id":2424},{"q":"What are the two processes in the two-process model?","a":"Classical conditioning (acquisition), Operant conditioning (maintenance)","t":"Psychopathology","id":2425},{"q":"How are phobias acquired according to the two-process model?","a":"Through classical conditioning – a neutral stimulus is associated with an unconditioned stimulus that causes fear","t":"Psychopathology","id":2426},{"q":"How are phobias maintained according to the two-process model?","a":"Through operant conditioning – avoidance of the phobic stimulus reduces fear, which is negatively reinforcing","t":"Psychopathology","id":2427},{"q":"Describe the Little Albert study.","a":"Watson and Rayner (1920) conditioned a 9-month-old baby to fear a white rat by pairing it with a loud noise","t":"Psychopathology","id":2428},{"q":"In Little Albert, what was the UCS?","a":"A loud noise (a steel bar struck with a hammer)","t":"Psychopathology","id":2429},{"q":"In Little Albert, what was the UCR?","a":"Fear","t":"Psychopathology","id":2430},{"q":"In Little Albert, what was the NS/CS?","a":"The white rat","t":"Psychopathology","id":2431},{"q":"In Little Albert, what was the CR?","a":"Fear of the rat","t":"Psychopathology","id":2432},{"q":"What did Little Albert's fear generalise to?","a":"Other white furry objects, e.g. a rabbit, a fur coat, a Santa Claus mask","t":"Psychopathology","id":2433},{"q":"Why is Little Albert considered unethical?","a":"Albert was harmed by being made afraid, and the fear was never extinguished; his mother may not have given fully informed consent","t":"Psychopathology","id":2434},{"q":"Give a strength of the two-process model.","a":"Real-world application – it led to exposure therapies like systematic desensitisation and flooding","t":"Psychopathology","id":2435},{"q":"What does DiNardo et al. (1988) show about the two-process model?","a":"Many people who had a traumatic experience with dogs did not develop a phobia, and some people with dog phobias had no traumatic experience – conditioning is not the whole story","t":"Psychopathology","id":2436},{"q":"What is the biological preparedness argument?","a":"Seligman (1971) argued we are evolutionarily prepared to fear things that were dangerous to our ancestors (e.g. snakes, heights), which the two-process model can't explain","t":"Psychopathology","id":2437},{"q":"Why is the two-process model an incomplete explanation?","a":"It ignores cognitive factors (e.g. irrational thinking) and biological preparedness","t":"Psychopathology","id":2438},{"q":"What is the difference between the two-process model and social learning explanations of phobias?","a":"SLT says phobias can be learned by observing others' fear (modelling), not only through direct conditioning","t":"Psychopathology","id":2439},{"q":"What are the two behavioural therapies for phobias on the specification?","a":"Systematic desensitisation, Flooding","t":"Psychopathology","id":2440},{"q":"What is systematic desensitisation (SD)?","a":"A behavioural therapy that gradually reduces phobic anxiety through counterconditioning, pairing the phobic stimulus with relaxation","t":"Psychopathology","id":2441},{"q":"Who developed systematic desensitisation?","a":"Wolpe (1958)","t":"Psychopathology","id":2442},{"q":"What is counterconditioning?","a":"Learning a new response (relaxation) to the phobic stimulus to replace the fear response","t":"Psychopathology","id":2443},{"q":"What is reciprocal inhibition?","a":"It is impossible to feel two opposing emotions (fear and relaxation) at the same time","t":"Psychopathology","id":2444},{"q":"What are the three processes in systematic desensitisation?","a":"Anxiety hierarchy, Relaxation, Exposure","t":"Psychopathology","id":2445},{"q":"What is an anxiety hierarchy?","a":"A list of situations related to the phobic stimulus, ranked from least to most frightening, created by the client and therapist","t":"Psychopathology","id":2446},{"q":"Give two relaxation techniques used in SD.","a":"Breathing exercises, Progressive muscle relaxation, Mental imagery, Drugs (e.g. Valium)","t":"Psychopathology","id":2447},{"q":"How does exposure work in SD?","a":"The client is exposed to each step of the hierarchy while relaxed, moving up only when they feel no anxiety","t":"Psychopathology","id":2448},{"q":"What is in vitro exposure?","a":"Imagining the phobic stimulus","t":"Psychopathology","id":2449},{"q":"What is in vivo exposure?","a":"Actual exposure to the phobic stimulus","t":"Psychopathology","id":2450},{"q":"Give a strength of SD.","a":"Effective – Gilroy et al. (2003) found spider phobics treated with SD were less fearful than controls at 3 and 33 months","t":"Psychopathology","id":2451},{"q":"Give another strength of SD.","a":"Suitable for a diverse range of patients, e.g. those with learning difficulties who may struggle with cognitive therapies; clients find it acceptable","t":"Psychopathology","id":2452},{"q":"What did Gilroy et al. (2003) find?","a":"42 people treated for spider phobia with SD were less fearful than a control group (relaxation without exposure) both 3 and 33 months later","t":"Psychopathology","id":2453},{"q":"Give a limitation of SD.","a":"It is less effective for phobias with an evolutionary basis (e.g. heights, snakes) and for social phobias","t":"Psychopathology","id":2454},{"q":"What is flooding?","a":"A behavioural therapy where the client is exposed to the most frightening phobic situation immediately, without gradual build-up","t":"Psychopathology","id":2455},{"q":"How does flooding work?","a":"Without the option of avoidance, the person learns the phobic stimulus is harmless; anxiety eventually peaks and falls (extinction)","t":"Psychopathology","id":2456},{"q":"How long does a flooding session typically last?","a":"Usually one long session of around 2–3 hours","t":"Psychopathology","id":2457},{"q":"Why must a client give informed consent for flooding?","a":"It is highly traumatic, so the client must be fully prepared and know what to expect","t":"Psychopathology","id":2458},{"q":"Give a strength of flooding.","a":"It is cost-effective – it can work in a single session, so it is cheaper than SD","t":"Psychopathology","id":2459},{"q":"Give a limitation of flooding.","a":"It is traumatic – some clients drop out, which wastes time and money","t":"Psychopathology","id":2460},{"q":"Why is flooding less effective for social phobias?","a":"Social phobias have cognitive aspects (e.g. irrational thoughts) that need a cognitive therapy like CBT","t":"Psychopathology","id":2461},{"q":"What is extinction in flooding?","a":"The conditioned response (fear) stops because the CS is repeatedly presented without the UCS","t":"Psychopathology","id":2462},{"q":"What is symptom substitution?","a":"The idea that if the underlying cause is not treated, symptoms reappear in another form (a criticism of behavioural therapies)","t":"Psychopathology","id":2463},{"q":"What is the cognitive approach's view of depression?","a":"Depression is caused by irrational, negative thinking rather than by events themselves","t":"Psychopathology","id":2464},{"q":"What are the two cognitive explanations of depression on the specification?","a":"Beck's negative triad, Ellis's ABC model","t":"Psychopathology","id":2465},{"q":"What are the three parts of Beck's cognitive theory of depression?","a":"Faulty information processing, Negative self-schemas, Negative triad","t":"Psychopathology","id":2466},{"q":"What is faulty information processing?","a":"Attending to the negative aspects of situations and ignoring the positives (e.g. black-and-white thinking)","t":"Psychopathology","id":2467},{"q":"What is Beck's negative triad?","a":"Negative view of the self, Negative view of the world, Negative view of the future","t":"Psychopathology","id":2468},{"q":"Give an example of a negative view of the self.","a":"'I am worthless'","t":"Psychopathology","id":2469},{"q":"Give an example of a negative view of the world.","a":"'The world is a cruel place'","t":"Psychopathology","id":2470},{"q":"Give an example of a negative view of the future.","a":"'Nothing will ever get better'","t":"Psychopathology","id":2471},{"q":"Give a strength of Beck's theory.","a":"Research support – Clark and Beck (1999) found cognitive vulnerabilities come before depression; Cohen et al. (2019) found early cognitive vulnerability predicted later depression","t":"Psychopathology","id":2472},{"q":"What did Grazioli and Terry (2000) find?","a":"Women with high cognitive vulnerability (e.g. negative schemas) before birth were more likely to develop postnatal depression","t":"Psychopathology","id":2473},{"q":"Give a strength of Beck's theory in terms of application.","a":"It led to CBT, which is widely used and effective","t":"Psychopathology","id":2474},{"q":"Give a limitation of Beck's theory.","a":"It doesn't explain all aspects of depression, e.g. anger or hallucinations and delusions in some cases; some cases seem biological","t":"Psychopathology","id":2475},{"q":"What is Ellis's ABC model?","a":"A model explaining depression as caused by irrational thoughts about activating events","t":"Psychopathology","id":2476},{"q":"What does A stand for in Ellis's ABC model?","a":"Activating event","t":"Psychopathology","id":2477},{"q":"What does B stand for in Ellis's ABC model?","a":"Beliefs (rational or irrational)","t":"Psychopathology","id":2478},{"q":"What does C stand for in Ellis's ABC model?","a":"Consequences (emotional and behavioural)","t":"Psychopathology","id":2479},{"q":"Give an example of an irrational belief (Ellis).","a":"Musturbation – 'I must always succeed', Utopianism – 'Life must always be fair', I-can't-stand-it-itis – thinking a problem is a disaster","t":"Psychopathology","id":2480},{"q":"What is musturbation?","a":"Ellis's term for the irrational belief that we must always be successful or perfect","t":"Psychopathology","id":2481},{"q":"Give a strength of Ellis's model.","a":"Real-world application – it led to REBT (rational emotive behaviour therapy) which is effective for depression","t":"Psychopathology","id":2482},{"q":"Give a limitation of Ellis's model.","a":"It only explains reactive depression (triggered by an event), not depression with no obvious cause","t":"Psychopathology","id":2483},{"q":"What is reactive depression?","a":"Depression triggered by a life event, e.g. losing a job","t":"Psychopathology","id":2484},{"q":"Why could cognitive explanations be seen as 'blaming the client'?","a":"They suggest the person's own thinking causes their depression, rather than their circumstances","t":"Psychopathology","id":2485},{"q":"What is CBT?","a":"Cognitive behaviour therapy – a therapy that aims to identify and challenge irrational thoughts and change behaviour","t":"Psychopathology","id":2486},{"q":"How does CBT begin?","a":"With an assessment in which the client and therapist identify goals and the negative/irrational thoughts involved","t":"Psychopathology","id":2487},{"q":"What is 'thought catching'?","a":"Clients record their negative thoughts in a diary as they occur","t":"Psychopathology","id":2488},{"q":"What is 'patient as scientist'?","a":"Clients are encouraged to test the reality of their negative beliefs, e.g. by gathering evidence against them","t":"Psychopathology","id":2489},{"q":"What are behavioural activation tasks in CBT?","a":"Encouraging clients to engage in enjoyable activities to test beliefs that they can't enjoy anything","t":"Psychopathology","id":2490},{"q":"What is Ellis's version of CBT called?","a":"REBT – rational emotive behaviour therapy","t":"Psychopathology","id":2491},{"q":"How does Ellis's model extend to ABCDE in therapy?","a":"D = Dispute irrational beliefs, E = Effect (of disputing)","t":"Psychopathology","id":2492},{"q":"What is empirical argument in REBT?","a":"Disputing whether there is evidence to support an irrational belief","t":"Psychopathology","id":2493},{"q":"What is logical argument in REBT?","a":"Disputing whether a negative thought logically follows from the facts","t":"Psychopathology","id":2494},{"q":"What is unconditional positive regard in REBT?","a":"Ellis suggested therapists should show acceptance of the client, helping them feel valued","t":"Psychopathology","id":2495},{"q":"Give a strength of CBT.","a":"Effective – March et al. (2007) found CBT was as effective as antidepressants (81% improved after 36 weeks), and the combination was best (86%)","t":"Psychopathology","id":2496},{"q":"What did March et al. (2007) find?","a":"Among 327 adolescents with depression, 81% improved with CBT, 81% with antidepressants and 86% with both after 36 weeks","t":"Psychopathology","id":2497},{"q":"Give a limitation of CBT.","a":"It may not be suitable for people with severe depression or learning difficulties who can't engage with it; success may depend on the therapist relationship","t":"Psychopathology","id":2498},{"q":"What is a limitation of CBT relating to relapse?","a":"Ali et al. (2017) found 42% of people relapsed within 12 months of finishing CBT","t":"Psychopathology","id":2499},{"q":"What does Rosenzweig's 'Dodo Bird effect' suggest?","a":"That all therapies are equally effective, suggesting the relationship with the therapist matters more than the type of therapy","t":"Psychopathology","id":2500},{"q":"Why can CBT be criticised for ignoring life circumstances?","a":"It focuses on thinking, but some people's circumstances (e.g. poverty, abuse) are genuinely difficult and need changing","t":"Psychopathology","id":2501},{"q":"What is the biological approach's explanation of OCD?","a":"OCD is caused by genetic and neural factors","t":"Psychopathology","id":2502},{"q":"What are the two biological explanations of OCD on the specification?","a":"Genetic explanations, Neural explanations","t":"Psychopathology","id":2503},{"q":"What are candidate genes?","a":"Specific genes that are thought to increase the risk of a disorder like OCD","t":"Psychopathology","id":2504},{"q":"Name two candidate genes for OCD.","a":"SERT gene (serotonin transporter), COMT gene","t":"Psychopathology","id":2505},{"q":"What does the COMT gene do?","a":"Regulates the production of dopamine; one variation is more common in OCD patients and leads to higher dopamine","t":"Psychopathology","id":2506},{"q":"What does the SERT gene do?","a":"Affects the transport of serotonin; a mutation may lead to lower serotonin levels","t":"Psychopathology","id":2507},{"q":"What does it mean that OCD is polygenic?","a":"It is caused by several genes, not just one","t":"Psychopathology","id":2508},{"q":"Who found that up to 230 genes may be involved in OCD?","a":"Taylor (2013)","t":"Psychopathology","id":2509},{"q":"What does aetiologically heterogeneous mean?","a":"One group of genes may cause OCD in one person, but a different group may cause it in another","t":"Psychopathology","id":2510},{"q":"What does twin research show about OCD?","a":"Nestadt et al. (2010) found 68% concordance for MZ twins and 31% for DZ twins","t":"Psychopathology","id":2511},{"q":"What did Lewis (1936) find about OCD?","a":"Of OCD patients, 37% had parents with OCD and 21% had siblings with OCD","t":"Psychopathology","id":2512},{"q":"Give a limitation of genetic explanations of OCD.","a":"Concordance is not 100%, so environmental factors must also play a role (diathesis-stress); e.g. Cromer et al. (2007) found over half of OCD patients had a traumatic event in their past","t":"Psychopathology","id":2513},{"q":"What is the diathesis-stress model?","a":"A genetic vulnerability (diathesis) combined with an environmental trigger (stress) causes a disorder","t":"Psychopathology","id":2514},{"q":"Which neurotransmitter is associated with OCD?","a":"Low levels of serotonin (and possibly high dopamine)","t":"Psychopathology","id":2515},{"q":"How does low serotonin link to OCD?","a":"Serotonin helps regulate mood; low levels may mean mood-relevant information isn't transmitted properly","t":"Psychopathology","id":2516},{"q":"Which brain area is linked to worry in OCD?","a":"The orbitofrontal cortex (OFC)","t":"Psychopathology","id":2517},{"q":"What is the worry circuit?","a":"A loop involving the OFC, thalamus and caudate nucleus; faulty functioning may lead to repeated worry signals","t":"Psychopathology","id":2518},{"q":"What is the role of the parahippocampal gyrus in OCD?","a":"It is associated with processing unpleasant emotions and functions abnormally in OCD","t":"Psychopathology","id":2519},{"q":"Give a strength of neural explanations of OCD.","a":"Research support – antidepressants that increase serotonin reduce OCD symptoms; OCD is linked to other disorders involving serotonin","t":"Psychopathology","id":2520},{"q":"Give a limitation of neural explanations of OCD.","a":"Neural differences may be a result of OCD rather than a cause; the evidence is correlational","t":"Psychopathology","id":2521},{"q":"What drug is used to treat OCD?","a":"SSRIs (selective serotonin reuptake inhibitors), e.g. fluoxetine (Prozac)","t":"Psychopathology","id":2522},{"q":"How do SSRIs work?","a":"They prevent the reabsorption (reuptake) and breakdown of serotonin in the synapse, increasing serotonin levels in the synaptic gap","t":"Psychopathology","id":2523},{"q":"What is a typical daily dose of fluoxetine for OCD?","a":"20mg (may be increased)","t":"Psychopathology","id":2524},{"q":"How long do SSRIs take to have an effect?","a":"About 3–4 months","t":"Psychopathology","id":2525},{"q":"What other drugs are used for OCD if SSRIs don't work?","a":"Tricyclics (e.g. clomipramine), SNRIs","t":"Psychopathology","id":2526},{"q":"Give a strength of drug therapy for OCD.","a":"Effective – Soomro et al. (2009) found SSRIs were more effective than placebos in reducing OCD symptoms up to 3 months after treatment","t":"Psychopathology","id":2527},{"q":"Give another strength of drug therapy for OCD.","a":"Cost-effective and non-disruptive – cheaper than psychological therapies and patients can take them without much change to their lives","t":"Psychopathology","id":2528},{"q":"Give a limitation of drug therapy for OCD.","a":"Side effects, e.g. indigestion, blurred vision, loss of sex drive, which may lead patients to stop treatment","t":"Psychopathology","id":2529},{"q":"Why might drug therapy not be a cure for OCD?","a":"Symptoms often return when medication stops; drugs treat symptoms rather than the underlying cause","t":"Psychopathology","id":2530},{"q":"What did Koran et al. (2007) suggest?","a":"Combining SSRIs with CBT is more effective than either alone","t":"Psychopathology","id":2531},{"q":"Why might some OCD patients benefit more from psychological therapy?","a":"Their OCD may be triggered by trauma, so CBT or exposure therapy addressing the cause may be more appropriate","t":"Psychopathology","id":2532},{"q":"What is a placebo?","a":"A dummy treatment with no active ingredient, used as a control in drug trials","t":"Psychopathology","id":2533},{"q":"What is the drug industry criticism of drug therapy research?","a":"Much research is funded by drug companies, which may lead to bias in publishing positive findings","t":"Psychopathology","id":2534},{"q":"Why is the biological approach to OCD deterministic?","a":"It suggests people have no control over their OCD because it is caused by genes and brain chemistry","t":"Psychopathology","id":2535},{"q":"Why is the biological approach to OCD reductionist?","a":"It reduces a complex disorder to genes and neurotransmitters, ignoring psychological and social factors","t":"Psychopathology","id":2536},{"q":"Why are phobias explained by the behaviourist approach seen as environmentally deterministic?","a":"They suggest behaviour is caused by past conditioning experiences","t":"Psychopathology","id":2537},{"q":"What is a DSM?","a":"The Diagnostic and Statistical Manual of Mental Disorders, used to classify and diagnose mental disorders (current version DSM-5)","t":"Psychopathology","id":2538},{"q":"What is a 'diagnosis'?","a":"Identifying a disorder based on a person's symptoms","t":"Psychopathology","id":2539},{"q":"What is the difference between a symptom and a characteristic?","a":"They are used similarly – characteristics are the features used to identify a disorder","t":"Psychopathology","id":2540},{"q":"Why is it difficult to define abnormality?","a":"No single definition covers all cases; each definition has limitations, so clinicians use several together","t":"Psychopathology","id":2541},{"q":"Which definition of abnormality is most objective?","a":"Statistical infrequency","t":"Psychopathology","id":2542},{"q":"Which definition of abnormality focuses on positive mental health?","a":"Deviation from ideal mental health","t":"Psychopathology","id":2543},{"q":"Which definition of abnormality considers the individual's own distress?","a":"Failure to function adequately","t":"Psychopathology","id":2544},{"q":"Which definition of abnormality is most culturally relative?","a":"Deviation from social norms","t":"Psychopathology","id":2545},{"q":"Why is it useful to combine definitions of abnormality?","a":"Each captures different aspects, so together they give a more complete picture","t":"Psychopathology","id":2546},{"q":"What is the normal distribution in relation to statistical infrequency?","a":"A bell-shaped curve where most people score near the mean and very few at the extremes","t":"Psychopathology","id":2547},{"q":"What IQ score is two standard deviations below the mean?","a":"70 (mean 100, SD 15)","t":"Psychopathology","id":2548},{"q":"Why is the cut-off for statistical infrequency arbitrary?","a":"There is no clear reason why 2 standard deviations, rather than another point, marks abnormality","t":"Psychopathology","id":2549},{"q":"What is an example of a norm that has changed over time?","a":"Attitudes to homosexuality, tattoos or women wearing trousers","t":"Psychopathology","id":2550},{"q":"What is an 'interpersonal rule' in failure to function adequately?","a":"Unwritten rules about how to interact with others, e.g. maintaining eye contact and personal space","t":"Psychopathology","id":2551},{"q":"What does 'observer discomfort' mean in failure to function?","a":"Behaviour that causes others to feel uncomfortable, as identified by Rosenhan and Seligman","t":"Psychopathology","id":2552},{"q":"Why might someone's apparent failure to function actually be adaptive?","a":"A person with depression may miss work, but withdrawal may help them cope with a genuinely stressful situation","t":"Psychopathology","id":2553},{"q":"Why might Jahoda's criteria be hard to measure?","a":"Concepts like self-actualisation and 'accurate perception of reality' are vague and subjective","t":"Psychopathology","id":2554},{"q":"Why might someone meet Jahoda's criteria but still have a disorder?","a":"Some disorders (e.g. early-stage schizophrenia) may not be obvious; criteria are ideals not diagnoses","t":"Psychopathology","id":2555},{"q":"What is the main difference between phobias and ordinary fears?","a":"Phobias are irrational, out of proportion to the actual danger, and interfere with daily life","t":"Psychopathology","id":2556},{"q":"What is claustrophobia?","a":"A fear of enclosed spaces","t":"Psychopathology","id":2557},{"q":"What is arachnophobia?","a":"A fear of spiders","t":"Psychopathology","id":2558},{"q":"What is acrophobia?","a":"A fear of heights","t":"Psychopathology","id":2559},{"q":"What is ophidiophobia?","a":"A fear of snakes","t":"Psychopathology","id":2560},{"q":"What is the difference between a behavioural and a cognitive characteristic?","a":"Behavioural characteristics are what the person does; cognitive characteristics are how they think","t":"Psychopathology","id":2561},{"q":"What are the DSM-5 criteria for major depressive disorder?","a":"At least 5 symptoms for at least 2 weeks, including either depressed mood or loss of interest/pleasure","t":"Psychopathology","id":2562},{"q":"What is anhedonia?","a":"Loss of interest or pleasure in activities that were previously enjoyed","t":"Psychopathology","id":2563},{"q":"What is persistent depressive disorder?","a":"Long-term depression lasting 2 years or more (dysthymia)","t":"Psychopathology","id":2564},{"q":"Which gender is more likely to be diagnosed with depression?","a":"Women (about twice as likely as men)","t":"Psychopathology","id":2565},{"q":"Why might anger be a characteristic of depression?","a":"People may direct anger at others or themselves, e.g. through self-harm","t":"Psychopathology","id":2566},{"q":"What is meant by 'intrusive thoughts' in OCD?","a":"Unwanted, recurring thoughts that the person finds distressing and hard to control","t":"Psychopathology","id":2567},{"q":"Why do people with OCD often know their obsessions are irrational?","a":"OCD sufferers usually have insight, which adds to their distress","t":"Psychopathology","id":2568},{"q":"What is hypervigilance in OCD?","a":"Being constantly alert and focused on potential threats, e.g. germs","t":"Psychopathology","id":2569},{"q":"Why do compulsions maintain OCD?","a":"They temporarily reduce anxiety, which negatively reinforces the behaviour","t":"Psychopathology","id":2570},{"q":"What is the difference between OCD and 'being tidy'?","a":"OCD involves significant distress and interferes with daily functioning; tidiness does not","t":"Psychopathology","id":2571},{"q":"What is stimulus generalisation in phobias?","a":"The fear response spreads to stimuli similar to the original, e.g. Little Albert fearing a rabbit","t":"Psychopathology","id":2572},{"q":"What is negative reinforcement in maintaining phobias?","a":"Avoiding the phobic stimulus removes anxiety, so avoidance is rewarded and repeated","t":"Psychopathology","id":2573},{"q":"Why is avoidance a problem for treating phobias?","a":"The person never learns that the stimulus is harmless, so the phobia is maintained","t":"Psychopathology","id":2574},{"q":"Why is the Little Albert study weak evidence for the two-process model?","a":"It is a single case study, was unethical, and Albert was not followed up","t":"Psychopathology","id":2575},{"q":"What is the cognitive criticism of the two-process model?","a":"It ignores the role of irrational thoughts, e.g. believing a spider will attack","t":"Psychopathology","id":2576},{"q":"What is a 'safety behaviour'?","a":"Behaviours such as carrying medication or staying near exits that reduce anxiety, which can help maintain phobias","t":"Psychopathology","id":2577},{"q":"Why is SD considered more ethical than flooding?","a":"It is gradual, so clients experience less distress and are less likely to drop out","t":"Psychopathology","id":2578},{"q":"What did Ost et al. (1991) find about one-session treatment?","a":"A single intensive exposure session was highly effective for specific phobias, supporting flooding-type approaches","t":"Psychopathology","id":2579},{"q":"Why might virtual reality be used in exposure therapy?","a":"It allows gradual or intense exposure to phobic stimuli in a safe, controlled way","t":"Psychopathology","id":2580},{"q":"Why does systematic desensitisation require a client to be able to relax?","a":"Relaxation is needed for counterconditioning to replace fear with calm","t":"Psychopathology","id":2581},{"q":"Why might the effects of SD last longer than drug therapy?","a":"SD tackles the learned association, whereas drugs only reduce symptoms temporarily","t":"Psychopathology","id":2582},{"q":"What is 'primary' and 'secondary' depression?","a":"Primary depression has no obvious cause; secondary depression is triggered by another condition or event","t":"Psychopathology","id":2583},{"q":"What is the cognitive triad in Beck's theory called?","a":"The negative triad","t":"Psychopathology","id":2584},{"q":"Give an example of faulty information processing.","a":"Overgeneralisation – concluding 'I'm useless at everything' after failing one test","t":"Psychopathology","id":2585},{"q":"What is overgeneralisation?","a":"Drawing a sweeping conclusion from a single event","t":"Psychopathology","id":2586},{"q":"What is catastrophising?","a":"Assuming the worst possible outcome will happen","t":"Psychopathology","id":2587},{"q":"What is selective abstraction?","a":"Focusing on a negative detail while ignoring the wider positive picture","t":"Psychopathology","id":2588},{"q":"Where do negative self-schemas come from according to Beck?","a":"Negative childhood experiences, e.g. criticism from parents or teachers","t":"Psychopathology","id":2589},{"q":"What is the difference between Beck's and Ellis's models?","a":"Beck focuses on underlying negative schemas and the triad; Ellis focuses on irrational beliefs about specific events","t":"Psychopathology","id":2590},{"q":"Why might the cognitive approach struggle with the direction of cause?","a":"Negative thinking may be a symptom of depression rather than a cause","t":"Psychopathology","id":2591},{"q":"What is a 'homework task' in CBT?","a":"An activity the client completes between sessions, e.g. recording thoughts or testing a belief","t":"Psychopathology","id":2592},{"q":"What is the aim of disputing irrational beliefs in REBT?","a":"To replace irrational beliefs with rational ones, changing the emotional consequences","t":"Psychopathology","id":2593},{"q":"What is 'utopianism' in Ellis's model?","a":"The irrational belief that life should always be fair","t":"Psychopathology","id":2594},{"q":"What is 'I-can't-stand-it-itis'?","a":"The irrational belief that it is a disaster when things don't go as planned","t":"Psychopathology","id":2595},{"q":"Why might CBT be preferred to drugs for depression?","a":"It has no physical side effects and teaches skills that may prevent relapse","t":"Psychopathology","id":2596},{"q":"What does NICE recommend for moderate to severe depression?","a":"A combination of antidepressants and CBT","t":"Psychopathology","id":2597},{"q":"What did Cuijpers et al. (2013) find?","a":"CBT was more effective than no treatment for depression, but effect sizes may be inflated by lower-quality studies","t":"Psychopathology","id":2598},{"q":"Why might CBT not suit people with severe depression?","a":"They may lack the motivation and concentration to engage with it","t":"Psychopathology","id":2599},{"q":"What is a limitation of CBT relating to the therapist?","a":"Success may depend on the therapeutic relationship rather than the specific techniques used","t":"Psychopathology","id":2600},{"q":"What is the role of genetics in OCD?","a":"Genes may create a vulnerability to OCD, e.g. through serotonin and dopamine regulation","t":"Psychopathology","id":2601},{"q":"What is a concordance rate?","a":"The percentage of twin pairs where both twins have the same characteristic or disorder","t":"Psychopathology","id":2602},{"q":"Why do family studies not prove OCD is genetic?","a":"Families share environments, so children may learn OCD behaviours from parents","t":"Psychopathology","id":2603},{"q":"What is the caudate nucleus?","a":"A part of the basal ganglia that normally suppresses minor worry signals from the OFC; damage may cause OCD","t":"Psychopathology","id":2604},{"q":"Why might OCD be linked to brain damage?","a":"Some people develop OCD after brain injuries or infections affecting the basal ganglia, e.g. PANDAS","t":"Psychopathology","id":2605},{"q":"What is PANDAS?","a":"A condition where a streptococcal infection causes an immune response affecting the basal ganglia, triggering OCD symptoms in children","t":"Psychopathology","id":2606},{"q":"What are tricyclics?","a":"An older group of antidepressants (e.g. clomipramine) used for OCD when SSRIs don't work; they have more side effects","t":"Psychopathology","id":2607},{"q":"What are SNRIs?","a":"Serotonin-noradrenaline reuptake inhibitors, used as an alternative for OCD","t":"Psychopathology","id":2608},{"q":"Why are SSRIs often combined with CBT for OCD?","a":"SSRIs reduce anxiety, so patients can engage more fully in CBT/exposure therapy","t":"Psychopathology","id":2609},{"q":"What is exposure and response prevention (ERP)?","a":"A behavioural therapy for OCD in which the person is exposed to their trigger and prevented from performing the compulsion","t":"Psychopathology","id":2610},{"q":"Why might drug therapy be seen as a 'quick fix' for OCD?","a":"It reduces symptoms without addressing any psychological causes, so relapse is likely when drugs stop","t":"Psychopathology","id":2611},{"q":"What is the role of placebos in drug trials?","a":"They control for the psychological effect of expecting to get better","t":"Psychopathology","id":2612},{"q":"What does 'double-blind drug trial' mean?","a":"Neither the patients nor the researchers know who is receiving the drug or the placebo","t":"Psychopathology","id":2613},{"q":"What are 'side effects' of SSRIs?","a":"Indigestion, blurred vision, loss of sex drive, insomnia, nausea","t":"Psychopathology","id":2614},{"q":"Why is it an issue that drug trials are often short term?","a":"The long-term effectiveness and side effects of drugs are unclear","t":"Psychopathology","id":2615},{"q":"Which explanation of OCD is more likely to lead to a reductionist treatment?","a":"The biological explanation (drug therapy)","t":"Psychopathology","id":2616},{"q":"What does it mean to say depression, phobias and OCD are explained by 'different approaches'?","a":"Each disorder is explained on the specification by one approach: phobias – behavioural, depression – cognitive, OCD – biological","t":"Psychopathology","id":2617},{"q":"What is a romantic relationship?","a":"A relationship between two people who have an emotional and physical attraction to each other","t":"Relationships","id":2618},{"q":"What are the factors affecting attraction on the specification?","a":"Self-disclosure, Physical attractiveness (including the matching hypothesis), Filter theory","t":"Relationships","id":2619},{"q":"What is self-disclosure?","a":"Revealing personal information about yourself to a partner","t":"Relationships","id":2620},{"q":"Who proposed social penetration theory?","a":"Altman and Taylor (1973)","t":"Relationships","id":2621},{"q":"What is social penetration theory?","a":"The theory that relationships develop as partners gradually reveal more personal information about themselves over time","t":"Relationships","id":2622},{"q":"What are the two dimensions of self-disclosure in social penetration theory?","a":"Breadth and depth","t":"Relationships","id":2623},{"q":"What is breadth of self-disclosure?","a":"The range of topics a person discloses about","t":"Relationships","id":2624},{"q":"What is depth of self-disclosure?","a":"How personal and intimate the information disclosed is","t":"Relationships","id":2625},{"q":"What metaphor is used to describe social penetration theory?","a":"An onion – revealing layers from the superficial outside to the intimate core","t":"Relationships","id":2626},{"q":"Why should self-disclosure be gradual?","a":"Revealing too much intimate information too soon can put a partner off","t":"Relationships","id":2627},{"q":"Why is reciprocity important in self-disclosure?","a":"Disclosure is most likely to increase satisfaction when both partners disclose and respond to each other","t":"Relationships","id":2628},{"q":"Who studied reciprocal self-disclosure?","a":"Reis and Shaver (1988)","t":"Relationships","id":2629},{"q":"What did Reis and Shaver (1988) say about self-disclosure?","a":"For a relationship to develop there must be reciprocity – one partner discloses and the other responds with empathy and their own disclosure","t":"Relationships","id":2630},{"q":"What did Sprecher and Hendrick (2004) find?","a":"In heterosexual dating couples, there was a strong correlation between self-disclosure and satisfaction for both partners","t":"Relationships","id":2631},{"q":"What did Laurenceau et al. (1998) find?","a":"Using diaries, participants who disclosed more (and felt their partner disclosed more) reported greater intimacy","t":"Relationships","id":2632},{"q":"Give a real-world application of self-disclosure research.","a":"Hass and Stafford (1998) found 57% of gay men and women said open disclosure maintained their relationship; therapy can teach disclosure skills","t":"Relationships","id":2633},{"q":"Give a limitation of self-disclosure research in terms of culture.","a":"Most research is Western; Tang et al. (2013) found men and women in the USA self-disclose more sexual thoughts than in China, but both have satisfying relationships","t":"Relationships","id":2634},{"q":"Give a limitation of self-disclosure research relating to correlation.","a":"Most research is correlational, so we don't know if disclosure causes satisfaction or satisfaction increases disclosure","t":"Relationships","id":2635},{"q":"What is physical attractiveness in relationships?","a":"How appealing we find a person's face or body – an important factor in initial attraction","t":"Relationships","id":2636},{"q":"What facial features are generally rated as attractive?","a":"Symmetry, neotenous (baby-face) features for women, averageness","t":"Relationships","id":2637},{"q":"Why might symmetrical faces be attractive?","a":"Symmetry may be an honest signal of genetic fitness, as it is hard to fake","t":"Relationships","id":2638},{"q":"What are neotenous features?","a":"Baby-face features such as widely separated eyes, a small nose and a small chin, which may trigger a protective instinct","t":"Relationships","id":2639},{"q":"What is the halo effect?","a":"The tendency to assume that physically attractive people have other positive characteristics, e.g. being kind, intelligent or successful","t":"Relationships","id":2640},{"q":"Who studied the halo effect?","a":"Dion et al. (1972)","t":"Relationships","id":2641},{"q":"What did Dion et al. (1972) find?","a":"Physically attractive people were rated as more sociable, successful and happy than unattractive people","t":"Relationships","id":2642},{"q":"What did Palmer and Peterson (2012) find about the halo effect?","a":"Attractive people were rated as more politically knowledgeable and competent, even when participants were told they had no special knowledge","t":"Relationships","id":2643},{"q":"What is the matching hypothesis?","a":"People choose partners who are similar in physical attractiveness to themselves","t":"Relationships","id":2644},{"q":"Who proposed the matching hypothesis?","a":"Walster et al. (1966)","t":"Relationships","id":2645},{"q":"Why does the matching hypothesis suggest we match?","a":"We balance our desire for an attractive partner against the fear of rejection, so we go for someone 'realistic'","t":"Relationships","id":2646},{"q":"Describe Walster et al.'s (1966) Computer Dance study.","a":"752 students were randomly paired for a dance after rating their attractiveness; participants were rated by judges and asked if they would like to see their date again","t":"Relationships","id":2647},{"q":"What did Walster et al. (1966) find?","a":"Participants preferred more attractive dates regardless of their own attractiveness – not supporting the matching hypothesis","t":"Relationships","id":2648},{"q":"What did Walster and Walster (1969) find?","a":"When participants met beforehand, they expressed most liking for partners matched in attractiveness – supporting matching","t":"Relationships","id":2649},{"q":"What did Feingold (1988) find?","a":"A meta-analysis of 17 studies found a significant correlation between partners' attractiveness ratings – supporting matching","t":"Relationships","id":2650},{"q":"What did Taylor et al. (2011) find about online dating?","a":"Online daters sought meetings with partners more attractive than themselves – challenging matching","t":"Relationships","id":2651},{"q":"Give a limitation of the matching hypothesis.","a":"People may compensate for lower attractiveness with other qualities (complex matching), e.g. wealth or intelligence","t":"Relationships","id":2652},{"q":"What is complex matching?","a":"Matching on overall desirability, where lower physical attractiveness can be compensated by other qualities (e.g. humour, status)","t":"Relationships","id":2653},{"q":"Give a strength of research into physical attractiveness.","a":"Supporting research – Palmer and Peterson; Cunningham et al. (1995) found similar facial features were rated attractive across cultures","t":"Relationships","id":2654},{"q":"What did Cunningham et al. (1995) find?","a":"White, Asian and Hispanic men all rated large eyes, prominent cheekbones, small noses and high eyebrows as attractive in women","t":"Relationships","id":2655},{"q":"Give a limitation of physical attractiveness research relating to individual differences.","a":"Towhey (1979) found participants who scored high on sexist attitudes were more influenced by physical attractiveness","t":"Relationships","id":2656},{"q":"What did Towhey (1979) find?","a":"Only participants with high scores on the MACHO scale (sexist attitudes) were strongly influenced by physical attractiveness when rating photos","t":"Relationships","id":2657},{"q":"Who developed filter theory?","a":"Kerckhoff and Davis (1962)","t":"Relationships","id":2658},{"q":"What is filter theory?","a":"We choose partners by using a series of 'filters' that narrow down the 'field of availables' to the 'field of desirables'","t":"Relationships","id":2659},{"q":"What are the three filters in filter theory?","a":"Social demography, Similarity in attitudes, Complementarity","t":"Relationships","id":2660},{"q":"What is the field of availables?","a":"All the potential partners available to us","t":"Relationships","id":2661},{"q":"What is the field of desirables?","a":"The smaller group of people we realistically consider as partners after filtering","t":"Relationships","id":2662},{"q":"What is social demography?","a":"Variables such as location, social class, education, religion and ethnicity that affect the likelihood of meeting and being attracted to people","t":"Relationships","id":2663},{"q":"Why is social demography the first filter?","a":"It determines who we are likely to meet in the first place – people who are geographically close and similar in background","t":"Relationships","id":2664},{"q":"What is proximity?","a":"Physical nearness – we are more likely to form relationships with people who live or work near us","t":"Relationships","id":2665},{"q":"What is homogamy?","a":"Forming relationships with people who are socially or culturally similar to ourselves","t":"Relationships","id":2666},{"q":"What is similarity in attitudes?","a":"Partners share similar beliefs and values; this is important in the early stages of a relationship","t":"Relationships","id":2667},{"q":"Why is similarity in attitudes important?","a":"It promotes easier communication and mutual understanding, and people like those who agree with them","t":"Relationships","id":2668},{"q":"What is complementarity?","a":"Partners meet each other's needs, having different traits that complement one another (e.g. one dominant and one submissive)","t":"Relationships","id":2669},{"q":"When is complementarity most important according to filter theory?","a":"In longer-term relationships (over 18 months)","t":"Relationships","id":2670},{"q":"Describe Kerckhoff and Davis's (1962) study.","a":"A longitudinal study of student couples who had been together for less than or more than 18 months, using questionnaires on attitudes and needs","t":"Relationships","id":2671},{"q":"What did Kerckhoff and Davis (1962) find?","a":"Similarity of attitudes was most important for couples together less than 18 months; complementarity was most important for couples together longer","t":"Relationships","id":2672},{"q":"Give a limitation of Kerckhoff and Davis's study.","a":"Failure to replicate – later studies did not find the same results; relationships have changed since the 1960s (temporal validity)","t":"Relationships","id":2673},{"q":"How has technology challenged social demography?","a":"Online dating allows people to meet partners from different backgrounds and locations","t":"Relationships","id":2674},{"q":"What is the problem with the 'direction of cause' in filter theory?","a":"Anderson et al. (2003) found couples became more similar in emotional responses over time (emotional convergence), so similarity may be an effect, not a cause","t":"Relationships","id":2675},{"q":"What did Anderson et al. (2003) find?","a":"Cohabiting partners became more similar in emotional responses over time – emotional convergence","t":"Relationships","id":2676},{"q":"Give a limitation of complementarity.","a":"It is hard to measure, and Dijkstra and Barelds (2008) found similarity in personality, not complementarity, was linked to satisfaction","t":"Relationships","id":2677},{"q":"What did Gruber-Baldini et al. (1995) find?","a":"Couples who were similar in educational level at the start of their marriage were more similar in intellectual abilities over 21 years – supports similarity","t":"Relationships","id":2678},{"q":"What are the three theories of romantic relationships on the specification?","a":"Social exchange theory, Equity theory, Rusbult's investment model","t":"Relationships","id":2679},{"q":"Who proposed social exchange theory?","a":"Thibaut and Kelley (1959)","t":"Relationships","id":2680},{"q":"What is social exchange theory?","a":"An economic theory that suggests people aim to maximise rewards and minimise costs in relationships (minimax principle)","t":"Relationships","id":2681},{"q":"What is the minimax principle?","a":"People try to gain maximum rewards and suffer minimum costs","t":"Relationships","id":2682},{"q":"Give examples of rewards in a relationship.","a":"Companionship, being cared for, sex, emotional support","t":"Relationships","id":2683},{"q":"Give examples of costs in a relationship.","a":"Stress, time, effort, arguments, compromise, lost opportunities","t":"Relationships","id":2684},{"q":"What is an opportunity cost?","a":"The time and effort invested in one relationship that could have been used elsewhere","t":"Relationships","id":2685},{"q":"What is the comparison level (CL)?","a":"The amount of reward a person believes they deserve, based on past relationships and social norms","t":"Relationships","id":2686},{"q":"What happens if the rewards exceed the comparison level?","a":"The relationship is seen as worthwhile and satisfying","t":"Relationships","id":2687},{"q":"What is the comparison level for alternatives (CLalt)?","a":"Whether a person believes they could gain greater rewards and fewer costs in another relationship (or alone)","t":"Relationships","id":2688},{"q":"What are the four stages of relationship development in SET?","a":"Sampling, Bargaining, Commitment, Institutionalisation","t":"Relationships","id":2689},{"q":"What is the sampling stage?","a":"Exploring rewards and costs by trying relationships out, directly or by observing others","t":"Relationships","id":2690},{"q":"What is the bargaining stage?","a":"Partners exchange rewards and costs and negotiate what is most profitable","t":"Relationships","id":2691},{"q":"What is the commitment stage?","a":"Relationships become more stable as costs decrease and rewards increase","t":"Relationships","id":2692},{"q":"What is the institutionalisation stage?","a":"Norms are established and partners settle into their relationship","t":"Relationships","id":2693},{"q":"Give a limitation of SET relating to direction of cause.","a":"Argyle (1987) said dissatisfaction may come first – we only look for alternatives or count costs once we are already unhappy","t":"Relationships","id":2694},{"q":"Give a limitation of SET relating to measurement.","a":"It is unclear what counts as a reward or cost, and they are subjective and hard to measure; CL is hard to define","t":"Relationships","id":2695},{"q":"Give a limitation of SET relating to equity.","a":"It ignores fairness – equity theory argues fairness matters more than rewards and costs","t":"Relationships","id":2696},{"q":"Give a limitation of SET relating to research.","a":"Much research uses artificial lab studies or economic games, which lack ecological validity","t":"Relationships","id":2697},{"q":"Give a strength of SET.","a":"Research support – Rusbult (1983) found commitment was linked to rewards; Kurdek (1994) found similar principles in gay and lesbian relationships","t":"Relationships","id":2698},{"q":"Who proposed equity theory?","a":"Walster et al. (1978)","t":"Relationships","id":2699},{"q":"What is equity theory?","a":"People are most satisfied in relationships when there is fairness – the ratio of rewards to costs is roughly the same for both partners","t":"Relationships","id":2700},{"q":"What is equity?","a":"Fairness – a balance of profit (rewards minus costs) between partners","t":"Relationships","id":2701},{"q":"What happens if one partner over-benefits?","a":"They may feel guilt or shame","t":"Relationships","id":2702},{"q":"What happens if one partner under-benefits?","a":"They may feel anger, hostility and resentment","t":"Relationships","id":2703},{"q":"Why do inequitable relationships cause dissatisfaction?","a":"Both over-benefiting and under-benefiting cause distress, which motivates partners to restore equity or end the relationship","t":"Relationships","id":2704},{"q":"How can equity be restored?","a":"Change the balance of rewards and costs, or cognitively re-evaluate the situation (perceived equity)","t":"Relationships","id":2705},{"q":"What is 'realignment' in equity theory?","a":"Changing perceptions of rewards and costs so the relationship feels fair again","t":"Relationships","id":2706},{"q":"Give research support for equity theory.","a":"Utne et al. (1984) found couples who saw their relationship as equitable were more satisfied","t":"Relationships","id":2707},{"q":"What did Utne et al. (1984) find?","a":"In 118 recently married couples, those who perceived equity were more satisfied","t":"Relationships","id":2708},{"q":"Give a limitation of equity theory relating to culture.","a":"Aumer-Ryan et al. (2006) found equity was linked to satisfaction in the USA but not in all cultures (e.g. Jamaica, where men were most satisfied when over-benefiting)","t":"Relationships","id":2709},{"q":"Give a limitation of equity theory relati
