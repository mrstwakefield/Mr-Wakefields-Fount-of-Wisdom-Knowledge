 et al. (2014) find about Milgram's prods?","a":"Every participant who was given the fourth prod ('You have no other choice') refused to continue","t":"Social Influence","id":3184},{"q":"What alternative explanation for Milgram's results is supported by Haslam et al. (2014)?","a":"Social identity theory – participants obeyed when they identified with the scientific aims of the study, not simply because of orders","t":"Social Influence","id":3185},{"q":"Give two ethical issues with Milgram's study.","a":"Deception (fake shocks/cover story), Lack of right to withdraw (prods), Psychological harm/stress","t":"Social Influence","id":3186},{"q":"How did Baumrind (1964) criticise Milgram?","a":"She said the deception was unethical and could make participants distrust authority/researchers in future","t":"Social Influence","id":3187},{"q":"How did Milgram defend his use of deception?","a":"Participants were fully debriefed and most said they were glad to have taken part; the knowledge gained justified it","t":"Social Influence","id":3188},{"q":"Why might Milgram's sample be biased?","a":"Volunteers from one area, all American men – may not generalise to women or other cultures","t":"Social Influence","id":3189},{"q":"Give a real-world application of Milgram's research.","a":"Explains atrocities like the Holocaust and My Lai; can inform training (e.g. nurses/pilots being encouraged to question authority)","t":"Social Influence","id":3190},{"q":"What two situational variables affecting obedience in the specification did Milgram investigate?","a":"Proximity and location (plus uniform)","t":"Social Influence","id":3191},{"q":"What was obedience when teacher and learner were in the same room?","a":"40%","t":"Social Influence","id":3192},{"q":"What was obedience in Milgram's touch-proximity condition?","a":"30% – the teacher had to force the learner's hand onto a shock plate","t":"Social Influence","id":3193},{"q":"What was obedience when the experimenter gave instructions by telephone?","a":"20.5%","t":"Social Influence","id":3194},{"q":"Why does proximity affect obedience?","a":"Being close to the victim makes the consequences of actions more obvious; a distant authority is easier to resist","t":"Social Influence","id":3195},{"q":"What did Milgram change in the location variation?","a":"The study was moved from prestigious Yale University to a run-down office building in Bridgeport","t":"Social Influence","id":3196},{"q":"What was obedience in the run-down office building?","a":"47.5%","t":"Social Influence","id":3197},{"q":"Why did obedience fall when the location changed?","a":"The prestigious university setting gave the experimenter legitimacy and authority","t":"Social Influence","id":3198},{"q":"What was changed in Milgram's uniform variation?","a":"The experimenter was called away and replaced by an 'ordinary member of the public' in everyday clothes","t":"Social Influence","id":3199},{"q":"What was obedience in Milgram's uniform (ordinary person) variation?","a":"20%","t":"Social Influence","id":3200},{"q":"Why does a uniform increase obedience?","a":"It is a symbol of legitimate authority that is widely recognised and hard to challenge","t":"Social Influence","id":3201},{"q":"Outline Bickman's (1974) study of uniform.","a":"Researchers dressed as a security guard, milkman or in a jacket and tie gave orders to people in the street; people were about twice as likely to obey the guard as the civilian","t":"Social Influence","id":3202},{"q":"Give a strength of research into situational variables.","a":"Supported by other research such as Bickman (1974), which was a field experiment with higher ecological validity","t":"Social Influence","id":3203},{"q":"Give a limitation of Milgram's variations.","a":"Orne and Holland argued participants were even more likely to see through the deception in variations (e.g. an obvious confederate replacing the experimenter)","t":"Social Influence","id":3204},{"q":"What did Miranda et al. (1981) find about cross-cultural obedience?","a":"Over 90% of Spanish students were obedient, suggesting Milgram's findings are not limited to Americans","t":"Social Influence","id":3205},{"q":"Why are cross-cultural replications of Milgram limited?","a":"Most were in similar Western, individualist cultures, so they may not generalise to all cultures","t":"Social Influence","id":3206},{"q":"What is the situational explanation versus dispositional explanation of obedience?","a":"Situational – features of the environment cause obedience; dispositional – personality characteristics cause obedience","t":"Social Influence","id":3207},{"q":"What are the two situational explanations for obedience on the specification?","a":"Agentic state, Legitimacy of authority","t":"Social Influence","id":3208},{"q":"What is the autonomous state?","a":"When a person feels free to behave according to their own principles and feels responsible for their actions","t":"Social Influence","id":3209},{"q":"What are binding factors?","a":"Aspects of the situation that allow a person to ignore or minimise the damaging effects of their behaviour and reduce moral strain","t":"Social Influence","id":3210},{"q":"Give an example of a binding factor.","a":"Shifting responsibility to the victim ('he was foolish to volunteer'), or denying the damage they are doing","t":"Social Influence","id":3211},{"q":"What is moral strain?","a":"The anxiety felt when someone is aware that what they are doing is wrong but feels unable to disobey","t":"Social Influence","id":3212},{"q":"What did Blass and Schmitt (2001) find?","a":"Students shown a film of Milgram's study blamed the experimenter rather than the participant, suggesting they saw him as responsible (legitimate authority and agentic state)","t":"Social Influence","id":3213},{"q":"Give a limitation of the agentic state explanation.","a":"It doesn't explain why some participants disobeyed, or why Milgram's participants showed moral strain if they felt no responsibility","t":"Social Influence","id":3214},{"q":"How does Mandel (1998) challenge the agentic state?","a":"Reserve Police Battalion 101 shot civilians in WW2 despite being told they could opt out and the authority not being present – they behaved autonomously","t":"Social Influence","id":3215},{"q":"How is legitimacy of authority learned?","a":"In childhood, we learn to accept the authority of parents, teachers and others, and that society is organised hierarchically","t":"Social Influence","id":3216},{"q":"Give a real-life example supporting legitimacy of authority.","a":"Kelman and Hamilton (1989) – the My Lai massacre, where US soldiers obeyed orders to kill civilians because of the army hierarchy","t":"Social Influence","id":3217},{"q":"What cross-cultural evidence supports legitimacy of authority?","a":"Kilham and Mann (1974) found only 16% obedience in Australia, whereas Mantell (1971) found 85% in Germany – suggesting cultures differ in how they view authority","t":"Social Influence","id":3218},{"q":"Why is legitimacy of authority not a full explanation of obedience?","a":"It can't explain why some people disobey authority they recognise as legitimate (e.g. nurses in Rank and Jacobson)","t":"Social Influence","id":3219},{"q":"Who proposed the Authoritarian Personality?","a":"Adorno et al. (1950)","t":"Social Influence","id":3220},{"q":"What scale did Adorno develop?","a":"The F-scale (potential for fascism scale)","t":"Social Influence","id":3221},{"q":"Describe the sample in Adorno et al.'s research.","a":"Over 2,000 middle-class, white Americans","t":"Social Influence","id":3222},{"q":"What unconscious attitudes did Adorno investigate?","a":"Attitudes towards other racial groups","t":"Social Influence","id":3223},{"q":"Give four characteristics of an Authoritarian Personality.","a":"Extreme respect for and submission to authority, Contempt for those of lower status, Conventional attitudes, Rigid (black-and-white) thinking/intolerance of ambiguity","t":"Social Influence","id":3224},{"q":"What is the origin of the Authoritarian Personality according to Adorno?","a":"Harsh, strict parenting with high expectations, criticism and conditional love","t":"Social Influence","id":3225},{"q":"Which approach does Adorno's explanation of the origin of the Authoritarian Personality draw on?","a":"Psychodynamic – hostility towards parents is repressed and displaced onto scapegoats (lower-status groups)","t":"Social Influence","id":3226},{"q":"What did Elms and Milgram (1966) find?","a":"Fully obedient participants from Milgram's study scored higher on the F-scale than disobedient ones","t":"Social Influence","id":3227},{"q":"Why does Elms and Milgram's research only partly support the Authoritarian Personality?","a":"Obedient participants did not show all the characteristics – e.g. they had good relationships with their parents","t":"Social Influence","id":3228},{"q":"Why is research into the Authoritarian Personality correlational?","a":"Researchers measure F-scale scores and obedience without manipulating variables, so we can't conclude personality causes obedience","t":"Social Influence","id":3229},{"q":"What is the political bias criticism of the Authoritarian Personality?","a":"It only measures right-wing authoritarianism, but left-wing ideologies can also demand obedience (Christie and Jahoda, 1954)","t":"Social Influence","id":3230},{"q":"What methodological problem does the F-scale have?","a":"All items are worded in the same direction, so it may measure acquiescence bias (a tendency to agree) rather than authoritarianism","t":"Social Influence","id":3231},{"q":"Why can't the Authoritarian Personality explain obedience in whole societies?","a":"It is unlikely that millions of people in Nazi Germany all had the same personality; social identity may explain it better","t":"Social Influence","id":3232},{"q":"What does 'resistance to social influence' mean?","a":"The ability of people to withstand the pressure to conform or obey","t":"Social Influence","id":3233},{"q":"What are the two explanations of resistance on the specification?","a":"Social support, Locus of control","t":"Social Influence","id":3234},{"q":"How does social support help resistance to conformity?","a":"A dissenter breaks the unanimity of the majority and shows that it is possible to resist, reducing pressure","t":"Social Influence","id":3235},{"q":"Does the dissenter in an Asch study need to give the right answer to reduce conformity?","a":"No – conformity falls even if the dissenter gives a different wrong answer; what matters is breaking unanimity","t":"Social Influence","id":3236},{"q":"How does social support help resistance to obedience?","a":"A disobedient peer acts as a model, showing it is possible to disobey","t":"Social Influence","id":3237},{"q":"What was obedience in Milgram's variation with a disobedient peer?","a":"It dropped from 65% to 10%","t":"Social Influence","id":3238},{"q":"What did Allen and Levine (1971) find?","a":"Conformity fell even when the dissenter wore thick glasses and said he had poor eyesight – supports social support","t":"Social Influence","id":3239},{"q":"What did Gamson et al. (1982) find?","a":"When groups were asked to produce evidence to help an oil company run a smear campaign, 88% of groups rebelled – supporting social support for disobedience","t":"Social Influence","id":3240},{"q":"Give a limitation of social support as an explanation of resistance.","a":"Social support doesn't always help; e.g. Asch found it only works while the dissenter remains – when they rejoin the majority, conformity rises again","t":"Social Influence","id":3241},{"q":"Who proposed locus of control?","a":"Rotter (1966)","t":"Social Influence","id":3242},{"q":"What is an internal locus of control?","a":"The belief that things happen because of your own actions and choices","t":"Social Influence","id":3243},{"q":"What is an external locus of control?","a":"The belief that things happen due to outside forces such as luck, fate or other people","t":"Social Influence","id":3244},{"q":"Why are internals more likely to resist social influence?","a":"They take responsibility for their actions and base decisions on their own beliefs; they tend to be more self-confident and less need for approval","t":"Social Influence","id":3245},{"q":"Is locus of control a continuum or two categories?","a":"A continuum from high internal to high external","t":"Social Influence","id":3246},{"q":"What did Holland (1967) find?","a":"In a Milgram-style study, 37% of internals did not continue to the highest shock compared with 23% of externals","t":"Social Influence","id":3247},{"q":"What did Twenge et al. (2004) find that challenges locus of control?","a":"Over 40 years Americans became more resistant to obedience but also more external – the opposite of what the theory predicts","t":"Social Influence","id":3248},{"q":"According to Rotter, when is locus of control most important?","a":"In new situations; in familiar situations past experiences matter more","t":"Social Influence","id":3249},{"q":"Which type of conformity does minority influence usually lead to?","a":"Internalisation (conversion)","t":"Social Influence","id":3250},{"q":"What are the three factors affecting minority influence on the specification?","a":"Consistency, Commitment, Flexibility","t":"Social Influence","id":3251},{"q":"What is synchronic consistency?","a":"When all members of the minority say the same thing as each other","t":"Social Influence","id":3252},{"q":"What is diachronic consistency?","a":"When the minority keep saying the same thing over time","t":"Social Influence","id":3253},{"q":"Why does consistency make a minority influential?","a":"It makes the majority reconsider their views and think the minority may be right","t":"Social Influence","id":3254},{"q":"What is the augmentation principle?","a":"If a minority are willing to suffer for their views, they are taken more seriously","t":"Social Influence","id":3255},{"q":"Why can too much consistency reduce minority influence?","a":"The minority may be seen as rigid and dogmatic, which is unappealing (Nemeth, 1986)","t":"Social Influence","id":3256},{"q":"Who studied minority influence using blue slides?","a":"Moscovici et al. (1969)","t":"Social Influence","id":3257},{"q":"Describe the procedure of Moscovici's blue-green study.","a":"Groups of 6 (2 confederates, 4 participants) judged the colour of 36 blue slides of varying intensity; confederates said 'green'","t":"Social Influence","id":3258},{"q":"What were the conditions in Moscovici's study?","a":"Consistent (confederates said green on all 36 slides), Inconsistent (green on 24 of 36 slides), Control (no confederates)","t":"Social Influence","id":3259},{"q":"What were the findings of Moscovici's study?","a":"Consistent minority: 8.42% green answers; inconsistent: 1.25%; control: 0.25%","t":"Social Influence","id":3260},{"q":"What does Moscovici's study show?","a":"Consistency is important in minority influence","t":"Social Influence","id":3261},{"q":"Give a limitation of Moscovici's study.","a":"Artificial task (identifying slide colour), so it lacks mundane realism and tells us little about real-life minority influence (e.g. political campaigns)","t":"Social Influence","id":3262},{"q":"What did Nemeth (1986) study?","a":"Flexibility – in a mock jury deciding compensation, a confederate who compromised was more influential than one who refused to change their position","t":"Social Influence","id":3263},{"q":"What did Wood et al. (1994) find?","a":"A meta-analysis of nearly 100 studies found minorities seen as consistent were the most influential","t":"Social Influence","id":3264},{"q":"What did Martin et al. (2003) find about minority influence?","a":"Participants who heard a minority message were more resistant to later counter-persuasion, suggesting minority influence involves deeper processing","t":"Social Influence","id":3265},{"q":"What is the snowball effect?","a":"As more people convert to the minority position, the rate of conversion speeds up until the minority becomes the majority","t":"Social Influence","id":3266},{"q":"What is social cryptomnesia?","a":"When people remember that change happened but forget how it came about (e.g. who the minority were)","t":"Social Influence","id":3267},{"q":"Why is minority influence thought to involve deeper processing than majority influence?","a":"A minority's views are unexpected, so people think carefully about the arguments, leading to genuine attitude change","t":"Social Influence","id":3268},{"q":"Why is research into minority influence limited in real life?","a":"Real minorities, e.g. suffragettes, face hostility and lack power, which lab groups don't capture","t":"Social Influence","id":3269},{"q":"Give a real-world example of minority influence.","a":"The suffragettes, or the civil rights movement","t":"Social Influence","id":3270},{"q":"How did the suffragettes show commitment?","a":"They were imprisoned, went on hunger strike and one died, showing they were willing to suffer for their cause","t":"Social Influence","id":3271},{"q":"Why is the distinction between minority and majority influence sometimes criticised?","a":"Real-life minorities and majorities differ in power and status as well as numbers, which lab studies don't capture","t":"Social Influence","id":3272},{"q":"What is an individual difference affecting conformity besides nAffiliation?","a":"Gender, personality/self-esteem, culture","t":"Social Influence","id":3273},{"q":"Why might women appear to conform more in some studies?","a":"Eagly (1978) suggested women are more concerned with social relationships; also studies often used tasks men were more familiar with","t":"Social Influence","id":3274},{"q":"Why is Asch's research sometimes described as low in population validity?","a":"Only 123 American male students were tested","t":"Social Influence","id":3275},{"q":"What research method did Asch use?","a":"Laboratory experiment","t":"Social Influence","id":3276},{"q":"What research method did Hofling use?","a":"Field experiment","t":"Social Influence","id":3277},{"q":"What is a confederate?","a":"A person who appears to be a participant but is actually working for the researcher","t":"Social Influence","id":3278},{"q":"What independent variable did Asch manipulate in the group size variation?","a":"The number of confederates","t":"Social Influence","id":3279},{"q":"What is an example of the right to withdraw being compromised in social influence research?","a":"Milgram's prods pressured participants to continue","t":"Social Influence","id":3280},{"q":"What is informed consent and how was it breached in Asch's study?","a":"Agreeing to take part knowing the true aims; participants were told it was a vision perception study","t":"Social Influence","id":3281},{"q":"How can researchers deal with deception in social influence research?","a":"Debriefing, presumptive or prior general consent, and ethics committee approval","t":"Social Influence","id":3282},{"q":"What happened in Milgram's variation where two peers delivered the shock and the participant only read out the words?","a":"Obedience rose to 92.5%, as the participant was not directly responsible","t":"Social Influence","id":3283},{"q":"Why does Milgram's variation where the participant read the words support agentic state?","a":"When they were further from responsibility for the harm, obedience increased","t":"Social Influence","id":3284},{"q":"Why is the finding that 12.5% stopped at 300V important?","a":"This was the first point where the learner protested strongly and stopped responding, showing a turning point where moral strain became too great for some","t":"Social Influence","id":3285},{"q":"What does 'dispositional' mean?","a":"Relating to the individual's personality or characteristics","t":"Social Influence","id":3286},{"q":"What is the 'Germans are different' hypothesis?","a":"The idea that Germans had a particular obedient personality that explained the Holocaust","t":"Social Influence","id":3287},{"q":"Why is locus of control research supportive of the idea of individual differences in resistance?","a":"It shows that personality factors, not just situation, affect whether people resist","t":"Social Influence","id":3288},{"q":"What is a limitation of locus of control research in terms of its evidence?","a":"Much of it is correlational and some findings (e.g. Twenge) contradict it","t":"Social Influence","id":3289},{"q":"Why are social influence studies often high in internal validity?","a":"They are lab experiments with high control over extraneous variables","t":"Social Influence","id":3290},{"q":"Why might situational explanations of obedience be seen as an excuse?","a":"Mandel argued they offer an 'obedience alibi', excusing people for evil acts","t":"Social Influence","id":3291},{"q":"What does the term 'majority influence' mean?","a":"Conformity to a larger group","t":"Social Influence","id":3292},{"q":"Why might a unanimous majority be more powerful than a larger non-unanimous one?","a":"A single dissent breaks the pressure; unanimity matters more than group size","t":"Social Influence","id":3293},{"q":"Give one practical way a person could resist obedience.","a":"Look for social support from others who also want to disobey, or remind themselves they are responsible for their actions","t":"Social Influence","id":3294},{"q":"What is schizophrenia?","a":"A severe mental disorder in which contact with reality and insight are impaired – a type of psychosis","t":"Schizophrenia","id":3295},{"q":"Roughly what percentage of the population is affected by schizophrenia?","a":"About 1%","t":"Schizophrenia","id":3296},{"q":"Is schizophrenia more commonly diagnosed in men or women?","a":"Men (slightly more)","t":"Schizophrenia","id":3297},{"q":"In which type of area is schizophrenia more commonly diagnosed?","a":"Cities rather than the countryside, and in lower social classes","t":"Schizophrenia","id":3298},{"q":"What is psychosis?","a":"A loss of contact with external reality","t":"Schizophrenia","id":3299},{"q":"What are the two main classification systems for schizophrenia?","a":"DSM-5 and ICD-11","t":"Schizophrenia","id":3300},{"q":"What does DSM stand for?","a":"Diagnostic and Statistical Manual of Mental Disorders","t":"Schizophrenia","id":3301},{"q":"What does ICD stand for?","a":"International Classification of Diseases","t":"Schizophrenia","id":3302},{"q":"Who publishes the DSM?","a":"The American Psychiatric Association","t":"Schizophrenia","id":3303},{"q":"Who publishes the ICD?","a":"The World Health Organization","t":"Schizophrenia","id":3304},{"q":"What does DSM-5 require for a diagnosis of schizophrenia?","a":"At least one positive symptom (delusions, hallucinations or disorganised speech) must be present","t":"Schizophrenia","id":3305},{"q":"What does ICD-11 require for a diagnosis of schizophrenia?","a":"Two or more negative symptoms can be sufficient","t":"Schizophrenia","id":3306},{"q":"What are positive symptoms?","a":"Atypical symptoms experienced in addition to normal experiences","t":"Schizophrenia","id":3307},{"q":"What are negative symptoms?","a":"Atypical experiences that represent the loss of a usual experience","t":"Schizophrenia","id":3308},{"q":"What are the two positive symptoms on the specification?","a":"Hallucinations, Delusions","t":"Schizophrenia","id":3309},{"q":"What are the two negative symptoms on the specification?","a":"Speech poverty, Avolition","t":"Schizophrenia","id":3310},{"q":"What are hallucinations?","a":"Sensory experiences of stimuli that are not there or are distorted, in any sense","t":"Schizophrenia","id":3311},{"q":"What is the most common type of hallucination in schizophrenia?","a":"Auditory hallucinations (hearing voices)","t":"Schizophrenia","id":3312},{"q":"Give an example of a hallucination.","a":"Hearing voices that criticise the person, or seeing faces in patterns","t":"Schizophrenia","id":3313},{"q":"What are delusions?","a":"Irrational beliefs that are not based on reality","t":"Schizophrenia","id":3314},{"q":"What are delusions of persecution?","a":"Believing others are out to harm or plot against you","t":"Schizophrenia","id":3315},{"q":"What are delusions of grandeur?","a":"Believing you are someone very important, e.g. Jesus or the Prime Minister","t":"Schizophrenia","id":3316},{"q":"What are delusions of control?","a":"Believing your behaviour or thoughts are being controlled by external forces","t":"Schizophrenia","id":3317},{"q":"What is speech poverty (alogia)?","a":"A reduction in the amount and quality of speech, often with a delay in responding","t":"Schizophrenia","id":3318},{"q":"How is speech poverty classified in DSM-5 and ICD?","a":"DSM-5 emphasises disorganised speech as a positive symptom; speech poverty is a negative symptom","t":"Schizophrenia","id":3319},{"q":"What is avolition?","a":"Finding it difficult to begin or keep up goal-directed behaviour – a severe reduction in motivation","t":"Schizophrenia","id":3320},{"q":"What are the three signs of avolition identified by Andreasen (1982)?","a":"Poor hygiene and grooming, Lack of persistence in work or education, Lack of energy","t":"Schizophrenia","id":3321},{"q":"What is disorganised speech?","a":"Speech that is incoherent or jumps between unrelated topics (derailment)","t":"Schizophrenia","id":3322},{"q":"What are 'word salad' and 'neologisms'?","a":"Word salad is jumbled, meaningless speech; neologisms are made-up words","t":"Schizophrenia","id":3323},{"q":"What is reliability in diagnosis?","a":"The consistency of a diagnosis – whether different clinicians agree (inter-rater) or the same clinician diagnoses consistently over time (test-retest)","t":"Schizophrenia","id":3324},{"q":"What is validity in diagnosis?","a":"The extent to which schizophrenia is a unique syndrome with its own characteristics and whether we are measuring what we intend to","t":"Schizophrenia","id":3325},{"q":"What did Osório et al. (2019) find?","a":"High reliability using DSM-5 – inter-rater reliability of +0.97 and test-retest of +0.92","t":"Schizophrenia","id":3326},{"q":"What did Cheniaux et al. (2009) find?","a":"Two psychiatrists diagnosed 100 patients; one diagnosed 68 using ICD and 39 using DSM; the other 60 and 26 – schizophrenia is over-diagnosed with ICD and diagnosis is not reliable","t":"Schizophrenia","id":3327},{"q":"What is criterion validity?","a":"Whether different assessment systems arrive at the same diagnosis","t":"Schizophrenia","id":3328},{"q":"What are the issues in diagnosis on the specification?","a":"Co-morbidity, Culture bias, Gender bias, Symptom overlap","t":"Schizophrenia","id":3329},{"q":"What is co-morbidity?","a":"When two or more conditions occur together in the same person","t":"Schizophrenia","id":3330},{"q":"Give an example of co-morbidity with schizophrenia.","a":"Depression, substance abuse, anxiety or OCD","t":"Schizophrenia","id":3331},{"q":"What did Buckley et al. (2009) find?","a":"Around 50% of people with schizophrenia also had depression, 47% substance abuse, 29% PTSD and 23% OCD","t":"Schizophrenia","id":3332},{"q":"Why is co-morbidity a problem for diagnosis?","a":"If conditions often occur together, they may not be separate conditions; it challenges the validity of schizophrenia as a separate disorder","t":"Schizophrenia","id":3333},{"q":"Why is co-morbidity a problem for treatment?","a":"Patients may need treatment for several conditions, and it is harder to know which symptoms relate to which disorder","t":"Schizophrenia","id":3334},{"q":"What is symptom overlap?","a":"When two or more conditions share symptoms","t":"Schizophrenia","id":3335},{"q":"Give an example of symptom overlap with schizophrenia.","a":"Bipolar disorder shares positive symptoms (delusions) and negative symptoms (avolition)","t":"Schizophrenia","id":3336},{"q":"Why is symptom overlap a problem for validity?","a":"It suggests schizophrenia and bipolar disorder may not be separate conditions; the same person could be diagnosed with either","t":"Schizophrenia","id":3337},{"q":"What did Ophoff et al. (2011) find?","a":"There is genetic overlap between schizophrenia and bipolar disorder, supporting symptom overlap","t":"Schizophrenia","id":3338},{"q":"What is gender bias in the diagnosis of schizophrenia?","a":"When the accuracy of diagnosis depends on the gender of the patient, due to gender-based stereotypes","t":"Schizophrenia","id":3339},{"q":"Why might men be diagnosed with schizophrenia more than women?","a":"Women may have better interpersonal functioning and be better at hiding symptoms, so they are under-diagnosed (Cotton et al., 2009)","t":"Schizophrenia","id":3340},{"q":"What did Cotton et al. (2009) find?","a":"Female patients typically functioned better than male patients, e.g. being more likely to work and have good family relationships","t":"Schizophrenia","id":3341},{"q":"What did Loring and Powell (1988) find?","a":"Psychiatrists were given case studies with patients labelled male or female; 56% diagnosed schizophrenia when male but only 20% when female","t":"Schizophrenia","id":3342},{"q":"Why is Loring and Powell's study evidence of gender bias?","a":"The same symptoms were diagnosed differently depending on the patient's gender, and the effect was stronger among male psychiatrists","t":"Schizophrenia","id":3343},{"q":"What is culture bias in the diagnosis of schizophrenia?","a":"The tendency to over- or under-diagnose members of other ethnic groups","t":"Schizophrenia","id":3344},{"q":"Which group in the UK is more likely to be diagnosed with schizophrenia?","a":"African-Caribbean people – around 9 times more likely than white British people","t":"Schizophrenia","id":3345},{"q":"Why might African-Caribbean people be over-diagnosed?","a":"Some symptoms, e.g. hearing voices, may be more acceptable in their culture, but white psychiatrists may interpret them as bizarre","t":"Schizophrenia","id":3346},{"q":"What did Escobar (2012) suggest about culture bias?","a":"White psychiatrists may interpret unfamiliar behaviours or cultural beliefs as symptoms of schizophrenia","t":"Schizophrenia","id":3347},{"q":"Why might high rates in African-Caribbean people not be caused by bias?","a":"People in Jamaica or Barbados don't have high rates, so it may be due to social factors (e.g. racism, poverty) in the UK","t":"Schizophrenia","id":3348},{"q":"What is the 'social drift hypothesis'?","a":"People with schizophrenia may drift down the social scale because of their illness, explaining higher rates in lower social classes","t":"Schizophrenia","id":3349},{"q":"What are the two biological explanations for schizophrenia on the specification?","a":"Genetics, Neural correlates (including the dopamine hypothesis)","t":"Schizophrenia","id":3350},{"q":"What is a family study?","a":"Research that looks at whether schizophrenia runs in families – the more closely related, the higher the risk","t":"Schizophrenia","id":3351},{"q":"Who conducted a family study of schizophrenia?","a":"Gottesman (1991)","t":"Schizophrenia","id":3352},{"q":"What did Gottesman (1991) find?","a":"Risk of schizophrenia increases with genetic similarity: 1% in the general population, 9% for siblings, 13% for children of one parent with schizophrenia, 48% for MZ twins, 17% for DZ twins","t":"Schizophrenia","id":3353},{"q":"What is the concordance rate for schizophrenia in MZ twins according to Gottesman?","a":"48%","t":"Schizophrenia","id":3354},{"q":"What is the concordance rate for schizophrenia in DZ twins according to Gottesman?","a":"17%","t":"Schizophrenia","id":3355},{"q":"What did Hilker et al. (2018) find?","a":"In a Danish twin study, concordance was 33% for MZ twins and 7% for DZ twins, with heritability of about 79%","t":"Schizophrenia","id":3356},{"q":"What are candidate genes?","a":"Individual genes believed to be linked to schizophrenia","t":"Schizophrenia","id":3357},{"q":"Is schizophrenia polygenic?","a":"Yes – it involves many genes working together","t":"Schizophrenia","id":3358},{"q":"Who found 108 separate genetic variations associated with schizophrenia?","a":"Ripke et al. (2014)","t":"Schizophrenia","id":3359},{"q":"What did Ripke et al. (2014) find?","a":"A study comparing 37,000 patients with 113,000 controls found 108 genetic variations linked to increased risk","t":"Schizophrenia","id":3360},{"q":"Which types of genes are linked to schizophrenia?","a":"Genes coding for neurotransmitters including dopamine, and genes involved in brain development","t":"Schizophrenia","id":3361},{"q":"What does aetiologically heterogeneous mean in schizophrenia?","a":"Different combinations of genes can cause schizophrenia in different people","t":"Schizophrenia","id":3362},{"q":"What are mutations in parental DNA?","a":"Changes in the DNA of the parent's sperm/egg that can increase the risk of schizophrenia","t":"Schizophrenia","id":3363},{"q":"What did Brown et al. (2002) find about paternal age?","a":"The risk of schizophrenia increases with the age of the father, possibly due to mutations in sperm – from 0.7% with fathers under 25 to 2% with fathers over 50","t":"Schizophrenia","id":3364},{"q":"Give a strength of the genetic explanation.","a":"Strong research support from family, twin and adoption studies (e.g. Gottesman, Tienari)","t":"Schizophrenia","id":3365},{"q":"What did Tienari et al. (2004) find in an adoption study?","a":"164 adoptees with biological mothers with schizophrenia – 11.2% developed schizophrenia versus 4.4% of controls","t":"Schizophrenia","id":3366},{"q":"Give a limitation of the genetic explanation.","a":"Concordance for MZ twins is not 100%, so environmental factors must play a role","t":"Schizophrenia","id":3367},{"q":"Why might MZ twins have higher concordance for reasons other than genes?","a":"MZ twins are treated more similarly and share more of their environment than DZ twins","t":"Schizophrenia","id":3368},{"q":"What environmental factors increase the risk of schizophrenia?","a":"Birth complications, smoking cannabis in adolescence, childhood trauma, urban living","t":"Schizophrenia","id":3369},{"q":"What did Morkved et al. (2017) find?","a":"67% of people with schizophrenia had experienced childhood trauma, compared with 38% of a control group","t":"Schizophrenia","id":3370},{"q":"What are neural correlates?","a":"Patterns of brain structure or activity that occur alongside an experience and may be involved in its origin","t":"Schizophrenia","id":3371},{"q":"What is the dopamine hypothesis?","a":"The idea that abnormal levels or activity of dopamine are involved in schizophrenia","t":"Schizophrenia","id":3372},{"q":"What is the original dopamine hypothesis?","a":"Hyperdopaminergia – too much dopamine in the subcortex causes positive symptoms","t":"Schizophrenia","id":3373},{"q":"What is hyperdopaminergia?","a":"High levels of dopamine activity, especially in the subcortex","t":"Schizophrenia","id":3374},{"q":"What is hypodopaminergia?","a":"Low levels of dopamine activity, especially in the cortex","t":"Schizophrenia","id":3375},{"q":"Which dopamine pathway is linked to positive symptoms?","a":"The mesolimbic pathway (high dopamine in the subcortex)","t":"Schizophrenia","id":3376},{"q":"Which dopamine pathway is linked to negative symptoms?","a":"The mesocortical pathway (low dopamine in the prefrontal cortex)","t":"Schizophrenia","id":3377},{"q":"Which brain area is linked to speech poverty and auditory hallucinations via dopamine?","a":"Broca's area – excess dopamine receptors may cause speech poverty and hallucinations","t":"Schizophrenia","id":3378},{"q":"Why might high dopamine cause hallucinations?","a":"Too much dopamine means neurons fire too often, which may cause the brain to misinterpret internal thoughts as external voices","t":"Schizophrenia","id":3379},{"q":"What is the revised dopamine hypothesis?","a":"Davis et al. (1991) suggested both hyperdopaminergia in the subcortex and hypodopaminergia in the cortex are involved","t":"Schizophrenia","id":3380},{"q":"What did Goldman-Rakic et al. (2004) find?","a":"Low dopamine in the prefrontal cortex was linked to cognitive problems and negative symptoms","t":"Schizophrenia","id":3381},{"q":"Give research support for the dopamine hypothesis from drugs.","a":"Amphetamines increase dopamine and can produce schizophrenia-like symptoms in people without the disorder; antipsychotics reduce dopamine and reduce symptoms","t":"Schizophrenia","id":3382},{"q":"What is L-dopa and how does it support the dopamine hypothesis?","a":"A drug that increases dopamine used for Parkinson's disease; it can cause schizophrenia-like symptoms","t":"Schizophrenia","id":3383},{"q":"Give a limitation of the dopamine hypothesis.","a":"Some patients don't respond to drugs that reduce dopamine; other neurotransmitters such as glutamate may be involved","t":"Schizophrenia","id":3384},{"q":"What is the glutamate hypothesis?","a":"The idea that abnormal glutamate activity (possibly reduced NMDA receptor function) is involved in schizophrenia","t":"Schizophrenia","id":3385},{"q":"What did Moghaddam and Javitt (2012) find?","a":"Glutamate may be involved, as drugs that block glutamate receptors (e.g. ketamine) produce schizophrenia-like symptoms","t":"Schizophrenia","id":3386},{"q":"What is the ventral striatum and its link to negative symptoms?","a":"Part of the brain involved in reward; lower activity in this area has been linked to avolition (Juckel et al., 2006)","t":"Schizophrenia","id":3387},{"q":"What did Juckel et al. (2006) find?","a":"Lower activity in the ventral striatum was linked to negative symptoms such as avolition","t":"Schizophrenia","id":3388},{"q":"What is the superior temporal gyrus and its link to positive symptoms?","a":"Allen et al. (2007) found lower activity in this area during auditory hallucinations","t":"Schizophrenia","id":3389},{"q":"What did Allen et al. (2007) find?","a":"Patients with hallucinations had lower activity in the superior temporal and anterior cingulate gyri during a task identifying their own voice","t":"Schizophrenia","id":3390},{"q":"What is a limitation of neural correlates evidence?","a":"It is correlational – brain differences may be a result of schizophrenia (or medication) rather than a cause","t":"Schizophrenia","id":3391},{"q":"What is enlarged ventricles in schizophrenia?","a":"Fluid-filled spaces in the brain are larger in some people with schizophrenia, suggesting loss of brain tissue","t":"Schizophrenia","id":3392},{"q":"What are the two psychological explanations of schizophrenia on the specification?","a":"Family dysfunction, Cognitive explanations (including dysfunctional thought processing)","t":"Schizophrenia","id":3393},{"q":"What is family dysfunction?","a":"Abnormal patterns of communication and interaction within a family which may be a risk factor for schizophrenia","t":"Schizophrenia","id":3394},{"q":"What is the 'schizophrenogenic mother'?","a":"Fromm-Reichmann's (1948) idea of a cold, rejecting, controlling mother who creates tension and secrecy, leading to distrust and paranoid delusions","t":"Schizophrenia","id":3395},{"q":"Who proposed the schizophrenogenic mother?","a":"Fromm-Reichmann (1948)","t":"Schizophrenia","id":3396},{"q":"What is the double bind theory?","a":"Bateson et al. (1956) – a child receives contradictory messages from parents (e.g. told they are loved while being frowned at), leading to confusion and distrust","t":"Schizophrenia","id":3397},{"q":"Who proposed double bind theory?","a":"Bateson et al. (1956)","t":"Schizophrenia","id":3398},{"q":"Give an example of a double bind.","a":"A parent says 'I love you' while turning away in disgust","t":"Schizophrenia","id":3399},{"q":"How does a double bind lead to schizophrenia?","a":"The child can't win and feels constantly confused, which may lead to disorganised thinking and paranoid delusions","t":"Schizophrenia","id":3400},{"q":"What is expressed emotion (EE)?","a":"The level of negative emotion expressed towards a patient by their carers","t":"Schizophrenia","id":3401},{"q":"What are the three elements of expressed emotion?","a":"Verbal criticism, Hostility, Emotional over-involvement","t":"Schizophrenia","id":3402},{"q":"Is expressed emotion linked to onset or relapse?","a":"Mainly relapse","t":"Schizophrenia","id":3403},{"q":"Give research support for family dysfunction.","a":"Read et al. (2005) reviewed 46 studies and found childhood abuse was a strong predictor of adult schizophrenia","t":"Schizophrenia","id":3404},{"q":"What did Read et al. (2005) find?","a":"A review of 46 studies found childhood abuse, particularly sexual abuse, strongly predicted schizophrenia","t":"Schizophrenia","id":3405},{"q":"What did Tienari et al. (2004) find about family environment?","a":"Adoptees with a genetic risk were more likely to develop schizophrenia if raised in a dysfunctional family – supporting the diathesis-stress model","t":"Schizophrenia","id":3406},{"q":"Give a limitation of family dysfunction explanations.","a":"Evidence for the schizophrenogenic mother and double bind is weak; they are based on clinical observation of patients","t":"Schizophrenia","id":3407},{"q":"Why are family dysfunction explanations socially sensitive?","a":"They blame parents (especially mothers), which can cause distress for families already dealing with a family member's illness","t":"Schizophrenia","id":3408},{"q":"Why is family dysfunction research often retrospective?","a":"It relies on adults with schizophrenia recalling their childhood, which may be distorted by their illness","t":"Schizophrenia","id":3409},{"q":"What is the cognitive explanation of schizophrenia?","a":"Schizophrenia is caused by dysfunctional thought processing","t":"Schizophrenia","id":3410},{"q":"What is dysfunctional thought processing?","a":"Information processing that doesn't function normally and produces negative consequences","t":"Schizophrenia","id":3411},{"q":"Who developed the cognitive explanation involving metarepresentation?","a":"Frith et al. (1992)","t":"Schizophrenia","id":3412},{"q":"What is metarepresentation?","a":"The cognitive ability to reflect on our own thoughts and behaviour, allowing insight into our intentions and goals","t":"Schizophrenia","id":3413},{"q":"What does dysfunction of metarepresentation lead to?","a":"Difficulty recognising thoughts as our own, leading to auditory hallucinations and delusions of control","t":"Schizophrenia","id":3414},{"q":"What is central control?","a":"The cognitive ability to suppress automatic responses while performing deliberate actions","t":"Schizophrenia","id":3415},{"q":"What does dysfunction of central control lead to?","a":"Disorganised speech and thought disorder, as automatic associations can't be suppressed (derailment)","t":"Schizophrenia","id":3416},{"q":"What is derailment?","a":"When a person's speech jumps from one topic to another, because each word triggers associations that can't be suppressed","t":"Schizophrenia","id":3417},{"q":"Give research support for the cognitive explanation.","a":"Stirling et al. (2006) found people with schizophrenia took over twice as long to complete the Stroop test as controls","t":"Schizophrenia","id":3418},{"q":"What did Stirling et al. (2006) find?","a":"30 patients with schizophrenia took longer to name the ink colour in the Stroop test, suggesting dysfunctional central control","t":"Schizophrenia","id":3419},{"q":"What is the Stroop test?","a":"A task where participants name the ink colour of colour words written in a conflicting colour (e.g. 'red' written in blue); it requires suppressing the automatic response of reading","t":"Schizophrenia","id":3420},{"q":"Give a limitation of the cognitive explanation.","a":"It explains the proximal (immediate) causes of symptoms but not the distal (root) cause of the faulty thinking","t":"Schizophrenia","id":3421},{"q":"What is a proximal cause?","a":"An immediate cause of symptoms","t":"Schizophrenia","id":3422},{"q":"What is a distal cause?","a":"The original underlying cause","t":"Schizophrenia","id":3423},{"q":"Give a strength of the cognitive explanation.","a":"It has led to CBT for schizophrenia, which can reduce the impact of symptoms","t":"Schizophrenia","id":3424},{"q":"What does 'interactionist' mean in relation to schizophrenia?","a":"Schizophrenia is explained by a combination of biological, psychological and social factors","t":"Schizophrenia","id":3425},{"q":"What are the two drug therapies for schizophrenia on the specification?","a":"Typical antipsychotics, Atypical antipsychotics","t":"Schizophrenia","id":3426},{"q":"What are antipsychotics?","a":"Drugs used to reduce the symptoms of schizophrenia, usually by acting on dopamine","t":"Schizophrenia","id":3427},{"q":"Give an example of a typical antipsychotic.","a":"Chlorpromazine","t":"Schizophrenia","id":3428},{"q":"Give examples of atypical antipsychotics.","a":"Clozapine, Risperidone","t":"Schizophrenia","id":3429},{"q":"How do typical antipsychotics work?","a":"They are dopamine antagonists – they block dopamine receptors (especially D2) in the synapse, reducing dopamine action","t":"Schizophrenia","id":3430},{"q":"Which symptoms do typical antipsychotics mainly treat?","a":"Positive symptoms such as hallucinations and delusions","t":"Schizophrenia","id":3431},{"q":"When were typical antipsychotics first used?","a":"The 1950s","t":"Schizophrenia","id":3432},{"q":"What else does chlorpromazine do?","a":"It has a sedative effect, affecting histamine receptors","t":"Schizophrenia","id":3433},{"q":"How do atypical antipsychotics differ from typical antipsychotics?","a":"They act on several neurotransmitters including dopamine, serotonin and glutamate, and only temporarily occupy D2 receptors, so side effects are fewer","t":"Schizophrenia","id":3434},{"q":"How does clozapine work?","a":"It binds to dopamine receptors but also acts on serotonin and glutamate receptors","t":"Schizophrenia","id":3435},{"q":"Why was clozapine initially withdrawn?","a":"It caused agranulocytosis, a potentially fatal blood condition, in some patients","t":"Schizophrenia","id":3436},{"q":"What is agranulocytosis?","a":"A blood condition where white blood cell count drops, which can be fatal","t":"Schizophrenia","id":3437},{"q":"When is clozapine used?","a":"For treatment-resistant schizophrenia, especially when patients haven't responded to other drugs; it may also reduce suicide risk","t":"Schizophrenia","id":3438},{"q":"How does risperidone work?","a":"It binds to dopamine and serotonin receptors, binding more strongly to dopamine receptors than clozapine, so smaller doses are effective","t":"Schizophrenia","id":3439},{"q":"Why was risperidone developed?","a":"To be as effective as clozapine but without its serious side effects","t":"Schizophrenia","id":3440},{"q":"What does the 'atypical' in atypical antipsychotics mean?","a":"They were developed later and work differently from the first-generation (typical) drugs","t":"Schizophrenia","id":3441},{"q":"Give a strength of antipsychotics.","a":"Research support – Thornley et al. (2003) found chlorpromazine was associated with better functioning and reduced symptoms compared with placebos","t":"Schizophrenia","id":3442},{"q":"What did Thornley et al. (2003) find?","a":"A review of 13 trials (1,121 participants) found chlorpromazine was associated with better overall functioning than placebos","t":"Schizophrenia","id":3443},{"q":"What did Meltzer (2012) find?","a":"Clozapine was more effective than typical antipsychotics and effective in 30–50% of treatment-resistant cases","t":"Schizophrenia","id":3444},{"q":"Give a limitation of antipsychotics relating to side effects.","a":"Typical antipsychotics can cause dizziness, agitation, sleepiness, weight gain and tardive dyskinesia (involuntary facial movements)","t":"Schizophrenia","id":3445},{"q":"What is tardive dyskinesia?","a":"Involuntary facial movements such as blinking and lip-smacking, caused by long-term use of typical antipsychotics","t":"Schizophrenia","id":3446},{"q":"What is neuroleptic malignant syndrome?","a":"A potentially fatal side effect of antipsychotics, caused by blocking dopamine in the hypothalamus, affecting body temperature and blood pressure","t":"Schizophrenia","id":3447},{"q":"Give a limitation of antipsychotics relating to research.","a":"Healy (2012) suggested some successful trials were published multiple times, exaggerating effectiveness, and data came from short-term trials","t":"Schizophrenia","id":3448},{"q":"Why is the mechanism of antipsychotics questioned?","a":"The dopamine hypothesis is not fully accepted; drugs may work by calming patients rather than targeting the cause","t":"Schizophrenia","id":3449},{"q":"What is the 'chemical cosh' argument?","a":"The claim that antipsychotics are used to calm and sedate patients to make them easier to manage, rather than for their benefit – an ethical issue","t":"Schizophrenia","id":3450},{"q":"Why do some patients stop taking antipsychotics?","a":"Due to side effects, or a lack of insight into their condition","t":"Schizophrenia","id":3451},{"q":"What are the two psychological therapies for schizophrenia on the specification?","a":"Cognitive behaviour therapy (CBT), Family therapy","t":"Schizophrenia","id":3452},{"q":"What is the aim of CBT for schizophrenia?","a":"To help patients identify and change irrational thoughts and reduce the distress caused by symptoms","t":"Schizophrenia","id":3453},{"q":"Can CBT cure schizophrenia?","a":"No – it helps patients manage and cope with symptoms rather than curing the disorder","t":"Schizophrenia","id":3454},{"q":"How many CBT sessions are typical for schizophrenia?","a":"Usually 5–20 sessions, individually or in groups","t":"Schizophrenia","id":3455},{"q":"What happens at the start of CBT for schizophrenia?","a":"Patients are helped to identify irrational thoughts and understand where their symptoms come from","t":"Schizophrenia","id":3456},{"q":"How can CBT help with hallucinations?","a":"By helping patients understand where voices come from (e.g. their own thoughts) and reducing anxiety about them","t":"Schizophrenia","id":3457},{"q":"How can CBT help with delusions?","a":"By helping patients test the reality of their beliefs and consider alternative explanations","t":"Schizophrenia","id":3458},{"q":"What is normalisation in CBT for schizophrenia?","a":"Helping patients see that their experiences are less unusual than they think, to reduce anxiety and stigma","t":"Schizophrenia","id":3459},{"q":"What is reality testing in CBT?","a":"Encouraging patients to find evidence for and against their delusional beliefs","t":"Schizophrenia","id":3460},{"q":"Give an example of reality testing.","a":"A patient who believes they are being followed is encouraged to look for evidence and consider whether it could be a coincidence","t":"Schizophrenia","id":3461},{"q":"Give a strength of CBT for schizophrenia.","a":"Research support – Jauhar et al. (2014) reviewed 34 studies and found CBT had a small but significant effect on positive and negative symptoms","t":"Schizophrenia","id":3462},{"q":"What did Jauhar et al. (2014) find?","a":"A meta-analysis of 34 studies found CBT had a small but significant effect on symptoms","t":"Schizophrenia","id":3463},{"q":"Give a limitation of CBT relating to the evidence.","a":"Effectiveness varies between studies and the effect is small; it may depend on the quality of the CBT delivered","t":"Schizophrenia","id":3464},{"q":"Give a limitation of CBT relating to suitability.","a":"Patients who are severely ill or lack insight may not be able to engage with CBT","t":"Schizophrenia","id":3465},{"q":"What did NICE recommend about CBT for schizophrenia?","a":"That CBT should be offered to people with schizophrenia alongside medication","t":"Schizophrenia","id":3466},{"q":"What is the difference between a 'cure' and 'management' of schizophrenia?","a":"A cure removes the disorder; management reduces symptoms and helps people live with them","t":"Schizophrenia","id":3467},{"q":"What is family therapy?","a":"A therapy that involves the patient's family, aiming to improve communication and reduce stress and expressed emotion within the family","t":"Schizophrenia","id":3468},{"q":"What are the aims of family therapy for schizophrenia?","a":"Reduce expressed emotion, Reduce stress in the family, Improve communication, Increase the family's ability to support the patient and reduce relapse","t":"Schizophrenia","id":3469},{"q":"What is Burbach's (2018) summary of family therapy strategies?","a":"Forming a therapeutic alliance with all family members, Reducing stress of caring, Improving the family's ability to anticipate and solve problems, Reducing anger and guilt, Maintaining a balance between caring and the family's own lives","t":"Schizophrenia","id":3470},{"q":"What does family therapy teach about expressed emotion?","a":"It helps families recognise and reduce criticism, hostility and over-involvement","t":"Schizophrenia","id":3471},{"q":"Which major review supports family therapy for schizophrenia?","a":"Pharoah et al. (2010), a Cochrane review","t":"Schizophrenia","id":3472},{"q":"What did Pharoah et al. (2010) find?","a":"Family therapy reduced hospital admission and relapse rates over the first year and improved patients' social functioning","t":"Schizophrenia","id":3473},{"q":"What is psychoeducation in family therapy?","a":"Educating the family about schizophrenia, its symptoms and treatments, so they understand and support the patient","t":"Schizophrenia","id":3474},{"q":"Give a strength of family therapy relating to cost.","a":"Economic benefits – reducing relapse and hospital admissions saves money; NICE found it saves more than it costs","t":"Schizophrenia","id":3475},{"q":"Give another strength of family therapy.","a":"It benefits the whole family, reducing their stress and improving their ability to cope","t":"Schizophrenia","id":3476},{"q":"Give a limitation of family therapy.","a":"It may be difficult to know which elements work; it requires the family to be willing and available to take part","t":"Schizophrenia","id":3477},{"q":"Why is family therapy linked to the idea of relapse?","a":"High expressed emotion in families is linked to relapse, so reducing it can prevent patients becoming ill again","t":"Schizophrenia","id":3478},{"q":"How can family therapy show an interactionist approach?","a":"It acknowledges both biological vulnerability and environmental stress within the family","t":"Schizophrenia","id":3479},{"q":"What is the interactionist approach to schizophrenia?","a":"An approach that combines biological, psychological and social factors to explain and treat schizophrenia","t":"Schizophrenia","id":3480},{"q":"What is the diathesis-stress model?","a":"Schizophrenia results from a combination of a vulnerability (diathesis) and a trigger (stress)","t":"Schizophrenia","id":3481},{"q":"What is a diathesis?","a":"An underlying vulnerability to a disorder, often genetic","t":"Schizophrenia","id":3482},{"q":"What is a stressor?","a":"An environmental trigger, e.g. trauma, cannabis use, family dysfunction","t":"Schizophrenia","id":3483},{"q":"What was Meehl's (1962) original diathesis-stress model?","a":"The diathesis was a single 'schizogene' and stress came from a schizophrenogenic mother; without the gene, stress would not cause schizophrenia","t":"Schizophrenia","id":3484},{"q":"How has the diathesis-stress model been modernised?","a":"The diathesis is now seen as polygenic, and can include early trauma; stress includes anything that risks triggering the disorder, e.g. cannabis","t":"Schizophrenia","id":3485},{"q":"What did Ingram and Luxton (2005) suggest?","a":"The diathesis need not be genetic – early trauma can create a psychological vulnerability","t":"Schizophrenia","id":3486},{"q":"How does cannabis link to the diathesis-stress model?","a":"Cannabis use (especially in adolescence) may act as a stressor that triggers schizophrenia in genetically vulnerable people","t":"Schizophrenia","id":3487},{"q":"What is the triple hit hypothesis?","a":"The idea that schizophrenia results from a genetic vulnerability plus early environmental insult plus a later stress (e.g. in adolescence)","t":"Schizophrenia","id":3488},{"q":"What treatment follows from the interactionist approach?","a":"A combination of antipsychotic drugs and psychological therapies such as CBT or family therapy","t":"Schizophrenia","id":3489},{"q":"What did Tarrier et al. (2004) find?","a":"Patients receiving medication plus CBT or supportive counselling showed lower symptom levels than those receiving medication alone","t":"Schizophrenia","id":3490},{"q":"Give a strength of the interactionist approach.","a":"Research support – Tienari et al. (2004) found genetic risk plus family dysfunction increased the chance of schizophrenia","t":"Schizophrenia","id":3491},{"q":"Give another strength of the interactionist approach.","a":"Real-world application – combining drugs and psychological therapies is more effective than either alone (Tarrier et al.)","t":"Schizophrenia","id":3492},{"q":"Give a limitation of the interactionist approach.","a":"It is complex; it is hard to know the exact contribution of each factor or how they interact","t":"Schizophrenia","id":3493},{"q":"Why is the original diathesis-stress model now seen as too simple?","a":"Research shows there is no single schizogene, and stress can take many forms beyond parenting","t":"Schizophrenia","id":3494},{"q":"What is the treatment-causation fallacy?","a":"The mistake of assuming that because a treatment works, the cause is related to it (e.g. drugs working doesn't prove dopamine causes schizophrenia)","t":"Schizophrenia","id":3495},{"q":"How does the treatment-causation fallacy apply to the interactionist approach?","a":"The success of combined treatments doesn't necessarily prove the interactionist explanation is correct","t":"Schizophrenia","id":3496},{"q":"Give an example of a biological factor in the interactionist approach.","a":"Genetic vulnerability or dopamine abnormalities","t":"Schizophrenia","id":3497},{"q":"Give an example of a psychological factor in the interactionist approach.","a":"Dysfunctional thought processing","t":"Schizophrenia","id":3498},{"q":"Give an example of a social factor in the interactionist approach.","a":"Family dysfunction, poverty or urban living","t":"Schizophrenia","id":3499},{"q":"Why do many psychiatrists now take a 'biopsychosocial' approach?","a":"It recognises schizophrenia results from biological, psychological and social influences working together","t":"Schizophrenia","id":3500},{"q":"A man believes the TV is sending him secret messages. Which symptom is this?","a":"A delusion (of reference)","t":"Schizophrenia","id":3501},{"q":"A woman hears voices telling her she is worthless. Which symptom is this?","a":"A (auditory) hallucination","t":"Schizophrenia","id":3502},{"q":"A patient has stopped washing and seems to have no motivation to do anything. Which symptom is this?","a":"Avolition","t":"Schizophrenia","id":3503},{"q":"A patient gives very short answers after a long pause. Which symptom is this?","a":"Speech poverty (alogia)","t":"Schizophrenia","id":3504},{"q":"A patient believes he is a famous royal figure. Which type of delusion is this?","a":"Delusion of grandeur","t":"Schizophrenia","id":3505},{"q":"A patient believes the government is trying to poison her. Which type of delusion is this?","a":"Delusion of persecution","t":"Schizophrenia","id":3506},{"q":"A patient says an alien is controlling his arm movements. Which type of delusion is this?","a":"Delusion of control","t":"Schizophrenia","id":3507},{"q":"Two psychiatrists diagnose the same patient differently. What issue does this raise?","a":"Poor inter-rater reliability of diagnosis","t":"Schizophrenia","id":3508},{"q":"A patient is diagnosed with schizophrenia and depression. What is this called?","a":"Co-morbidity","t":"Schizophrenia","id":3509},{"q":"A patient could be diagnosed with either schizophrenia or bipolar disorder. What issue does this raise?","a":"Symptom overlap (a validity issue)","t":"Schizophrenia","id":3510},{"q":"A young man who smoked a lot of cannabis and has a family history develops schizophrenia. Which model explains this?","a":"The diathesis-stress model","t":"Schizophrenia","id":3511},{"q":"A patient's parents are very critical and hostile towards her. What concept is this?","a":"High expressed emotion","t":"Schizophrenia","id":3512},{"q":"A psychiatrist dismisses a female patient's symptoms because she is holding down a job. What issue is this?","a":"Gender bias in diagnosis","t":"Schizophrenia","id":3513},{"q":"Why might an African-Caribbean patient be misdiagnosed with schizophrenia?","a":"A white psychiatrist may misinterpret culturally normal beliefs (e.g. hearing ancestors' voices) as symptoms","t":"Schizophrenia","id":3514},{"q":"Which neurotransmitter do typical antipsychotics mainly target?","a":"Dopamine","t":"Schizophrenia","id":3515},{"q":"Which receptor do typical antipsychotics block?","a":"D2 dopamine receptors","t":"Schizophrenia","id":3516},{"q":"Why do atypical antipsychotics have fewer side effects?","a":"They occupy D2 receptors only temporarily and act on several neurotransmitters, reducing movement side effects","t":"Schizophrenia","id":3517},{"q":"Why might atypical antipsychotics help negative symptoms?","a":"They act on serotonin and glutamate, which may improve mood and cognitive functioning","t":"Schizophrenia","id":3518},{"q":"Why must patients on clozapine have regular blood tests?","a":"To monitor for agranulocytosis","t":"Schizophrenia","id":3519},{"q":"Why may drug therapy be preferred to psychological therapy?","a":"It works quickly, is cheaper and requires less effort from the patient","t":"Schizophrenia","id":3520},{"q":"Why is it an ethical issue to use antipsychotics?","a":"Side effects can be serious, and patients may be given drugs without full consent if detained under the Mental Health Act","t":"Schizophrenia","id":3521},{"q":"What did Lieberman et al. (2005) find about antipsychotic use?","a":"Many patients (74%) stopped taking their antipsychotic within 18 months, often due to side effects or lack of effectiveness","t":"Schizophrenia","id":3522},{"q":"What is 'relapse'?","a":"The return of symptoms after a period of improvement","t":"Schizophrenia","id":3523},{"q":"Why is relapse common in schizophrenia?","a":"Patients stop taking medication, experience stress or live in families with high expressed emotion","t":"Schizophrenia","id":3524},{"q":"What is the role of the Mental Health Act in treatment?","a":"It allows people to be detained and treated without consent if they are a danger to themselves or others","t":"Schizophrenia","id":3525},{"q":"What is a limitation of using the DSM to diagnose schizophrenia?","a":"Criteria may be applied differently by clinicians, and cultural and gender biases can affect diagnosis","t":"Schizophrenia","id":3526},{"q":"Why is schizophrenia research socially sensitive?","a":"It can lead to stigma, e.g. linking schizophrenia to violence, or blaming families","t":"Schizophrenia","id":3527},{"q":"What is the stigma associated with schizophrenia?","a":"Negative stereotypes, e.g. that people with schizophrenia are dangerous, which can lead to discrimination","t":"Schizophrenia","id":3528},{"q":"What is the prognosis for schizophrenia?","a":"Varies widely – some recover fully, some have repeated episodes, and some have long-term symptoms","t":"Schizophrenia","id":3529},{"q":"What is the typical age of onset for schizophrenia?","a":"Late adolescence to early adulthood (earlier in men than women)","t":"Schizophrenia","id":3530},{"q":"Why is the dopamine hypothesis considered biologically reductionist?","a":"It explains a complex disorder through a single neurotransmitter","t":"Schizophrenia","id":3531},{"q":"Why is the genetic explanation considered deterministic?","a":"It suggests people with certain genes will inevitably develop schizophrenia, ignoring free will and environment","t":"Schizophrenia","id":3532},{"q":"Why is the family dysfunction explanation considered environmentally deterministic?","a":"It suggests schizophrenia is caused by family environment","t":"Schizophrenia","id":3533},{"q":"What is the nature-nurture position of the diathesis-stress model?","a":"Interactionist – both nature (diathesis) and nurture (stress) are involved","t":"Schizophrenia","id":3534},{"q":"Why are adoption studies useful for schizophrenia research?","a":"They separate the effects of genes (biological parents) from the environment (adoptive family)","t":"Schizophrenia","id":3535},{"q":"What did Kety et al. (1994) find?","a":"Biological relatives of adopted people with schizophrenia were more likely to have schizophrenia than adoptive relatives – supporting genetics","t":"Schizophrenia","id":3536},{"q":"What is an MZ twin reared apart study?","a":"A study of identical twins raised in different environments, used to separate genetic and environmental influences","t":"Schizophrenia","id":3537},{"q":"Why are few MZ twins reared apart available for study?","a":"It is rare for identical twins to be separated, so samples are small","t":"Schizophrenia","id":3538},{"q":"What is the difference between typical and atypical antipsychotics in treating negative symptoms?","a":"Typical antipsychotics mainly reduce positive symptoms; atypical ones may also improve negative symptoms","t":"Schizophrenia","id":3539},{"q":"Why may the success of antipsychotics support the dopamine hypothesis?","a":"They reduce dopamine activity and reduce symptoms","t":"Schizophrenia","id":3540},{"q":"Why might antipsychotics be only a partial treatment?","a":"They mainly reduce positive symptoms and don't address social functioning or psychological causes","t":"Schizophrenia","id":3541},{"q":"What is 'treatment-resistant schizophrenia'?","a":"Schizophrenia that doesn't improve with at least two different antipsychotics","t":"Schizophrenia","id":3542},{"q":"Which drug is recommended for treatment-resistant schizophrenia?","a":"Clozapine","t":"Schizophrenia","id":3543},{"q":"What did Leucht et al. (2012) find?","a":"A meta-analysis found antipsychotics significantly reduced relapse compared with placebos (27% vs 64% relapse after a year)","t":"Schizophrenia","id":3544},{"q":"What are the symptoms of schizophrenia that most affect daily functioning?","a":"Negative symptoms such as avolition and speech poverty","t":"Schizophrenia","id":3545},{"q":"Why are negative symptoms harder to treat?","a":"They are less responsive to typical antipsychotics and involve loss of motivation and function","t":"Schizophrenia","id":3546},{"q":"What is 'cognitive remediation'?","a":"Training to improve cognitive skills such as memory and attention in people with schizophrenia","t":"Schizophrenia","id":3547},{"q":"Why might cognitive explanations complement biological ones?","a":"Faulty thought processing could result from abnormal brain functioning, combining both levels","t":"Schizophrenia","id":3548},{"q":"What did Frith (1992) suggest about auditory hallucinations?","a":"They occur when a person fails to recognise their inner speech as their own, due to faulty metarepresentation","t":"Schizophrenia","id":3549},{"q":"What is 'insight' in schizophrenia?","a":"A person's awareness that they have a mental illness and that their experiences are symptoms","t":"Schizophrenia","id":3550},{"q":"Why is lack of insight a problem for treatment?","a":"Patients may not believe they are ill and may refuse medication or therapy","t":"Schizophrenia","id":3551},{"q":"Why might CBT be more effective when combined with drugs?","a":"Drugs reduce severe symptoms, allowing patients to engage in CBT to manage remaining symptoms","t":"Schizophrenia","id":3552},{"q":"What is a 'hierarchy of evidence' criticism of schizophrenia treatment research?","a":"Many trials are short-term with small samples, so long-term effectiveness is unclear","t":"Schizophrenia","id":3553},{"q":"What is a practical problem with conducting family therapy?","a":"It requires family members to attend sessions, which may not be possible for all","t":"Schizophrenia","id":3554},{"q":"Why is Fromm-Reichmann's theory seen as outdated?","a":"It was based on clinical impressions rather than systematic research and blamed mothers","t":"Schizophrenia","id":3555},{"q":"What is the 'schizogene'?","a":"Meehl's hypothetical single gene for schizophrenia; research now shows there is no single gene","t":"Schizophrenia","id":3556},{"q":"What evidence suggests urban living is linked to schizophrenia?","a":"Rates are higher in cities, possibly due to social stress, isolation or pollution","t":"Schizophrenia","id":3557},{"q":"What is the difference between sensitivity and specificity in diagnosis?","a":"Sensitivity is correctly identifying people with the disorder; specificity is correctly identifying those without it","t":"Schizophrenia","id":3558},{"q":"What is 'labelling' in schizophrenia?","a":"Being given a diagnosis can lead others to see the person only in terms of their illness, affecting their treatment and self-image","t":"Schizophrenia","id":3559},{"q":"Who carried out the 'On being sane in insane places' study?","a":"Rosenhan (1973)","t":"Schizophrenia","id":3560},{"q":"What did Rosenhan (1973) show?","a":"Healthy pseudo-patients who claimed to hear voices were admitted to psychiatric hospitals and diagnosed with schizophrenia, suggesting diagnosis lacked validity","t":"Schizophrenia","id":3561},{"q":"Why is Rosenhan's study now considered dated?","a":"Diagnostic systems (e.g. DSM-5) have been improved since 1973","t":"Schizophrenia","id":3562},{"q":"What is a 'prodromal phase'?","a":"The early phase before full symptoms appear, with mild changes such as social withdrawal","t":"Schizophrenia","id":3563},{"q":"Give an example of cultural difference in experiences of hearing voices.","a":"Luhrmann et al. (2015) found people in Ghana and India often experienced voices as positive, while Americans found them violent and threatening","t":"Schizophrenia","id":3564},{"q":"Why is Luhrmann's research important?","a":"It shows culture affects how symptoms are experienced and interpreted, supporting cultural bias concerns in diagnosis","t":"Schizophrenia","id":3565},{"q":"What does 'heritability of 79%' mean for schizophrenia?","a":"About 79% of the variation in schizophrenia risk in a population is due to genetic differences","t":"Schizophrenia","id":3566},{"q":"What is an economic implication of schizophrenia research?","a":"Effective treatment reduces hospital stays and allows people to work, saving money","t":"Schizophrenia","id":3567},{"q":"Why is it important to consider the patient's wishes in schizophrenia treatment?","a":"Treatment is more effective if the patient agrees with it and continues to engage","t":"Schizophrenia","id":3568},{"q":"What is the difference between initial attraction and relationship maintenance?","a":"Initial attraction explains why relationships start; maintenance explains why they continue","t":"Relationships","id":3569},{"q":"Why is self-disclosure linked to trust?","a":"Revealing personal information shows trust and invites the partner to reciprocate","t":"Relationships","id":3570},{"q":"What happens to self-disclosure as a relationship ends?","a":"Depth may stay high (e.g. revealing negative feelings) while breadth reduces","t":"Relationships","id":3571},{"q":"Why might men and women differ in self-disclosure?","a":"Research suggests women typically self-disclose more, possibly due to socialisation","t":"Relationships","id":3572},{"q":"Why might physical attractiveness be more important for men choosing partners?","a":"Evolutionary explanations suggest men value signs of youth and fertility","t":"Relationships","id":3573},{"q":"Why is filter theory said to lack temporal validity?","a":"It was developed in the 1960s, before online dating and changing social norms","t":"Relationships","id":3574},{"q":"What is 'social demography' in the context of online dating?","a":"Apps often still filter by location, age and background, so demographic factors remain important","t":"Relationships","id":3575},{"q":"Why might similarity in attitudes be more important early in a relationship?","a":"It makes early communication easier and gives a sense of validation","t":"Relationships","id":3576},{"q":"Why might complementarity become important later?","a":"As partners share more, meeting each other's needs becomes more important for long-term satisfaction","t":"Relationships","id":3577},{"q":"What does 'profit' mean in SET?","a":"Rewards minus costs","t":"Relationships","id":3578},{"q":"What is 'investment' in simple terms?","a":"Everything a person would lose if the relationship ended","t":"Relationships","id":3579},{"q":"Why is investment a strong predictor of staying?","a":"Leaving would mean losing things like a home, children and shared friends","t":"Relationships","id":3580},{"q":"Which theory would explain why someone leaves a relationship for a more rewarding partner?","a":"Social exchange theory (comparison level for alternatives)","t":"Relationships","id":3581},{"q":"Which theory would explain why a person who gives more than they receive feels resentful?","a":"Equity theory (under-benefiting)","t":"Relationships","id":3582},{"q":"What is the 'sunk cost' idea in relationships?","a":"Staying because of what has already been invested, even if the relationship is not satisfying","t":"Relationships","id":3583},{"q":"Why does Rusbult's model apply to abusive relationships?","a":"Victims may stay due to high investments and low alternatives, even with low satisfaction","t":"Relationships","id":3584},{"q":"Why might Duck's model be useful for counsellors?","a":"It helps identify which stage a couple is at and suggests appropriate interventions","t":"Relationships","id":3585},{"q":"How might partners in the intra-psychic phase be helped?","a":"Partners should focus on positive aspects of the relationship to improve it","t":"Relationships","id":3586},{"q":"Why might couples in the dyadic phase benefit from communication training?","a":"Arguments at this stage can be made more constructive to resolve problems","t":"Relationships","id":3587},{"q":"What is 'the absorption-addiction model' criticised for?","a":"It explains extreme cases but says little about typical parasocial relationships","t":"Relationships","id":3588},{"q":"Why might parasocial relationships increase during adolescence?","a":"Adolescents are forming identities and may seek role models outside their families","t":"Relationships","id":3589},{"q":"What is 'social comparison' in parasocial relationships?","a":"Comparing oneself to a celebrity, which can affect self-esteem and body image","t":"Relationships","id":3590},{"q":"How might online relationships affect self-disclosure breadth and depth?","a":"Online, depth may increase quickly while breadth may be narrower","t":"Relationships","id":3591},{"q":"What is 'social presence' online?","a":"The sense that another person is present in an interaction; lower social presence may reduce inhibition","t":"Relationships","id":3592},{"q":"Why might anonymity online be both positive and negative?","a":"It can encourage self-disclosure but also deception and disinhibited behaviour","t":"Relationships","id":3593},{"q":"What is a 'filter' in the context of online dating apps?","a":"Settings that allow users to select partners by criteria such as age, location or interests","t":"Relationships","id":3594},{"q":"Why might deception online be more common in dating than in friendships?","a":"People want to appear attractive to potential partners","t":"Relationships","id":3595},{"q":"What is 'reciprocity' in relationships?","a":"Mutual exchange – responding to a partner's behaviour in kind","t":"Relationships","id":3596},{"q":"Why is research into relationships often correlational?","a":"Relationships can't be manipulated experimentally for ethical and practical reasons","t":"Relationships","id":3597},{"q":"What is 'the similarity-attraction hypothesis'?","a":"We are attracted to people who are similar to us","t":"Relationships","id":3598},{"q":"Why might long-distance relationships challenge filter theory?","a":"Proximity (social demography) is not required for the relationship to form","t":"Relationships","id":3599},{"q":"What is meant by the 'grave-dressing' metaphor?","a":"Burying the relationship and 'tidying up' the story of its end","t":"Relationships","id":3600},{"q":"What is 'reputation management' in Duck's model?","a":"Presenting a version of the breakup that makes you look good to others","t":"Relationships","id":3601},{"q":"Why is the resurrection phase important?","a":"It allows people to learn from the relationship and move forward positively","t":"Relationships","id":3602},{"q":"How does equity theory explain why some people end relationships where they over-benefit?","a":"Over-benefiting causes guilt, which is uncomfortable","t":"Relationships","id":3603},{"q":"What is the key difference between Rusbult's and Thibaut and Kelley's theories?","a":"Rusbult focuses on commitment, including investment; Thibaut and Kelley focus on satisfaction via rewards and costs","t":"Relationships","id":3604},{"q":"Why might the hyperpersonal model explain 'whirlwind' online romances?","a":"Rapid, intense self-disclosure creates strong feelings of intimacy quickly","t":"Relationships","id":3605},{"q":"Why do dating apps rely on physical attractiveness?","a":"Photos are the first thing users see, so attractiveness strongly influences initial choices","t":"Relationships","id":3606},{"q":"Why might parasocial relationships be seen as a normal part of social development?","a":"Most are at the entertainment-social level and can provide models of behaviour and topics of conversation","t":"Relationships","id":3607},{"q":"Why is the Celebrity Attitude Scale limited?","a":"It is self-report, so answers may be affected by social desirability bias","t":"Relationships","id":3608},{"q":"What is the difference between a sign and a symptom?","a":"A sign is something objectively observed by a clinician; a symptom is something reported by the patient","t":"Schizophrenia","id":3609},{"q":"Why might negative symptoms be mistaken for depression?","a":"Avolition and speech poverty look similar to low mood and low energy in depression","t":"Schizophrenia","id":3610},{"q":"What is catatonia?","a":"A state of abnormal movement, e.g. staying still in odd positions or excessive, purposeless movement","t":"Schizophrenia","id":3611},{"q":"What is 'disorganised behaviour'?","a":"Behaviour that is unpredictable or inappropriate, e.g. laughing at sad news","t":"Schizophrenia","id":3612},{"q":"What is affective flattening?","a":"A reduction in emotional expression, e.g. a flat voice and expressionless face","t":"Schizophrenia","id":3613},{"q":"What is 'thought insertion'?","a":"The belief that thoughts are being put into one's mind by others","t":"Schizophrenia","id":3614},{"q":"What is 'thought broadcasting'?","a":"The belief that one's thoughts can be heard by others","t":"Schizophrenia","id":3615},{"q":"Why is schizophrenia considered a heterogeneous disorder?","a":"People with the same diagnosis can have very different symptoms","t":"Schizophrenia","id":3616},{"q":"What is the significance of 'no single cause' in schizophrenia?","a":"It supports the interactionist approach, as multiple factors contribute","t":"Schizophrenia","id":3617},{"q":"Why might the dopamine hypothesis not explain negative symptoms well?","a":"The original hypothesis focused on excess dopamine, but negative symptoms are linked to low dopamine in the cortex","t":"Schizophrenia","id":3618},{"q":"What does
