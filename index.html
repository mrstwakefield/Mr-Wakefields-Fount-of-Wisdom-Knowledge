ch based information.","t":"Biopsychology"},{"id":716,"q":"Where is Wernicke’s area and what does it do?","a":"Temporal lobe of left hemisphere. Understanding of language","t":"Biopsychology"},{"id":717,"q":"Where is Broca’s area and what does it do?","a":"Frontal lobe of left hemisphere. Speech production","t":"Biopsychology"},{"id":718,"q":"What was Peterson et al’s brain scan evidence for localisation of function, specifically language?","a":"Demonstrated that Wernicke’s area was active during a listening task whilst Broca’s area was active during a reading task – showing they are responsible for different functions.","t":"Biopsychology"},{"id":719,"q":"What was Tulving’s evidence showing memory may demonstrate localisation of function?","a":"Showed that long term memory is split and semantic and episodic memories are in different parts of the prefrontal cortex.","t":"Biopsychology"},{"id":720,"q":"Who found evidence against localisation of function? How?","a":"Lashley, Rats learning a maze could have up to half of their cortex removed (different parts) and could still learn the maze showing that learning isn’t happening in just one place – not localised","t":"Biopsychology"},{"id":721,"q":"What is the alternative theory to localisation of brain function?","a":"Holistic theory, equipotentiality","t":"Biopsychology"},{"id":722,"q":"What is a compromise between localisation of function and holistic theory of brain function?","a":"Some processes are more localised than others – more complex processes (like learning) involved multiple areas of the brain.","t":"Biopsychology"},{"id":723,"q":"What is brain plasticity?","a":"The brain’s tendency to change and adapt as a result of learning and experience","t":"Biopsychology"},{"id":724,"q":"What is functional recovery?","a":"A specific type of brain plasticity – occurs following a trauma","t":"Biopsychology"},{"id":725,"q":"What 3 processes be involved in functional recovery?","a":"Axonal sprouting, recruitment of homologous areas, reformation of blood supply","t":"Biopsychology"},{"id":726,"q":"What is the taxi driver evidence for plasticity?","a":"Maguire – significantly more grey matter in the posterior hippocampus of taxi drivers than a control group, an area important for spatial memory and navigational skills, result of use and training for ‘the knowledge’","t":"Biopsychology"},{"id":727,"q":"What is hemispheric lateralisation? Give an example.","a":"The idea that certain mental processes or behaviours are controlled or dominantly controlled by one hemisphere rather than the other. Language on the left, facial recognition on the right, right controls left side movement, left controls right side movement","t":"Biopsychology"},{"id":728,"q":"What is the corpus callosum?","a":"The band of neural fibres (white matter) that connects the left and right hemispheres of the brain.","t":"Biopsychology"},{"id":729,"q":"What has happened to a split brain patient?","a":"They have had their corpus callosum cut (commisurotomy), usually as a last resort for relieving severe epilepsy.","t":"Biopsychology"},{"id":730,"q":"What is the name of the set up used to experiment with split brain patients and how did it work?","a":"Tachistoscope – allowed visual stimuli to be presented to just one visual field of the split brain patient.","t":"Biopsychology"},{"id":731,"q":"If an image or word is presented to a split brain patient’s right visual field they can…","a":"Name it (verbally)","t":"Biopsychology"},{"id":732,"q":"If an image or word is presented to a split brain patient’s left visual field they can…","a":"Draw it or select a matching object from a selection (using their left hand)","t":"Biopsychology"},{"id":733,"q":"If a face is shown to a split brain patient’s left visual field…","a":"They can correctly choose the face from a selection","t":"Biopsychology"},{"id":734,"q":"If a face is shown to a split brain patient’s right visual field…","a":"They will struggle to identify it","t":"Biopsychology"},{"id":735,"q":"The problems with the split brain research are…","a":"Small sample, Different levels of severing, Varied time since surgery – possibility of some functional recovery? Artificial task – in real life patients can just make use of both eyes → exaggerating the differences","t":"Biopsychology"},{"id":736,"q":"What are the 4 ways of studying the brain that you should know?","a":"fMRI, post mortems, EEGs and ERPs","t":"Biopsychology"},{"id":737,"q":"What is an fMRI, what does it measure?","a":"Functional magnetic resonance imaging, Measures brain activity by detecting associated changes in blood flow","t":"Biopsychology"},{"id":738,"q":"What is an EEG, what does it measure?","a":"Electroencephalogram, Records the electrical activity of millions of neurons producing brain wave patterns that can be characteristic of specific states/behaviours e.g. stages of sleep","t":"Biopsychology"},{"id":739,"q":"What is an ERP, what does it measure?","a":"Event related potentials, Statistical averaging techniques used on EEGs to try and isolate specific responses of neurons to specific stimuli or tasks.","t":"Biopsychology"},{"id":740,"q":"How do we use post-mortems in psychology?","a":"Compare brains to ‘neuro-typical’ brains to identify differences and try to correlate these abnormalities to behaviours seen before death.","t":"Biopsychology"},{"id":741,"q":"What are circadian rhythms?","a":"Natural cycles that occur once every 24 hours","t":"Biopsychology"},{"id":742,"q":"Give an example of a circadian rhythm.","a":"Sleep-wake cycle, Body temperature","t":"Biopsychology"},{"id":743,"q":"What are infradian rhythms?","a":"Natural cycles that occur less than once every 24 hours (longer cycles)","t":"Biopsychology"},{"id":744,"q":"Give an example of an infradian rhythm.","a":"Menstrual cycle, Seasonal affective disorder","t":"Biopsychology"},{"id":745,"q":"What are ultradian rhythms?","a":"Natural cycles that occur more than once every 24 hours (short cycles)","t":"Biopsychology"},{"id":746,"q":"Give an example of an ultradian rhythm.","a":"Sleep cycle (stages of sleep)","t":"Biopsychology"},{"id":747,"q":"What are exogenous zeitgebers?","a":"External cues in the environment that entrain our endogenous rhythms","t":"Biopsychology"},{"id":748,"q":"What are endogenous pacemakers?","a":"Internal body clocks that regulate our biological rhythms","t":"Biopsychology"},{"id":749,"q":"What does ‘entrain’ mean in the context of biological rhythms?","a":"This is how external factors can be used to adjust our rhythms via our endogenous pacemakers","t":"Biopsychology"},{"id":750,"q":"Name the key exogenous zeitgebers for the sleep wake cycle.","a":"Light, social cues e.g. meal times, alarm clocks, working day","t":"Biopsychology"},{"id":751,"q":"Name the endogenous pacemaker thought to control our sleep-wake cycle.","a":"SCN – suprachiasmatic nucleus","t":"Biopsychology"},{"id":752,"q":"What is melatonin?","a":"Chemical produced by the pineal gland at night, required for sleep.","t":"Biopsychology"},{"id":753,"q":"How is melatonin production affected by light?","a":"(Blue) light inhibits the production of melatonin from the pineal gland, this maintains wakefulness. When (blue) light levels drop, melatonin can be produced inducing sleep.","t":"Biopsychology"},{"id":754,"q":"What support is there for the role of exogenous zeitgebers in controlling our circadian rhythms?","a":"Siffre, caves – absence of light → increasing the length of his circadian rhythm. Aschoff and Weaver, WWII bunker – absence of light → increasing length of circadian rhymts","t":"Biopsychology"},{"id":755,"q":"What is the major criticism of the studies into light effects on circadian rhythms (e.g. Siffre, Aschoff and Weaver)?","a":"The participants had access to artificial light, Czeisler showed that artificial light appears to reset biological rhythms","t":"Biopsychology"},{"id":756,"q":"What is the problem for circadian rhythms research caused by night owls and larks?","a":"There are individual differences in the natural preferences of individuals, mediated by genes like Per1, meaning that we are oversimplifying our models/explanations of circadian rhythms.","t":"Biopsychology"},{"id":757,"q":"What evidence is there that exogenous zeitgebers can affect infradian rhythms?","a":"Synchronising menstrual cycles (Stern and McClintock). Light therapy for treating SAD","t":"Biopsychology"},{"id":758,"q":"Who first found EEG evidence for the stages of sleep?","a":"Dement and Kleitman","t":"Biopsychology"},{"id":759,"q":"What is brain activity like in each stage of sleep (wave type/speed etc.)?","a":"1 – alpha waves, slower and more rhythmic than when awake, 2 – sleep spindles and theta waves 3&4 – Slow wave sleep - delta waves, slower waves with larger amplitude 5 – activity similar to when awake","t":"Biopsychology"},{"id":760,"q":"How easy is it to wake people in stages 1 to 4? What do we observe in stage 5?","a":"1 –, easy to wake people, 2 – easy to wake people, 3&4 – difficult to wake people, 5 – REM","t":"Biopsychology"},{"id":761,"q":"Which stage of sleep is correlated with dreaming?","a":"5 – Rapid Eye Movement (REM) sleep","t":"Biopsychology"},{"id":762,"q":"Give an example of a piece of idiographic research in Psychology.","a":"Little Hans (psychodynamic/gender), Case studies KF, CW, HM (memory), Genie (attachment)","t":"Issues and Debates part I"},{"id":763,"q":"Give an example of a concept we have studied that takes an extreme nature view.","a":"Bowlby – born programmed to form attachments, Genetic causes of disorders – OCD, Schizophrenia, Genetic markers for offending – MAOA/CDH13, Biological explanations for gender","t":"Issues and Debates part I"},{"id":764,"q":"Give an example of a concept we have studied that takes an extreme nurture view.","a":"Learning theory of attachment (conditioning), Acquisition and maintenance of phobias","t":"Issues and Debates part I"},{"id":765,"q":"Give an example of a nature-nurture interactionist concept we have studied.","a":"Diathesis-stress model for Schizophrenia, Depression, OCD, violent offending, Neural plasticity – experience changes our biology, Epigenetics – environmental experiences of parents alter DNA which can then be passed to children","t":"Issues and Debates part I"},{"id":766,"q":"Give an example of a concept we have studied that is very reductionist.","a":"Biological explanation/treatment of OCD, Behaviourist explanation/treatment of phobias, Computer analogies in the cognitive approach, Multi-store model of memory","t":"Issues and Debates part I"},{"id":767,"q":"Give an example of a concept we have studied that tries to be holistic.","a":"Humanistic approach & CCT","t":"Issues and Debates part I"},{"id":768,"q":"Give an example of a concept we have studied that is biologically deterministic.","a":"Genetic causes of OCD, Schizophrenia, Violent crime, gender linked to biological sex","t":"Issues and Debates part I"},{"id":769,"q":"Give an example of a concept we have studied that is environmentally deterministic.","a":"Acquisition and maintenance of phobias","t":"Issues and Debates part I"},{"id":770,"q":"Give an example of a concept we have studied that is psychically deterministic.","a":"Formation of personality through psychosexual stages (Freud), Acquisition of gender identify during phallic stage, Critical period for attachment linked to IWM and therefore later relationships. MDH linked to explaining criminality","t":"Issues and Debates part I"},{"id":771,"q":"Give an example of a concept we have studied that emphasises free will.","a":"Maslow’s hierarchy of needs – people are free agents to seek out the stages of the hierarchy.","t":"Issues and Debates part I"},{"id":772,"q":"Give an example of a concept we have studied that is softly deterministic.","a":"Cognitive approach – schemas built through experience but still have choice within these, SLT – motivation to perform learnt behaviour has element of choice","t":"Issues and Debates part I"},{"id":773,"q":"Give an example of alpha (gender) bias in a topic we have studied.","a":"Freud – women inferior to men due to weaker identification if phallic stage → weak superego, Attachment – Bowlby emphasis on mum being more important than dad","t":"Issues and Debates part I"},{"id":774,"q":"Give an example of beta (gender) bias in a topic we have studied.","a":"Fight or Flight – women tend and befriend. Milgram/Asch/Zimbardo etc. – only studied men, generalised to all","t":"Issues and Debates part I"},{"id":775,"q":"Give an example of some culturally biased research we have studied.","a":"Ainsworth’s strange situation – American values on parenting influenced the method and criteria for classification, not appropriate in collectivist or even other individualistic cultures.","t":"Issues and Debates part I"},{"id":776,"q":"Give an example of socially sensitive research that we have studied.","a":"Milgram – manipulation by giving orders, Schizophrenogenic mother – parent blaming","t":"Issues and Debates part I"},{"q":"When and where did Wundt open the first psychology lab?","a":"1879, Leipzig, Germany","t":"Approaches","id":1001},{"q":"What was structuralism?","a":"Wundt's approach of breaking down behaviour into its basic elements (e.g. sensations, images) through introspection","t":"Approaches","id":1002},{"q":"Why is Wundt important in psychology's history?","a":"He marked the separation of psychology from philosophy and made it an experimental science","t":"Approaches","id":1003},{"q":"Which approach replaced introspection in the early 20th century?","a":"The behaviourist approach (Watson, 1913)","t":"Approaches","id":1004},{"q":"Why did Watson reject introspection?","a":"It was subjective and unobservable, so it couldn't be studied scientifically","t":"Approaches","id":1005},{"q":"What does 'empirical' mean?","a":"Gaining knowledge through direct observation or experiment rather than reasoned argument","t":"Approaches","id":1006},{"q":"Which approach emerged in the 1950s with the development of computers?","a":"The cognitive approach","t":"Approaches","id":1007},{"q":"Which approach emerged in the 1980s with advances in technology?","a":"The biological approach (and cognitive neuroscience)","t":"Approaches","id":1008},{"q":"What is the tabula rasa?","a":"The idea that we are born as a 'blank slate', so behaviour is learned through experience","t":"Approaches","id":1009},{"q":"What is classical conditioning?","a":"Learning through association – a neutral stimulus becomes associated with an unconditioned stimulus so it produces the same response","t":"Approaches","id":1010},{"q":"What was the unconditioned stimulus in Pavlov's research?","a":"Food","t":"Approaches","id":1011},{"q":"What was the unconditioned response in Pavlov's research?","a":"Salivation to food","t":"Approaches","id":1012},{"q":"What was the neutral stimulus in Pavlov's research?","a":"A bell (or metronome)","t":"Approaches","id":1013},{"q":"What was the conditioned response in Pavlov's research?","a":"Salivation to the bell","t":"Approaches","id":1014},{"q":"What is spontaneous recovery?","a":"When a previously extinguished conditioned response suddenly reappears when the CS is presented again","t":"Approaches","id":1015},{"q":"What is discrimination in classical conditioning?","a":"Learning to respond only to the specific CS and not to similar stimuli","t":"Approaches","id":1016},{"q":"What is timing in classical conditioning?","a":"The NS needs to be presented at the same time as, or just before, the UCS for association to occur","t":"Approaches","id":1017},{"q":"What is operant conditioning?","a":"Learning through the consequences of behaviour (reinforcement and punishment)","t":"Approaches","id":1018},{"q":"What was the Skinner box?","a":"A box where animals (rats or pigeons) could press a lever to receive food or avoid a shock, allowing reinforcement to be studied","t":"Approaches","id":1019},{"q":"What did Skinner find with rats and food pellets?","a":"Rats pressed the lever more often when it delivered a food pellet – positive reinforcement","t":"Approaches","id":1020},{"q":"How did Skinner show negative reinforcement?","a":"Rats learned to press a lever to turn off an electric shock","t":"Approaches","id":1021},{"q":"What is the difference between negative reinforcement and punishment?","a":"Negative reinforcement increases behaviour by removing something unpleasant; punishment decreases behaviour with an unpleasant consequence","t":"Approaches","id":1022},{"q":"Give an example of positive reinforcement.","a":"Receiving praise from a teacher for answering a question","t":"Approaches","id":1023},{"q":"Give an example of negative reinforcement.","a":"Doing homework to avoid being told off","t":"Approaches","id":1024},{"q":"Give an example of punishment.","a":"Being given a detention for talking in class","t":"Approaches","id":1025},{"q":"What is a schedule of reinforcement?","a":"The rate and pattern at which a behaviour is reinforced (e.g. continuous, fixed ratio, variable ratio)","t":"Approaches","id":1026},{"q":"Which schedule of reinforcement is most resistant to extinction?","a":"Variable ratio (e.g. gambling)","t":"Approaches","id":1027},{"q":"What is behaviour shaping?","a":"Reinforcing behaviours that come closer and closer to the desired behaviour","t":"Approaches","id":1028},{"q":"Give a real-life application of operant conditioning.","a":"Token economies in prisons, behaviour charts in schools","t":"Approaches","id":1029},{"q":"Give a real-life application of classical conditioning.","a":"Systematic desensitisation and flooding for phobias; aversion therapy","t":"Approaches","id":1030},{"q":"Why does the behaviourist approach use animals?","a":"Behaviourists believe humans and animals learn in the same way, and it is more practical/ethical to test animals","t":"Approaches","id":1031},{"q":"What is environmental determinism?","a":"The idea that all behaviour is caused by previous experiences that have been conditioned","t":"Approaches","id":1032},{"q":"Why is the behaviourist approach mechanistic?","a":"It sees people as passive responders to stimuli, ignoring thought and emotion","t":"Approaches","id":1033},{"q":"Why is the behaviourist approach ethically problematic in its applications?","a":"Techniques like token economies can be seen as manipulative and remove people's autonomy","t":"Approaches","id":1034},{"q":"What is 'S-R' in behaviourism?","a":"Stimulus-response – behaviour is explained as a learned response to a stimulus","t":"Approaches","id":1035},{"q":"Who developed social learning theory?","a":"Albert Bandura","t":"Approaches","id":1036},{"q":"What is imitation in SLT?","a":"Copying the behaviour of others","t":"Approaches","id":1037},{"q":"What is identification in SLT?","a":"When an observer associates themselves with a role model and wants to be like them","t":"Approaches","id":1038},{"q":"What is modelling from the model's perspective?","a":"When a role model demonstrates a behaviour that may be imitated","t":"Approaches","id":1039},{"q":"What is modelling from the observer's perspective?","a":"Imitating the behaviour of a role model","t":"Approaches","id":1040},{"q":"Why are mediational processes called 'cognitive factors'?","a":"They occur between stimulus and response and involve thinking","t":"Approaches","id":1041},{"q":"What is attention (mediational process)?","a":"The extent to which we notice certain behaviours","t":"Approaches","id":1042},{"q":"What is retention (mediational process)?","a":"How well the behaviour is remembered","t":"Approaches","id":1043},{"q":"What is motor reproduction (mediational process)?","a":"Being physically able to perform the behaviour","t":"Approaches","id":1044},{"q":"What is motivation (mediational process)?","a":"The will to perform the behaviour, often determined by whether it was rewarded or punished","t":"Approaches","id":1045},{"q":"Which two mediational processes relate to learning a behaviour?","a":"Attention and retention","t":"Approaches","id":1046},{"q":"Which two mediational processes relate to performing a behaviour?","a":"Motor reproduction and motivation","t":"Approaches","id":1047},{"q":"What is reciprocal determinism?","a":"Bandura's idea that we are influenced by our environment but also exert an influence on it through our behaviour","t":"Approaches","id":1048},{"q":"How does reciprocal determinism make SLT less deterministic than behaviourism?","a":"It suggests some free will, as people can shape their environment","t":"Approaches","id":1049},{"q":"What did Bandura (1965) find about vicarious reinforcement?","a":"Children who saw a model rewarded for aggression were more aggressive than those who saw the model punished","t":"Approaches","id":1050},{"q":"Why can SLT explain cultural differences?","a":"Behaviour is learned from role models in a culture, so different cultures model different behaviours","t":"Approaches","id":1051},{"q":"Give a limitation of SLT in terms of cognitive factors.","a":"Bandura underestimated the influence of biological factors; also it is hard to measure mediational processes","t":"Approaches","id":1052},{"q":"What is a limitation of Bandura's research participants?","a":"Children may have been demand-led, as the Bobo doll is designed to be hit","t":"Approaches","id":1053},{"q":"Why is SLT considered a bridge between approaches?","a":"It combines behaviourism (reinforcement) with cognitive factors (mediational processes)","t":"Approaches","id":1054},{"q":"What are the main assumptions of the cognitive approach?","a":"Internal mental processes can and should be studied scientifically; the mind processes information like a computer; we can make inferences from behaviour","t":"Approaches","id":1055},{"q":"What are internal mental processes?","a":"Private operations of the mind, such as perception, memory, language and attention, that mediate between stimulus and response","t":"Approaches","id":1056},{"q":"What is a theoretical model in cognitive psychology?","a":"A simplified representation of mental processes based on current research, e.g. the working memory model","t":"Approaches","id":1057},{"q":"What is a computer model in cognitive psychology?","a":"The idea that mental processes work like a computer – input, processing, storage and output","t":"Approaches","id":1058},{"q":"Give an example of an information processing model.","a":"The multi-store model of memory","t":"Approaches","id":1059},{"q":"What is the role of inference in the cognitive approach?","a":"Psychologists draw conclusions about mental processes based on observed behaviour, as processes can't be seen directly","t":"Approaches","id":1060},{"q":"Give a strength of the cognitive approach relating to scientific methods.","a":"It uses objective, controlled lab experiments, which gives it scientific credibility","t":"Approaches","id":1061},{"q":"What is 'soft determinism' in the cognitive approach?","a":"The cognitive approach recognises that behaviour is limited by how we process information, but we are free to think before acting","t":"Approaches","id":1062},{"q":"What is machine reductionism?","a":"Comparing the human mind to a machine, ignoring the influence of emotion and motivation","t":"Approaches","id":1063},{"q":"Why is the cognitive approach said to lack ecological validity?","a":"It often uses artificial stimuli (e.g. word lists) in lab settings which don't represent everyday experience","t":"Approaches","id":1064},{"q":"Give an example of research in cognitive neuroscience.","a":"Tulving et al. (1994) used PET scans to show episodic memories are linked to the prefrontal cortex","t":"Approaches","id":1065},{"q":"What is a schema in the cognitive approach?","a":"A package of beliefs and expectations developed from experience that helps us organise and interpret information","t":"Approaches","id":1066},{"q":"What is a 'role schema'?","a":"A schema about how people in particular roles behave (e.g. doctors)","t":"Approaches","id":1067},{"q":"What is an 'event schema' (script)?","a":"A schema about the sequence of events in a familiar situation (e.g. going to a restaurant)","t":"Approaches","id":1068},{"q":"What is a 'self schema'?","a":"A schema containing knowledge about ourselves","t":"Approaches","id":1069},{"q":"Which cognitive neuroscience technique uses magnetic fields to measure blood flow?","a":"fMRI","t":"Approaches","id":1070},{"q":"What are the main assumptions of the biological approach?","a":"Everything psychological is at first biological; behaviour is influenced by genes, brain structures and neurochemistry; behaviour can be explained through evolution","t":"Approaches","id":1071},{"q":"What is neurochemistry?","a":"The chemicals in the brain that regulate psychological functioning, e.g. neurotransmitters","t":"Approaches","id":1072},{"q":"Give an example of neurochemistry influencing behaviour.","a":"Low serotonin has been linked to OCD and depression; high dopamine to schizophrenia","t":"Approaches","id":1073},{"q":"What is the role of the brain structure in the biological approach?","a":"Specific brain areas are linked to specific functions and behaviours","t":"Approaches","id":1074},{"q":"What is natural selection?","a":"Genetically determined behaviours that increase survival and reproduction are passed on to future generations","t":"Approaches","id":1075},{"q":"Give an example of an evolved behaviour.","a":"Attachment, fear of snakes, preference for sugary/fatty foods","t":"Approaches","id":1076},{"q":"Why is the biological approach said to be scientific?","a":"It uses objective methods such as brain scans, twin studies and drug trials which produce reliable data","t":"Approaches","id":1077},{"q":"Why is the biological approach said to be deterministic?","a":"It suggests behaviour is governed by internal causes (genes, brain chemistry) we cannot control","t":"Approaches","id":1078},{"q":"What is the problem with using correlational data in the biological approach?","a":"A link between, e.g., neurotransmitters and a disorder doesn't show which causes which","t":"Approaches","id":1079},{"q":"What is phenylketonuria (PKU) an example of?","a":"The interaction of genotype and environment – a genetic disorder whose effects (intellectual disability) can be prevented by a special diet","t":"Approaches","id":1080},{"q":"What is the difference between MZ and DZ twins?","a":"MZ (identical) share 100% of their genes; DZ (non-identical) share about 50%","t":"Approaches","id":1081},{"q":"Why are adoption studies useful?","a":"They separate genetic and environmental influences because the child shares genes with biological parents and environment with adoptive parents","t":"Approaches","id":1082},{"q":"What is Freud's approach called?","a":"The psychodynamic approach","t":"Approaches","id":1083},{"q":"What are the main assumptions of the psychodynamic approach?","a":"Behaviour is driven by the unconscious mind, personality has three parts, childhood experiences shape adult personality, defence mechanisms protect the ego","t":"Approaches","id":1084},{"q":"What is the unconscious according to Freud?","a":"The part of the mind we are unaware of, which contains repressed thoughts and drives and influences behaviour","t":"Approaches","id":1085},{"q":"What is the preconscious?","a":"Thoughts and memories not currently in awareness but that can be accessed, e.g. through dreams or slips of the tongue","t":"Approaches","id":1086},{"q":"How can the unconscious be accessed according to Freud?","a":"Through dream analysis, free association, and Freudian slips","t":"Approaches","id":1087},{"q":"What is a Freudian slip?","a":"A verbal mistake that reveals an unconscious thought or desire","t":"Approaches","id":1088},{"q":"What is the Id?","a":"The primitive part of the personality, present from birth, containing libido and operating on the pleasure principle – wanting immediate gratification","t":"Approaches","id":1089},{"q":"What is the ego?","a":"The 'reality check' that balances the demands of the id and superego, operating on the reality principle","t":"Approaches","id":1090},{"q":"What is the superego?","a":"The internalised sense of right and wrong, based on the morals of the same-sex parent; operates on the morality principle","t":"Approaches","id":1091},{"q":"What happens if the superego is too strong?","a":"The person may feel excessive guilt and anxiety","t":"Approaches","id":1092},{"q":"What happens if the id is too strong?","a":"The person may be selfish, impulsive and destructive","t":"Approaches","id":1093},{"q":"What is the role of defence mechanisms?","a":"Unconscious strategies the ego uses to manage conflict between the id and superego and reduce anxiety","t":"Approaches","id":1094},{"q":"Give an example of repression.","a":"A person who was abused in childhood has no conscious memory of it","t":"Approaches","id":1095},{"q":"Give an example of denial.","a":"An alcoholic refusing to accept they have a drinking problem","t":"Approaches","id":1096},{"q":"Give an example of displacement.","a":"Slamming a door after an argument with a boss","t":"Approaches","id":1097},{"q":"What is the oral stage?","a":"0–1 years; focus of pleasure is the mouth; conflict: weaning","t":"Approaches","id":1098},{"q":"What is an oral fixation?","a":"Adult behaviours such as smoking, nail-biting or sarcasm linked to unresolved conflict in the oral stage","t":"Approaches","id":1099},{"q":"What is the anal stage?","a":"1–3 years; focus of pleasure is the anus; conflict: potty training","t":"Approaches","id":1100},{"q":"What is an anal-retentive personality?","a":"Being perfectionist and obsessive, linked to harsh potty training","t":"Approaches","id":1101},{"q":"What is an anal-expulsive personality?","a":"Being thoughtless and messy, linked to lenient potty training","t":"Approaches","id":1102},{"q":"What is the phallic stage?","a":"3–5 years; focus of pleasure is the genital area; conflict: the Oedipus/Electra complex","t":"Approaches","id":1103},{"q":"What is the Electra complex?","a":"Girls experience penis envy, desire their father and blame their mother, then later identify with the mother","t":"Approaches","id":1104},{"q":"What is a phallic fixation?","a":"Narcissism, recklessness and possibly homosexuality (according to Freud)","t":"Approaches","id":1105},{"q":"What is the latency stage?","a":"From about 6 to puberty; earlier conflicts are repressed and libido is directed into other activities","t":"Approaches","id":1106},{"q":"What is the genital stage?","a":"From puberty; sexual desires become conscious and are directed at mature relationships","t":"Approaches","id":1107},{"q":"Which case study did Freud use to support the Oedipus complex?","a":"Little Hans – a boy with a fear of horses","t":"Approaches","id":1108},{"q":"What did Freud say caused Little Hans' fear of horses?","a":"The horse represented his father, and his fear was a displacement of castration anxiety","t":"Approaches","id":1109},{"q":"Give a strength of the psychodynamic approach.","a":"Explanatory power – it has been used to explain many behaviours and drew attention to childhood experiences; it led to psychoanalysis (the 'talking cure')","t":"Approaches","id":1110},{"q":"Give a limitation of the psychodynamic approach relating to falsifiability.","a":"Many concepts (e.g. the unconscious) can't be tested scientifically; Popper called it pseudoscience","t":"Approaches","id":1111},{"q":"What is psychic determinism?","a":"Freud's belief that all behaviour is caused by unconscious conflicts that we cannot control","t":"Approaches","id":1112},{"q":"Why is psychoanalysis sometimes seen as unsuitable for some clients?","a":"It is lengthy and expensive; it may not suit people with serious mental illness like schizophrenia","t":"Approaches","id":1113},{"q":"What are the main assumptions of humanistic psychology?","a":"People have free will, are motivated to self-actualise, the person should be studied as a whole, and psychology should be person-centred","t":"Approaches","id":1114},{"q":"Who were the two key figures in humanistic psychology?","a":"Abraham Maslow and Carl Rogers","t":"Approaches","id":1115},{"q":"What is free will in humanistic psychology?","a":"The idea that humans are self-determining and able to make significant personal choices","t":"Approaches","id":1116},{"q":"What is self-actualisation?","a":"The desire to grow psychologically and fulfil one's potential – becoming what you are capable of","t":"Approaches","id":1117},{"q":"What are the lower four levels of Maslow's hierarchy called?","a":"Deficiency needs","t":"Approaches","id":1118},{"q":"What is the top level of Maslow's hierarchy called?","a":"Growth needs (self-actualisation)","t":"Approaches","id":1119},{"q":"What is congruence?","a":"When the self-concept and ideal self are broadly equivalent, allowing personal growth","t":"Approaches","id":1120},{"q":"What is incongruence?","a":"When there is a large gap between the self-concept and ideal self, causing negative feelings of self-worth","t":"Approaches","id":1121},{"q":"What are conditions of worth?","a":"Conditions that a person feels they must meet to be accepted and loved (e.g. by parents)","t":"Approaches","id":1122},{"q":"How do conditions of worth cause problems?","a":"They lead to low self-esteem and incongruence, as the person believes they are only lovable if they meet these conditions","t":"Approaches","id":1123},{"q":"What is unconditional positive regard?","a":"Accepting and valuing a person completely without judgement or conditions","t":"Approaches","id":1124},{"q":"What does the humanistic approach say is needed for psychological growth?","a":"Unconditional positive regard and congruence","t":"Approaches","id":1125},{"q":"What is client-centred therapy also called?","a":"Person-centred therapy (Rogerian therapy)","t":"Approaches","id":1126},{"q":"What three qualities should a client-centred therapist show?","a":"Genuineness (congruence), Empathy, Unconditional positive regard","t":"Approaches","id":1127},{"q":"Why do humanistic psychologists call the person seeking help a 'client'?","a":"To emphasise equality and that the person is an expert on themselves, not a 'patient'","t":"Approaches","id":1128},{"q":"Why is the humanistic approach described as anti-reductionist?","a":"It sees the person as a whole (holism) rather than reducing behaviour to components","t":"Approaches","id":1129},{"q":"Why is the humanistic approach culturally biased?","a":"Concepts like self-actualisation and personal growth reflect individualist Western values","t":"Approaches","id":1130},{"q":"Why is the humanistic approach difficult to test?","a":"Concepts such as self-actualisation are vague and hard to measure","t":"Approaches","id":1131},{"q":"What is counselling?","a":"A talking therapy based on humanistic principles, now widely used in schools and workplaces","t":"Approaches","id":1132},{"q":"What is the main method used by the humanistic approach?","a":"Qualitative methods, e.g. unstructured interviews and case studies (idiographic)","t":"Approaches","id":1133},{"q":"Why is the humanistic approach seen as a 'positive' approach?","a":"It focuses on healthy growth and people's potential, rather than on problems and pathology","t":"Approaches","id":1134},{"q":"Compare the behaviourist and humanistic approaches on free will.","a":"Behaviourism is hard determinist (behaviour is caused by conditioning); humanism argues people have free will","t":"Approaches","id":1135},{"q":"Compare the biological and psychodynamic approaches on nature/nurture.","a":"Biological – mainly nature; psychodynamic – both (innate drives plus childhood experiences)","t":"Approaches","id":1136},{"q":"Compare the cognitive and biological approaches on reductionism.","a":"Both are reductionist – cognitive reduces behaviour to information processing (machine reductionism), biological to genes and neurotransmitters","t":"Approaches","id":1137},{"q":"Compare the approaches on their use of the scientific method.","a":"Behaviourist, cognitive and biological use scientific methods; psychodynamic and humanistic use case studies and are less scientific","t":"Approaches","id":1138},{"q":"Which approach is most idiographic?","a":"Humanistic (also psychodynamic)","t":"Approaches","id":1139},{"q":"Which approaches are most nomothetic?","a":"Behaviourist, cognitive and biological","t":"Approaches","id":1140},{"q":"Which approaches are hard determinist?","a":"Behaviourist, biological and psychodynamic","t":"Approaches","id":1141},{"q":"Which approach is soft determinist?","a":"Cognitive (and SLT through reciprocal determinism)","t":"Approaches","id":1142},{"q":"Which approach sees behaviour as determined by the unconscious?","a":"Psychodynamic","t":"Approaches","id":1143},{"q":"Which approach has led to token economies?","a":"Behaviourist","t":"Approaches","id":1144},{"q":"Which approach has led to CBT?","a":"Cognitive","t":"Approaches","id":1145},{"q":"Which approach has led to drug therapies?","a":"Biological","t":"Approaches","id":1146},{"q":"Which approach has led to psychoanalysis?","a":"Psychodynamic","t":"Approaches","id":1147},{"q":"Which approach has led to counselling/client-centred therapy?","a":"Humanistic","t":"Approaches","id":1148},{"q":"What does 'eclectic' mean in psychology?","a":"Combining ideas and methods from different approaches to explain or treat behaviour","t":"Approaches","id":1149},{"q":"What is the diathesis-stress model an example of?","a":"An interactionist approach combining biological and environmental factors","t":"Approaches","id":1150},{"q":"Why might an eclectic approach be better than using one approach?","a":"Behaviour is complex; combining approaches can give a fuller explanation and more effective treatment","t":"Approaches","id":1151},{"q":"Why did Freud's use of case studies limit generalisation?","a":"He studied a small number of mostly middle-class Viennese women (and Little Hans), so findings may not apply widely","t":"Approaches","id":1152},{"q":"What is an 'approach' in psychology?","a":"A perspective that involves certain assumptions about human behaviour and how it should be studied","t":"Approaches","id":1153},{"q":"What is the difference between an approach and a theory?","a":"An approach is a broad perspective with shared assumptions; a theory is a specific explanation of a behaviour within an approach","t":"Approaches","id":1154},{"q":"Give an example of a debate between the behaviourist and cognitive approaches.","a":"Behaviourists say mental processes can't be studied; cognitive psychologists say they can be inferred from behaviour","t":"Approaches","id":1155},{"q":"What did Tolman's research on rats in mazes show?","a":"Rats developed a 'cognitive map' of the maze, suggesting mental processes influence learning – a challenge to strict behaviourism","t":"Approaches","id":1156},{"q":"Why does the biological approach struggle to explain behaviours such as conformity?","a":"They are heavily influenced by social context, which biological explanations may ignore","t":"Approaches","id":1157},{"q":"What is a genotype?","a":"A person's actual genetic make-up","t":"Approaches","id":1158},{"q":"What is a phenotype?","a":"The way genes are expressed through physical, behavioural and psychological characteristics, influenced by environment","t":"Approaches","id":1159},{"q":"Why can MZ twins have different phenotypes?","a":"The environment affects how genes are expressed, so identical twins may differ in characteristics","t":"Approaches","id":1160},{"q":"What is evolution in the biological approach?","a":"The process by which characteristics that aid survival and reproduction are passed on and become more common over generations","t":"Approaches","id":1161},{"q":"Who proposed the theory of natural selection?","a":"Charles Darwin","t":"Approaches","id":1162},{"q":"What does 'inference' mean in the cognitive approach?","a":"Drawing conclusions about mental processes based on observable behaviour","t":"Approaches","id":1163},{"q":"Why is the cognitive approach seen as a 'soft' science by some?","a":"It relies on inference, so mental processes can't be observed directly","t":"Approaches","id":1164},{"q":"What is the difference between the cognitive and behaviourist approaches on internal processes?","a":"Behaviourists ignore them as unobservable; cognitive psychologists study them through inference","t":"Approaches","id":1165},{"q":"What is a schema's 'downside'?","a":"Schemas can distort information, leading to errors such as stereotyping or false memories","t":"Approaches","id":1166},{"q":"Give an example of a schema distorting memory.","a":"Bartlett's (1932) War of the Ghosts – participants changed an unfamiliar story to fit their own cultural schemas","t":"Approaches","id":1167},{"q":"What does Bartlett's War of the Ghosts study show?","a":"Memory is reconstructive – people reshape unfamiliar information to fit their existing schemas","t":"Approaches","id":1168},{"q":"What is the main aim of the behaviourist approach?","a":"To study observable behaviour scientifically and explain it through learning","t":"Approaches","id":1169},{"q":"Why did behaviourists use controlled lab experiments?","a":"To control variables and establish cause and effect","t":"Approaches","id":1170},{"q":"What is a key strength of the behaviourist approach?","a":"It is scientific and has led to effective real-world applications (e.g. token economies, SD)","t":"Approaches","id":1171},{"q":"What is a key strength of social learning theory?","a":"It explains cultural differences in behaviour and includes cognitive factors, so it is more complete than behaviourism","t":"Approaches","id":1172},{"q":"What is a key strength of the cognitive approach?","a":"It is scientific and has many applications, e.g. CBT and artificial intelligence","t":"Approaches","id":1173},{"q":"What is a key strength of the biological approach?","a":"It is scientific and has led to effective treatments, e.g. drug therapy","t":"Approaches","id":1174},{"q":"What is a key strength of the psychodynamic approach?","a":"It highlights the importance of childhood and the unconscious, and led to talking therapies","t":"Approaches","id":1175},{"q":"What is a key strength of humanistic psychology?","a":"It is positive and has led to counselling, which is widely used","t":"Approaches","id":1176},{"q":"What is a key limitation of the humanistic approach?","a":"It is untestable and culturally biased towards individualist values","t":"Approaches","id":1177},{"q":"What is a key limitation of the psychodynamic approach?","a":"It is unfalsifiable and based on case studies of unusual individuals","t":"Approaches","id":1178},{"q":"What is a key limitation of the biological approach?","a":"It is reductionist and deterministic, and often relies on correlational evidence","t":"Approaches","id":1179},{"q":"What is a key limitation of the cognitive approach?","a":"It uses machine reductionism and artificial tasks, lacking ecological validity","t":"Approaches","id":1180},{"q":"What is a key limitation of social learning theory?","a":"It relies heavily on lab studies (e.g. Bobo doll) and underestimates biological influences","t":"Approaches","id":1181},{"q":"What is a key limitation of the behaviourist approach?","a":"It ignores free will and cognition and is based on animal research","t":"Approaches","id":1182},{"q":"Compare the behaviourist and cognitive approaches on methodology.","a":"Both use lab experiments and value scientific methods","t":"Approaches","id":1183},{"q":"Compare the humanistic and psychodynamic approaches on free will.","a":"Humanistic argues for free will; psychodynamic says behaviour is determined by unconscious forces","t":"Approaches","id":1184},{"q":"Compare the psychodynamic and humanistic approaches on methods.","a":"Both use qualitative, idiographic methods such as case studies","t":"Approaches","id":1185},{"q":"Compare the biological and behaviourist approaches on nature/nurture.","a":"Biological emphasises nature; behaviourist emphasises nurture","t":"Approaches","id":1186},{"q":"Which approach sees humans as having an innate drive towards growth?","a":"The humanistic approach","t":"Approaches","id":1187},{"q":"Which approach would explain aggression through imitation of role models?","a":"Social learning theory","t":"Approaches","id":1188},{"q":"Which approach would explain aggression through high testosterone?","a":"The biological approach","t":"Approaches","id":1189},{"q":"Which approach would explain aggression through displacement of repressed feelings?","a":"The psychodynamic approach","t":"Approaches","id":1190},{"q":"Which approach would explain aggression through hostile attribution bias?","a":"The cognitive approach","t":"Approaches","id":1191},{"q":"Which approach would explain aggression through reinforcement?","a":"The behaviourist approach","t":"Approaches","id":1192},{"q":"Define attachment.","a":"A strong, enduring, reciprocal emotional bond between two people, especially an infant and caregiver, that serves to ensure the infant's survival","t":"Attachment","id":1193},{"q":"Give three behaviours that show an attachment has formed.","a":"Proximity seeking, Separation anxiety, Stranger anxiety, Secure base behaviour","t":"Attachment","id":1194},{"q":"What is proximity seeking?","a":"The infant tries to stay physically close to the attachment figure","t":"Attachment","id":1195},{"q":"What is separation anxiety?","a":"Distress shown when the attachment figure leaves","t":"Attachment","id":1196},{"q":"What is stranger anxiety?","a":"Distress shown when approached by an unfamiliar person","t":"Attachment","id":1197},{"q":"What is secure base behaviour?","a":"The infant uses the attachment figure as a safe base from which to explore, regularly returning to them","t":"Attachment","id":1198},{"q":"Why do psychologists use animal studies of attachment?","a":"Ethical and practical reasons – some procedures (e.g. separation from mothers) cannot be done with human infants","t":"Attachment","id":1199},{"q":"Which two animal studies of attachment are on the specification?","a":"Lorenz (1935) and Harlow (1958)","t":"Attachment","id":1200},{"q":"What animal did Lorenz study?","a":"Geese (goslings)","t":"Attachment","id":1201},{"q":"Describe Lorenz's procedure.","a":"He divided a clutch of goose eggs; half hatched with the mother, half in an incubator where Lorenz was the first moving object they saw","t":"Attachment","id":1202},{"q":"What were Lorenz's findings?","a":"The incubator group followed Lorenz everywhere, and the control group followed their mother; when mixed, each group went back to its own 'parent'","t":"Attachment","id":1203},{"q":"What is imprinting?","a":"A process where young animals follow and attach to the first large moving object they see after birth","t":"Attachment","id":1204},{"q":"What is the critical period for imprinting according to Lorenz?","a":"A few hours after hatching; if imprinting doesn't happen then, it will not happen","t":"Attachment","id":1205},{"q":"What is sexual imprinting?","a":"When an animal acquires a template of the characteristics of a desirable mate from the object it imprinted on","t":"Attachment","id":1206},{"q":"Give an example of sexual imprinting from Lorenz.","a":"A peacock raised in a reptile house tried to mate with giant tortoises","t":"Attachment","id":1207},{"q":"Give a limitation of generalising Lorenz's findings.","a":"Birds are very different from humans (e.g. mammals show more emotional attachment), so findings may not apply to humans","t":"Attachment","id":1208},{"q":"What did Guiton (1966) find that challenges Lorenz?","a":"Chickens imprinted on yellow washing-up gloves tried to mate with them, but later learned to mate with other chickens – imprinting is not as permanent as Lorenz thought","t":"Attachment","id":1209},{"q":"Give a strength of Lorenz's research.","a":"It supports the idea of a critical period and influenced Bowlby's theory of human attachment","t":"Attachment","id":1210},{"q":"What animal did Harlow study?","a":"Rhesus monkeys","t":"Attachment","id":1211},{"q":"Describe Harlow's (1958) procedure.","a":"16 baby monkeys were reared with two wire model 'mothers' – one plain wire, one cloth-covered; in some conditions the wire mother dispensed milk, in others the cloth mother did","t":"Attachment","id":1212},{"q":"What were Harlow's findings?","a":"The monkeys preferred the cloth mother regardless of which gave milk; they clung to her when frightened","t":"Attachment","id":1213},{"q":"What does Harlow's research show about attachment?","a":"Contact comfort is more important than food in attachment formation","t":"Attachment","id":1214},{"q":"What happened to Harlow's monkeys as adults?","a":"They were more aggressive, less sociable, bred less often, and were poor mothers – some neglected or killed their babies","t":"Attachment","id":1215},{"q":"What was the critical period for monkeys according to Harlow?","a":"90 days – after this attachment could not form and damage was irreversible","t":"Attachment","id":1216},{"q":"Give a strength of Harlow's research.","a":"It has real-world value, e.g. it has helped social workers understand risk factors in child neglect and abuse; it informs care of zoo/farm animals","t":"Attachment","id":1217},{"q":"Give an ethical issue with Harlow's research.","a":"The monkeys suffered severe, long-term psychological harm","t":"Attachment","id":1218},{"q":"How has Harlow's research been defended ethically?","a":"The findings were important for understanding human attachment and neglect","t":"Attachment","id":1219},{"q":"Why can Harlow's findings be generalised to humans more than Lorenz's?","a":"Monkeys are mammals and more similar to humans than birds","t":"Attachment","id":1220},{"q":"Give a limitation of generalising from Harlow's research.","a":"Monkeys are still different from humans, e.g. in cognition and culture","t":"Attachment","id":1221},{"q":"What confounding variable was there in Harlow's study?","a":"The two wire mothers had different heads, so preference may be due to the head rather than the cloth","t":"Attachment","id":1222},{"q":"What does learning theory say about attachment?","a":"Attachment is learned through classical and operant conditioning, especially through association with food","t":"Attachment","id":1223},{"q":"Which approach does learning theory of attachment come from?","a":"The behaviourist approach","t":"Attachment","id":1224},{"q":"Who proposed learning theory of attachment?","a":"Dollard and Miller (1950)","t":"Attachment","id":1225},{"q":"What is the unconditioned stimulus in classical conditioning of attachment?","a":"Food","t":"Attachment","id":1226},{"q":"What is the unconditioned response in classical conditioning of attachment?","a":"Pleasure","t":"Attachment","id":1227},{"q":"What is the neutral stimulus in classical conditioning of attachment?","a":"The caregiver (before conditioning)","t":"Attachment","id":1228},{"q":"What is the conditioned stimulus in classical conditioning of attachment?","a":"The caregiver","t":"Attachment","id":1229},{"q":"What is the conditioned response in classical conditioning of attachment?","a":"Pleasure (an attachment has formed)","t":"Attachment","id":1230},{"q":"How does negative reinforcement explain attachment?","a":"A hungry baby cries; being fed removes the discomfort of hunger, so crying is reinforced","t":"Attachment","id":1231},{"q":"How does positive reinforcement of the caregiver explain attachment?","a":"The caregiver is reinforced because the baby stops crying (escape from an unpleasant stimulus), so attachment is a two-way process","t":"Attachment","id":1232},{"q":"What is a primary drive?","a":"An innate biological motivation, e.g. hunger","t":"Attachment","id":1233},{"q":"What is a secondary drive?","a":"A drive learned by association with a primary drive, e.g. attachment","t":"Attachment","id":1234},{"q":"How does drive reduction theory explain attachment?","a":"The caregiver becomes associated with reducing the primary drive of hunger, so attachment becomes a secondary drive","t":"Attachment","id":1235},{"q":"Give research evidence against learning theory of attachment.","a":"Harlow – monkeys attached to the cloth mother that did not provide food; Schaffer and Emerson – many babies attached to mothers who did not feed them","t":"Attachment","id":1236},{"q":"Give another limitation of learning theory of attachment.","a":"It is based on animal research (e.g. Skinner's rats) which may not generalise to humans; it ignores other factors such as interactional synchrony","t":"Attachment","id":1237},{"q":"Give a counterpoint in support of learning theory.","a":"Social learning theory elements may still matter, e.g. parents model affection and reward attachment behaviours","t":"Attachment","id":1238},{"q":"Who proposed the monotropic theory of attachment?","a":"John Bowlby (1969)","t":"Attachment","id":1239},{"q":"Is Bowlby's monotropic theory a nature or nurture explanation?","a":"Nature – attachment is innate and evolved to aid survival","t":"Attachment","id":1240},{"q":"What is monotropy?","a":"The idea that the infant forms one special attachment, usually with the mother, which is more important than any other","t":"Attachment","id":1241},{"q":"What are the two laws Bowlby proposed about monotropy?","a":"The law of continuity, The law of accumulated separation","t":"Attachment","id":1242},{"q":"What is the law of continuity?","a":"The more constant and predictable a child's care, the better the quality of their attachment","t":"Attachment","id":1243},{"q":"What is the law of accumulated separation?","a":"The effects of every separation from the mother add up, so the safest dose is zero","t":"Attachment","id":1244},{"q":"What are social releasers?","a":"Innate 'cute' behaviours (e.g. smiling, crying, cooing) that encourage attention from adults and activate their attachment system","t":"Attachment","id":1245},{"q":"What is the critical period according to Bowlby?","a":"About 2 years (the first 6 months to 2 years); if an attachment is not formed by then it will be hard to form one later","t":"Attachment","id":1246},{"q":"What did Bowlby later call the critical period?","a":"A sensitive period – attachments can form later but it is harder","t":"Attachment","id":1247},{"q":"What is an internal working model?","a":"A mental representation of the child's relationship with their primary attachment figure that acts as a template for future relationships","t":"Attachment","id":1248},{"q":"How does an internal working model affect later relationships?","a":"A child with a loving relationship expects future relationships to be loving; a child with poor attachment may expect relationships to be difficult","t":"Attachment","id":1249},{"q":"What is the continuity hypothesis?","a":"The idea that the quality of early attachments predicts the quality of later relationships","t":"Attachment","id":1250},{"q":"Give research support for social releasers.","a":"Brazelton et al. (1975) found that when primary attachment figures ignored babies' social releasers, the babies became distressed and some lay motionless","t":"Attachment","id":1251},{"q":"Give research support for the internal working model.","a":"Bailey et al. (2007) found mothers with poor attachments to their own parents were more likely to have poorly attached babies","t":"Attachment","id":1252},{"q":"Give a limitation of monotropy.","a":"Schaffer and Emerson (1964) found many babies formed multiple attachments at the same time; the first attachment was not always with the mother","t":"Attachment","id":1253},{"q":"Why is monotropy socially sensitive?","a":"It suggests mothers are responsible for their child's development and should not return to work, which could cause guilt","t":"Attachment","id":1254},{"q":"Give a limitation of the internal working model idea.","a":"Other factors, such as temperament, may explain continuity between early attachment and later relationships","t":"Attachment","id":1255},{"q":"Who emphasised temperament as an alternative to Bowlby?","a":"Kagan (1982) – innate temperament may affect attachment","t":"Attachment","id":1256},{"q":"Why is Bowlby's theory hard to test?","a":"Concepts like internal working models are unconscious and hard to measure scientifically","t":"Attachment","id":1257},{"q":"Who developed the Strange Situation?","a":"Mary Ainsworth (1970)","t":"Attachment","id":1258},{"q":"What is the aim of the Strange Situation?","a":"To measure the quality of attachment between a 12–18-month-old infant and their caregiver","t":"Attachment","id":1259},{"q":"What age are infants tested in the Strange Situation?","a":"12–18 months (9–18 months in the original)","t":"Attachment","id":1260},{"q":"Where did the Strange Situation take place?","a":"A controlled observation in a lab playroom (a room with a two-way mirror)","t":"Attachment","id":1261},{"q":"How many episodes are in the Strange Situation?","a":"8 episodes (each lasting about 3 minutes)","t":"Attachment","id":1262},{"q":"What are the five behaviours measured in the Strange Situation?","a":"Proximity seeking, Exploration and secure base behaviour, Stranger anxiety, Separation anxiety, Response to reunion","t":"Attachment","id":1263},{"q":"What was the sample in Ainsworth's original study?","a":"About 100 middle-class American infants and their mothers","t":"Attachment","id":1264},{"q":"What percentage of Ainsworth's sample were secure?","a":"About 66% (Type B)","t":"Attachment","id":1265},{"q":"What percentage were insecure-avoidant?","a":"About 22% (Type A)","t":"Attachment","id":1266},{"q":"What percentage were insecure-resistant?","a":"About 12% (Type C)","t":"Attachment","id":1267},{"q":"Describe secure attachment (Type B) behaviour.","a":"Explore happily and use caregiver as a secure base, moderate separation and stranger anxiety, seek and are easily comforted by caregiver on reunion","t":"Attachment","id":1268},{"q":"Describe insecure-avoidant attachment (Type A) behaviour.","a":"Explore freely but don't seek proximity, little or no separation or stranger anxiety, little response on reunion","t":"Attachment","id":1269},{"q":"Describe insecure-resistant attachment (Type C) behaviour.","a":"Seek greater proximity and explore less, high stranger and separation anxiety, resist comfort on reunion","t":"Attachment","id":1270},{"q":"What did Main and Solomon (1986) add as a fourth attachment type?","a":"Disorganised attachment (Type D) – a mixture of avoidant and resistant behaviours","t":"Attachment","id":1271},{"q":"Give a strength of the Strange Situation in terms of reliability.","a":"High inter-observer reliability – Bick et al. (2012) found 94% agreement between observers","t":"Attachment","id":1272},{"q":"Give a limitation of the Strange Situation in terms of culture.","a":"It may be culture-bound: behaviour such as separation anxiety means different things in different cultures (e.g. Japanese infants rarely separated from mothers)","t":"Attachment","id":1273},{"q":"What is meant by a 'culture-bound' test?","a":"A test that only has meaning in the culture in which it was developed","t":"Attachment","id":1274},{"q":"Give a limitation of the Strange Situation linked to temperament.","a":"The infant's behaviour may reflect innate temperament (Kagan) rather than the quality of attachment","t":"Attachment","id":1275},{"q":"Give a strength of the Strange Situation relating to validity.","a":"Predictive validity – secure attachment predicts better outcomes, e.g. better mental health and relationships (McCormick et al., 2016)","t":"Attachment","id":1276},{"q":"Why might the Strange Situation lack ecological validity?","a":"It is a controlled lab situation that may not reflect how a child behaves at home","t":"Attachment","id":1277},{"q":"What does 'cultural variations' mean in attachment?","a":"Differences in norms and values between cultures that may affect attachment types","t":"Attachment","id":1278},{"q":"Who carried out a meta-analysis of Strange Situation studies across cultures?","a":"Van Ijzendoorn and Kroonenberg (1988)","t":"Attachment","id":1279},{"q":"How many studies and countries were in van Ijzendoorn and Kroonenberg's meta-analysis?","a":"32 studies from 8 countries (1,990 children)","t":"Attachment","id":1280},{"q":"What was the most common attachment type across cultures in van Ijzendoorn and Kroonenberg's study?","a":"Secure attachment","t":"Attachment","id":1281},{"q":"Which country had the highest proportion of secure attachment?","a":"Great Britain (about 75%)","t":"Attachment","id":1282},{"q":"Which country had the lowest proportion of secure attachment?","a":"China (about 50%)","t":"Attachment","id":1283},{"q":"Which country had the highest proportion of insecure-resistant attachment?","a":"Israel (about 29%)","t":"Attachment","id":1284},{"q":"Which country had the highest proportion of insecure-avoidant attachment?","a":"Germany (about 35%)","t":"Attachment","id":1285},{"q":"What did van Ijzendoorn and Kroonenberg find about variation within cultures?","a":"Variation within cultures was 1.5 times greater than variation between cultures","t":"Attachment","id":1286},{"q":"What does the finding that secure attachment was most common suggest?","a":"Attachment may be universal and innate, supporting Bowlby","t":"Attachment","id":1287},{"q":"Why was insecure-avoidant attachment higher in Germany?","a":"German culture values independence, so infants are encouraged not to be clingy","t":"Attachment","id":1288},{"q":"Why was insecure-resistant attachment higher in Israel/Japan?","a":"Infants were rarely separated from mothers, so the separation stage was very distressing","t":"Attachment","id":1289},{"q":"Why is the meta-analysis a limitation for cultural variation research?","a":"Countries are not the same as cultures – there are many subcultures within a country","t":"Attachment","id":1290},{"q":"What did van Ijzendoorn and Sagi (2001) find about Tokyo?","a":"Urban Tokyo had similar distributions to Western studies, but rural Japan had more resistant infants – showing subcultural differences","t":"Attachment","id":1291},{"q":"What is an imposed etic?","a":"Using a technique developed in one culture to study another, assuming it has the same meaning","t":"Attachment","id":1292},{"q":"Why is the Strange Situation an imposed etic?","a":"It was developed in the USA and reflects American ideas about attachment, e.g. that independence is healthy","t":"Attachment","id":1293},{"q":"Give a strength of van Ijzendoorn's meta-analysis.","a":"Large sample size increases internal validity and reduces the impact of anomalous results","t":"Attachment","id":1294},{"q":"Give a limitation of van Ijzendoorn's meta-analysis in terms of balance.","a":"Unbalanced samples – 18 of the 32 studies were from the USA; only one from China","t":"Attachment","id":1295},{"q":"What did Simonella et al. (2014) find in Italy?","a":"50% secure and 36% insecure-avoidant, lower secure rates than before – possibly because more mothers work full time","t":"Attachment","id":1296},{"q":"What did Jin et al. (2012) find in Korea?","a":"Similar proportions of secure and insecure attachment to Western studies, but more resistant than avoidant – similar to Japan","t":"Attachment","id":1297},{"q":"What is maternal deprivation?","a":"The emotional and intellectual consequences of separation between a child and their mother","t":"Attachment","id":1298},{"q":"Who proposed the theory of maternal deprivation?","a":"John Bowlby (1951)","t":"Attachment","id":1299},{"q":"What is the difference between separation and deprivation?","a":"Separation is the child not being in the presence of the caregiver; deprivation is losing emotional care as a result of separation","t":"Attachment","id":1300},{"q":"What is the critical period in maternal deprivation theory?","a":"The first 30 months (2½ years) of life","t":"Attachment","id":1301},{"q":"What are the intellectual consequences of maternal deprivation?","a":"Delayed intellectual development, e.g. low IQ (Goldfarb, 1947)","t":"Attachment","id":1302},{"q":"What did Goldfarb (1947) find?","a":"Orphans who stayed in an institution had lower IQ than those fostered, supporting intellectual effects of deprivation","t":"Attachment","id":1303},{"q":"What are the emotional consequences of maternal deprivation?","a":"Affectionless psychopathy – lack of guilt, empathy and strong emotion","t":"Attachment","id":1304},{"q":"What is affectionless psychopathy?","a":"An inability to experience guilt or strong emotions for others, preventing normal relationships and linked to criminality","t":"Attachment","id":1305},{"q":"Describe the sample of Bowlby's 44 thieves study.","a":"44 teenagers accused of stealing, and a control group of 44 non-thieves with emotional problems","t":"Attachment","id":1306},{"q":"What did Bowlby find in the 44 thieves study?","a":"14 of the 44 thieves were affectionless psychopaths; 12 of those 14 had experienced prolonged early separation from their mothers","t":"Attachment","id":1307},{"q":"What proportion of the control group had experienced early separation?","a":"2 of 44","t":"Attachment","id":1308},{"q":"Give a limitation of the 44 thieves study.","a":"Bowlby conducted the interviews and assessments himself so researcher bias may have occurred; it was correlational","t":"Attachment","id":1309},{"q":"Give research that challenges maternal deprivation.","a":"Lewis et al. (1995) found in a study of 500 people that early prolonged separation did not predict criminality or difficulty in close relationships","t":"Attachment","id":1310},{"q":"What were the Czech twins?","a":"Twins who suffered severe abuse and isolation until age 7, but recovered well after being adopted – showing effects of deprivation can be reversed","t":"Attachment","id":1311},{"q":"What did Levy et al. (1953) find with rats?","a":"Separating rat pups from their mother for just a day had a permanent effect on their social development – supports maternal deprivation","t":"Attachment","id":1312},{"q":"Why is Bowlby's maternal deprivation theory seen as confusing deprivation and privation?","a":"Rutter argued Bowlby confused deprivation (losing an attachment) with privation (never forming one); many of the 44 thieves may have been privated","t":"Attachment","id":1313},{"q":"What is privation?","a":"Never forming an attachment in the first place","t":"Attachment","id":1314},{"q":"What is institutionalisation?","a":"The effects of living in an institutional setting such as an orphanage, where children receive little emotional care","t":"Attachment","id":1315},{"q":"What is the ERA project?","a":"The English and Romanian Adoptees study – a longitudinal study of Romanian orphans adopted into British families","t":"Attachment","id":1316},{"q":"Who led the ERA project?","a":"Michael Rutter (2011)","t":"Attachment","id":1317},{"q":"How many children were in the ERA project?","a":"165 Romanian orphans (plus a control group of 52 British adopted children)","t":"Attachment","id":1318},{"q":"At what ages were the ERA children assessed?","a":"4, 6, 11, 15 and 22–25 years (repeatedly over time)","t":"Attachment","id":1319},{"q":"What did the ERA project find about physical development at adoption?","a":"Half showed signs of delayed intellectual development and most were severely undernourished","t":"Attachment","id":1320},{"q":"What did the ERA project find about age of adoption and IQ at 11?","a":"Those adopted before 6 months had a mean IQ of 102, those adopted between 6 months and 2 years 86, and those adopted after 2 years 77","t":"Attachment","id":1321},{"q":"What is disinhibited attachment?","a":"Being equally friendly and affectionate towards familiar and unfamiliar people","t":"Attachment","id":1322},{"q":"Which ERA children showed disinhibited attachment?","a":"Those adopted after 6 months of age","t":"Attachment","id":1323},{"q":"Why might disinhibited attachment develop?","a":"It may be an adaptation to having many caregivers in an institution","t":"Attachment","id":1324},{"q":"What did Zeanah et al. (2005) study?","a":"The Bucharest Early Intervention Project – Romanian institutionalised children compared with a control group of children who had never been in an institution","t":"Attachment","id":1325},{"q":"What did Zeanah find?","a":"74% of the control group were securely attached compared with 19% of the institutionalised group; 44% of institutionalised children showed disinhibited attachment","t":"Attachment","id":1326},{"q":"Give four effects of institutionalisation.","a":"Disinhibited attachment, Intellectual disability/low IQ, Physical underdevelopment (deprivation dwarfism), Poor parenting and relationships later","t":"Attachment","id":1327},{"q":"What is deprivation dwarfism?","a":"Physically small growth due to emotional deprivation rather than just poor nutrition","t":"Attachment","id":1328},{"q":"Give a strength of Romanian orphan studies over earlier studies.","a":"Children were adopted from the same conditions and lived in good homes, so there are fewer confounding variables (e.g. prior abuse or trauma)","t":"Attachment","id":1329},{"q":"Give a limitation of Romanian orphan studies.","a":"Romanian orphanages were extreme and unusual, so findings may not generalise to other institutions","t":"Attachment","id":1330},{"q":"Give a real-world application of institutionalisation research.","a":"Improved care in institutions, e.g. children now have a key worker, and adoption happens earlier","t":"Attachment","id":1331},{"q":"Why can't we know the long-term effects of institutionalisation fully?","a":"Some findings may change as children get older; they may catch up later, so we need longer follow-up","t":"Attachment","id":1332},{"q":"What ethical issue is raised by the Bucharest Early Intervention Project?","a":"Some children were randomly allocated to stay in institutional care while others were fostered","t":"Attachment","id":1333},{"q":"What does the influence of early attachment on later relationships mean?","a":"The idea that the type of attachment we form as a baby affects our relationships in childhood and adulthood","t":"Attachment","id":1334},{"q":"Which concept explains the link between early attachment and later relationships?","a":"The internal working model","t":"Attachment","id":1335},{"q":"What did Myron-Wilson and Smith (1998) find?","a":"Securely attached children were unlikely to be involved in bullying; insecure-avoidant were more likely to be victims and insecure-disorganised more likely to be bullies","t":"Attachment","id":1336},{"q":"What did Kerns (1994) find?","a":"Securely attached infants tend to go on to form the best quality childhood friendships","t":"Attachment","id":1337},{"q":"How does attachment type influence romantic relationships?","a":"Securely attached adults tend to have longer, more trusting relationships; insecure adults have more problems such as jealousy or fear of intimacy","t":"Attachment","id":1338},{"q":"Describe the Hazan and Shaver (1987) love quiz study.","a":"620 people responded to a 'love quiz' in a local newspaper which assessed their early attachment and current relationship experiences","t":"Attachment","id":1339},{"q":"What did Hazan and Shaver find?","a":"56% were secure and most likely to have good, long-lasting relationships; avoidant respondents tended to fear intimacy","t":"Attachment","id":1340},{"q":"How does early attachment affect parenting?","a":"People tend to base their parenting on their own internal working model, so attachment types are passed on (intergenerational continuity)","t":"Attachment","id":1341},{"q":"What did Harlow's monkeys show about parenting?","a":"Monkeys reared without mothers became poor, sometimes abusive mothers","t":"Attachment","id":1342},{"q":"Give a limitation of research into later relationships based on retrospective data.","a":"Participants may not recall childhood accurately, so data may lack validity","t":"Attachment","id":1343},{"q":"Give a limitation of Hazan and Shaver's study.","a":"Volunteer sample from a newspaper, self-report, and correlational – so causation cannot be inferred","t":"Attachment","id":1344},{"q":"What is a confounding variable in later relationships research?","a":"Parenting style or temperament could affect both attachment and later relationships","t":"Attachment","id":1345},{"q":"Why is research into later relationships deterministic?","a":"It suggests early attachment inevitably affects later relationships, which may be overly pessimistic for people with insecure attachments","t":"Attachment","id":1346},{"q":"What did Zimmerman (2000) find?","a":"Infant attachment type did not predict adolescent attachment well; life events such as divorce were more important","t":"Attachment","id":1347},{"q":"What is the 'temperament hypothesis'?","a":"The idea that a child's innate personality, rather than the caregiver's sensitivity, determines their attachment type","t":"Attachment","id":1348},{"q":"Who proposed the caregiver sensitivity hypothesis?","a":"Ainsworth – that secure attachment results from sensitive, responsive caregiving","t":"Attachment","id":1349},{"q":"What is interactional synchrony?","a":"When mother and infant mirror each other's actions and emotions in a coordinated way","t":"Attachment","id":1350},{"q":"What is reciprocity?","a":"A two-way, turn-taking interaction where the caregiver and infant respond to each other's signals","t":"Attachment","id":1351},{"q":"Name two researchers who studied attachment in a strict controlled observation.","a":"Ainsworth and Bell (1970)","t":"Attachment","id":1352},{"q":"Why might Ainsworth's Strange Situation be ethically problematic?","a":"The infants are deliberately distressed by being left with a stranger","t":"Attachment","id":1353},{"q":"Why is the Strange Situation a controlled observation?","a":"It takes place in a set environment with a standardised procedure while researchers observe behaviour","t":"Attachment","id":1354},{"q":"What sampling method was used to record behaviour in the Strange Situation?","a":"Time sampling – observers recorded the target behaviours every 15 seconds and rated their intensity","t":"Attachment","id":1355},{"q":"What is a 'safe haven' in attachment?","a":"The caregiver provides comfort when a child is distressed","t":"Attachment","id":1356},{"q":"Why is Bowlby's theory said to have evolutionary roots?","a":"Attachment increases survival by keeping infants close to caregivers who protect and feed them","t":"Attachment","id":1357},{"q":"What did Bowlby say about the role of the mother?","a":"The mother (or permanent mother substitute) is the most important attachment figure","t":"Attachment","id":1358},{"q":"Why is monotropy criticised by feminists?","a":"It places responsibility on mothers and justifies women staying at home rather than working","t":"Attachment","id":1359},{"q":"What did Bowlby mean by 'mother substitute'?","a":"Anyone who acts as the primary caregiver consistently, not necessarily the biological mother","t":"Attachment","id":1360},{"q":"Give an example of a nature explanation of attachment.","a":"Bowlby's monotropic theory","t":"Attachment","id":1361},{"q":"Give an example of a nurture explanation of attachment.","a":"Learning theory","t":"Attachment","id":1362},{"q":"What is contact comfort?","a":"The comfort gained from physical closeness to a soft, warm caregiver","t":"Attachment","id":1363},{"q":"How did Harlow's findings challenge learning theory?","a":"Monkeys preferred the cloth mother who gave no food, showing attachment is not based on feeding","t":"Attachment","id":1364},{"q":"Why is Lorenz's research described as a natural/field study?","a":"He observed geese in natural conditions rather than a lab","t":"Attachment","id":1365},{"q":"Why was imprinting said to be irreversible by Lorenz?","a":"Once an animal had imprinted it would not switch to another object","t":"Attachment","id":1366},{"q":"Why is the Strange Situation useful for professionals?","a":"It can identify children at risk of insecure attachment so interventions (e.g. Circle of Security) can be offered","t":"Attachment","id":1367},{"q":"What is the Circle of Security project?","a":"An intervention that teaches caregivers to understand and respond to their infants' needs, which increased secure attachment (Cassidy et al., 2011)","t":"Attachment","id":1368},{"q":"Why might attachment research be ethnocentric?","a":"Much research was carried out in the USA/Western countries, using Western norms to judge what is 'normal'","t":"Attachment","id":1369},{"q":"Why is the ERA project a natural experiment?","a":"The IV (age at adoption) occurred naturally and was not manipulated by the researchers","t":"Attachment","id":1370},{"q":"What is the IV in the ERA project?","a":"Age of adoption (before 6 months, 6 months–2 years, after 2 years)","t":"Attachment","id":1371},{"q":"What is the DV in the ERA project?","a":"Measures such as IQ and attachment/social behaviour","t":"Attachment","id":1372},{"q":"Why are longitudinal studies useful in attachment research?","a":"They follow the same participants over time to see long-term effects of early experiences","t":"Attachment","id":1373},{"q":"Give a limitation of longitudinal studies in attachment research.","a":"Participant attrition – children drop out over time, which can bias the sample","t":"Attachment","id":1374},{"q":"What is meant by 'maternal sensitivity'?","a":"The caregiver's ability to notice, interpret and respond appropriately to their infant's signals","t":"Attachment","id":1375},{"q":"What is the main criticism of Bowlby's theories from a nurture perspective?","a":"They ignore the role of learning and environmental factors like fathers, siblings and day care","t":"Attachment","id":1376},{"q":"How could an insecure-resistant attachment affect adult relationships?","a":"Adults may be clingy, jealous and anxious about their partner leaving","t":"Attachment","id":1377},{"q":"How could an insecure-avoidant attachment affect adult relationships?","a":"Adults may avoid intimacy and commitment and struggle to trust","t":"Attachment","id":1378},{"q":"Why might day care be relevant to Bowlby's theory?","a":"His theory suggests separation from the mother is harmful, but research on day care shows mixed effects","t":"Attachment","id":1379},{"q":"A baby cries when his mum leaves the room and is easily comforted when she returns. Which attachment type is this?","a":"Secure (Type B)","t":"Attachment","id":1380},{"q":"A toddler ignores her dad when he leaves and returns, and plays happily with a stranger. Which attachment type is this?","a":"Insecure-avoidant (Type A)","t":"Attachment","id":1381},{"q":"A baby is very distressed when her mum leaves, but pushes her away angrily on reunion. Which attachment type is this?","a":"Insecure-resistant (Type C)","t":"Attachment","id":1382},{"q":"A child adopted at 3 years old from an orphanage is overly friendly with strangers. What is this called?","a":"Disinhibited attachment","t":"Attachment","id":1383},{"q":"A baby smiles and coos at his grandad, who then picks him up. What are the baby's behaviours called by Bowlby?","a":"Social releasers","t":"Attachment","id":1384},{"q":"A mother bottle-feeds her baby, who then shows pleasure when she enters the room. Which explanation of attachment does this support?","a":"Learning theory (classical conditioning)","t":"Attachment","id":1385},{"q":"A duckling follows a remote-control car that it saw first after hatching. What is this called?","a":"Imprinting","t":"Attachment","id":1386},{"q":"Give the order of episodes in the Strange Situation.","a":"Parent and infant enter, Stranger enters, Parent leaves (stranger stays), Parent returns and stranger leaves, Parent leaves infant
