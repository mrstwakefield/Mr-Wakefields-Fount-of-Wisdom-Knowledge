alone, Stranger returns, Parent returns and stranger leaves","t":"Attachment","id":1387},{"q":"Which episodes of the Strange Situation test separation anxiety?","a":"The episodes where the parent leaves (e.g. episodes 3 and 5/6)","t":"Attachment","id":1388},{"q":"Which episodes of the Strange Situation test stranger anxiety?","a":"When the stranger enters and when the stranger returns while the parent is absent","t":"Attachment","id":1389},{"q":"Which episodes of the Strange Situation test reunion behaviour?","a":"When the parent returns","t":"Attachment","id":1390},{"q":"What does Ainsworth's Type B stand for?","a":"Secure attachment","t":"Attachment","id":1391},{"q":"What is the 'Uganda study'?","a":"Ainsworth (1967) observed mothers and babies in Uganda and found sensitive mothers had securely attached babies, inspiring the Strange Situation","t":"Attachment","id":1392},{"q":"Why is it a problem that the Strange Situation only measures attachment to one caregiver?","a":"A child may have different attachment types with different carers (Main and Weston, 1981), so it measures a relationship rather than the child","t":"Attachment","id":1393},{"q":"What did Main and Weston (1981) find?","a":"Children behaved differently in the Strange Situation depending on which parent they were with","t":"Attachment","id":1394},{"q":"What did Takahashi (1990) find in Japan?","a":"No Japanese infants were insecure-avoidant and many were insecure-resistant; many were so distressed the separation episodes had to be stopped","t":"Attachment","id":1395},{"q":"Why did Japanese infants show high insecure-resistant attachment in Takahashi's study?","a":"Japanese infants are rarely separated from their mothers, so the separation episodes were unusually stressful","t":"Attachment","id":1396},{"q":"What did Grossmann and Grossmann (1991) find in Germany?","a":"German infants were more likely to be classified as insecure-avoidant, reflecting cultural value on independence","t":"Attachment","id":1397},{"q":"What is cultural relativism in attachment research?","a":"The view that attachment behaviours must be understood in the context of the culture in which they occur","t":"Attachment","id":1398},{"q":"What does the term 'universal' mean in attachment?","a":"Something that occurs in all cultures, suggesting a biological basis","t":"Attachment","id":1399},{"q":"Why does van Ijzendoorn's finding of more variation within cultures matter?","a":"It suggests the concept of national 'cultures' is misleading and that subcultural factors (e.g. rural vs urban) matter","t":"Attachment","id":1400},{"q":"What is a meta-analysis?","a":"A statistical technique that combines the results of many studies on the same topic","t":"Attachment","id":1401},{"q":"What did Bowlby believe would happen if the critical period for attachment was missed?","a":"Serious, long-lasting and irreversible damage to social, emotional and intellectual development","t":"Attachment","id":1402},{"q":"Give a practical implication of Bowlby's maternal deprivation theory.","a":"Hospitals changed practice to let parents stay with children (e.g. Robertson and Robertson's films), and it influenced childcare policy","t":"Attachment","id":1403},{"q":"What did Robertson and Robertson (1952) show?","a":"Short separations (e.g. a child in hospital) caused distress, and a film of 'Laura' helped change hospital visiting policy","t":"Attachment","id":1404},{"q":"What are the three stages of distress in the PDD model of separation?","a":"Protest, Despair, Detachment","t":"Attachment","id":1405},{"q":"What is the 'protest' stage of separation?","a":"The child cries and is angry and panicked when the caregiver leaves","t":"Attachment","id":1406},{"q":"What is the 'despair' stage of separation?","a":"The child becomes calmer but apathetic and withdrawn","t":"Attachment","id":1407},{"q":"What is the 'detachment' stage of separation?","a":"The child engages with others but rejects the caregiver on return","t":"Attachment","id":1408},{"q":"What does 'hospitalisation' research tell us about deprivation?","a":"Even short separations can be damaging if emotional care is not substituted","t":"Attachment","id":1409},{"q":"How do the Romanian orphan studies support Bowlby's idea of a sensitive period?","a":"Children adopted after 6 months showed lasting effects, suggesting early care is especially important","t":"Attachment","id":1410},{"q":"How do the Romanian orphan studies challenge Bowlby's idea of irreversibility?","a":"Children adopted before 6 months recovered well, and some later-adopted children improved, so damage is not always permanent","t":"Attachment","id":1411},{"q":"Why can't we assume institutional care caused the problems in the ERA project?","a":"Children may have been placed in orphanages because of existing problems (e.g. disabilities), or those adopted first may have been the most sociable","t":"Attachment","id":1412},{"q":"What did Hodges and Tizard (1989) find?","a":"Institutionalised children who were adopted formed close attachments with adoptive parents but had problems with peer relationships and sought adult attention","t":"Attachment","id":1413},{"q":"What is the 'quality of care' issue in institutionalisation research?","a":"Romanian orphanages had exceptionally poor care, so effects may be worse than in better institutions","t":"Attachment","id":1414},{"q":"What does the term 'emotional deprivation' mean?","a":"A lack of warmth, affection and emotional responsiveness from caregivers","t":"Attachment","id":1415},{"q":"What is the link between attachment and the fight or flight response in infants?","a":"Separation from the attachment figure is stressful and activates the stress response; the caregiver provides comfort","t":"Attachment","id":1416},{"q":"What is the 'temperament' explanation of Strange Situation behaviour?","a":"Some babies are naturally more anxious, so they may show distress regardless of their attachment quality","t":"Attachment","id":1417},{"q":"What is a 'secure base'?","a":"A safe place from which a child can explore, knowing they can return for comfort","t":"Attachment","id":1418},{"q":"Why is Harlow's study considered a lab experiment?","a":"The independent variable (which 'mother' gave milk) was manipulated in a controlled environment","t":"Attachment","id":1419},{"q":"What is the IV in Harlow's study?","a":"Whether the wire or cloth mother provided milk (and the type of mother)","t":"Attachment","id":1420},{"q":"What is the DV in Harlow's study?","a":"Time spent with each mother/which mother the monkey went to when frightened","t":"Attachment","id":1421},{"q":"Why can Lorenz's research be criticised for low control?","a":"He observed natural behaviour, so extraneous variables could not be controlled","t":"Attachment","id":1422},{"q":"What is the difference between an attachment figure and a caregiver?","a":"A caregiver provides care, but an attachment figure is someone the child has an emotional bond with","t":"Attachment","id":1423},{"q":"Why does Bowlby say attachment is adaptive?","a":"It increases the chance of survival and passing on genes, as it keeps infants close to protection and food","t":"Attachment","id":1424},{"q":"What is the link between Bowlby's monotropy and his maternal deprivation theory?","a":"Both emphasise one special relationship with the mother, which, if disrupted during the critical period, causes lasting harm","t":"Attachment","id":1425},{"q":"Explain why a child with an insecure attachment might have difficulty in school relationships.","a":"Their internal working model may lead them to expect others to be unreliable, making them distrustful or aggressive","t":"Attachment","id":1426},{"q":"Why might securely attached children cope better with day care?","a":"They trust their attachment figure will return, so they explore and make friends more confidently","t":"Attachment","id":1427},{"q":"What is intergenerational continuity?","a":"When attachment types are passed from parent to child across generations","t":"Attachment","id":1428},{"q":"Explain how the internal working model links childhood to adult parenting.","a":"The child's IWM of their own care becomes a template for how they parent their own children","t":"Attachment","id":1429},{"q":"Why do many psychologists prefer an interactionist view of attachment?","a":"Attachment is likely influenced by both innate factors (e.g. social releasers, temperament) and learning/caregiver sensitivity","t":"Attachment","id":1430},{"q":"Why might attachment theory be considered reductionist?","a":"It explains complex relationships by reducing them to early mother-infant bonds and ignores other influences","t":"Attachment","id":1431},{"q":"Give one way in which Harlow's findings are useful for zoos.","a":"Zoos and breeding programmes ensure baby animals have social contact and are not isolated, to avoid lasting harm","t":"Attachment","id":1432},{"q":"What did Suomi and Harlow find about rehabilitation?","a":"Isolated monkeys could partly recover if placed with younger 'therapist' monkeys, suggesting some effects are reversible","t":"Attachment","id":1433},{"q":"Which research method is the Strange Situation?","a":"A controlled observation","t":"Attachment","id":1434},{"q":"What type of data does the Strange Situation mainly produce?","a":"Quantitative data (behaviour counts and ratings), plus some qualitative description","t":"Attachment","id":1435},{"q":"Why is inter-observer reliability important in the Strange Situation?","a":"It shows that different observers classify behaviours in the same way, so the classifications are consistent","t":"Attachment","id":1436},{"q":"How can researchers improve the reliability of the Strange Situation?","a":"Use clear, operationalised behavioural categories and train observers; check agreement with inter-observer reliability","t":"Attachment","id":1437},{"q":"Why may classification into only three attachment types be too simple?","a":"Some babies don't fit any type, which is why Main and Solomon added disorganised attachment","t":"Attachment","id":1438},{"q":"What did Lamb (1977) suggest about fathers?","a":"Infants form attachments with fathers, often based on play rather than care","t":"Attachment","id":1439},{"q":"Why is Bowlby's theory difficult to falsify?","a":"It is based on concepts like internal working models and innate predispositions that are hard to test directly","t":"Attachment","id":1440},{"q":"Explain one way that culture might affect how securely attached babies behave.","a":"Cultures that value independence may encourage infants to be less distressed by separation, which may look like avoidance","t":"Attachment","id":1441},{"q":"Why might the effects of institutionalisation be seen as supporting the nurture side of the debate?","a":"Environmental deprivation early in life had a clear effect on development","t":"Attachment","id":1442},{"q":"What does 'reversible' mean in attachment research?","a":"The effects of deprivation or institutionalisation can be overcome by later good care","t":"Attachment","id":1443},{"q":"What does 'irreversible' mean in attachment research?","a":"The effects of deprivation cannot be undone","t":"Attachment","id":1444},{"q":"Why might research on attachment be useful to the economy?","a":"Better childcare and early intervention can reduce later mental health problems, crime and costs to the state","t":"Attachment","id":1445},{"q":"Which attachment type is linked to the most positive outcomes?","a":"Secure attachment","t":"Attachment","id":1446},{"q":"What are the two main divisions of the nervous system?","a":"Central nervous system (CNS), Peripheral nervous system (PNS)","t":"Biopsychology","id":1447},{"q":"What makes up the central nervous system?","a":"The brain and spinal cord","t":"Biopsychology","id":1448},{"q":"What makes up the peripheral nervous system?","a":"All the nerves outside the brain and spinal cord","t":"Biopsychology","id":1449},{"q":"What is the main function of the nervous system?","a":"To collect, process and respond to information in the environment, and coordinate the working of organs and cells","t":"Biopsychology","id":1450},{"q":"What is the function of the brain?","a":"The centre of all conscious awareness; it processes information and coordinates behaviour","t":"Biopsychology","id":1451},{"q":"What is the cerebral cortex?","a":"The outer layer of the brain, involved in higher mental functions","t":"Biopsychology","id":1452},{"q":"What is the function of the spinal cord?","a":"Relays information between the brain and the rest of the body, and controls simple reflexes without the brain","t":"Biopsychology","id":1453},{"q":"What is a reflex arc?","a":"A neural pathway that controls a reflex, allowing a rapid response without involving the brain (e.g. pulling your hand from a hot surface)","t":"Biopsychology","id":1454},{"q":"Is the autonomic nervous system voluntary or involuntary?","a":"Involuntary","t":"Biopsychology","id":1455},{"q":"What does the sympathetic nervous system do?","a":"Prepares the body for action – the fight or flight response","t":"Biopsychology","id":1456},{"q":"What does the parasympathetic nervous system do?","a":"Returns the body to its resting state – 'rest and digest'","t":"Biopsychology","id":1457},{"q":"Give three effects of the sympathetic nervous system.","a":"Increases heart rate, Increases breathing rate, Dilates pupils, Inhibits digestion, Inhibits saliva, Contracts rectum","t":"Biopsychology","id":1458},{"q":"Give three effects of the parasympathetic nervous system.","a":"Decreases heart rate, Decreases breathing rate, Constricts pupils, Stimulates digestion, Stimulates saliva, Relaxes rectum","t":"Biopsychology","id":1459},{"q":"What is the brain stem responsible for?","a":"Automatic functions such as breathing and heart rate, and the sleep-wake cycle","t":"Biopsychology","id":1460},{"q":"Roughly how many neurons are in the human nervous system?","a":"About 100 billion (80% in the brain)","t":"Biopsychology","id":1461},{"q":"What is the function of sensory neurons?","a":"Carry messages from sensory receptors (PNS) to the CNS","t":"Biopsychology","id":1462},{"q":"What is the function of relay neurons?","a":"Connect sensory neurons to motor neurons or other relay neurons within the CNS","t":"Biopsychology","id":1463},{"q":"What is the function of motor neurons?","a":"Carry messages from the CNS to effectors such as muscles and glands","t":"Biopsychology","id":1464},{"q":"Describe the structure of a sensory neuron.","a":"Long dendrites and short axons; cell body is located off to one side (in the PNS)","t":"Biopsychology","id":1465},{"q":"Describe the structure of a relay neuron.","a":"Short dendrites and short axons; found in the CNS","t":"Biopsychology","id":1466},{"q":"Describe the structure of a motor neuron.","a":"Short dendrites and long axons; cell body is in the CNS","t":"Biopsychology","id":1467},{"q":"What is the cell body (soma)?","a":"The part of the neuron that contains the nucleus and genetic material","t":"Biopsychology","id":1468},{"q":"What are dendrites?","a":"Branch-like structures that receive nerve impulses from neighbouring neurons","t":"Biopsychology","id":1469},{"q":"What is the myelin sheath?","a":"A fatty layer that insulates the axon and speeds up the electrical impulse","t":"Biopsychology","id":1470},{"q":"What are the nodes of Ranvier?","a":"Gaps in the myelin sheath that make the impulse 'jump', speeding up transmission","t":"Biopsychology","id":1471},{"q":"What are terminal buttons?","a":"Structures at the end of the axon that communicate with the next neuron across the synapse","t":"Biopsychology","id":1472},{"q":"What is electrical transmission in a neuron?","a":"When a neuron is activated, the inside becomes positively charged (an action potential), creating an electrical impulse that travels down the axon","t":"Biopsychology","id":1473},{"q":"What is the resting state of a neuron?","a":"The inside of the cell is negatively charged compared with the outside","t":"Biopsychology","id":1474},{"q":"What is an action potential?","a":"A brief change in charge inside the neuron from negative to positive, which travels down the axon","t":"Biopsychology","id":1475},{"q":"What is synaptic transmission?","a":"The process by which neighbouring neurons communicate by sending chemical messages across the synaptic gap","t":"Biopsychology","id":1476},{"q":"What are synaptic vesicles?","a":"Sacs in the terminal button that contain neurotransmitters","t":"Biopsychology","id":1477},{"q":"What happens when an electrical impulse reaches the end of the axon?","a":"It triggers the release of neurotransmitters from synaptic vesicles into the synaptic gap (exocytosis)","t":"Biopsychology","id":1478},{"q":"What is the synaptic gap (cleft)?","a":"The small space between the presynaptic and postsynaptic neurons","t":"Biopsychology","id":1479},{"q":"What happens to neurotransmitters after release?","a":"They diffuse across the synaptic gap and bind to receptor sites on the postsynaptic neuron","t":"Biopsychology","id":1480},{"q":"What happens once a neurotransmitter binds to a postsynaptic receptor?","a":"The chemical message is converted back into an electrical impulse (if the neuron fires)","t":"Biopsychology","id":1481},{"q":"What is reuptake?","a":"The process where neurotransmitters are reabsorbed back into the presynaptic neuron","t":"Biopsychology","id":1482},{"q":"Why is synaptic transmission one-way?","a":"Vesicles are only in the presynaptic neuron and receptors are only on the postsynaptic neuron","t":"Biopsychology","id":1483},{"q":"Give two examples of neurotransmitters.","a":"Serotonin, Dopamine, Acetylcholine, GABA, Adrenaline (noradrenaline)","t":"Biopsychology","id":1484},{"q":"What is an excitatory neurotransmitter?","a":"One that makes the postsynaptic neuron more likely to fire (e.g. adrenaline)","t":"Biopsychology","id":1485},{"q":"What is an inhibitory neurotransmitter?","a":"One that makes the postsynaptic neuron less likely to fire (e.g. serotonin, GABA)","t":"Biopsychology","id":1486},{"q":"What is an EPSP?","a":"An excitatory postsynaptic potential – makes the postsynaptic neuron more positively charged, so more likely to fire","t":"Biopsychology","id":1487},{"q":"What is an IPSP?","a":"An inhibitory postsynaptic potential – makes the postsynaptic neuron more negatively charged, so less likely to fire","t":"Biopsychology","id":1488},{"q":"What is summation?","a":"Adding together all the excitatory and inhibitory inputs to determine whether the postsynaptic neuron fires","t":"Biopsychology","id":1489},{"q":"What is spatial summation?","a":"When many presynaptic neurons release neurotransmitters at the same time onto one postsynaptic neuron","t":"Biopsychology","id":1490},{"q":"What is temporal summation?","a":"When one presynaptic neuron releases neurotransmitters repeatedly in quick succession","t":"Biopsychology","id":1491},{"q":"What does dopamine do?","a":"It is both excitatory and inhibitory; linked to reward, motivation and movement","t":"Biopsychology","id":1492},{"q":"How does the endocrine system differ from the nervous system?","a":"It uses the bloodstream rather than nerves, so it works more slowly but its effects are longer lasting","t":"Biopsychology","id":1493},{"q":"Which gland is known as the 'master gland'?","a":"The pituitary gland","t":"Biopsychology","id":1494},{"q":"Why is the pituitary gland called the 'master gland'?","a":"It controls the release of hormones from all the other endocrine glands","t":"Biopsychology","id":1495},{"q":"What controls the pituitary gland?","a":"The hypothalamus","t":"Biopsychology","id":1496},{"q":"What are the two lobes of the pituitary gland?","a":"Anterior and posterior","t":"Biopsychology","id":1497},{"q":"Which hormone does the anterior pituitary release in response to stress?","a":"ACTH (adrenocorticotropic hormone)","t":"Biopsychology","id":1498},{"q":"Which hormone does the posterior pituitary release?","a":"Oxytocin","t":"Biopsychology","id":1499},{"q":"What is the role of oxytocin?","a":"Involved in uterus contractions in childbirth and bonding (the 'love hormone')","t":"Biopsychology","id":1500},{"q":"Which gland releases thyroxine?","a":"The thyroid gland","t":"Biopsychology","id":1501},{"q":"What does thyroxine do?","a":"Regulates metabolism and increases heart rate","t":"Biopsychology","id":1502},{"q":"Which gland releases melatonin?","a":"The pineal gland","t":"Biopsychology","id":1503},{"q":"What are the two parts of the adrenal gland?","a":"Adrenal medulla, Adrenal cortex","t":"Biopsychology","id":1504},{"q":"What does the adrenal medulla release?","a":"Adrenaline and noradrenaline","t":"Biopsychology","id":1505},{"q":"What does the adrenal cortex release?","a":"Cortisol","t":"Biopsychology","id":1506},{"q":"What does the pancreas release?","a":"Insulin (and glucagon), which regulate blood sugar","t":"Biopsychology","id":1507},{"q":"What do the testes release?","a":"Testosterone","t":"Biopsychology","id":1508},{"q":"What do the ovaries release?","a":"Oestrogen (and progesterone)","t":"Biopsychology","id":1509},{"q":"What is the role of testosterone?","a":"Development of male sex characteristics; linked to aggression","t":"Biopsychology","id":1510},{"q":"What is the role of oestrogen?","a":"Controls female reproductive system and menstrual cycle","t":"Biopsychology","id":1511},{"q":"What is the fight or flight response?","a":"The way an animal responds when stressed – the body becomes physiologically aroused to fight or run away","t":"Biopsychology","id":1512},{"q":"Which part of the brain detects the stressor first?","a":"The amygdala, which sends a distress signal to the hypothalamus","t":"Biopsychology","id":1513},{"q":"What is the name of the pathway that produces the immediate fight or flight response?","a":"The sympathomedullary pathway (SAM)","t":"Biopsychology","id":1514},{"q":"Describe the sympathomedullary pathway.","a":"Hypothalamus activates the sympathetic nervous system, which stimulates the adrenal medulla to release adrenaline into the bloodstream","t":"Biopsychology","id":1515},{"q":"What does adrenaline do in fight or flight?","a":"Increases heart rate and blood pressure, increases breathing rate, dilates pupils, releases glucose, diverts blood to muscles, inhibits digestion","t":"Biopsychology","id":1516},{"q":"Why does adrenaline increase heart rate?","a":"To pump blood faster to muscles and the brain so the body can respond to the threat","t":"Biopsychology","id":1517},{"q":"Why does breathing rate increase in fight or flight?","a":"To take in more oxygen for the muscles","t":"Biopsychology","id":1518},{"q":"Why does digestion stop in fight or flight?","a":"Blood is diverted to the muscles, and digestion is not needed for immediate survival","t":"Biopsychology","id":1519},{"q":"What happens when the threat has passed?","a":"The parasympathetic nervous system returns the body to its resting state","t":"Biopsychology","id":1520},{"q":"What pathway is activated if the stressor continues?","a":"The hypothalamic-pituitary-adrenal (HPA) axis","t":"Biopsychology","id":1521},{"q":"Describe the HPA axis.","a":"Hypothalamus releases CRH, which causes the pituitary to release ACTH, which causes the adrenal cortex to release cortisol","t":"Biopsychology","id":1522},{"q":"What does cortisol do?","a":"Provides a steady supply of glucose/energy, but can suppress the immune system and impair cognition","t":"Biopsychology","id":1523},{"q":"What is the freeze response?","a":"A response to a threat before fight or flight, where the animal stays still and hyper-vigilant","t":"Biopsychology","id":1524},{"q":"What is 'tend and befriend'?","a":"Taylor et al. (2000) suggested females respond to stress by protecting offspring and forming alliances, rather than fight or flight","t":"Biopsychology","id":1525},{"q":"Why might the fight or flight response be maladaptive today?","a":"Modern stressors are mostly psychological, so repeated activation can cause health problems, e.g. heart disease","t":"Biopsychology","id":1526},{"q":"Why was the fight or flight response research gender biased?","a":"Early research was mostly on males, so it may not describe female stress responses","t":"Biopsychology","id":1527},{"q":"What did Lee and Harley (2012) find?","a":"The SRY gene on the male Y chromosome may promote aggression and fight or flight; females lack this gene","t":"Biopsychology","id":1528},{"q":"What are the two hemispheres of the brain connected by?","a":"The corpus callosum","t":"Biopsychology","id":1529},{"q":"What is localisation of function?","a":"The theory that specific areas of the brain are associated with specific physical and psychological functions","t":"Biopsychology","id":1530},{"q":"What is holistic theory of brain function?","a":"The earlier view that all parts of the brain are involved in processing thoughts and actions","t":"Biopsychology","id":1531},{"q":"Where is the motor area?","a":"At the back of the frontal lobe in both hemispheres","t":"Biopsychology","id":1532},{"q":"What does the motor area do?","a":"Controls voluntary movement on the opposite side of the body","t":"Biopsychology","id":1533},{"q":"Where is the somatosensory area?","a":"At the front of the parietal lobe","t":"Biopsychology","id":1534},{"q":"What does the somatosensory area do?","a":"Processes sensory information from the skin, such as touch, heat and pressure","t":"Biopsychology","id":1535},{"q":"Where is the visual area?","a":"In the occipital lobe at the back of the brain","t":"Biopsychology","id":1536},{"q":"What does the visual area do?","a":"Processes visual information; each eye sends information from the right visual field to the left visual cortex and vice versa","t":"Biopsychology","id":1537},{"q":"Where is the auditory area?","a":"In the temporal lobe","t":"Biopsychology","id":1538},{"q":"What does the auditory area do?","a":"Analyses speech-based information and processes sound","t":"Biopsychology","id":1539},{"q":"Where is Broca's area?","a":"In the left frontal lobe","t":"Biopsychology","id":1540},{"q":"What does Broca's area do?","a":"Responsible for speech production","t":"Biopsychology","id":1541},{"q":"What is Broca's aphasia?","a":"Slow, laborious speech lacking fluency, caused by damage to Broca's area","t":"Biopsychology","id":1542},{"q":"Who was Tan?","a":"Broca's patient, who could only say the word 'tan'; post-mortem showed damage to the left frontal lobe","t":"Biopsychology","id":1543},{"q":"Where is Wernicke's area?","a":"In the left temporal lobe","t":"Biopsychology","id":1544},{"q":"What does Wernicke's area do?","a":"Responsible for language comprehension","t":"Biopsychology","id":1545},{"q":"What is Wernicke's aphasia?","a":"Producing fluent but meaningless speech (neologisms) and difficulty understanding language","t":"Biopsychology","id":1546},{"q":"Give a strength of localisation of function.","a":"Brain scan evidence, e.g. Petersen et al. (1988) showed Broca's area active during reading and Wernicke's during listening","t":"Biopsychology","id":1547},{"q":"Give another strength of localisation of function.","a":"Case studies such as Phineas Gage, whose personality changed after damage to his frontal lobe","t":"Biopsychology","id":1548},{"q":"Who was Phineas Gage?","a":"A railway worker who had a metal rod pass through his left frontal lobe in 1848; he became aggressive and impulsive, suggesting the frontal lobe regulates mood","t":"Biopsychology","id":1549},{"q":"What did Lashley (1950) find?","a":"When he removed areas of rats' cortex, learning a maze was not affected by the specific area removed, supporting equipotentiality","t":"Biopsychology","id":1550},{"q":"What is equipotentiality theory?","a":"The idea that basic functions are localised, but higher cognitive functions are not; intact areas can take over if one is damaged","t":"Biopsychology","id":1551},{"q":"What is a limitation of localisation of function linked to language?","a":"Dick and Tremblay (2016) found only 2% of researchers think language is completely controlled by Broca's and Wernicke's areas; it involves networks across the brain","t":"Biopsychology","id":1552},{"q":"What is hemispheric lateralisation?","a":"The idea that the two halves of the brain are functionally different and some functions are controlled by one hemisphere more than the other","t":"Biopsychology","id":1553},{"q":"Which hemisphere is dominant for language?","a":"The left hemisphere","t":"Biopsychology","id":1554},{"q":"Which hemisphere is associated with visuo-spatial processing and facial recognition?","a":"The right hemisphere","t":"Biopsychology","id":1555},{"q":"What is contralateral wiring?","a":"Each hemisphere controls the opposite side of the body","t":"Biopsychology","id":1556},{"q":"What is split-brain research?","a":"Studies of people whose corpus callosum has been cut (usually to treat epilepsy), so the two hemispheres can't communicate","t":"Biopsychology","id":1557},{"q":"Who carried out split-brain research?","a":"Sperry (1968)","t":"Biopsychology","id":1558},{"q":"Describe Sperry's procedure.","a":"11 split-brain patients were shown an image to one visual field (e.g. right) while the other eye was covered","t":"Biopsychology","id":1559},{"q":"What happened when a picture was shown to a split-brain patient's right visual field?","a":"They could describe it, because it was processed by the left (language) hemisphere","t":"Biopsychology","id":1560},{"q":"What happened when a picture was shown to the left visual field?","a":"They could not describe it and often said there was nothing there, as the right hemisphere lacks language","t":"Biopsychology","id":1561},{"q":"How could split-brain patients identify an object shown to their left visual field?","a":"By selecting a matching object with their left hand, which is controlled by the right hemisphere","t":"Biopsychology","id":1562},{"q":"What did Sperry find about the right hemisphere and drawing?","a":"The left hand (right hemisphere) drew pictures better than the right hand, even though patients were right-handed","t":"Biopsychology","id":1563},{"q":"What did Sperry's research show about the hemispheres?","a":"The left hemisphere is dominant for language, the right for visuo-spatial processing and emotional responses","t":"Biopsychology","id":1564},{"q":"Give a strength of split-brain research.","a":"Well controlled – standardised procedures with one eye covered and images presented very briefly (1/10 second)","t":"Biopsychology","id":1565},{"q":"Give a limitation of split-brain research.","a":"Small sample of patients with epilepsy, who may have had unusual brains; differences may not apply to typical brains","t":"Biopsychology","id":1566},{"q":"What is the idea of 'left-brained' and 'right-brained' people?","a":"A popular myth that people are dominated by one hemisphere (e.g. logical vs creative); research doesn't support it","t":"Biopsychology","id":1567},{"q":"What did Nielsen et al. (2013) find?","a":"Brain scans of 1,000 people found no evidence of people being 'left-brained' or 'right-brained' overall","t":"Biopsychology","id":1568},{"q":"What is synaptic pruning?","a":"As we age, rarely used connections are deleted and frequently used connections are strengthened","t":"Biopsychology","id":1569},{"q":"Roughly how many synaptic connections does a 2–3-year-old have per neuron?","a":"About 15,000","t":"Biopsychology","id":1570},{"q":"What did Maguire et al. (2000) find?","a":"London taxi drivers had more grey matter in the posterior hippocampus than a control group, and this was linked to length of time as a driver","t":"Biopsychology","id":1571},{"q":"What did Draganski et al. (2006) find?","a":"Medical students' brains showed changes (in the posterior hippocampus and parietal cortex) after studying for exams","t":"Biopsychology","id":1572},{"q":"What did Kuhn et al. (2014) find?","a":"Playing video games (Super Mario) for 30 minutes a day over 2 months increased grey matter in several brain areas","t":"Biopsychology","id":1573},{"q":"What did Davidson et al. (2004) find?","a":"Buddhist monks who meditated had greater gamma wave activity than controls, suggesting meditation can change the brain","t":"Biopsychology","id":1574},{"q":"What is a negative consequence of plasticity?","a":"Maladaptive changes, e.g. phantom limb syndrome, where amputees feel sensations in a missing limb","t":"Biopsychology","id":1575},{"q":"What is spontaneous recovery?","a":"The quick recovery of function soon after trauma, which then slows down","t":"Biopsychology","id":1576},{"q":"What is axonal sprouting?","a":"The growth of new nerve endings which connect with other undamaged nerve cells to form new pathways","t":"Biopsychology","id":1577},{"q":"What is denervation supersensitivity?","a":"When axons doing a similar job become aroused to a higher level to compensate for ones that are lost","t":"Biopsychology","id":1578},{"q":"What is recruitment of homologous areas?","a":"Similar areas on the opposite side of the brain take over specific tasks (e.g. language moving to the right hemisphere)","t":"Biopsychology","id":1579},{"q":"What is neural unmasking?","a":"Dormant synapses become active when neighbouring areas are damaged","t":"Biopsychology","id":1580},{"q":"Give a strength of research into plasticity and recovery.","a":"Real-world application – it has contributed to neurorehabilitation, e.g. physical therapy and constraint-induced movement therapy","t":"Biopsychology","id":1581},{"q":"What did Schneider et al. (2014) find?","a":"Patients who spent more years in education were more likely to achieve disability-free recovery after brain injury – cognitive reserve","t":"Biopsychology","id":1582},{"q":"What is cognitive reserve?","a":"The idea that more education or intellectual activity helps the brain recover from damage","t":"Biopsychology","id":1583},{"q":"What is a limitation of plasticity research relating to age?","a":"Plasticity reduces with age, so older people may recover less well (though Bezzola et al. found golf training increased plasticity in over-40s)","t":"Biopsychology","id":1584},{"q":"What did Bezzola et al. (2012) find?","a":"40 hours of golf training produced changes in the neural representation of movement in people aged 40–60","t":"Biopsychology","id":1585},{"q":"What are the four ways of studying the brain on the specification?","a":"fMRI, EEG, ERPs, Post-mortem examinations","t":"Biopsychology","id":1586},{"q":"What does fMRI stand for?","a":"Functional magnetic resonance imaging","t":"Biopsychology","id":1587},{"q":"How does fMRI work?","a":"It detects changes in blood oxygenation and flow that occur as a result of neural activity in specific brain areas","t":"Biopsychology","id":1588},{"q":"What does fMRI produce?","a":"A 3D image (activation map) showing which parts of the brain are active during a task","t":"Biopsychology","id":1589},{"q":"Give a strength of fMRI.","a":"Non-invasive, no radiation, and high spatial resolution (about 1–2mm)","t":"Biopsychology","id":1590},{"q":"Give a limitation of fMRI.","a":"Expensive, poor temporal resolution (about 5-second lag), and only measures blood flow rather than neural activity directly","t":"Biopsychology","id":1591},{"q":"What does EEG stand for?","a":"Electroencephalogram","t":"Biopsychology","id":1592},{"q":"How does an EEG work?","a":"Electrodes placed on the scalp measure electrical activity in the brain","t":"Biopsychology","id":1593},{"q":"What is an EEG useful for?","a":"Diagnosing conditions such as epilepsy and studying sleep stages","t":"Biopsychology","id":1594},{"q":"Give a strength of EEG.","a":"High temporal resolution (about 1 millisecond); cheap and non-invasive","t":"Biopsychology","id":1595},{"q":"Give a limitation of EEG.","a":"Poor spatial resolution – it can't pinpoint the exact source of activity; only detects surface activity","t":"Biopsychology","id":1596},{"q":"What are ERPs?","a":"Event-related potentials – brainwaves triggered by particular events, isolated from EEG data using statistical averaging","t":"Biopsychology","id":1597},{"q":"How are ERPs obtained?","a":"A stimulus is presented many times and the EEG responses are averaged, filtering out background activity","t":"Biopsychology","id":1598},{"q":"What are sensory ERPs?","a":"ERPs occurring within 100 milliseconds of a stimulus, reflecting an initial response","t":"Biopsychology","id":1599},{"q":"What are cognitive ERPs?","a":"ERPs occurring after 100 milliseconds, reflecting cognitive processing","t":"Biopsychology","id":1600},{"q":"Give a strength of ERPs.","a":"More specific than EEG, and excellent temporal resolution","t":"Biopsychology","id":1601},{"q":"Give a limitation of ERPs.","a":"Lack of standardisation between studies; background noise must be removed completely, which can be difficult","t":"Biopsychology","id":1602},{"q":"What is a post-mortem examination?","a":"Analysis of a person's brain after death to look for abnormalities that may explain behaviour","t":"Biopsychology","id":1603},{"q":"Who used a post-mortem to find Broca's area?","a":"Paul Broca (patient Tan)","t":"Biopsychology","id":1604},{"q":"Give a strength of post-mortem examinations.","a":"Allow detailed examination of deep brain areas, and were vital for early understanding (e.g. Broca, HM)","t":"Biopsychology","id":1605},{"q":"Give a limitation of post-mortem examinations.","a":"Causation – damage may not be linked to the behaviour; also ethical issues of consent from patients before death","t":"Biopsychology","id":1606},{"q":"Which brain study method has the best spatial resolution?","a":"fMRI","t":"Biopsychology","id":1607},{"q":"Which brain study methods have the best temporal resolution?","a":"EEG and ERPs","t":"Biopsychology","id":1608},{"q":"Why is it important to study the brain?","a":"To understand localisation of function, diagnose disorders and develop treatments","t":"Biopsychology","id":1609},{"q":"What does 'spatial resolution' mean?","a":"The smallest area/feature that can be distinguished by a technique","t":"Biopsychology","id":1610},{"q":"What does 'temporal resolution' mean?","a":"How accurately a technique measures the timing of brain activity","t":"Biopsychology","id":1611},{"q":"What is the difference between hormones and neurotransmitters?","a":"Hormones travel in the blood and act slowly on target organs; neurotransmitters act across synapses quickly","t":"Biopsychology","id":1612},{"q":"Why is a hormone only able to affect target organs?","a":"Only cells with the matching receptors respond to it","t":"Biopsychology","id":1613},{"q":"What happens during the 'rest and digest' state?","a":"The parasympathetic system slows heart rate and breathing and restarts digestion","t":"Biopsychology","id":1614},{"q":"Why is the biological approach useful for understanding stress?","a":"It explains the physiological processes (SAM and HPA) that link stress to illness","t":"Biopsychology","id":1615},{"q":"Why does the sympathetic nervous system increase pupil size?","a":"To let in more light and improve vision for spotting threats","t":"Biopsychology","id":1616},{"q":"Why does the fight or flight response release glucose?","a":"To provide energy for the muscles","t":"Biopsychology","id":1617},{"q":"Why does the fight or flight response increase blood pressure?","a":"To deliver more oxygen and glucose to the muscles and brain","t":"Biopsychology","id":1618},{"q":"Why does the fight or flight response inhibit saliva production?","a":"Digestion is not needed, so energy is conserved for action","t":"Biopsychology","id":1619},{"q":"Why is adrenaline both a hormone and a neurotransmitter?","a":"It is released into the blood by the adrenal medulla (hormone) and also acts at synapses (neurotransmitter)","t":"Biopsychology","id":1620},{"q":"What is the role of the hypothalamus in stress?","a":"It detects stress and activates both the sympathomedullary pathway and the HPA axis","t":"Biopsychology","id":1621},{"q":"What does CRH stand for?","a":"Corticotropin-releasing hormone","t":"Biopsychology","id":1622},{"q":"Where is the hypothalamus?","a":"At the base of the brain, just above the pituitary gland","t":"Biopsychology","id":1623},{"q":"What is homeostasis?","a":"Maintaining a stable internal environment, e.g. body temperature","t":"Biopsychology","id":1624},{"q":"Which part of the brain regulates homeostasis?","a":"The hypothalamus","t":"Biopsychology","id":1625},{"q":"What is the difference between the SAM and HPA stress responses?","a":"SAM is fast and short-lived (adrenaline); HPA is slower and longer-lasting (cortisol)","t":"Biopsychology","id":1626},{"q":"What does the cerebellum do?","a":"Coordinates balance and fine motor movement","t":"Biopsychology","id":1627},{"q":"What is the role of the frontal lobe?","a":"Higher-order thinking, planning, decision-making, personality and voluntary movement","t":"Biopsychology","id":1628},{"q":"What is the role of the parietal lobe?","a":"Processing sensory information such as touch and spatial awareness","t":"Biopsychology","id":1629},{"q":"What is the role of the temporal lobe?","a":"Processing auditory information, language comprehension and memory","t":"Biopsychology","id":1630},{"q":"What is the role of the occipital lobe?","a":"Processing visual information","t":"Biopsychology","id":1631},{"q":"Why does damage to the left motor area affect the right side of the body?","a":"Because of contralateral control – each hemisphere controls the opposite side of the body","t":"Biopsychology","id":1632},{"q":"What is aphasia?","a":"An impairment of language ability, usually caused by brain damage","t":"Biopsychology","id":1633},{"q":"Why might localisation of function be oversimplified?","a":"Complex functions involve networks of brain areas working together, not single regions","t":"Biopsychology","id":1634},{"q":"What did Lashley's research suggest about memory?","a":"Memory is not localised in a single area but distributed across the cortex","t":"Biopsychology","id":1635},{"q":"What is the connectivity view of brain function?","a":"Functions emerge from connections between brain regions rather than single areas","t":"Biopsychology","id":1636},{"q":"Why might lateralisation change with age?","a":"Szaflarski et al. (2006) found language became more lateralised to the left hemisphere with age in children, then less lateralised after 25","t":"Biopsychology","id":1637},{"q":"What did Szaflarski et al. (2006) find?","a":"Language becomes increasingly lateralised in children and adolescents, but lateralisation decreases after about age 25","t":"Biopsychology","id":1638},{"q":"Why is lateralisation thought to be adaptive?","a":"It allows the brain to carry out two tasks simultaneously, increasing neural processing capacity (Rogers et al., 2004)","t":"Biopsychology","id":1639},{"q":"What did Rogers et al. (2004) find?","a":"Lateralised chickens could find food while watching for predators, whereas non-lateralised chickens could not","t":"Biopsychology","id":1640},{"q":"What is 'constraint-induced movement therapy'?","a":"A rehabilitation technique where the unaffected limb is restrained so the affected limb must be used, encouraging plasticity","t":"Biopsychology","id":1641},{"q":"What is the difference between plasticity and functional recovery?","a":"Plasticity is the brain's general ability to change with experience; functional recovery is a type of plasticity after damage","t":"Biopsychology","id":1642},{"q":"Which age group shows the greatest plasticity?","a":"Children","t":"Biopsychology","id":1643},{"q":"Why might gender affect recovery from brain injury?","a":"Some research suggests women recover better because function is less lateralised, though evidence is mixed","t":"Biopsychology","id":1644},{"q":"What is a PET scan?","a":"Positron emission tomography – uses a radioactive tracer to show brain activity","t":"Biopsychology","id":1645},{"q":"Why is fMRI useful for localisation research?","a":"It shows which brain areas are active during specific tasks","t":"Biopsychology","id":1646},{"q":"Why can post-mortems not show causation?","a":"The brain abnormality may have developed after the behaviour or be unrelated","t":"Biopsychology","id":1647},{"q":"Why are EEGs used in sleep research?","a":"They show different brainwave patterns during stages of sleep","t":"Biopsychology","id":1648},{"q":"What is an 'electrode'?","a":"A sensor placed on the scalp to detect electrical activity in EEG","t":"Biopsychology","id":1649},{"q":"What is the difference between NSI and ISI in terms of the need met?","a":"NSI meets the need to be liked; ISI meets the need to be right","t":"Social Influence","id":1650},{"q":"What did Asch find when participants wrote answers privately?","a":"Conformity fell, showing the importance of NSI","t":"Social Influence","id":1651},{"q":"Why did conformity rise with task difficulty in Asch's study?","a":"The correct answer was less obvious, so participants looked to the majority for information (ISI)","t":"Social Influence","id":1652},{"q":"What does 'unanimity' mean?","a":"Everyone in the group agreeing","t":"Social Influence","id":1653},{"q":"What is a 'dissenter'?","a":"A person in the group who disagrees with the majority","t":"Social Influence","id":1654},{"q":"What did Milgram find when the experimenter was absent and gave instructions by phone?","a":"Obedience fell to 20.5%, and some participants pretended to give shocks","t":"Social Influence","id":1655},{"q":"Why do uniforms signal legitimacy?","a":"They are symbols of an institution's authority that society recognises","t":"Social Influence","id":1656},{"q":"What is the 'authority' in Milgram's study?","a":"The experimenter in a grey lab coat","t":"Social Influence","id":1657},{"q":"What is 'social influence'?","a":"The process by which individuals and groups change each other's attitudes and behaviours","t":"Social Influence","id":1658},{"q":"What is a 'minority' in social influence?","a":"A small group or individual whose views differ from the majority","t":"Social Influence","id":1659},{"q":"What is forensic psychology?","a":"The application of psychology to the criminal justice system, including explaining offending and dealing with offenders","t":"Forensic Psychology","id":1660},{"q":"What is offender profiling?","a":"A behavioural and analytical tool that helps investigators narrow the range of likely suspects by predicting characteristics of the offender from the crime scene","t":"Forensic Psychology","id":1661},{"q":"What are the three approaches to offender profiling on the specification?","a":"The typology (top-down) approach, The data-driven (bottom-up) approach including investigative psychology, Geographical profiling","t":"Forensic Psychology","id":1662},{"q":"What is the top-down approach to profiling?","a":"Matching crime scene evidence to a pre-existing typology of offenders (e.g. organised/disorganised)","t":"Forensic Psychology","id":1663},{"q":"Where did the top-down (typology) approach originate?","a":"The FBI Behavioral Science Unit in the USA in the 1970s","t":"Forensic Psychology","id":1664},{"q":"How was the FBI typology developed?","a":"From in-depth interviews with 36 sexually motivated serial killers, including Ted Bundy and Charles Manson","t":"Forensic Psychology","id":1665},{"q":"What are the two types of offender in the FBI typology?","a":"Organised and disorganised","t":"Forensic Psychology","id":1666},{"q":"Describe an organised offender.","a":"Shows evidence of planning, targets a victim who is a 'type', maintains control, leaves few clues, usually above-average intelligence, in a skilled job, socially and sexually competent, often married","t":"Forensic Psychology","id":1667},{"q":"Describe a disorganised offender.","a":"Little evidence of planning (spontaneous), leaves clues at the crime scene, little control, lower-than-average intelligence, unskilled work or unemployed, history of sexual dysfunction, often lives alone near the crime scene","t":"Forensic Psychology","id":1668},{"q":"What are the four main stages of constructing an FBI profile?","a":"Data assimilation, Crime scene classification, Crime reconstruction, Profile generation","t":"Forensic Psychology","id":1669},{"q":"What is data assimilation?","a":"Reviewing evidence such as crime scene photos, pathology reports and witness statements","t":"Forensic Psychology","id":1670},{"q":"What is crime scene classification?","a":"Deciding whether the crime is organised or disorganised","t":"Forensic Psychology","id":1671},{"q":"What is crime reconstruction?","a":"Forming hypotheses about the sequence of events, the behaviour of the victim and the offender","t":"Forensic Psychology","id":1672},{"q":"What is profile generation?","a":"Creating a hypothesis about the likely offender, e.g. their demographics, background and physical characteristics","t":"Forensic Psychology","id":1673},{"q":"Which crimes is the top-down approach most suited to?","a":"Crimes such as murder, rape and arson, where the crime scene reveals a lot about the offender","t":"Forensic Psychology","id":1674},{"q":"Why is top-down profiling less useful for burglary?","a":"Burglary reveals little about the offender's personality or motives","t":"Forensic Psychology","id":1675},{"q":"Give a strength of the organised/disorganised typology.","a":"Canter et al. (2004) found some evidence of a subset of organised features in serial killings","t":"Forensic Psychology","id":1676},{"q":"What did Canter et al. (2004) find?","a":"Analysis of 100 US serial killings found no clear distinction between organised and disorganised types, although a subset of organised features was common to most killings","t":"Forensic Psychology","id":1677},{"q":"Give a limitation of the FBI typology relating to its evidence.","a":"It was based on interviews with only 36 US killers, who may have been manipulative and not representative; not all were sexually motivated","t":"Forensic Psychology","id":1678},{"q":"Give a limitation of the organised/disorganised typology relating to its categories.","a":"It is too simplistic – many crime scenes have features of both types; Godwin (2002) argued killers' behaviour isn't static","t":"Forensic Psychology","id":1679},{"q":"Why is the top-down approach said to be based on outdated personality theory?","a":"It assumes behaviour is consistent across situations; Alison et al. (2002) argued behaviour is influenced by situational factors","t":"Forensic Psychology","id":1680},{"q":"What did Alison et al. (2002) argue?","a":"The typology approach relies on outdated trait theories of personality that assume behaviour is stable, whereas it is influenced by situation","t":"Forensic Psychology","id":1681},{"q":"What is the bottom-up approach to profiling?","a":"Working up from crime scene evidence to generate a profile, using statistical analysis of databases rather than pre-existing categories","t":"Forensic Psychology","id":1682},{"q":"In which country is bottom-up profiling associated?","a":"The UK","t":"Forensic Psychology","id":1683},{"q":"Who developed investigative psychology?","a":"David Canter","t":"Forensic Psychology","id":1684},{"q":"What is investigative psychology?","a":"A form of bottom-up profiling that applies psychological theory and statistical analysis to crime scene data to identify patterns","t":"Forensic Psychology","id":1685},{"q":"What is interpersonal coherence?","a":"The way an offender behaves at the crime scene (including interaction with the victim) may reflect their behaviour in everyday life","t":"Forensic Psychology","id":1686},{"q":"What is forensic awareness?","a":"When an offender takes steps to cover their tracks, suggesting they have had previous contact with police","t":"Forensic Psychology","id":1687},{"q":"What is the significance of time and place in investigative psychology?","a":"They may indicate where the offender lives or works","t":"Forensic Psychology","id":1688},{"q":"What are the smallest space analysis techniques?","a":"Statistical techniques that identify behaviours that commonly occur together at crime scenes","t":"Forensic Psychology","id":1689},{"q":"Who was John Duffy?","a":"The 'Railway Rapist', caught with help from David Canter's profile in the 1980s; 13 of 17 profile details were accurate","t":"Forensic Psychology","id":1690},{"q":"Why is the John Duffy case important?","a":"It was one of the first uses of investigative psychology in the UK and showed its usefulness","t":"Forensic Psychology","id":1691},{"q":"What is geographical profiling?","a":"A form of bottom-up profiling based on the location of linked crimes to make inferences about the likely home base of the offender","t":"Forensic Psychology","id":1692},{"q":"What is the circle theory?","a":"Canter's idea that an offender's pattern of offending forms a circle around their home base","t":"Forensic Psychology","id":1693},{"q":"What is a marauder?","a":"An offender who operates close to their home base","t":"Forensic Psychology","id":1694},{"q":"What is a commuter?","a":"An offender who travels a distance from their home base to commit crimes","t":"Forensic Psychology","id":1695},{"q":"What is crime mapping?","a":"Using the locations of crimes to identify patterns and the likely base of the offender","t":"Forensic Psychology","id":1696},{"q":"What is a spatial decision support system?","a":"A computer program (e.g. Rigel) that uses crime locations to help predict where the offender lives","t":"Forensic Psychology","id":1697},{"q":"What is 'distance decay'?","a":"Offenders are more likely to commit crimes close to home, with the frequency decreasing with distance","t":"Forensic Psychology","id":1698},{"q":"Give a strength of geographical profiling.","a":"Lundrigan and Canter (2001) found spatial consistency in 120 serial murder cases – offenders' homes were often in the centre of the pattern","t":"Forensic Psychology","id":1699},{"q":"What did Lundrigan and Canter (2001) find?","a":"In 120 US serial murder cases, disposal sites formed a pattern with the offender's home often at the centre, especially for marauders","t":"Forensic Psychology","id":1700},{"q":"Give a limitation of geographical profiling.","a":"It relies on accurate crime data; not all crimes are reported or linked; it doesn't identify an individual, only an area","t":"Forensic Psychology","id":1701},{"q":"Give a strength of investigative psychology.","a":"It is more scientific and objective than top-down profiling, based on statistical analysis of large databases","t":"Forensic Psychology","id":1702},{"q":"Give a limitation of bottom-up profiling.","a":"Copson (1995) found only 3% of cases led to an arrest due to profiling (though 83% of police found it useful)","t":"Forensic Psychology","id":1703},{"q":"What did Copson (1995) find?","a":"In a survey of police, 83% found profiling useful but it led to the identification of the offender in only 3% of cases","t":"Forensic Psychology","id":1704},{"q":"Why might bottom-up profiling be limited for rare crimes?","a":"There may not be enough data to find meaningful patterns","t":"Forensic Psychology","id":1705},{"q":"What is a 'signature' in offender profiling?","a":"A behaviour an offender performs that is not necessary to commit the crime but reflects their psychological needs","t":"Forensic Psychology","id":1706},{"q":"What is 'modus operandi'?","a":"The method of operating – the way an offender commits a crime","t":"Forensic Psychology","id":1707},{"q":"What is the difference between top-down and bottom-up profiling?","a":"Top-down matches evidence to existing typologies; bottom-up uses data to build a profile from the crime scene up","t":"Forensic Psychology","id":1708},{"q":"Why is profiling not used to find a single suspect?","a":"It narrows down the range of likely suspects rather than identifying one person","t":"Forensic Psychology","id":1709},{"q":"What was the Rachel Nickell case?","a":"A case where a psychological profile led police to focus on the wrong man (Colin Stagg), showing profiling can mislead investigations","t":"Forensic Psychology","id":1710},{"q":"What are the two biological explanations of offending on the specification?","a":"Genetic explanations, Neural explanations","t":"Forensic Psychology","id":1711},{"q":"What does the genetic explanation of offending suggest?","a":"Offenders inherit genes, or combinations of genes, that predispose them to commit crime","t":"Forensic Psychology","id":1712},{"q":"What did Lange (1929) find?","a":"13 pairs of MZ twins and 17 pairs of DZ twins where one had been in prison; 10 MZ pairs and 2 DZ pairs were both in prison","t":"Forensic Psychology","id":1713},{"q":"What did Christiansen (1977) find?","a":"A study of 3,586 Danish twin pairs found concordance for offending of 35% for MZ males and 13% for DZ males","t":"Forensic Psychology","id":1714},{"q":"What did Crowe (1972) find?","a":"Adopted children whose biological mothers had a criminal record had a 50% risk of having a criminal record by age 18, compared with 5% for controls","t":"Forensic Psychology","id":1715},{"q":"What is the MAOA gene?","a":"A gene that regulates serotonin; a low-activity variant has been linked to aggressive behaviour","t":"Forensic Psychology","id":1716},{"q":"What is the CDH13 gene?","a":"A gene linked to substance abuse and attention deficit disorder","t":"Forensic Psychology","id":1717},{"q":"What did Tiihonen et al. (2014) find?","a":"Analysis of 900 Finnish offenders found that the MAOA and CDH13 genes were associated with violent crime; 5–10% of violent crime in Finland may be attributable to these genes","t":"Forensic Psychology","id":1718},{"q":"What is the diathesis-stress model of offending?","a":"A genetic predisposition to offending may be triggered by environmental factors such as a dysfunctional upbringing","t":"Forensic Psychology","id":1719},{"q":"What did Mednick et al. (1984) find?","a":"In over 13,000 Danish adoptees, convictions were 13.5% when neither parent was convicted, 14.7% when only the adoptive parents were, 20% when only the biological parents were, and 24.5% when both were","t":"Forensic Psychology","id":1720},{"q":"Why does Mednick's study support the diathesis-stress model?","a":"The highest rate occurred when both the biological and adoptive parents had convictions, showing genes and environment interact","t":"Forensic Psychology","id":1721},{"q":"Give a limitation of genetic explanations relating to research design.","a":"Twin studies (e.g. Lange) often shared environments, and zygosity was sometimes judged by appearance, so results may be unreliable","t":"Forensic Psychology","id":1722},{"q":"Give a limitation of genetic explanations relating to determinism.","a":"If offending is genetically determined, offenders may not be held responsible, which conflicts with the legal system","t":"Forensic Psychology","id":1723},{"q":"What is the 'problem of defining crime' for genetic research?","a":"Crime is socially defined and varies by time and culture, so it cannot be directly inherited – it is more likely traits like aggression or impulsivity are","t":"Forensic Psychology","id":1724},{"q":"Why is genetic research into offending socially sensitive?","a":"It could lead to discrimination against people with certain genes or be used to excuse behaviour","t":"Forensic Psychology","id":1725},{"q":"What are neural explanations of offending?","a":"Offending is linked to differences in brain structure and neurochemistry, e.g. in the prefrontal cortex","t":"Forensic Psychology","id":1726},{"q":"What is antisocial personality disorder (APD)?","a":"A condition with reduced emotional responses, lack of empathy and disregard for others, often linked to offending","t":"Forensic Psychology","id":1727},{"q":"What did Raine (2000) find about APD?","a":"People with APD had an 11% reduction in grey matter in the prefrontal cortex compared with controls","t":"Forensic Psychology","id":1728},{"q":"What is the role of the prefrontal cortex in offending?","a":"It regulates emotional behaviour and impulse control; reduced activity may lead to impulsive and aggressive behaviour","t":"Forensic Psychology","id":1729},{"q":"What did Raine et al. (1997) find?","a":"PET scans of 41 murderers pleading not guilty by reason of insanity showed reduced activity in the prefrontal cortex compared with controls","t":"Forensic Psychology","id":1730},{"q":"What did Keysers (2011) find about mirror neurons in offenders?","a":"Offenders with psychopathy only showed empathy when asked to empathise, suggesting they have a 'neural switch' rather than no empathy","t":"Forensic Psychology","id":1731},{"q":"What is the role of the amygdala in offending?","a":"It processes emotions such as fear; abnormal functioning may reduce fear of punishment and empathy","t":"Forensic Psychology","id":1732},{"q":"Give a limitation of neural explanations.","a":"Correlational – brain differences may be caused by other factors (e.g. childhood abuse), and many people with such differences do not offend","t":"Forensic Psychology","id":1733},{"q":"Give a strength of neural explanations.","a":"Brain imaging provides objective, scientific evidence, e.g. Raine's PET scan findings","t":"Forensic Psychology","id":1734},{"q":"Why are biological explanations of offending seen as reductionist?","a":"They reduce complex criminal behaviour to genes or brain structures, ignoring social and psychological factors","t":"Forensic Psychology","id":1735},{"q":"What are the psychological explanations of offending on the specification?","a":"Eysenck's theory of the criminal personality, Cognitive explanations (level of moral reasoning and cognitive distortions), Differential association theory","t":"Forensic Psychology","id":1736},{"q":"What is Eysenck's theory of the criminal personality?","a":"Offenders have a personality type that is high in extraversion, neuroticism and psychoticism, which is innate and makes them more likely to offend","t":"Forensic Psychology","id":1737},{"q":"What are the three personality dimensions in Eysenck's theory?","a":"Extraversion, Neuroticism, Psychoticism","t":"Forensic Psychology","id":1738},{"q":"What is extraversion in Eysenck's theory?","a":"A trait characterised by being outgoing, sociable and seeking excitement; extraverts have an underactive nervous system","t":"Forensic Psychology","id":1739},{"q":"Why do extraverts seek excitement?","a":"They have an underactive nervous system, so they seek stimulation to raise arousal, which may lead to risk-taking","t":"Forensic Psychology","id":1740},{"q":"What is neuroticism in Eysenck's theory?","a":"A trait characterised by instability, anxiety and overreaction to threat; neurotics have an overactive sympathetic nervous system","t":"Forensic Psychology","id":1741},{"q":"What is psychoticism in Eysenck's theory?","a":"A trait characterised by being cold, aggressive and lacking empathy; linked to high testosterone","t":"Forensic Psychology","id":1742},{"q":"Why does Eysenck's theory suggest criminal personality is biological?","a":"Personality traits are innate and based on the nervous system","t":"Forensic Psychology","id":1743},{"q":"How does socialisation link to Eysenck's theory?","a":"People high in extraversion and neuroticism are harder to condition, so they don't learn to control antisocial behaviour through punishment","t":"Forensic Psychology","id":1744},{"q":"What questionnaire did Eysenck develop?","a":"The Eysenck Personality Questionnaire (EPQ)","t":"Forensic Psychology","id":1745},{"q":"Give research support for Eysenck.","a":"Eysenck and Eysenck (1977) compared 2,070 male prisoners with 2,422 controls and found prisoners scored higher on extraversion, neuroticism and psychoticism","t":"Forensic Psychology","id":1746},{"q":"Give a limitation of Eysenck's theory.","a":"Farrington et al. (1982) found offenders scored higher on psychoticism but not on extraversion","t":"Forensic Psychology","id":1747},{"q":"What did Farrington et al. (1982) find?","a":"A review found offenders scored high on psychoticism but not on extraversion and neuroticism","t":"Forensic Psychology","id":1748},{"q":"Give a limitation of Eysenck's theory relating to culture.","a":"Bartol and Holanchock (1979) found Hispanic and African-American offenders in New York were less extraverted than a control group","t":"Forensic Psychology","id":1749},{"q":"Give a limitation of Eysenck's theory relating to measurement.","a":"Personality may not be measurable with a questionnaire; personality may not be stable across situations (Moffitt)","t":"Forensic Psychology","id":1750},{"q":"What is Moffitt's (1993) criticism of Eysenck?","a":"Offending may be limited to adolescence for most people, so a stable personality theory can't explain all offending","t":"Forensic Psychology","id":1751},{"q":"What is level of moral reasoning?","a":"The way people think about moral issues; Kohlberg proposed people progress through stages of moral reasoning","t":"Forensic Psychology","id":1752},{"q":"Who proposed stages of moral reasoning?","a":"Kohlberg","t":"Forensic Psychology","id":1753},{"q":"What are Kohlberg's three levels of moral reasoning?","a":"Pre-conventional, Conventional, Post-conventional","t":"Forensic Psychology","id":1754},{"q":"What is pre-conventional morality?","a":"Moral reasoning based on avoiding punishment and gaining rewards","t":"Forensic Psychology","id":1755},{"q":"Which level of moral reasoning are offenders likely to be at?","a":"Pre-conventional – they are more likely to break the law if they think they can avoid punishment or gain reward","t":"Forensic Psychology","id":1756},{"q":"How did Kohlberg measure moral reasoning?","a":"Using moral dilemmas such as the Heinz dilemma","t":"Forensic Psychology","id":1757},{"q":"What is the Heinz dilemma?","a":"A man must decide whether to steal a drug he can't afford to save his dying wife","t":"Forensic Psychology","id":1758},{"q":"Give research support for moral reasoning and offending.","a":"Palmer and Hollin (1998) found offenders had less mature moral reasoning than non-offenders","t":"Forensic Psychology","id":1759},{"q":"What did Palmer and Hollin (1998) find?","a":"126 convicted offenders showed less mature moral reasoning than 332 non-offenders on the Sociomoral Reflection Measure","t":"Forensic Psychology","id":1760},{"q":"Give a limitation of moral reasoning explanations.","a":"Moral reasoning may be different for different types of crime; Thornton and Reid (1982) found pre-conventional reasoning in crimes for financial gain but not impulsive crimes","t":"Forensic Psychology","id":1761},{"q":"Why might moral reasoning be only part of the explanation for offending?","a":"People may reason morally but still behave immorally; moral reasoning doesn't always match moral behaviour","t":"Forensic Psychology","id":1762},{"q":"What is Gilligan's criticism of Kohlberg's theory?","a":"It is based on men and has gender bias – women may reason with an 'ethics of care' rather than justice","t":"Forensic Psychology","id":1763},{"q":"What are cognitive distortions?","a":"Errors or biases in information processing, characterised by faulty and irrational thinking","t":"Forensic Psychology","id":1764},{"q":"What are the two cognitive distortions on the specification?","a":"Hostile attribution bias, Minimalisation","t":"Forensic Psychology","id":1765},{"q":"What is hostile attribution bias?","a":"The tendency to misinterpret others' actions as aggressive or threatening, even when they are not","t":"Forensic Psychology","id":1766},{"q":"Give an example of hostile attribution bias.","a":"Thinking someone who looks at you in a bar is challenging you, and responding aggressively","t":"Forensic Psychology","id":1767},{"q":"What did Schönenberg and Justye (2014) find?","a":"55 violent offenders shown ambiguous faces were more likely to see them as angry and hostile than controls","t":"Forensic Psychology","id":1768},{"q":"What is minimalisation?","a":"Downplaying or reducing the seriousness of an offence","t":"Forensic Psychology","id":1769},{"q":"Give an example of minimalisation.","a":"A burglar describing themselves as 'just doing a job', or a sex offender saying the victim was 'asking for it'","t":"Forensic Psychology","id":1770},{"q":"What did Barbaree (1991) find?","a":"54% of rapists denied they had committed an offence and 40% minimised the harm they had caused","t":"Forensic Psychology","id":1771},{"q":"What did Kennedy and Grubin (1992) find?","a":"Sex offenders often minimised their offences, with some blaming the victim","t":"Forensic Psychology","id":1772},{"q":"Give a strength of cognitive distortions explanation.","a":"Real-world application – CBT for offenders aims to challenge distortions such as minimalisation, and has been linked to reduced reoffending","t":"Forensic Psychology","id":1773},{"q":"Give a limitation of cognitive distortions.","a":"They may explain the maintenance of offending rather than its cause; it is also unclear whether distortions precede offending","t":"Forensic Psychology","id":1774},{"q":"What is differential association theory?","a":"Sutherland's (1947) theory that offending is learned through association with others who have pro-criminal attitudes and techniques","t":"Forensic Psychology","id":1775},{"q":"Who proposed differential association theory?","a":"Edwin Sutherland (1947)","t":"Forensic Psychology","id":1776},{"q":"What two things are learned in differential association theory?","a":"Pro-criminal attitudes, Specific criminal techniques","t":"Forensic Psychology","id":1777},{"q":"When is a person likely to offend according to Sutherland?","a":"When the number of pro-criminal attitudes they are exposed to outweighs the number of anti-criminal attitudes","t":"Forensic Psychology","id":1778},{"q":"Why does differential association theory explain reoffending after prison?","a":"Prisoners learn new techniques and attitudes from other inmates","t":"Forensic Psychology","id":1779},{"q":"What factors affect the strength of associations according to Sutherland?","a":"Frequency, Duration, Priority (how early in life), Intensity (how important the person is)","t":"Forensic Psychology","id":1780},{"q":"Give a strength of differential association theory.","a":"It moves away from biological explanations, and explains why crime is found in all social classes (e.g. white-collar crime)","t":"Forensic Psychology","id":1781},{"q":"Give a limitation of differential association theory.","a":"It is hard to test – you can't measure the number of pro-criminal attitudes a person has been exposed to","t":"Forensic Psychology","id":1782},{"q":"Give another limitation of differential association theory.","a":"It ignores biological factors; not everyone exposed to pro-criminal attitudes offends","t":"Forensic Psychology","id":1783},{"q":"What did Osborn and West (1979) find?","a":"Sons of fathers with criminal convictions were more likely to have convictions (40%) than sons of non-criminal fathers (13%) – supports DAT but could also be genetic","t":"Forensic Psychology","id":1784},{"q":"What is the difference between DAT and SLT?","a":"DAT focuses on associations and attitudes learned from groups; SLT focuses on imitation of role models and vicarious reinforcement","t":"Forensic Psychology","id":1785},{"q":"What is custodial sentencing?","a":"A sentence where a convicted offender spends time in prison or another closed institution","t":"Forensic Psychology","id":1786},{"q":"What are the four aims of custodial sentencing?","a":"Deterrence, Incapacitation, Retribution, Rehabilitation","t":"Forensic Psychology","id":1787},{"q":"What is deterrence?","a":"Using the unpleasant experience of prison to put people off offending","t":"Forensic Psychology","id":1788},{"q":"What is individual deterrence?","a":"Preventing the offender from reoffending because they don't want to return to prison","t":"Forensic Psychology","id":1789},{"q":"What is general deterrence?","a":"Sending a message to society that crime will be punished, discouraging others from offending","t":"Forensic Psychology","id":1790},{"q":"Which psychological principle is deterrence based on?","a":"Behaviourist principles – punishment (operant conditioning) and vicarious punishment (SLT)","t":"Forensic Psychology","id":1791},{"q":"What is incapacitation?","a":"Removing the offender from society to protect the public","t":"Forensic Psychology","id":1792},{"q":"What is retribution?","a":"Society enacting revenge – the offender should suffer in proportion to the seriousness of their crime","t":"Forensic Psychology","id":1793},{"q":"What is rehabilitation?","a":"Reforming the offender through education, training and treatment, so they don't reoffend on release","t":"Forensic Psychology","id":1794},{"q":"Which aim of custodial sentencing is most future-focused?","a":"Rehabilitation (and deterrence)","t":"Forensic Psychology","id":1795},{"q":"Give three psychological effects of custodial sentencing.","a":"Stress and depression, Institutionalisation, Prisonisation","t":"Forensic Psychology","id":1796},{"q":"What did the Prison Reform Trust find about suicide and self-harm in prison?","a":"Suicide rates are much higher in prison than in the general population, especially among young, single men in the first 24 hours","t":"Forensic Psychology","id":1797},{"q":"What is institutionalisation in prison?","a":"Offenders become so used to prison routines and norms that they are unable to function outside prison","t":"Forensic Psychology","id":1798},{"q":"What is prisonisation?","a":"Adopting the 'inmate code' – behaviours that are unacceptable outside prison become normal within it","t":"Forensic Psychology","id":1799},{"q":"What is 'the inmate code'?","a":"The informal norms and values that prisoners are socialised into, e.g. not 'grassing'","t":"Forensic Psychology","id":1800},{"q":"Give an example of prisonisation.","a":"Using violence or trading goods to gain status and survive in prison","t":"Forensic Psychology","id":1801},{"q":"What is recidivism?","a":"Reoffending after receiving punishment for a previous crime","t":"Forensic Psychology","id":1802},{"q":"What is the reoffending rate in the UK?","a":"About 25% of adults reoffend within a year; the rate is higher for short sentences and young offenders","t":"Forensic Psychology","id":1803},{"q":"What is meant by prisons being 'universities of crime'?","a":"Prisoners may learn new criminal techniques and attitudes from other inmates, increasing reoffending – links to differential association theory","t":"Forensic Psychology","id":1804},{"q":"What did Dooley (1990) find?","a":"A study of 300 prison suicides found most were not related to prison conditions but to guilt or mental illness","t":"Forensic Psychology","id":1805},{"q":"Give a limitation of research into the effects of custodial sentencing.","a":"Individual differences – not all prisoners are affected in the same way; it depends on age, gender, length of sentence and prior mental health","t":"Forensic Psychology","id":1806},{"q":"Give a limitation of custodial sentencing relating to recidivism.","a":"High reoffending rates suggest prison doesn't deter or rehabilitate effectively","t":"Forensic Psychology","id":1807},{"q":"How does the Norwegian prison system differ from the UK's?","a":"Norway focuses on rehabilitation, with better conditions and education; recidivism is about 20% within two years, much lower than the UK","t":"Forensic Psychology","id":1808},{"q":"Give a strength of custodial sentencing relating to training.","a":"Some prisons offer education and training, which can improve prisoners' chances of employment on release","t":"Forensic Psychology","id":1809},{"q":"What is behaviour modification in custody?","a":"Using operant conditioning (reinforcement) to replace undesirable behaviour with desirable behaviour in prisoners","t":"Forensic Psychology","id":1810},{"q":"What is a token economy?","a":"A behaviour modification programme where prisoners receive tokens for good behaviour that can be exchanged for rewards","t":"Forensic Psychology","id":1811},{"q":"Which learning principle is a token economy based on?","a":"Operant conditioning (positive reinforcement)","t":"Forensic Psychology","id":1812},{"q":"What is a secondary reinforcer?","a":"Something that is not rewarding in itself but can be exchanged for a primary reinforcer, e.g. tokens","t":"Forensic Psychology","id":1813},{"q":"What is a primary reinforcer?","a":"Something that is rewarding in itself, e.g. food or phone calls","t":"Forensic Psychology","id":1814},{"q":"Give examples of rewards in a token economy.","a":"Phone calls to family, extra visits, time in the gym, food, cigarettes","t":"Forensic Psychology","id":1815},{"q":"How can token economies punish behaviour?","a":"Tokens can be removed for undesirable behaviour (negative punishment)","t":"Forensic Psychology","id":1816},{"q":"What are the stages of setting up a token economy?","a":"Define target behaviours (operationalise), Select reinforcers, Train staff to use it consistently, Check behaviour changes (baseline and follow-up)","t":"Forensic Psychology","id":1817},{"q":"Why must behaviours be operationalised in a token economy?","a":"So staff know exactly which behaviours to reward and can do so consistently","t":"Forensic Psychology","id":1818},{"q":"What is behaviour shaping in a token economy?","a":"Rewarding behaviours that gradually become closer to the target behaviour","t":"Forensic Psychology","id":1819},{"q":"Give a strength of behaviour modification.","a":"Easy to implement – it doesn't need specialist professionals, just trained staff; Hobbs and Holt (1976) found it improved behaviour in young offenders","t":"Forensic Psychology","id":1820},{"q":"What did Hobbs and Holt (1976) find?","a":"A token economy introduced to three groups of young offenders improved positive behaviour compared with a non-token group","t":"Forensic Psychology","id":1821},{"q":"Give a limitation of behaviour modification relating to reoffending.","a":"Behaviour changes may not be maintained after release, as the reward system isn't present outside prison","t":"Forensic Psychology","id":1822},{"q":"Give an ethical limitation of token economies.","a":"Prisoners may have basic privileges removed, which can be seen as dehumanising and manipulative","t":"Forensic Psychology","id":1823},{"q":"What did Blackburn (1993) say about token economies?","a":"They have little rehabilitative value – offenders quickly lose the positive behaviour when they leave prison","t":"Forensic Psychology","id":1824},{"q":"Why do token economies need consistency?","a":"If staff don't reward consistently, behaviour won't be reinforced and the programme will fail","t":"Forensic Psychology","id":1825},{"q":"What is anger management?","a":"A form of CBT in which offenders are taught to recognise the triggers of their anger and develop techniques to reduce it","t":"Forensic Psychology","id":1826},{"q":"Which approach is anger management based on?","a":"The cognitive-behavioural approach","t":"Forensic Psychology","id":1827},{"q":"Who developed the three stages of anger management?","a":"Novaco (1975)","t":"Forensic Psychology","id":1828},{"q":"What are the three stages of anger management?","a":"Cognitive preparation, Skill acquisition, Application practice","t":"Forensic Psychology","id":1829},{"q":"What happens in cognitive preparation?","a":"The offender reflects on past experiences to identify their typical pattern of anger and triggers","t":"Forensic Psychology","id":1830},{"q":"What happens in skill acquisition?","a":"Offenders learn techniques to deal with anger-provoking situations, e.g. self-talk, relaxation, assertiveness","t":"Forensic Psychology","id":1831},{"q":"What happens in application practice?","a":"Off
