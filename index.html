ng to individual differences.","a":"Huseman et al. (1987) – 'benevolents' are happy to give more, while 'entitleds' believe they deserve more","t":"Relationships","id":2710},{"q":"Give a limitation of equity theory relating to gender.","a":"DeMaris et al. (2007) found women were more dissatisfied by under-benefit, suggesting gender differences","t":"Relationships","id":2711},{"q":"Give a limitation of equity theory relating to research.","a":"Berg and McQuinn (1986) found equity did not increase over time in dating couples, and other variables (e.g. self-disclosure) predicted satisfaction better","t":"Relationships","id":2712},{"q":"Who developed the investment model of commitment?","a":"Rusbult (1983)","t":"Relationships","id":2713},{"q":"What are the three factors that determine commitment in Rusbult's model?","a":"Satisfaction level, Comparison with alternatives, Investment size","t":"Relationships","id":2714},{"q":"What is satisfaction level in Rusbult's model?","a":"The extent to which partners are gratified by the relationship – many rewards and few costs","t":"Relationships","id":2715},{"q":"What is comparison with alternatives in Rusbult's model?","a":"Whether needs could be better met by another partner or by being alone","t":"Relationships","id":2716},{"q":"What is investment size in Rusbult's model?","a":"The resources that would be lost if the relationship ended","t":"Relationships","id":2717},{"q":"What are intrinsic investments?","a":"Resources put directly into the relationship, e.g. money, effort, self-disclosure","t":"Relationships","id":2718},{"q":"What are extrinsic investments?","a":"Resources that develop as a result of the relationship, e.g. a shared house, children, mutual friends, shared memories","t":"Relationships","id":2719},{"q":"Why can people stay in unsatisfying relationships according to Rusbult?","a":"They have invested a lot and have few alternatives, so commitment remains high","t":"Relationships","id":2720},{"q":"What are relationship maintenance mechanisms?","a":"Behaviours that committed partners use to keep the relationship going","t":"Relationships","id":2721},{"q":"Give four relationship maintenance mechanisms.","a":"Accommodation, Willingness to sacrifice, Forgiveness, Positive illusions, Ridiculing alternatives","t":"Relationships","id":2722},{"q":"What is accommodation?","a":"Acting in ways that promote the relationship rather than retaliating, e.g. being nice when the partner is not","t":"Relationships","id":2723},{"q":"What are positive illusions?","a":"Seeing the partner more positively than they really are","t":"Relationships","id":2724},{"q":"What is ridiculing alternatives?","a":"Being negative about potential alternative partners","t":"Relationships","id":2725},{"q":"What did Le and Agnew (2003) find?","a":"A meta-analysis of 52 studies (over 11,000 participants) found satisfaction, alternatives and investment all predicted commitment, and commitment predicted stability","t":"Relationships","id":2726},{"q":"Give a strength of Rusbult's model relating to abusive relationships.","a":"Rusbult and Martz (1995) found women in a shelter who had more investment and poorer alternatives were more likely to return to an abusive partner","t":"Relationships","id":2727},{"q":"Give a limitation of Rusbult's model relating to investment.","a":"Goodfriend and Agnew (2008) argued investment includes future plans, not just past investments","t":"Relationships","id":2728},{"q":"Give a limitation of Rusbult's model relating to research.","a":"Much research is correlational and uses self-report, so it can't show cause and effect","t":"Relationships","id":2729},{"q":"Give a strength of Rusbult's model compared with SET.","a":"It explains why people stay in unsatisfying relationships (investment), which SET cannot","t":"Relationships","id":2730},{"q":"Who developed the phase model of relationship breakdown?","a":"Steve Duck (1982)","t":"Relationships","id":2731},{"q":"What are the four phases in Duck's model?","a":"Intra-psychic, Dyadic, Social, Grave-dressing","t":"Relationships","id":2732},{"q":"What is the intra-psychic phase?","a":"One partner privately thinks about their dissatisfaction, broods and may confide in a trusted friend","t":"Relationships","id":2733},{"q":"What is the threshold for the intra-psychic phase?","a":"'I can't stand this anymore'","t":"Relationships","id":2734},{"q":"What is the dyadic phase?","a":"The partners discuss their dissatisfaction; they may argue about equity and the future of the relationship","t":"Relationships","id":2735},{"q":"What is the threshold for the dyadic phase?","a":"'I'd be justified in withdrawing'","t":"Relationships","id":2736},{"q":"What is the social phase?","a":"The breakdown is made public; friends take sides and support is sought","t":"Relationships","id":2737},{"q":"What is the threshold for the social phase?","a":"'I mean it'","t":"Relationships","id":2738},{"q":"What is the grave-dressing phase?","a":"The partners create their own version of the breakdown story to protect their reputations and prepare for new relationships","t":"Relationships","id":2739},{"q":"What is the threshold for the grave-dressing phase?","a":"'It's now inevitable'","t":"Relationships","id":2740},{"q":"Which phase did Rollie and Duck (2006) add?","a":"The resurrection phase","t":"Relationships","id":2741},{"q":"What is the resurrection phase?","a":"The individual reflects on the relationship, learns from it and prepares for future relationships","t":"Relationships","id":2742},{"q":"Give a strength of Duck's model relating to application.","a":"It suggests interventions at different stages, e.g. improving communication in the dyadic phase, or helping partners 'save face' in the grave-dressing phase","t":"Relationships","id":2743},{"q":"Give a limitation of Duck's model relating to its description.","a":"It describes breakdown rather than explaining why it happens","t":"Relationships","id":2744},{"q":"Give a limitation of Duck's model relating to research methods.","a":"Ethical and practical problems – researching people going through breakdown can be distressing, and much research is retrospective","t":"Relationships","id":2745},{"q":"Give a limitation of Duck's model relating to culture.","a":"It is based on Western, individualist relationships; in collectivist cultures relationships are less voluntary and families are more involved","t":"Relationships","id":2746},{"q":"What did Tashiro and Frazier (2003) find?","a":"Students who had broken up reported emotional distress but also personal growth – supporting the resurrection phase","t":"Relationships","id":2747},{"q":"Give a strength of Duck's model relating to research support.","a":"Tashiro and Frazier (2003) support the resurrection phase; Duck's model reflects the experiences of many people","t":"Relationships","id":2748},{"q":"Why is Duck's model called a stage theory?","a":"It proposes people go through stages in a set order, though not everyone goes through all stages","t":"Relationships","id":2749},{"q":"What is a limitation of stage models of relationship breakdown?","a":"Not everyone goes through every stage in the same order; some relationships end suddenly","t":"Relationships","id":2750},{"q":"What are virtual relationships?","a":"Relationships conducted through social media or other online communication","t":"Relationships","id":2751},{"q":"What are the three aspects of online relationships on the specification?","a":"Self-disclosure, Use of deception, Effects of absence of gating","t":"Relationships","id":2752},{"q":"What does 'CMC' stand for?","a":"Computer-mediated communication","t":"Relationships","id":2753},{"q":"What is the reduced cues theory?","a":"Sproull and Kiesler (1986) – online relationships lack non-verbal cues (e.g. facial expression, tone), leading to deindividuation and less self-disclosure","t":"Relationships","id":2754},{"q":"What is deindividuation in online relationships?","a":"A loss of individual identity when anonymous online, which may lead to disinhibition such as blunt or aggressive communication","t":"Relationships","id":2755},{"q":"What is the hyperpersonal model?","a":"Walther (1996) – online relationships can be more personal and involve greater self-disclosure than face-to-face relationships","t":"Relationships","id":2756},{"q":"Why do online relationships develop faster according to the hyperpersonal model?","a":"People self-disclose more quickly and intimately because they are anonymous and feel less at risk","t":"Relationships","id":2757},{"q":"What is selective self-presentation?","a":"Controlling what we reveal about ourselves online, presenting ourselves in an idealised way","t":"Relationships","id":2758},{"q":"What is the 'boom and bust' of online relationships?","a":"Online relationships can start quickly with intense self-disclosure, but they may end quickly if trust is not built","t":"Relationships","id":2759},{"q":"Give research support for the hyperpersonal model.","a":"Whitty and Joinson (2009) found questions and answers in online discussions were more direct and probing than face-to-face","t":"Relationships","id":2760},{"q":"Give a limitation of the reduced cues theory.","a":"Online communication does contain cues, e.g. emoticons/emojis, acronyms like 'LOL', and response speed","t":"Relationships","id":2761},{"q":"What did Back et al. (2010) find about Facebook profiles?","a":"Profiles reflected people's actual personalities rather than idealised versions – suggesting online deception may be less common than assumed","t":"Relationships","id":2762},{"q":"What is the use of deception in online relationships?","a":"Presenting false information about oneself, e.g. age, appearance, or identity (including 'catfishing')","t":"Relationships","id":2763},{"q":"What is catfishing?","a":"Creating a fake online identity to deceive someone into a relationship","t":"Relationships","id":2764},{"q":"What did Toma et al. (2008) find?","a":"Online daters lied about weight (men and women), height (men) and age – but deceptions were usually small","t":"Relationships","id":2765},{"q":"Why might deception be common online?","a":"Absence of gating and anonymity make it easy to present an idealised or false self","t":"Relationships","id":2766},{"q":"What did Hancock et al. (2007) find?","a":"Most online daters told small lies (e.g. about height or weight) to look more attractive, but big lies were rare because they expected to meet","t":"Relationships","id":2767},{"q":"Why might people limit their deception online?","a":"If they expect to meet the person face to face, big lies would be discovered","t":"Relationships","id":2768},{"q":"What is 'gating'?","a":"Obstacles to the formation of a relationship, such as physical appearance, stutter, shyness or social anxiety","t":"Relationships","id":2769},{"q":"What is the absence of gating?","a":"Online, these barriers are removed, so relationships can form based on self-disclosure rather than appearance","t":"Relationships","id":2770},{"q":"How might the absence of gating benefit shy people?","a":"They can form relationships based on personality without their shyness or appearance acting as a barrier","t":"Relationships","id":2771},{"q":"What did McKenna and Bargh (1999) find?","a":"Lonely and socially anxious people were better able to express their 'true selves' online and formed close relationships, many of which lasted","t":"Relationships","id":2772},{"q":"Give a real-world application of the absence of gating.","a":"Online relationships may help people with social anxiety or disabilities form relationships","t":"Relationships","id":2773},{"q":"Give a limitation of the absence of gating.","a":"People may be too anonymous – the lack of gating also makes deception easier","t":"Relationships","id":2774},{"q":"What did Baker and Oswald (2010) find?","a":"Shy people who used Facebook reported better quality friendships than shy people who didn't","t":"Relationships","id":2775},{"q":"Why might online and offline relationships not be separate?","a":"Most online relationships also involve offline contact; people use social media to maintain existing friendships","t":"Relationships","id":2776},{"q":"Give a limitation of research into online relationships.","a":"Technology and social media change rapidly, so research quickly lacks temporal validity","t":"Relationships","id":2777},{"q":"What is a parasocial relationship?","a":"A one-sided relationship with a celebrity or media figure, where the individual invests emotional energy but the other is unaware of their existence","t":"Relationships","id":2778},{"q":"What is a parasocial relationship's key feature?","a":"It is one-sided and not reciprocated","t":"Relationships","id":2779},{"q":"Who developed the Celebrity Attitude Scale?","a":"McCutcheon et al. (2002)","t":"Relationships","id":2780},{"q":"What are the three levels of parasocial relationships?","a":"Entertainment-social, Intense-personal, Borderline-pathological","t":"Relationships","id":2781},{"q":"What is the entertainment-social level?","a":"Celebrities are seen as a source of entertainment and a topic of conversation with others","t":"Relationships","id":2782},{"q":"What is the intense-personal level?","a":"A deeper level where people feel a personal connection and have obsessive thoughts about the celebrity","t":"Relationships","id":2783},{"q":"What is the borderline-pathological level?","a":"An extreme level with uncontrollable fantasies and extreme behaviours, e.g. stalking or spending large amounts of money","t":"Relationships","id":2784},{"q":"Give an example of a borderline-pathological statement.","a":"'If I walked through the door of my favourite celebrity's house, they would be happy to see me'","t":"Relationships","id":2785},{"q":"What did Maltby et al. (2006) find?","a":"Female teenagers with intense-personal parasocial relationships had poorer body image, particularly when the celebrity's body was admired","t":"Relationships","id":2786},{"q":"What is the absorption-addiction model?","a":"McCutcheon (2002) – parasocial relationships develop when people seek to fill deficits in their lives (absorption), and the relationship becomes addictive","t":"Relationships","id":2787},{"q":"What is absorption?","a":"Focusing attention on a celebrity to escape reality and establish a sense of identity","t":"Relationships","id":2788},{"q":"What is addiction in the absorption-addiction model?","a":"The need for a stronger 'dose' of involvement with the celebrity, which may lead to extreme behaviours like stalking","t":"Relationships","id":2789},{"q":"Give research support for the absorption-addiction model.","a":"Maltby et al. (2003) found entertainment-social was linked to extraversion, intense-personal to neuroticism, and borderline-pathological to psychoticism","t":"Relationships","id":2790},{"q":"Give a limitation of the absorption-addiction model.","a":"It describes rather than explains parasocial relationships; research is correlational so it can't show cause and effect","t":"Relationships","id":2791},{"q":"What is the attachment theory explanation of parasocial relationships?","a":"People with insecure attachments may form parasocial relationships to meet their unmet attachment needs","t":"Relationships","id":2792},{"q":"Which attachment type is most likely to form parasocial relationships?","a":"Insecure-resistant (anxious), because they want a relationship without the risk of rejection","t":"Relationships","id":2793},{"q":"Why are insecure-avoidant people unlikely to form parasocial relationships?","a":"They avoid intimacy and closeness in any relationships","t":"Relationships","id":2794},{"q":"Who proposed the attachment theory explanation of parasocial relationships?","a":"Weiss (1991), developed by Cole and Leets (1999)","t":"Relationships","id":2795},{"q":"What did Cole and Leets (1999) find?","a":"Insecure-resistant individuals were most likely to form parasocial relationships","t":"Relationships","id":2796},{"q":"Give a limitation of the attachment explanation.","a":"McCutcheon et al. (2006) found no link between attachment type and parasocial relationships in 299 participants","t":"Relationships","id":2797},{"q":"Give a limitation of research into parasocial relationships.","a":"Most research relies on self-report, which may be affected by social desirability bias; mostly correlational","t":"Relationships","id":2798},{"q":"Why might parasocial relationships be beneficial?","a":"They can provide models for social behaviour, a sense of belonging, and a topic of conversation with others","t":"Relationships","id":2799},{"q":"Why might parasocial relationships be harmful?","a":"At extreme levels they may lead to stalking, poor body image or financial problems","t":"Relationships","id":2800},{"q":"How does social media affect parasocial relationships?","a":"Celebrities can interact directly with fans (e.g. replying online), making relationships feel more reciprocal","t":"Relationships","id":2801},{"q":"What is 'celebrity worship'?","a":"Obsessive interest in a celebrity, measured by the Celebrity Attitude Scale","t":"Relationships","id":2802},{"q":"Why are parasocial relationships appealing according to Schiappa et al. (2007)?","a":"They require no commitment, carry no risk of rejection and involve no demands, criticism or arguments","t":"Relationships","id":2803},{"q":"What is the difference between a parasocial relationship and a normal relationship?","a":"A parasocial relationship is one-sided, whereas normal relationships are reciprocal","t":"Relationships","id":2804},{"q":"Emma and Sam have been dating for 3 weeks and Emma has told Sam about a family problem. Which factor of attraction is this?","a":"Self-disclosure","t":"Relationships","id":2805},{"q":"Why might Emma's self-disclosure after 3 weeks be too fast?","a":"According to social penetration theory, revealing deep information too early can reduce attraction","t":"Relationships","id":2806},{"q":"Kate and Jack both went to the same university and grew up in the same town. Which filter is this?","a":"Social demography","t":"Relationships","id":2807},{"q":"A couple always argue about who does the housework and feel it's unfair. Which theory best explains their dissatisfaction?","a":"Equity theory","t":"Relationships","id":2808},{"q":"Sarah stays with her partner because they have a house together and two children, though she is unhappy. Which theory explains this?","a":"Rusbult's investment model","t":"Relationships","id":2809},{"q":"Tom is unhappy with his partner and has started telling his friends about his problems. Which phase of Duck's model is this?","a":"The social phase","t":"Relationships","id":2810},{"q":"Leah is privately thinking about everything wrong with her relationship. Which phase of Duck's model is this?","a":"The intra-psychic phase","t":"Relationships","id":2811},{"q":"After a breakup, Josh tells everyone the relationship failed because they were too different. Which phase is this?","a":"The grave-dressing phase","t":"Relationships","id":2812},{"q":"Mia is spending hours reading about a pop star and feels she knows him personally. Which level of parasocial relationship is this?","a":"Intense-personal","t":"Relationships","id":2813},{"q":"Dev and Priya are both vegetarian and share the same political views. Which filter is this?","a":"Similarity in attitudes","t":"Relationships","id":2814},{"q":"Chloe is very organised and her partner is very spontaneous; they say they balance each other out. Which filter is this?","a":"Complementarity","t":"Relationships","id":2815},{"q":"Why might someone with low physical attractiveness still be matched with a very attractive partner?","a":"Complex matching – they may compensate with other qualities such as wealth, humour or status","t":"Relationships","id":2816},{"q":"A person compares their current relationship with a previous better one and feels dissatisfied. What concept from SET is this?","a":"Comparison level (CL)","t":"Relationships","id":2817},{"q":"A person feels they could be happier with someone they met at work. What concept from SET is this?","a":"Comparison level for alternatives (CLalt)","t":"Relationships","id":2818},{"q":"Why is the matching hypothesis sometimes seen as about 'realistic' choice?","a":"We pick partners we are likely to get, avoiding rejection","t":"Relationships","id":2819},{"q":"What is the difference between SET and equity theory?","a":"SET focuses on maximising personal profit; equity theory focuses on fairness between partners","t":"Relationships","id":2820},{"q":"What does Rusbult's model add to SET?","a":"Investment – explaining why people stay in relationships that are not satisfying","t":"Relationships","id":2821},{"q":"How do the economic theories of relationships view relationships?","a":"As exchanges of rewards and costs, like a business transaction","t":"Relationships","id":2822},{"q":"Why might economic theories be seen as reductionist?","a":"They reduce complex relationships to a calculation of rewards and costs, ignoring love and emotion","t":"Relationships","id":2823},{"q":"What did Clark and Mills (2011) argue about communal and exchange relationships?","a":"Romantic relationships are communal (based on care), not exchange relationships, so partners don't 'keep score'","t":"Relationships","id":2824},{"q":"Why are economic theories less relevant to communal relationships?","a":"In communal relationships partners give without expecting anything in return","t":"Relationships","id":2825},{"q":"What is an idiographic criticism of relationships research?","a":"Relationships are unique, so general theories may not capture individual experience","t":"Relationships","id":2826},{"q":"Why is much relationships research criticised for being heterosexual-biased?","a":"It focuses on heterosexual couples, so findings may not apply to gay and lesbian relationships","t":"Relationships","id":2827},{"q":"Why is relationships research often culturally biased?","a":"Most research is on Western, voluntary, individualist relationships, not arranged marriages or collectivist cultures","t":"Relationships","id":2828},{"q":"Why may relationships research be socially sensitive?","a":"It could be used to judge certain relationship types (e.g. same-sex, arranged) as less valid","t":"Relationships","id":2829},{"q":"What is the difference between voluntary and non-voluntary relationships?","a":"Voluntary relationships are freely chosen (common in the West); non-voluntary relationships may be arranged by families","t":"Relationships","id":2830},{"q":"Why might research into relationships be low in temporal validity?","a":"Social norms (e.g. about marriage, gender roles, online dating) change over time","t":"Relationships","id":2831},{"q":"What type of research method is commonly used to study relationships?","a":"Self-report questionnaires and interviews","t":"Relationships","id":2832},{"q":"What is a limitation of self-report in relationships research?","a":"Social desirability bias – people may present their relationships positively","t":"Relationships","id":2833},{"q":"What is a limitation of retrospective data in breakdown research?","a":"People may recall events inaccurately after the relationship has ended","t":"Relationships","id":2834},{"q":"What is a 'dyad'?","a":"A pair of people in a relationship","t":"Relationships","id":2835},{"q":"What is 'dyadic' in Duck's model?","a":"The stage involving both partners discussing the relationship","t":"Relationships","id":2836},{"q":"Which theory suggests self-disclosure increases intimacy only if it is reciprocal?","a":"Reis and Shaver's intimacy model","t":"Relationships","id":2837},{"q":"Which theory suggests online relationships may be more intimate than face-to-face ones?","a":"Walther's hyperpersonal model","t":"Relationships","id":2838},{"q":"Which theory suggests online relationships are less personal?","a":"Sproull and Kiesler's reduced cues theory","t":"Relationships","id":2839},{"q":"What is the role of equity in long-term relationships?","a":"Perceived fairness is linked to satisfaction and commitment","t":"Relationships","id":2840},{"q":"Why may investment be more important than satisfaction for commitment?","a":"People may stay because they would lose too much if they left, even if they are not happy","t":"Relationships","id":2841},{"q":"Why might proximity be less important today?","a":"Online communication allows relationships to form over distance","t":"Relationships","id":2842},{"q":"What did Festinger et al. (1950) find about proximity?","a":"Students in housing were more likely to be friends with those living closest to them","t":"Relationships","id":2843},{"q":"What is the mere exposure effect?","a":"The more we see someone, the more we tend to like them","t":"Relationships","id":2844},{"q":"Why is the mere exposure effect linked to social demography?","a":"We see people who live and work near us more often, increasing attraction","t":"Relationships","id":2845},{"q":"Why might physical attractiveness be less important online?","a":"The absence of gating means people can get to know each other through self-disclosure before seeing them","t":"Relationships","id":2846},{"q":"Why might physical attractiveness still matter online?","a":"Dating apps often rely heavily on photos, e.g. swipe-based apps","t":"Relationships","id":2847},{"q":"What did Hatfield and Sprecher (1986) say about the importance of physical attractiveness?","a":"That it is especially important in the early stages of relationships","t":"Relationships","id":2848},{"q":"What is 'emotional convergence'?","a":"Partners becoming more similar in their emotional responses over time","t":"Relationships","id":2849},{"q":"Why might similarity be important for relationships?","a":"It reduces conflict, validates our own views and makes communication easier","t":"Relationships","id":2850},{"q":"What did Byrne (1971) find about similarity?","a":"We like people who share our attitudes – the similarity-attraction effect","t":"Relationships","id":2851},{"q":"Give an evolutionary explanation for why physical attractiveness matters.","a":"Attractive features (e.g. symmetry, clear skin) may signal good genes and health","t":"Relationships","id":2852},{"q":"What is a limitation of the evolutionary view of attractiveness?","a":"Standards of beauty vary between cultures and over time, suggesting a role for social learning","t":"Relationships","id":2853},{"q":"Why might the halo effect be important in relationships?","a":"We assume attractive people have positive traits, which may increase initial attraction","t":"Relationships","id":2854},{"q":"Give a limitation of the halo effect.","a":"It may not apply to everyone and may be weaker when people have more information about a person","t":"Relationships","id":2855},{"q":"What is the 'field of eligibles'?","a":"Another name for the field of availables – potential partners after demographic filtering","t":"Relationships","id":2856},{"q":"What is meant by 'relationship maintenance'?","a":"The strategies partners use to keep their relationship going","t":"Relationships","id":2857},{"q":"What is 'accommodation' in Rusbult's model?","a":"Responding constructively rather than destructively to a partner's negative behaviour","t":"Relationships","id":2858},{"q":"Why do people ridicule alternatives in Rusbult's model?","a":"To protect their commitment by devaluing attractive alternatives","t":"Relationships","id":2859},{"q":"How might you use Duck's model to help a couple?","a":"Identify which phase they are in and offer relevant help, e.g. improving communication in the dyadic phase","t":"Relationships","id":2860},{"q":"Why might Duck's model not apply to all relationships?","a":"It is mainly based on Western romantic relationships; some relationships end suddenly (e.g. affairs)","t":"Relationships","id":2861},{"q":"What is the role of friends in Duck's social phase?","a":"Friends may take sides, provide support, or try to help repair the relationship","t":"Relationships","id":2862},{"q":"Why is the grave-dressing phase important?","a":"It allows each partner to save face and maintain their reputation for future relationships","t":"Relationships","id":2863},{"q":"What did Lee (1984) propose about relationship breakdown?","a":"A five-stage model of breakdown based on 112 couples: dissatisfaction, exposure, negotiation, resolution attempts, termination","t":"Relationships","id":2864},{"q":"Why might online relationships lead to deception?","a":"People can control what they present and may want to seem more attractive or interesting","t":"Relationships","id":2865},{"q":"Why might self-disclosure be riskier online?","a":"Information may be shared further or used against the person","t":"Relationships","id":2866},{"q":"Why might people self-disclose more online?","a":"They feel anonymous and less likely to be judged","t":"Relationships","id":2867},{"q":"What is 'online disinhibition'?","a":"The tendency for people to behave with less restraint online than face-to-face","t":"Relationships","id":2868},{"q":"What is the difference between 'true self' and 'actual self' online?","a":"True self is the person you feel you really are but don't usually show; actual self is how you normally present","t":"Relationships","id":2869},{"q":"What did Bargh et al. (2002) find?","a":"People felt better able to express their true selves in online interactions than face-to-face","t":"Relationships","id":2870},{"q":"Why can online relationships be useful for people with disabilities?","a":"Physical gates such as appearance or mobility are removed, allowing relationships based on shared interests","t":"Relationships","id":2871},{"q":"How might social media maintain relationships?","a":"It allows people to keep in touch easily and share experiences, supporting existing relationships","t":"Relationships","id":2872},{"q":"Why is the entertainment-social level of parasocial relationships seen as normal?","a":"It involves casual interest in celebrities and social discussion with others","t":"Relationships","id":2873},{"q":"What personality trait was linked to the borderline-pathological level?","a":"Psychoticism (Maltby et al., 2003)","t":"Relationships","id":2874},{"q":"What personality trait was linked to the intense-personal level?","a":"Neuroticism","t":"Relationships","id":2875},{"q":"What personality trait was linked to the entertainment-social level?","a":"Extraversion","t":"Relationships","id":2876},{"q":"Why might children form parasocial relationships?","a":"With TV characters or YouTubers; they may learn social norms from them","t":"Relationships","id":2877},{"q":"What is a real-world application of parasocial relationship research?","a":"Identifying people at risk of harmful celebrity worship or stalking and providing support","t":"Relationships","id":2878},{"q":"What might explain why adolescents form strong parasocial relationships?","a":"They are forming identities and may use celebrities as role models or for emotional support","t":"Relationships","id":2879},{"q":"What is an evaluation point about parasocial research relating to culture?","a":"Most research is Western; celebrity culture and parasocial relationships may differ elsewhere","t":"Relationships","id":2880},{"q":"Why is it difficult to establish cause and effect in parasocial research?","a":"Studies are correlational, e.g. we don't know if poor body image leads to intense relationships or vice versa","t":"Relationships","id":2881},{"q":"What is the social exchange perspective on parasocial relationships?","a":"They offer rewards (entertainment, company) with few costs (no rejection), explaining their appeal","t":"Relationships","id":2882},{"q":"Why is Rusbult's model considered more complete than SET?","a":"It includes satisfaction, alternatives and investment, explaining both leaving and staying","t":"Relationships","id":2883},{"q":"Why might satisfaction be linked to perceived rather than actual equity?","a":"It is people's perception of fairness that affects feelings, not an objective calculation","t":"Relationships","id":2884},{"q":"Why is equity theory relevant to household division of labour?","a":"Unequal sharing of chores is a common source of perceived inequity and dissatisfaction","t":"Relationships","id":2885},{"q":"What is the difference between an aim and a hypothesis?","a":"An aim is a general statement of what the researcher intends to investigate; a hypothesis is a precise, testable prediction","t":"RM","id":2886},{"q":"When would a researcher use a directional hypothesis?","a":"When previous research suggests which direction the results will go","t":"RM","id":2887},{"q":"When would a researcher use a non-directional hypothesis?","a":"When there is no previous research or previous findings are contradictory","t":"RM","id":2888},{"q":"Write a directional hypothesis for a study on caffeine and reaction time.","a":"Participants who drink 200mg of caffeine will have faster reaction times (in ms) than those who drink water","t":"RM","id":2889},{"q":"Write a non-directional hypothesis for a study on music and memory.","a":"There will be a difference in the number of words recalled from a list of 20 between participants who revise with music and those who revise in silence","t":"RM","id":2890},{"q":"What is a correlational hypothesis?","a":"A prediction about the relationship between two co-variables, e.g. 'There is a positive correlation between hours of revision and test score'","t":"RM","id":2891},{"q":"What is the experimental method?","a":"Manipulating an IV to measure its effect on a DV while controlling other variables","t":"RM","id":2892},{"q":"Why can experiments establish cause and effect?","a":"The IV is manipulated and other variables are controlled, so changes in the DV can be attributed to the IV","t":"RM","id":2893},{"q":"Why can't a natural experiment establish cause and effect as easily as a lab experiment?","a":"The IV is not deliberately manipulated and participants cannot be randomly allocated, so confounding variables may be present","t":"RM","id":2894},{"q":"What is the key difference between a natural experiment and a quasi-experiment?","a":"In a natural experiment the IV has been changed by nature/someone else; in a quasi-experiment the IV is a pre-existing difference between people (e.g. age, gender)","t":"RM","id":2895},{"q":"Give an example of a quasi-experiment.","a":"Comparing memory in males and females","t":"RM","id":2896},{"q":"Give an example of a natural experiment.","a":"Studying the effect of an earthquake on children's stress levels, or the ERA project","t":"RM","id":2897},{"q":"What does mundane realism mean?","a":"How much a study mirrors real-life situations","t":"RM","id":2898},{"q":"What are co-variables?","a":"The two variables measured in a correlation","t":"RM","id":2899},{"q":"What is the difference between a correlation and an experiment?","a":"In a correlation variables are measured, not manipulated, so causation cannot be established; experiments manipulate an IV","t":"RM","id":2900},{"q":"What is a zero correlation?","a":"No relationship between two co-variables","t":"RM","id":2901},{"q":"What is an intervening (third) variable?","a":"A variable that may explain the relationship between two co-variables in a correlation","t":"RM","id":2902},{"q":"Give a strength of correlations.","a":"Useful starting point for research; quick and economical; can use secondary data","t":"RM","id":2903},{"q":"Give a limitation of correlations.","a":"Can't show cause and effect; there may be intervening variables","t":"RM","id":2904},{"q":"What does a correlation coefficient of -0.85 show?","a":"A strong negative correlation","t":"RM","id":2905},{"q":"What does a correlation coefficient of +0.2 show?","a":"A weak positive correlation","t":"RM","id":2906},{"q":"What is the range of possible correlation coefficients?","a":"From -1 to +1","t":"RM","id":2907},{"q":"What type of data do case studies usually produce?","a":"Mainly qualitative data, though some quantitative data (e.g. test scores) may be gathered","t":"RM","id":2908},{"q":"Give a strength of case studies.","a":"Rich, detailed data; can study rare behaviours that couldn't be studied in other ways (e.g. HM)","t":"RM","id":2909},{"q":"Give a limitation of case studies.","a":"Hard to generalise from one case; data may be subjective and rely on retrospective recall","t":"RM","id":2910},{"q":"Give an example of a longitudinal case study.","a":"HM – studied over many years after his surgery","t":"RM","id":2911},{"q":"What is coding in content analysis?","a":"Categorising material into meaningful units, e.g. counting how many times certain words appear","t":"RM","id":2912},{"q":"How is quantitative data produced in content analysis?","a":"By counting the frequency of behavioural categories/coding units","t":"RM","id":2913},{"q":"Give a strength of content analysis.","a":"High external validity as it uses real communications; can be replicated as material is often publicly available","t":"RM","id":2914},{"q":"Give a limitation of content analysis.","a":"Researchers may interpret communication subjectively (observer bias); context may be lost","t":"RM","id":2915},{"q":"How can reliability be checked in content analysis?","a":"Two researchers independently code the same material and compare their results (inter-rater reliability)","t":"RM","id":2916},{"q":"How do you carry out a random sample?","a":"Assign every member of the target population a number and use a random number generator or lottery method","t":"RM","id":2917},{"q":"How do you carry out a systematic sample?","a":"Select every nth person from a list of the target population (e.g. every 5th name)","t":"RM","id":2918},{"q":"How do you carry out a stratified sample?","a":"Identify subgroups (strata) in the population, work out their proportions, then randomly select participants from each in the same proportions","t":"RM","id":2919},{"q":"How do you carry out an opportunity sample?","a":"Select whoever is available and willing at the time","t":"RM","id":2920},{"q":"How do you carry out a volunteer sample?","a":"Participants select themselves, e.g. by responding to an advert","t":"RM","id":2921},{"q":"Give a strength of random sampling.","a":"Free from researcher bias, as the researcher has no influence over who is selected","t":"RM","id":2922},{"q":"Give a limitation of random sampling.","a":"Time-consuming and difficult; a random sample may still be unrepresentative; people may refuse","t":"RM","id":2923},{"q":"Give a strength of stratified sampling.","a":"Most representative sample, as it reflects the proportions of subgroups in the population","t":"RM","id":2924},{"q":"Give a limitation of stratified sampling.","a":"Can't reflect all the ways people differ; time-consuming","t":"RM","id":2925},{"q":"Give a strength of opportunity sampling.","a":"Quick, convenient and economical","t":"RM","id":2926},{"q":"Give a limitation of opportunity sampling.","a":"Unrepresentative and prone to researcher bias","t":"RM","id":2927},{"q":"Give a strength of volunteer sampling.","a":"Easy and quick; participants are likely to be engaged","t":"RM","id":2928},{"q":"Give a limitation of volunteer sampling.","a":"Volunteer bias – volunteers may share characteristics (e.g. being more curious), so the sample is unrepresentative","t":"RM","id":2929},{"q":"Give a strength of systematic sampling.","a":"Avoids researcher bias once the system is set up","t":"RM","id":2930},{"q":"What is a pilot study?","a":"A small-scale trial run of a study to test procedures, materials and design before the main study","t":"RM","id":2931},{"q":"Give two aims of piloting.","a":"To check procedures and instructions are clear, To identify problems (e.g. ambiguous questions), To save time and money","t":"RM","id":2932},{"q":"What is a practice effect?","a":"Improvement in performance in the second condition because participants have done the task before","t":"RM","id":2933},{"q":"What is a fatigue effect?","a":"Worse performance in the second condition because participants are tired or bored","t":"RM","id":2934},{"q":"What is ABBA counterbalancing?","a":"Participants do the conditions in the order A, B, B, A so order effects are balanced","t":"RM","id":2935},{"q":"How does a matched pairs design reduce participant variables?","a":"Participants are paired on key characteristics (e.g. IQ) and one of each pair goes into each condition","t":"RM","id":2936},{"q":"Give a limitation of a matched pairs design.","a":"Time-consuming and it is impossible to match people exactly on all variables","t":"RM","id":2937},{"q":"Why might demand characteristics be greater in a repeated measures design?","a":"Participants take part in both conditions, so they are more likely to guess the aim","t":"RM","id":2938},{"q":"What is a participant variable?","a":"A characteristic of a participant (e.g. age, intelligence) that may affect the DV","t":"RM","id":2939},{"q":"What is a situational variable?","a":"A feature of the environment (e.g. noise, temperature) that may affect the DV","t":"RM","id":2940},{"q":"What is randomisation?","a":"Using chance to control for bias, e.g. the order of stimuli or allocation to conditions","t":"RM","id":2941},{"q":"What is standardisation?","a":"Using exactly the same procedures and instructions for all participants","t":"RM","id":2942},{"q":"What are standardised instructions?","a":"A set of instructions that are read to all participants in the same way","t":"RM","id":2943},{"q":"Why are control groups used?","a":"To provide a baseline for comparison to establish the effect of the IV","t":"RM","id":2944},{"q":"What are investigator effects?","a":"Any effect of the investigator's behaviour on the research outcome (DV), e.g. unconscious cues or leading questions","t":"RM","id":2945},{"q":"How can investigator effects be reduced?","a":"Double-blind procedure, standardised instructions","t":"RM","id":2946},{"q":"What is a single-blind procedure?","a":"Participants are not told the aim or which condition they are in, to reduce demand characteristics","t":"RM","id":2947},{"q":"What is a double-blind procedure?","a":"Neither the participants nor the researcher conducting the study know the aim/condition, to reduce demand characteristics and investigator effects","t":"RM","id":2948},{"q":"What is the 'please-U' effect?","a":"When participants act in a way they think the researcher wants","t":"RM","id":2949},{"q":"What is the 'screw-U' effect?","a":"When participants deliberately act against what they think the researcher wants","t":"RM","id":2950},{"q":"What is behavioural categories in observation?","a":"Breaking a target behaviour into observable, measurable components","t":"RM","id":2951},{"q":"Give an example of behavioural categories for aggression.","a":"Hitting, kicking, pushing, shouting","t":"RM","id":2952},{"q":"Why should behavioural categories not overlap?","a":"So each behaviour can be recorded in one category only, making data reliable","t":"RM","id":2953},{"q":"Give a strength of event sampling.","a":"Useful when the target behaviour is infrequent, as every instance is recorded","t":"RM","id":2954},{"q":"Give a limitation of event sampling.","a":"Complex behaviours may be oversimplified, and some may be missed if too much is happening","t":"RM","id":2955},{"q":"Give a strength of time sampling.","a":"Reduces the number of observations, making it more manageable","t":"RM","id":2956},{"q":"Give a limitation of time sampling.","a":"Behaviour outside the sampling intervals is missed, so the data may be unrepresentative","t":"RM","id":2957},{"q":"What is observer bias?","a":"When the observer's expectations affect what they see and record","t":"RM","id":2958},{"q":"What is the Hawthorne effect?","a":"People change their behaviour because they know they are being observed","t":"RM","id":2959},{"q":"What are the three types of observation on the specification?","a":"Naturalistic vs controlled, Covert vs overt, Participant vs non-participant","t":"RM","id":2960},{"q":"What is a non-participant observation?","a":"The researcher observes from a distance and does not join the group","t":"RM","id":2961},{"q":"Why is 'going native' a problem?","a":"In participant observation, the researcher may become too involved and lose objectivity","t":"RM","id":2962},{"q":"What is an ethical issue with covert observations?","a":"Participants can't give informed consent; issues with privacy","t":"RM","id":2963},{"q":"What is social desirability bias?","a":"When participants answer in a way that makes them look good rather than truthfully","t":"RM","id":2964},{"q":"What is a Likert scale?","a":"A rating scale where respondents indicate how much they agree with a statement, usually on a 5-point scale from 'strongly disagree' to 'strongly agree'","t":"RM","id":2965},{"q":"What is a rating scale?","a":"A scale that asks respondents to identify a value representing their strength of feeling, e.g. 1–10","t":"RM","id":2966},{"q":"What is a fixed-choice option question?","a":"A closed question where respondents choose from a list of options","t":"RM","id":2967},{"q":"What is acquiescence bias?","a":"The tendency to agree with items regardless of content","t":"RM","id":2968},{"q":"How can questionnaire design avoid acquiescence bias?","a":"Word some items positively and some negatively (reverse-scoring)","t":"RM","id":2969},{"q":"What is an interview schedule?","a":"A list of standardised questions that the interviewer follows","t":"RM","id":2970},{"q":"Give three tips for designing good questions.","a":"Avoid jargon, Avoid emotive/leading language, Avoid double-barrelled questions, Avoid double negatives","t":"RM","id":2971},{"q":"What is a double-barrelled question?","a":"A question that asks about two things at once, e.g. 'Do you agree that exercise is good and that people should go to the gym?'","t":"RM","id":2972},{"q":"What is the BPS?","a":"The British Psychological Society, which publishes a code of ethics for psychologists","t":"RM","id":2973},{"q":"What are the four principles of the BPS Code of Ethics (2021)?","a":"Respect, Competence, Responsibility, Integrity","t":"RM","id":2974},{"q":"What is protection from harm?","a":"Participants should be at no more risk of physical or psychological harm than in everyday life","t":"RM","id":2975},{"q":"What is privacy?","a":"Participants have the right to control information about themselves","t":"RM","id":2976},{"q":"What is confidentiality?","a":"Personal data must be protected and not shared; participants should not be identifiable","t":"RM","id":2977},{"q":"How can researchers deal with confidentiality?","a":"Use numbers/initials instead of names; store data securely","t":"RM","id":2978},{"q":"What is presumptive consent?","a":"Asking a similar group of people whether they would consent to the study; if they agree, it is assumed the participants would too","t":"RM","id":2979},{"q":"What is prior general consent?","a":"Participants agree to take part in a number of studies, including one involving deception","t":"RM","id":2980},{"q":"What is retrospective consent?","a":"Participants are asked for consent after they have taken part, during the debrief","t":"RM","id":2981},{"q":"What is an ethics committee?","a":"A group that weighs up the costs and benefits of a study before approving it","t":"RM","id":2982},{"q":"What is a cost-benefit analysis in ethics?","a":"Weighing the potential harm to participants against the potential benefits of the research","t":"RM","id":2983},{"q":"Give three aims of peer review.","a":"To allocate research funding, To validate the quality and relevance of research, To suggest amendments/improvements","t":"RM","id":2984},{"q":"Give a limitation of peer review.","a":"Anonymity can allow reviewers to be harsh or unfair; publication bias; it may slow down revolutionary ideas","t":"RM","id":2985},{"q":"What is the file drawer problem?","a":"Studies with negative/non-significant results are less likely to be published, giving a false impression of research","t":"RM","id":2986},{"q":"How can psychological research benefit the economy?","a":"E.g. research into mental illness allows people to return to work (less absence); research into attachment helps working parents","t":"RM","id":2987},{"q":"Give an example of psychology's impact on the economy.","a":"CBT for depression reduces time off work; research on fathers' roles supports shared parental leave","t":"RM","id":2988},{"q":"What is reliability?","a":"How consistent a measure is","t":"RM","id":2989},{"q":"What is internal reliability?","a":"Whether a test is consistent within itself (e.g. items all measure the same thing)","t":"RM","id":2990},{"q":"What is external reliability?","a":"Whether a test is consistent over time and between different researchers","t":"RM","id":2991},{"q":"What correlation is needed for good reliability?","a":"+0.8 or above","t":"RM","id":2992},{"q":"How can you improve the reliability of a questionnaire?","a":"Rewrite ambiguous questions, or use more closed questions","t":"RM","id":2993},{"q":"How can you improve the reliability of an interview?","a":"Use the same interviewer, train interviewers, use structured interviews","t":"RM","id":2994},{"q":"How can you improve the reliability of an observation?","a":"Operationalise behavioural categories clearly, train observers, ensure categories don't overlap","t":"RM","id":2995},{"q":"How can you improve the reliability of an experiment?","a":"Use standardised procedures","t":"RM","id":2996},{"q":"What is validity?","a":"Whether a research finding or measure is legitimate/accurate – measuring what it claims to measure","t":"RM","id":2997},{"q":"What is internal validity?","a":"Whether the study measures what it intended to, and effects on the DV are caused by the IV","t":"RM","id":2998},{"q":"What is external validity?","a":"Whether findings can be generalised beyond the study to other settings, populations and time periods","t":"RM","id":2999},{"q":"What is face validity?","a":"Whether a test appears, on the face of it, to measure what it is supposed to","t":"RM","id":3000},{"q":"What is concurrent validity?","a":"Whether results on a new test are similar to those on an established test measuring the same thing (correlation above +0.8)","t":"RM","id":3001},{"q":"What is ecological validity?","a":"Whether findings can be generalised to other settings, especially everyday life","t":"RM","id":3002},{"q":"What is temporal validity?","a":"Whether findings from a study can be generalised to other historical times","t":"RM","id":3003},{"q":"How can validity be improved in experiments?","a":"Use a control group, standardised procedures, single- or double-blind designs","t":"RM","id":3004},{"q":"How can validity be improved in questionnaires?","a":"Use a lie scale, assure anonymity","t":"RM","id":3005},{"q":"How can validity be improved in observations?","a":"Covert observation, clear behavioural categories","t":"RM","id":3006},{"q":"How can validity be improved in qualitative research?","a":"Triangulation (using several sources), and quoting participants directly","t":"RM","id":3007},{"q":"What is triangulation?","a":"Using a number of different sources of data to check findings","t":"RM","id":3008},{"q":"What are the key features of science?","a":"Empirical method, Objectivity, Replicability, Falsifiability, Theory construction and hypothesis testing, Paradigms and paradigm shifts","t":"RM","id":3009},{"q":"What is objectivity?","a":"Keeping a 'critical distance' so personal opinions and biases don't influence data","t":"RM","id":3010},{"q":"What is replicability?","a":"The extent to which scientific procedures and findings can be repeated by other researchers","t":"RM","id":3011},{"q":"Why is replicability important?","a":"It checks the validity of findings – if they are repeated, we can be more confident they are true","t":"RM","id":3012},{"q":"What is falsifiability?","a":"The principle that a scientific theory must be capable of being proved wrong","t":"RM","id":3013},{"q":"Who proposed falsifiability?","a":"Karl Popper","t":"RM","id":3014},{"q":"What is theory construction?","a":"Gathering evidence through observation to develop a general explanation of behaviour","t":"RM","id":3015},{"q":"What is hypothesis testing?","a":"Deriving testable predictions from a theory and testing them through research","t":"RM","id":3016},{"q":"What is a paradigm?","a":"A set of shared assumptions and methods within a scientific discipline","t":"RM","id":3017},{"q":"Who proposed paradigms and paradigm shifts?","a":"Thomas Kuhn (1962)","t":"RM","id":3018},{"q":"What is a paradigm shift?","a":"When the dominant theory is overthrown by a new one due to contradictory evidence building up (a scientific revolution)","t":"RM","id":3019},{"q":"Why did Kuhn argue psychology is a 'pre-science'?","a":"It has no single agreed paradigm – there are many approaches","t":"RM","id":3020},{"q":"What is the deductive method?","a":"Starting from a theory, deriving hypotheses and testing them","t":"RM","id":3021},{"q":"What is the inductive method?","a":"Starting with observations, then developing hypotheses and theories from them","t":"RM","id":3022},{"q":"What are the sections of a scientific report?","a":"Abstract, Introduction, Method, Results, Discussion, Referencing","t":"RM","id":3023},{"q":"What is the abstract?","a":"A short summary (about 150–200 words) of the aims, method, results and conclusions","t":"RM","id":3024},{"q":"What goes in the introduction of a report?","a":"A literature review of relevant theories and research, leading to the aims and hypotheses","t":"RM","id":3025},{"q":"What goes in the method section of a report?","a":"Design, sample, apparatus/materials, procedure, ethics – in enough detail to allow replication","t":"RM","id":3026},{"q":"What goes in the results section of a report?","a":"Descriptive and inferential statistics (and qualitative analysis), summarising findings","t":"RM","id":3027},{"q":"What goes in the discussion section of a report?","a":"Summary of results in relation to previous research, limitations, implications and suggestions for future research","t":"RM","id":3028},{"q":"What is referencing?","a":"A full list of the sources used, e.g. author, date, title, journal, volume, page numbers","t":"RM","id":3029},{"q":"What order are references given in?","a":"Alphabetical order by surname of the first author","t":"RM","id":3030},{"q":"How do you calculate the mean?","a":"Add up all the scores and divide by the number of scores","t":"RM","id":3031},{"q":"How do you calculate the median?","a":"Put the scores in order and find the middle value (average of the middle two if even)","t":"RM","id":3032},{"q":"How do you calculate the mode?","a":"Find the most frequently occurring score","t":"RM","id":3033},{"q":"How do you calculate the range?","a":"Subtract the lowest score from the highest score (sometimes +1)","t":"RM","id":3034},{"q":"What is a limitation of the range?","a":"It only uses the two extreme scores, so it can be distorted by outliers","t":"RM","id":3035},{"q":"Give a strength of the standard deviation.","a":"More precise than the range, as it takes all scores into account","t":"RM","id":3036},{"q":"Give a limitation of the standard deviation.","a":"It can be distorted by a single extreme value","t":"RM","id":3037},{"q":"What does a large standard deviation show?","a":"Scores are widely spread around the mean","t":"RM","id":3038},{"q":"What does a small standard deviation show?","a":"Scores are tightly clustered around the mean – participants responded similarly","t":"RM","id":3039},{"q":"How do you calculate a percentage?","a":"Divide the part by the total and multiply by 100","t":"RM","id":3040},{"q":"Convert 0.35 to a percentage.","a":"35%","t":"RM","id":3041},{"q":"Convert 3/5 to a percentage.","a":"60%","t":"RM","id":3042},{"q":"What is a ratio?","a":"A comparison of two amounts, e.g. 2:3","t":"RM","id":3043},{"q":"What is standard form?","a":"A way of writing very large or small numbers, e.g. 3.5 × 10⁴ = 35,000","t":"RM","id":3044},{"q":"How many significant figures is 0.0452?","a":"Three","t":"RM","id":3045},{"q":"What is a histogram?","a":"A graph showing continuous data where the bars touch and the area of the bars is proportional to frequency","t":"RM","id":3046},{"q":"What is the difference between a bar chart and a histogram?","a":"Bar charts show discrete/categorical data with gaps between bars; histograms show continuous data with no gaps","t":"RM","id":3047},{"q":"What should a scattergram be used for?","a":"To show the relationship between co-variables in a correlation","t":"RM","id":3048},{"q":"What is a table used for in results?","a":"To summarise raw data or descriptive statistics clearly","t":"RM","id":3049},{"q":"In a normal distribution, where are the mean, median and mode?","a":"All at the same point, the highest peak in the middle","t":"RM","id":3050},{"q":"In a positively skewed distribution, where are the mean, median and mode?","a":"Mode is at the peak (lowest), then the median, and the mean is highest – pulled to the right","t":"RM","id":3051},{"q":"In a negatively skewed distribution, where are the mean, median and mode?","a":"Mean is lowest (pulled left), then median, with mode at the highest point","t":"RM","id":3052},{"q":"Give an example of when a positively skewed distribution would occur.","a":"A very difficult test – most people score low with a few high scores","t":"RM","id":3053},{"q":"Give an example of when a negatively skewed distribution would occur.","a":"A very easy test – most people score high with a few low scores","t":"RM","id":3054},{"q":"What is nominal data?","a":"Data in separate categories, e.g. counting how many people are left-handed or right-handed","t":"RM","id":3055},{"q":"What is ordinal data?","a":"Data that can be ordered/ranked but intervals are not equal, e.g. ratings on a scale of 1–10","t":"RM","id":3056},{"q":"What is interval data?","a":"Data measured on a scale with equal, precise intervals, e.g. time, temperature","t":"RM","id":3057},{"q":"Which level of measurement is most precise?","a":"Interval","t":"RM","id":3058},{"q":"Why is ordinal data said to lack precision?","a":"It is based on subjective opinions and intervals between points are not equal","t":"RM","id":3059},{"q":"What does 'statistical significance' mean?","a":"The results are unlikely to have occurred by chance, so the null hypothesis can be rejected","t":"RM","id":3060},{"q":"What does p ≤ 0.05 mean?","a":"There is a 5% or less probability that the results occurred by chance","t":"RM","id":3061},{"q":"When might a stricter significance level such as p ≤ 0.01 be used?","a":"When research has important consequences, e.g. drug trials, or when replicating a controversial finding","t":"RM","id":3062},{"q":"What is a Type I error?","a":"A false positive – rejecting the null hypothesis when it is actually true","t":"RM","id":3063},{"q":"What is a Type II error?","a":"A false negative – accepting the null hypothesis when it is actually false","t":"RM","id":3064},{"q":"Which significance level makes a Type I error more likely?","a":"A lenient level, e.g. 10% (p ≤ 0.1)","t":"RM","id":3065},{"q":"Which significance level makes a Type II error more likely?","a":"A stringent level, e.g. 1% (p ≤ 0.01)","t":"RM","id":3066},{"q":"What three things do you need to know to find the critical value?","a":"Whether the hypothesis is one- or two-tailed, The number of participants (N) or degrees of freedom, The level of significance","t":"RM","id":3067},{"q":"What three factors decide which statistical test to use?","a":"Test of difference or correlation, Experimental design (related or unrelated), Level of measurement","t":"RM","id":3068},{"q":"Which test is used for a difference, unrelated design, nominal data?","a":"Chi-squared","t":"RM","id":3069},{"q":"Which test is used for a difference, related design, nominal data?","a":"Sign test","t":"RM","id":3070},{"q":"Which test is used for a difference, unrelated design, ordinal data?","a":"Mann-Whitney","t":"RM","id":3071},{"q":"Which test is used for a difference, related design, ordinal data?","a":"Wilcoxon","t":"RM","id":3072},{"q":"Which test is used for a difference, unrelated design, interval data?","a":"Unrelated t-test","t":"RM","id":3073},{"q":"Which test is used for a difference, related design, interval data?","a":"Related t-test","t":"RM","id":3074},{"q":"Which test is used for a correlation with ordinal data?","a":"Spearman's rho","t":"RM","id":3075},{"q":"Which test is used for a correlation with interval data?","a":"Pearson's r","t":"RM","id":3076},{"q":"Which test is used for an association with nominal data?","a":"Chi-squared","t":"RM","id":3077},{"q":"Which experimental designs count as 'related'?","a":"Repeated measures and matched pairs","t":"RM","id":3078},{"q":"Which experimental design counts as 'unrelated'?","a":"Independent groups","t":"RM","id":3079},{"q":"What are parametric tests?","a":"More powerful tests (e.g. t-tests, Pearson's r) that require interval data, normal distribution and similar variance between groups","t":"RM","id":3080},{"q":"For which tests must the calculated value be greater than or equal to the critical value for significance?","a":"Chi-squared, Pearson's r, Spearman's rho, related and unrelated t-tests (tests with an R in their name)","t":"RM","id":3081},{"q":"For which tests must the calculated value be less than or equal to the critical value for significance?","a":"Sign test, Wilcoxon, Mann-Whitney","t":"RM","id":3082},{"q":"How do you calculate the sign test?","a":"Record a + or - for each participant's change between conditions, ignore any with no change, then the calculated value (S) is the number of the less frequent sign","t":"RM","id":3083},{"q":"What is N in the sign test?","a":"The number of participants whose scores changed (excluding those with no difference)","t":"RM","id":3084},{"q":"In a sign test, 12 participants: 9 +, 2 -, 1 no change. What are S and N?","a":"S = 2, N = 11","t":"RM","id":3085},{"q":"How are degrees of freedom calculated for a chi-squared test?","a":"(Number of rows – 1) × (number of columns – 1)","t":"RM","id":3086},{"q":"What is a 'one-tailed test'?","a":"A statistical test used for a directional hypothesis","t":"RM","id":3087},{"q":"What is a 'two-tailed test'?","a":"A statistical test used for a non-directional hypothesis","t":"RM","id":3088},{"q":"What is the difference between descriptive and inferential statistics?","a":"Descriptive statistics summarise data; inferential statistics test whether results are significant","t":"RM","id":3089},{"q":"What is an 'outlier'?","a":"An extreme score that is very different from the rest of the data","t":"RM","id":3090},{"q":"Why is the median better than the mean when there are outliers?","a":"The median is not affected by extreme scores","t":"RM","id":3091},{"q":"When is the mode the only appropriate measure of central tendency?","a":"When the data is nominal (categories)","t":"RM","id":3092},{"q":"What is a 'lab' in the term lab experiment?","a":"A controlled environment – not necessarily a laboratory","t":"RM","id":3093},{"q":"Why might a lab experiment lack mundane realism?","a":"The tasks are often artificial and unlike everyday life","t":"RM","id":3094},{"q":"What is the main advantage of a field experiment over a lab experiment?","a":"Higher mundane realism and ecological validity, as behaviour is more natural","t":"RM","id":3095},{"q":"What is a main ethical issue with field experiments?","a":"Participants often don't know they are being studied, so can't consent","t":"RM","id":3096},{"q":"What is the independent variable in a study comparing memory with and without music?","a":"Whether participants listened to music or not","t":"RM","id":3097},{"q":"What is the dependent variable in a study comparing memory with and without music?","a":"Number of words recalled","t":"RM","id":3098},{"q":"What might be an extraneous variable in a memory study?","a":"Time of day, noise, participants' age, prior knowledge of the words","t":"RM","id":3099},{"q":"What is the difference between an extraneous and a confounding variable?","a":"Extraneous variables are any other variables that might affect the DV; confounding variables have actually varied systematically with the IV","t":"RM","id":3100},{"q":"Define conformity.","a":"A change in a person's behaviour or opinions as a result of real or imagined pressure from a person or group of people","t":"Social Influence","id":3101},{"q":"Define internalisation.","a":"Genuinely accepting group norms, resulting in a private as well as public change of opinion/behaviour","t":"Social Influence","id":3102},{"q":"Define compliance.","a":"Going along with the group publicly but not changing private opinions; the change stops when group pressure is removed","t":"Social Influence","id":3103},{"q":"Which type of conformity is the most permanent?","a":"Internalisation, because the views have become part of the person's own belief system","t":"Social Influence","id":3104},{"q":"Which type of conformity is the most superficial?","a":"Compliance","t":"Social Influence","id":3105},{"q":"Define identification (Kelman).","a":"Conforming to the opinions/behaviour of a group because we value it and want to be part of it; public and private change while we are a group member","t":"Social Influence","id":3106},{"q":"Who proposed the three types of conformity?","a":"Kelman (1958)","t":"Social Influence","id":3107},{"q":"Give an example of compliance.","a":"Laughing at a joke you don't find funny because everyone else is laughing","t":"Social Influence","id":3108},{"q":"Give an example of internalisation.","a":"Becoming vegetarian after living with vegetarian friends and genuinely agreeing with their reasons","t":"Social Influence","id":3109},{"q":"Who proposed the two-process theory of conformity?","a":"Deutsch and Gerard (1955)","t":"Social Influence","id":3110},{"q":"What are the two processes in Deutsch and Gerard's two-process theory?","a":"Informational social influence (ISI), Normative social influence (NSI)","t":"Social Influence","id":3111},{"q":"What is normative social influence (NSI)?","a":"Conforming because of the desire to be liked and accepted by the group (to avoid rejection)","t":"Social Influence","id":3112},{"q":"Which type of conformity is usually linked to NSI?","a":"Compliance","t":"Social Influence","id":3113},{"q":"Which type of conformity is usually linked to ISI?","a":"Internalisation","t":"Social Influence","id":3114},{"q":"Is NSI an emotional or cognitive process?","a":"Emotional","t":"Social Influence","id":3115},{"q":"Is ISI an emotional or cognitive process?","a":"Cognitive","t":"Social Influence","id":3116},{"q":"When is NSI most likely to occur?","a":"With strangers (where we fear rejection) and with people we know (where we want approval), and in stressful situations where we need social support","t":"Social Influence","id":3117},{"q":"Give one piece of research support for NSI.","a":"Asch – participants said they conformed because they felt self-conscious giving the correct answer and were afraid of disapproval; conformity fell to 12.5% when answers were written privately","t":"Social Influence","id":3118},{"q":"Give one piece of research support for ISI.","a":"Lucas et al. (2006) – students conformed more to incorrect answers on harder maths problems, when they were unsure of the right answer","t":"Social Influence","id":3119},{"q":"What did Lucas et al. (2006) find about individual differences in ISI?","a":"Students who rated their maths ability as poor conformed more to wrong answers than those who rated their ability as good","t":"Social Influence","id":3120},{"q":"Why is it an issue that ISI and NSI often work together?","a":"It is hard to separate them; e.g. a dissenter may reduce NSI (support) and ISI (an alternative source of information), so the two-process distinction is oversimplified","t":"Social Influence","id":3121},{"q":"Who are nAffiliators?","a":"People who have a strong need for affiliation (to be liked and belong)","t":"Social Influence","id":3122},{"q":"What did McGhee and Teevan (1975) find about NSI?","a":"Students high in need for affiliation (nAffiliators) were more likely to conform","t":"Social Influence","id":3123},{"q":"Why is the McGhee and Teevan (1975) finding a limitation for NSI as an explanation?","a":"It shows NSI doesn't affect everyone equally – there are individual differences","t":"Social Influence","id":3124},{"q":"Outline the aim of Asch's (1951) study.","a":"To investigate whether people would conform to a majority giving clearly wrong answers on an unambiguous task","t":"Social Influence","id":3125},{"q":"Outline the sample of Asch's (1951) study.","a":"123 American male undergraduate students","t":"Social Influence","id":3126},{"q":"Describe the procedure of Asch's (1951) line study.","a":"Participant placed with 6–8 confederates; each said aloud which of three comparison lines matched a standard line; the participant answered last or second last","t":"Social Influence","id":3127},{"q":"How many trials did each participant do in Asch's study, and how many were critical?","a":"18 trials, 12 of which were critical trials (confederates gave the same wrong answer)","t":"Social Influence","id":3128},{"q":"What was the overall conformity rate on critical trials in Asch's study?","a":"36.8%","t":"Social Influence","id":3129},{"q":"What percentage of Asch's participants never conformed?","a":"25%","t":"Social Influence","id":3130},{"q":"What percentage of Asch's participants conformed at least once?","a":"75%","t":"Social Influence","id":3131},{"q":"What was the error rate in Asch's control condition (no confederates)?","a":"Less than 1% (about 0.04%)","t":"Social Influence","id":3132},{"q":"What did Asch's participants say about why they conformed?","a":"Most said they knew the answer was wrong but went along to avoid ridicule (NSI); a few genuinely doubted their own perception (ISI)","t":"Social Influence","id":3133},{"q":"What are the three variables affecting conformity investigated by Asch?","a":"Group size, Unanimity, Task difficulty","t":"Social Influence","id":3134},{"q":"How did group size affect conformity in Asch's variations?","a":"With 1 confederate conformity was 3%, 2 confederates 13%, 3 confederates 31.8%; adding more made little difference","t":"Social Influence","id":3135},{"q":"What does Asch's group size finding suggest about majority size?","a":"A small majority is not enough, but beyond about 3 people there is little extra effect – conformity plateaus","t":"Social Influence","id":3136},{"q":"How did unanimity affect conformity in Asch's variations?","a":"A dissenting confederate who gave the right answer reduced conformity to about 5.5%; a dissenter giving a different wrong answer also reduced conformity","t":"Social Influence","id":3137},{"q":"Why does a dissenter reduce conformity?","a":"The participant has social support and is freed from the pressure of the group; it breaks the group's unanimity","t":"Social Influence","id":3138},{"q":"How did Asch increase task difficulty?","a":"By making the comparison lines more similar in length to the standard line","t":"Social Influence","id":3139},{"q":"How did task difficulty affect conformity in Asch's variations?","a":"Conformity increased when the task was harder","t":"Social Influence","id":3140},{"q":"Which explanation of conformity best accounts for the effect of task difficulty?","a":"ISI – when the answer is less clear we look to others for guidance","t":"Social Influence","id":3141},{"q":"Why has Asch's research been criticised as 'a child of its time'?","a":"It was conducted in 1950s America, a conformist era (McCarthyism), so results may not apply today","t":"Social Influence","id":3142},{"q":"Who replicated Asch in the UK and what did they find?","a":"Perrin and Spencer (1980) – using engineering students, only 1 conforming response in 396 trials","t":"Social Influence","id":3143},{"q":"Why might Perrin and Spencer's replication not be a fair comparison with Asch?","a":"Engineering students were confident judging lengths, so they were less likely to conform than Asch's students","t":"Social Influence","id":3144},{"q":"Give a weakness of Asch's research relating to the task.","a":"Artificial task – judging line lengths is trivial, so there was little reason not to conform; low ecological validity","t":"Social Influence","id":3145},{"q":"Why do Asch's findings have limited application to women?","a":"Only American men were tested; women may conform more because they are more concerned with social relationships","t":"Social Influence","id":3146},{"q":"How does Asch's research lack generalisability to other cultures?","a":"Only Americans (individualist culture) were studied; Bond and Smith (1996) found conformity is higher in collectivist cultures","t":"Social Influence","id":3147},{"q":"Give an ethical issue with Asch's research.","a":"Deception – participants were told it was a vision test and the confederates were presented as participants; they may have felt stress/embarrassment","t":"Social Influence","id":3148},{"q":"Why did Asch's participants' groups not feel like real groups?","a":"The confederates were strangers and there was no real consequence, so they may not reflect how friends/real groups exert pressure","t":"Social Influence","id":3149},{"q":"What was Bond and Smith's (1996) study?","a":"A meta-analysis of 133 Asch-type studies across 17 countries; conformity was higher in collectivist cultures","t":"Social Influence","id":3150},{"q":"Why might conformity be higher in collectivist cultures?","a":"The group and group goals are valued more than individual needs, so fitting in is more important","t":"Social Influence","id":3151},{"q":"Who manipulated the lighting in a box to study ISI?","a":"Sherif (1935) – the autokinetic effect (a still light in a dark room appears to move)","t":"Social Influence","id":3152},{"q":"Describe Sherif's (1935) autokinetic effect study.","a":"Participants estimated how far a light moved, first alone then in groups; group estimates converged into a group norm, showing ISI in an ambiguous task","t":"Social Influence","id":3153},{"q":"Why did Sherif's study show ISI rather than NSI?","a":"The task was ambiguous, so participants genuinely used others' answers as information","t":"Social Influence","id":3154},{"q":"What is a limitation of the Sherif study?","a":"Artificial and ambiguous task with no correct answer, so it may not apply to everyday situations","t":"Social Influence","id":3155},{"q":"Define obedience.","a":"A form of social influence where an individual follows a direct order from a person with authority","t":"Social Influence","id":3156},{"q":"What is the difference between conformity and obedience?","a":"Conformity is going along with peers without direct orders; obedience is following direct orders from a higher-status figure","t":"Social Influence","id":3157},{"q":"Outline the aim of Milgram's (1963) study.","a":"To investigate whether ordinary Americans would obey an unjust order from an authority figure to harm another person","t":"Social Influence","id":3158},{"q":"Why did Milgram conduct his study?","a":"To test the 'Germans are different' hypothesis after the Holocaust – whether ordinary people would obey destructive orders","t":"Social Influence","id":3159},{"q":"Outline the sample in Milgram's (1963) study.","a":"40 American men aged 20–50 from the New Haven area, recruited by newspaper advert","t":"Social Influence","id":3160},{"q":"How much were Milgram's participants paid?","a":"$4.50","t":"Social Influence","id":3161},{"q":"What were participants told Milgram's study was about?","a":"The effect of punishment on learning (a memory study)","t":"Social Influence","id":3162},{"q":"How were roles allocated in Milgram's study?","a":"A rigged draw – the participant was always the teacher and the confederate (Mr Wallace) always the learner","t":"Social Influence","id":3163},{"q":"What was the range of shocks on Milgram's shock generator?","a":"15 volts to 450 volts in 15-volt increments","t":"Social Influence","id":3164},{"q":"What was the learner's name in Milgram's study?","a":"Mr Wallace (a confederate)","t":"Social Influence","id":3165},{"q":"What happened at 300V in Milgram's study?","a":"The learner pounded on the wall and then gave no further responses","t":"Social Influence","id":3166},{"q":"What did participants hear before starting in Milgram's study to make it realistic?","a":"They received a sample 45V shock","t":"Social Influence","id":3167},{"q":"What were Milgram's four verbal prods?","a":"Please continue/please go on, The experiment requires that you continue, It is absolutely essential that you continue, You have no other choice, you must go on","t":"Social Influence","id":3168},{"q":"What percentage of Milgram's participants went to 300V?","a":"100%","t":"Social Influence","id":3169},{"q":"What percentage of Milgram's participants went to 450V?","a":"65%","t":"Social Influence","id":3170},{"q":"What percentage of Milgram's participants stopped at 300V?","a":"12.5% (5 participants)","t":"Social Influence","id":3171},{"q":"What had psychology students predicted about obedience in Milgram's study?","a":"That only about 3% would go to 450V","t":"Social Influence","id":3172},{"q":"What signs of stress did Milgram's participants show?","a":"Sweating, trembling, stuttering, biting lips, digging nails into hands; 3 had seizures","t":"Social Influence","id":3173},{"q":"What did Milgram do after the study to protect participants?","a":"A full debrief, including meeting the learner; a follow-up questionnaire found 84% were glad to have taken part","t":"Social Influence","id":3174},{"q":"What conclusion did Milgram draw from his 1963 study?","a":"Ordinary Americans are obedient to destructive authority; obedience is due to situational rather than dispositional factors","t":"Social Influence","id":3175},{"q":"Give a strength of Milgram's study in terms of control.","a":"Highly controlled lab setting with standardised procedure and prods, so cause and effect can be established and it is replicable","t":"Social Influence","id":3176},{"q":"What did Orne and Holland (1968) argue about Milgram's study?","a":"Participants may have guessed the shocks were fake and were 'playing along', so the study lacks internal validity","t":"Social Influence","id":3177},{"q":"What did Perry (2013) find about Milgram's participants?","a":"From tapes, only about half of participants believed the shocks were real, and those who did were less obedient","t":"Social Influence","id":3178},{"q":"What was Sheridan and King's (1972) study?","a":"Participants gave real shocks to a puppy; 54% of men and 100% of women gave what they thought was a fatal shock – supports Milgram's validity","t":"Social Influence","id":3179},{"q":"Outline Hofling et al.'s (1966) study.","a":"A field study where 21 of 22 nurses obeyed a phone instruction from an unknown doctor to give an overdose of an unfamiliar drug","t":"Social Influence","id":3180},{"q":"What did Rank and Jacobson (1977) find, compared with Hofling?","a":"Only 2 of 18 nurses obeyed when the drug was familiar (Valium) and they could consult colleagues","t":"Social Influence","id":3181},{"q":"What did Burger (2009) find when partially replicating Milgram?","a":"70% of participants were willing to continue past 150V – similar to Milgram's rate at that point","t":"Social Influence","id":3182},{"q":"Why did Burger stop his replication at 150V?","a":"For ethical reasons – almost everyone who passed 150V in Milgram's study went on to 450V","t":"Social Influence","id":3183},{"q":"What did Haslam
