d":333,"q":"Identify the two broadest categories/cultures that societies are often divided into in Psychology.","a":"Individualistic, Collectivist","t":"Issues and Debates part I"},{"id":334,"q":"Define the term cultural relativism.","a":"The idea that norms, values, ethics and moral standards can only be meaningful and understood within the specific social and cultural contexts.","t":"Issues and Debates part I"},{"id":335,"q":"Define the term etic in relation to culture bias in psychology.","a":"Etic constructs are universal traits/constructs/ideas/values that can be found across all cultures e.g. family","t":"Issues and Debates part I"},{"id":336,"q":"Define the term emic in relation to culture bias in psychology.","a":"Emic constructs are traits/constructs/ideas/values that are specific to certain cultures e.g. monogamy","t":"Issues and Debates part I"},{"id":337,"q":"What is the role of history when considering issues of culture bias?","a":"We must remember that cultures change over time, and therefore old research may not reflect the present day state of that culture e.g. Asch and conformity – changed since 1950! (Low temporal validity)","t":"Issues and Debates part I"},{"id":338,"q":"How can the way research is designed potentially create a culture difference that isn’t really there? (alpha bias)","a":"If procedures used are culturally biased they can exaggerate differences e.g. Ainsworth, If questionnaires/instructions have to be translated into a different language you may lose meaning or misinterpret them, changing the way the experiment works from one culture to the next.","t":"Issues and Debates part I"},{"id":339,"q":"Why is a lot of psychology research culture biased, and to which specific culture?","a":"Most research uses students, and historically most of these students have been American. This means there is low representativeness of the research (poor population validity).","t":"Issues and Debates part I"},{"id":340,"q":"What good advances have been made as a result of increased awareness of culture bias?","a":"+ Indigenous psychologies – developing theories/ideas specific to different cultures e.g. Afrocentrism – African focused + increased understanding of other cultures (linked to increased travel/international conferences etc.) in an effort to reduce the bias.","t":"Issues and Debates part I"},{"id":341,"q":"What are the implications of having culture bias in psychological research?","a":"- potentially fuelling/validating racist views/racial stereotypes - publishing misleading information","t":"Issues and Debates part I"},{"id":342,"q":"What are ethical issues in psychological research?","a":"When there is a potential conflict between the rights of participants and the aims of the research (in a study)","t":"Issues and Debates part I"},{"id":343,"q":"An ethical issue within a piece of psychological research is privacy, explain why.","a":"A researcher might be trying to get more information than a participant feels comfortable to give","t":"Issues and Debates part I"},{"id":344,"q":"An ethical issue within a piece of psychological research is confidentiality, explain why.","a":"Participants may be less willing to give information in the future if a study breaches their confidentiality (it may have put them at risk before)","t":"Issues and Debates part I"},{"id":345,"q":"An ethical issue within a piece of psychological research is valid methodology, explain why.","a":"If a methodology is poor it will result in collecting invalid findings, e.g. that MMR is linked to autism.","t":"Issues and Debates part I"},{"id":346,"q":"An ethical issue within a piece of psychological research is deception, explain how psychologists address this.","a":"They get informed consent at the start of the experiment, explaining as much of the investigation as they can, and then debrief at the end to fill in any gaps.","t":"Issues and Debates part I"},{"id":347,"q":"What do psychologists do to minimise ethical issues within their research?","a":"Follow ethical guidelines to protect the participants, the researchers and the reputation of psychology as a whole.","t":"Issues and Debates part I"},{"id":348,"q":"When is deception allowed in psychological research?","a":"Deception is only allowed if it is essential to the purpose of the study and is considered reasonable by an ethics committee.","t":"Issues and Debates part I"},{"id":349,"q":"What are ethical implications of psychological research?","a":"The impact or consequences the psychological research has on the rights of others/on society in the wider context – the big picture impact","t":"Issues and Debates part I"},{"id":350,"q":"What is socially sensitive research in psychology?","a":"Studies where there are potential social consequences for participants/the groups represented by the research (potentially biases/conflicts/stereotypes etc. could result)","t":"Issues and Debates part I"},{"id":351,"q":"Explain why Sieber and Stanley say psychologists must carefully consider the following when conducting socially sensitive research; The research question","a":"They need to think about the way they phrase the question, is there a way it can be phrased that will minimise the potential for problems on publication.","t":"Issues and Debates part I"},{"id":352,"q":"Explain why Sieber and Stanley say psychologists must carefully consider the following when conducting socially sensitive research; The methodology used","a":"They need to ensure that the way they conduct the experiment is going to minimise the consequences for the participants involved upon publication of the findings e.g. confidentiality/anonymity","t":"Issues and Debates part I"},{"id":353,"q":"Explain why Sieber and Stanley say psychologists must carefully consider the following when conducting socially sensitive research; The institutional context","a":"They need to have thought about who is going to be using the information upon publication (and for what) and who is funding the research – could there be a hidden agenda?","t":"Issues and Debates part I"},{"id":354,"q":"Explain why Sieber and Stanley say psychologists must carefully consider the following when conducting socially sensitive research; Interpretation and application of findings","a":"They need to consider the different ways the data could be used after publication – how might it be interpreted and applied to the real world - What might the media do with it? What impact might it have on government/legislation?","t":"Issues and Debates part I"},{"id":355,"q":"What is the argument that you have to have if you plan to conduct socially sensitive research?","a":"Will the benefit of increased understanding outweigh the risks to participants/potential problems resulting from publication. Short term pain for long term gain?","t":"Issues and Debates part I"},{"id":356,"q":"Explain the definition ‘statistical infrequency/deviation’ as a way of defining abnormality","a":"The least frequent (rare/uncommon) behaviours are defined as abnormal. The extreme ends of a normal (bell-shaped) distribution.","t":"Psychopathology"},{"id":357,"q":"Explain the definition ‘deviation from social norms’ as a way of defining abnormality","a":"Behaviour which violates the accepted social norms","t":"Psychopathology"},{"id":358,"q":"Explain the definition ‘deviation from ideal mental health’ as a way of defining abnormality","a":"The failure to meet criteria for perfect psychological well-being (as outlined by Jahoda)","t":"Psychopathology"},{"id":359,"q":"Explain the ‘failure to function adequately’ definition of abnormality","a":"An inability to cope/perform behaviours necessary for day to day living.","t":"Psychopathology"},{"id":360,"q":"What were Jahoda’s criteria for ideal mental health?","a":"Positive view of self, Capable of self-actualisation, Independent, Accurate view of reality, Cope with stress, Ability to master environment","t":"Psychopathology"},{"id":361,"q":"What were Rosehan and Seligman’s criteria for failing to function adequately?","a":"Experiences suffering and severe distress through inability to cope, Behaviour has become irrational/dangerous to themselves or others.","t":"Psychopathology"},{"id":362,"q":"What are the strengths of using ‘statistical infrequency’ as a definition of abnormality?","a":"Objective, universal, quick for clinical assessments","t":"Psychopathology"},{"id":363,"q":"What are the weaknesses of using ‘statistical infrequency’ as a definition of abnormality?","a":"Some abnormal behaviours are frequent e.g. depression, Some abnormal behaviours are positive, Labels unusual people negatively","t":"Psychopathology"},{"id":364,"q":"What are the strengths of using ‘deviation from social norms’ as a definition of abnormality?","a":"More culturally relativistic, Allows protection of society","t":"Psychopathology"},{"id":365,"q":"What are the weaknesses of using ‘deviation from social norms’ as a definition of abnormality?","a":"Not universal, subjective, potential human rights abuses","t":"Psychopathology"},{"id":366,"q":"What are the strengths of using ‘deviation from ideal mental health’ as a definition of abnormality?","a":"Allows clear goal setting as can easily identify areas of dysfunction, Positive stance","t":"Psychopathology"},{"id":367,"q":"What are the weaknesses of using ‘deviation from ideal mental health’ as a definition of abnormality?","a":"Ethnocentric, subjective, unrealistic","t":"Psychopathology"},{"id":368,"q":"What are the strengths of using ‘failure to function adequately’ as a definition of abnormality?","a":"Focus on patient perspective, Others can observe and identify problems even if the individual themselves cannot","t":"Psychopathology"},{"id":369,"q":"What are the weaknesses of using ‘failure to function adequately’ as a definition of abnormality?","a":"Subjective, Risks restricting personal freedoms","t":"Psychopathology"},{"id":370,"q":"What is OCD?","a":"Obsessive Compulsive disorder","t":"Psychopathology"},{"id":371,"q":"What are the 2 key characteristics of OCD?","a":"Obsessions and Compulsions","t":"Psychopathology"},{"id":372,"q":"Define obsessions in OCD.","a":"Re-occurring and persistent thoughts that cause anxiety and distress","t":"Psychopathology"},{"id":373,"q":"Define compulsions in OCD.","a":"Repetitive behaviours carried out to reduce anxiety caused by obsessions.","t":"Psychopathology"},{"id":374,"q":"What are the behavioural characteristics of OCD?","a":"Compulsions that hinder everyday functioning and cause social impairment","t":"Psychopathology"},{"id":375,"q":"What are the emotional characteristics of OCD?","a":"Anxiety, depression, loss of pleasure in everyday activities","t":"Psychopathology"},{"id":376,"q":"What are the cognitive characteristics of OCD?","a":"Obsessive thoughts which sufferers know are irrational and intrusive.","t":"Psychopathology"},{"id":377,"q":"Which approach do you use to explain OCD?","a":"Biological","t":"Psychopathology"},{"id":378,"q":"What are the 2 biological explanations for OCD?","a":"Genetic and neural","t":"Psychopathology"},{"id":379,"q":"Outline the genetic explanation for OCD.","a":"Polygenic, Aetiologically heterogenous, 5HT1-D beta","t":"Psychopathology"},{"id":380,"q":"Outline the neural explanation for OCD.","a":"Abnormal levels of neurotransmitters – serotonin, Abnormal functioning in particular areas – basal ganglia, left parahippocampal gyrus","t":"Psychopathology"},{"id":381,"q":"What is the biological treatment for OCD?","a":"Antidepressants – SSRIs (selective serotonin reuptake inhibitors) to elevate levels of serotonin","t":"Psychopathology"},{"id":382,"q":"What are the behavioural characteristics of depression?","a":"Loss of energy, fatigue, disrupted sleep patterns, altered eating patterns","t":"Psychopathology"},{"id":383,"q":"What are the emotional characteristics of depression?","a":"Low mood, lack of pleasure, worthlessness","t":"Psychopathology"},{"id":384,"q":"What are the cognitive characteristics of depression?","a":"Poor concentration, negative thoughts","t":"Psychopathology"},{"id":385,"q":"Which approach is used to explain depression?","a":"Cognitive","t":"Psychopathology"},{"id":386,"q":"According to the cognitive approach what is the explanation for depression?","a":"Faulting thinking/processing, 2 models – Beck and Ellis","t":"Psychopathology"},{"id":387,"q":"Outline Beck’s explanation for depression.","a":"Depression results from a cognitive vulnerability caused by 1) Faulty processing, 2) Negative self-schemas, 3) the negative triad","t":"Psychopathology"},{"id":388,"q":"What is a negative self-schema?","a":"A packet of information about the self that is negative, causing all new information on the self to be interpreted negatively.","t":"Psychopathology"},{"id":389,"q":"What is the faulty processing that Beck identifies as part of the vulnerability to developing depression?","a":"Focus on the negative, ignore positives, Absolutism, Catastrophising","t":"Psychopathology"},{"id":390,"q":"Outline the negative triad in Beck’s explanation of depression.","a":"Negative views of the self, the world and the future","t":"Psychopathology"},{"id":391,"q":"What was Ellis’ model for explaining depression?","a":"A – activating event, triggers… B – beliefs, that are irrational, resulting in… C – consequence, depression","t":"Psychopathology"},{"id":392,"q":"What is the cognitive approach to treating depression?","a":"CBT – cognitive behaviour therapy","t":"Psychopathology"},{"id":393,"q":"How does CBT address depression?","a":"It seeks to assist patients to identify irrational/negative thoughts and alter them into rational/positive thoughts","t":"Psychopathology"},{"id":394,"q":"What are the key stages of CBT?","a":"Identify irrational beliefs/thoughts, challenge these beliefs, Behavioural activation","t":"Psychopathology"},{"id":395,"q":"What is the 3 part model for explaining behaviour and emotions that CBT aims to disrupt?","a":"Thoughts cause feelings, Feelings cause behaviours, Behaviours cause/reinforce thoughts","t":"Psychopathology"},{"id":396,"q":"What are the key characteristics of Beck’s approach to CBT?","a":"Encourage the patient to work with the therapist in looking to challenge and alter negative thought processes. May set homework – ‘patient as scientist’","t":"Psychopathology"},{"id":397,"q":"What did Ellis call his version of CBT?","a":"REBT – Rational Emotive Behaviour Therapy","t":"Psychopathology"},{"id":398,"q":"Outline Ellis’ version of CBT.","a":"Identify irrational thoughts, Challenge these through empirical (evidence based) or logical dispute – the argument is key","t":"Psychopathology"},{"id":399,"q":"What is a phobia?","a":"An anxiety disorder characterised by extreme irrational fears","t":"Psychopathology"},{"id":400,"q":"Define ‘specific phobia’.","a":"Occurs when sufferers have fears about specific things/environments","t":"Psychopathology"},{"id":401,"q":"Define ‘social phobias’","a":"Occurs when sufferers have fears about situations involving others (including performance phobias)","t":"Psychopathology"},{"id":402,"q":"Define ‘agoraphobia’","a":"Fear of leaving home/a safe place","t":"Psychopathology"},{"id":403,"q":"What are the behavioural characteristics of phobias?","a":"Avoidance of feared object/situation","t":"Psychopathology"},{"id":404,"q":"What are the emotional characteristics of phobias?","a":"Persistent, excessive fear","t":"Psychopathology"},{"id":405,"q":"What are the cognitive characteristics of phobias?","a":"Selective attention, Irrational beliefs (about the phobic stimulus)","t":"Psychopathology"},{"id":406,"q":"Which approach do you use to explain phobias?","a":"Behavioural","t":"Psychopathology"},{"id":407,"q":"What is the two process model for explaining phobias?","a":"Acquisition by classical conditioning, Maintenance by operant conditioning","t":"Psychopathology"},{"id":408,"q":"Explain how a phobia is acquired.","a":"Classical conditioning results in associations between a previously neutral stimulus and a naturally fear invoking unconditioned stimulus (fear is the unconditioned response that is eventually conditioned to result from the now conditioned stimulus)","t":"Psychopathology"},{"id":409,"q":"Explain how a phobia is maintained.","a":"Operant conditioning via negative reinforcement – avoidance of the phobic stimulus reduces anxiety which is a positive experience → continued avoidance","t":"Psychopathology"},{"id":410,"q":"How is the behaviourist approach used to treat phobias (2 ways)?","a":"Flooding, Systematic desensitisation","t":"Psychopathology"},{"id":411,"q":"What is the main difference between flooding and systematic desensitisation?","a":"Flooding = immediate and full exposure to the phobic stimulus, Systematic desensitisation = gradual exposure","t":"Psychopathology"},{"id":412,"q":"What principle is flooding based on?","a":"Eventual exhaustion → realisation that stimulus is harmless – counter conditioning","t":"Psychopathology"},{"id":413,"q":"What principle is systematic desensitisation based on?","a":"Reciprocal inhibition – it is impossible to be both relaxed and fearful at the same time","t":"Psychopathology"},{"id":414,"q":"How does systematic desensitisation take place?","a":"Creation of anxiety hierarchy, Taught relaxation techniques, Gradual exposure to scenarios in the anxiety hierarchy","t":"Psychopathology"},{"id":415,"q":"Memory is studied by psychologists from which approach?","a":"Cognitive","t":"Memory"},{"id":416,"q":"Why do we use models to study memory?","a":"To understand it, because it’s not an ‘observable phenomenon’ (we can’t see memory – it’s a mental process)","t":"Memory"},{"id":417,"q":"Give the encoding, capacity and duration of STM","a":"Acoustic, 7+/-2, 18 seconds","t":"Memory"},{"id":418,"q":"Name one method to improve the capacity of STM","a":"Chunking information together (Miller said we can hold 7+/-2 chunks)","t":"Memory"},{"id":419,"q":"What did Miller find? (memory)","a":"Miller said we can hold 7+/-2 chunks of information (magical number 7)","t":"Memory"},{"id":420,"q":"Give the encoding, capacity and duration of LTM","a":"Semantic, unlimited, a lifetime","t":"Memory"},{"id":421,"q":"Give one study of LTM duration","a":"Bahrick (1975) High school yearbook – people could remember","t":"Memory"},{"id":422,"q":"What does the term ‘coding’ mean in the context of memory?","a":"The format in which memory is stored.","t":"Memory"},{"id":423,"q":"What did Peterson and Peterson investigate? (memory)","a":"The duration of STM (they found it was 18 seconds)","t":"Memory"},{"id":424,"q":"What is the Brown-Peterson technique? (memory)","a":"Counting backwards to prevent rehearsal (so we can study the duration of STM without rehearsal)","t":"Memory"},{"id":425,"q":"What does MSM stand for?","a":"Multistore model of memory","t":"Memory"},{"id":426,"q":"Give the three stores of the MSM","a":"Sensory store, short term memory, long term memory","t":"Memory"},{"id":427,"q":"How is information passed from STM to LTM according to the MSM?","a":"Prolonged rehearsal (just rehearsing over and over)","t":"Memory"},{"id":428,"q":"Identify the two types of rehearsal in the MSM","a":"Maintenance (keeps info in STM), Prolonged (moves info from STM to LTM)","t":"Memory"},{"id":429,"q":"How does info pass from Sensory memory to STM according to the MSM?","a":"Attention","t":"Memory"},{"id":430,"q":"Give 2 ways information is lost from LTM according to the MSM","a":"Retrieval failure, Interference","t":"Memory"},{"id":431,"q":"How is information recalled from LTM according to the MSM?","a":"It passes back into STM by a process called retrieval, and is then recalled","t":"Memory"},{"id":432,"q":"One criticism of the MSM was that it is too simple. Give one way it’s too simple.","a":"1) STM is not a unitary store – there is verbal and visual components – it’s more a working memory, 2) LTM is not a unitary store –semantic, procedural, episodic 3) Prolonged rehearsal is too simple – it’s elaborative rehearsal that passes info to LTM (linking info to other things in LTM)","t":"Memory"},{"id":433,"q":"Give one case study to support the MSM","a":"HM or Clive Wearing - both show distinction between LTM and STM","t":"Memory"},{"id":434,"q":"Who was HM? (memory)","a":"Henry Molaison - A brain damaged patient who had surgery to remove hippocampus to cure epilepsy.","t":"Memory"},{"id":435,"q":"Who came up with the MSM?","a":"Atkinson and Shiffrin","t":"Memory"},{"id":436,"q":"Give the three types of long term memory","a":"Semantic, procedural, episodic","t":"Memory"},{"id":437,"q":"Give two differences between semantic and episodic memory","a":"1) Semantic is for facts WHEREAS episodic is for events, 2) Semantic is related to an encyclopedia WHEREAS episodic is related to a diary, 3) Semantic is not time stamped WHEREAS episodic is, 4) Semantic is encoded consciously WHEREAS episodic is unconsciously encoded.","t":"Memory"},{"id":438,"q":"How is procedural memory different from both semantic and episodic?","a":"It’s unavailable for conscious inspection (it’s unconsciously recalled)","t":"Memory"},{"id":439,"q":"Which type of long term memory is ‘unavailable for conscious inspection’?","a":"Procedural","t":"Memory"},{"id":440,"q":"The smell of a bonfire is an example of what type of LTM?","a":"Semantic (recalling a time at a bonfire would be episodic)","t":"Memory"},{"id":441,"q":"One weakness of the types of LTM is that they are too complex. Give one way we could simplify them.","a":"Declarative (episodic and semantic) and non declarative (procedural)","t":"Memory"},{"id":442,"q":"How did Tulving support the three types of LTM?","a":"PET scans to show activity in different areas of the brain when doing tasks using different types of LTM.","t":"Memory"},{"id":443,"q":"Which part of the brain is used for episodic memories?","a":"Right pre frontal cortex","t":"Memory"},{"id":444,"q":"Which part of the brain is used for semantic memories?","a":"Left pre frontal cortex","t":"Memory"},{"id":445,"q":"Give one real life application of the types of LTM","a":"Helping patients with ‘mild cognitive impairments’ = better people’s lives. They often have poor episodic memory so we can target that and train/improve it.","t":"Memory"},{"id":446,"q":"What did Cohen and Squire say about the types of LTM","a":"There were only two, not three. They are declarative (episodic and semantic) and non declarative (procedural)","t":"Memory"},{"id":447,"q":"Name all parts of the working memory model","a":"Central executive, episodic buffer, phonological loop, phonological store, articulatory control system, visuo spatial sketchpad, visual cache, inner scribe","t":"Memory"},{"id":448,"q":"Which part of the WMM is in charge? What does it do?","a":"Central executive – it has slave systems and allocates resources to them.","t":"Memory"},{"id":449,"q":"What is the different between working memory and short term memory?","a":"Working memory is an active process - it is an explanation of how STM functions whereas STM is a temporary store.","t":"Memory"},{"id":450,"q":"Who came up with the working memory model?","a":"Baddeley and Hitch","t":"Memory"},{"id":451,"q":"What is the articulatory process for? (memory)","a":"Repeating information inside your head (to keep them in STM whilst you use them)","t":"Memory"},{"id":452,"q":"How big is the capacity of the articulatory system? (memory)","a":"However much you can say in 2 seconds","t":"Memory"},{"id":453,"q":"Give one case study to support the WMM","a":"KF – could remember words he read (VSS) but not those read aloud to him (PL)","t":"Memory"},{"id":454,"q":"How did Baddeley ‘damage’ his participant’s brains in order to study the working memory processes separately?","a":"He made them do tasks which used up certain sections of the WM. For example saying a word over and over, uses the phonological loop.","t":"Memory"},{"id":455,"q":"Give one evaluation point about the central executive. (memory)","a":"It is not fully understood or explained in the WMM research. ‘It’s the most important but the least understood component of working memory’.","t":"Memory"},{"id":456,"q":"Give two theories of forgetting","a":"Interference, retrieval failure","t":"Memory"},{"id":457,"q":"Identify and explain the two types of interference (memory)","a":"Proactive – Where old prevents the learning of new info, Retroactive - where new info prevents the recall of old info","t":"Memory"},{"id":458,"q":"When is memory interference most likely to occur?","a":"When information is similar","t":"Memory"},{"id":459,"q":"Give the method by which McGeoch an Mcdonald studied interference (memory)","a":"They gave participants a list of 10 adjectives (list A). There was then a resting interval of 10 minutes during which they learnt list B, followed by recall of list A. List B was either: Synonyms, antonyms, unrelated words, nonsense syllables, 3 digit numbers, nothing.","t":"Memory"},{"id":460,"q":"What did the results of McGeoch and Mcdonalds study on the effects of similarity of material demonstrate? (memory)","a":"That the more similar the items are the stronger interference is. Ony interference, rather than decay, can explain such effects","t":"Memory"},{"id":461,"q":"How did Baddeley and Hitch study interference in real life? (memory)","a":"Rugby players recalling the names of teams they had played","t":"Memory"},{"id":462,"q":"Define retrieval failure in the context of memory","a":"When you forget due to the absence of cues. When you try to retrieve a memory that is there in LTM, but not accessible.","t":"Memory"},{"id":463,"q":"What is the encoding specificity principle? (memory)","a":"The rule that the same cues need to be there at encoding and retrieval for info to be remembered.","t":"Memory"},{"id":464,"q":"If you can’t recall your exam material in the hall because you didn’t revise there, it’s an example of what? (memory)","a":"Context dependent forgetting","t":"Memory"},{"id":465,"q":"If you can’t recall your exam material because you are too nervous now, but when you learned the info you were calm, it’s an example of what? (memory)","a":"State dependent forgetting","t":"Memory"},{"id":466,"q":"Carter and Cassidy studied retrieval failure, what did they find? (memory)","a":"People recalled more info when they had taken antihistamine at encoding and retrieval, or when they had not taken it at both, than when there was a mismatch.","t":"Memory"},{"id":467,"q":"What is the main study to support retrieval failure? (memory)","a":"Godden and Baddeley (1975) Underwater diver study","t":"Memory"},{"id":468,"q":"Give a finding of Godden and Baddeleys study (use a figure if possible) (memory)","a":"Recall was 40% worse when learning and recalling environment was different, than when it was the same.","t":"Memory"},{"id":469,"q":"Give one weakness of Godden and Baddeley’s study on retrieval failure. (memory)","a":"The contexts were too different – not ecologically valid, Lacks mundane realism – learning words, and learning them underwater!","t":"Memory"},{"id":470,"q":"Give a real life application of research into retrieval failure (memory)","a":"Police interviews and eyewitness testimony, revising for exams","t":"Memory"},{"id":471,"q":"What are leading questions in the context of memory research?","a":"A question that, either by its form content, suggest to the witnesses what answer is desired or leads him or her to the desired answer.","t":"Memory"},{"id":472,"q":"What is post event discussion in the context of memory research?","a":"A conversation between co-witnesses or an interviewer and an eyewitness after a crime has taken place which may contaminate a witnesses memory for the event.","t":"Memory"},{"id":473,"q":"Give two ways post event discussion can alter EWT","a":"Memory conformity – report the memories that everyone else say (but memory not affected), Memory contamination – get confused between actual memory and what others have said, so memory changes (source confusion)","t":"Memory"},{"id":474,"q":"What did Gabbert do to study EWT and misleading info?","a":"Participants were put into pairs where each partner watched a different video of the same event so that they both saw unique items. Pairs in one condition discussed the event before each partner was asked to recall the event they had just watched.","t":"Memory"},{"id":475,"q":"What were Gabbert’s findings into EWT and misleading info?","a":"71% of participants who had discussed the event with their partner mistakenly recalled items discussed by the other partner of which they did not see in there video","t":"Memory"},{"id":476,"q":"What is the substitution explanation, relating to EWT?","a":"When the wording of a leading questions causes an eyewitnesses’ memory to actually change","t":"Memory"},{"id":477,"q":"Explain the inverted U theory in the context of memory?","a":"Inverted U theory states that at low levels of anxiety cognitive performance (in this case memory accuracy) will be at a relatively low level, but as anxiety increases then so does cognitive performance until it reaches an optimal level after which any further increase in anxiety level leads to a rapid drop in cognitive performance.","t":"Memory"},{"id":478,"q":"What is the Yerkes Dodson Law in the context of memory?","a":"At low levels of anxiety cognitive performance (in this case memory accuracy) will be at a relatively low level, but as anxiety increases then so does cognitive performance until it reaches an optimal level after which any further increase in anxiety level leads to a rapid drop in cognitive performance.","t":"Memory"},{"id":479,"q":"What is the evolutionary reason why our memories should be better when we are anxious?","a":"More aware of surroundings due to heightened senses from fight or flight","t":"Memory"},{"id":480,"q":"Explain the weapon focus effect in the context of memory","a":"We recall less peripheral details of an event because we have ‘tunnel vision’ where we focus on the weapon in a scene, not the surroundings.","t":"Memory"},{"id":481,"q":"Who studied the weapon focus effect? (memory)","a":"Johnson and Scott (1976) knife and pen study","t":"Memory"},{"id":482,"q":"What did Yuille and Cutshall study? (memory)","a":"The effect of anxiety on memory","t":"Memory"},{"id":483,"q":"How did Pickel (1998) criticise the weapon focus effect as an explanation of forgetting? (memory)","a":"Pickel said that it’s surprise, not anxiety that causes us to get ‘tunnel vision’ and forget details of an event. Eg we look at the weapon in a scene because it’s odd, not because it causes anxiety. (raw chicken in a hairdresser study).","t":"Memory"},{"id":484,"q":"Give one ethical issue when studying the effect of anxiety on EWT.","a":"Can’t always protect from harm – have to make participants anxious to get the results.","t":"Memory"},{"id":485,"q":"Identify the 4 parts of the cognitive interview (memory)","a":"Report everything, change perspective, reverse order, reinstate context","t":"Memory"},{"id":486,"q":"Who developed the Cognitive Interview (memory)","a":"Fisher and Geiselman","t":"Memory"},{"id":487,"q":"Who developed the enhanced cognitive interview? (memory)","a":"Fisher","t":"Memory"},{"id":488,"q":"What does the enhanced cognitive interview add to the regular cognitive interview? (memory)","a":"Social cues, body language, eye contact, non-leading questions, open ended questions, speaking slowly.","t":"Memory"},{"id":489,"q":"Which part of the cognitive interview is based on the encoding specificity principle? (memory)","a":"Reinstate the context (to give the same cues that were present at encoding)","t":"Memory"},{"id":490,"q":"Which part of the cognitive interview is based on the idea of reducing schemas? (memory)","a":"Change perspective, reverse order","t":"Memory"},{"id":491,"q":"Why do they ask people to reverse the order of events, in the cognitive interview? (memory)","a":"To reduce the impact of schemas on recall.","t":"Memory"},{"id":492,"q":"Give one weakness of the cognitive interview (memory)","a":"Time consuming, police need extra training, expensive, some sections more useful than others, can increase recall of incorrect information too.","t":"Memory"},{"id":493,"q":"What is conformity? (SI)","a":"Yielding to group pressure (majority)","t":"Social Influence"},{"id":494,"q":"What is the other name for conformity? (SI)","a":"Majority influence","t":"Social Influence"},{"id":495,"q":"What happens when conformity takes place? (SI)","a":"Someone’s behaviour and/or beliefs are influenced by a larger group of people.","t":"Social Influence"},{"id":496,"q":"What is the weakest form of conformity? (SI)","a":"Compliance","t":"Social Influence"},{"id":497,"q":"What is compliance? (SI)","a":"When an individual changes their behaviour in public, but not in private. (About getting a favourable reaction from others)","t":"Social Influence"},{"id":498,"q":"What is the middle level of conformity? (SI)","a":"Identification","t":"Social Influence"},{"id":499,"q":"What is identification? (SI)","a":"When an individual changes their behaviour in public in an effort to be accepted by a group they want to be in.","t":"Social Influence"},{"id":500,"q":"What is the highest level of conformity? (SI)","a":"Internalisation","t":"Social Influence"},{"id":501,"q":"What is internalisation? (SI)","a":"When an individual changes their behaviour or view to that of others in the group, in public and in private.","t":"Social Influence"},{"id":502,"q":"What are the types of conformity? (SI)","a":"Compliance, identification and internalisation","t":"Social Influence"},{"id":503,"q":"What are the explanations of conformity? (SI)","a":"ISI and NSI","t":"Social Influence"},{"id":504,"q":"What is ISI?","a":"Information social influence – desire to be right","t":"Social Influence"},{"id":505,"q":"When is ISI most likely to occur?","a":"Unfamiliar/ambiguous situations, Where there is apparently an expert present","t":"Social Influence"},{"id":507,"q":"Describe how the Jenness jelly bean study supports ISI.","a":"Individuals privately estimated number of beans in the jar, then had a group discussion with a group estimate, then made a second private estimate. Second estimates moved closer to the group estimate suggesting ISI (can’t be NSI as second estimate was private).","t":"Social Influence"},{"id":508,"q":"What is Normative social influence?","a":"Desire to be liked/accepted by a group","t":"Social Influence"},{"id":509,"q":"Which famous study demonstrated the existence of NSI?","a":"Asch lines study","t":"Social Influence"},{"id":510,"q":"What was Asch’s sample? (SI)","a":"123 American male student volunteers","t":"Social Influence"},{"id":511,"q":"What are the issues with Asch’s sample? (SI)","a":"Small, ethnocentric, androcentric, volunteer type","t":"Social Influence"},{"id":512,"q":"What was Asch’s procedure? (SI)","a":"Group of 7-9 confederates, 1 participant, Match a standard line to A,B or C, 12/18 trials were critical, Real participant answered second last or last, Task was unambiguous (mistake baseline was 0.7%)","t":"Social Influence"},{"id":513,"q":"How many participants conformed at least once in Asch’s study (%)? (SI)","a":"0.75","t":"Social Influence"},{"id":514,"q":"What was the overall % for conformity across all trials in Asch’s study? (SI)","a":"36.8% (37%)","t":"Social Influence"},{"id":515,"q":"In the control group of Asch’s study how many participants never conformed (%)? (SI)","a":"0.95","t":"Social Influence"},{"id":516,"q":"What were the post interview findings of Asch’s study? (SI)","a":"Participants reported conforming out of a desire to not be rejected (NSI)","t":"Social Influence"},{"id":517,"q":"Name the three factors Asch showed effected conformity. (SI)","a":"Group size, unanimity, task difficulty","t":"Social Influence"},{"id":518,"q":"What minimum size group is required to increase chances of conformity? (SI)","a":"3","t":"Social Influence"},{"id":519,"q":"What happened to conformity rates once Asch increased the group size above 3? (SI)","a":"Little change","t":"Social Influence"},{"id":520,"q":"What effect does unanimity have on conformity? (SI)","a":"When a group is not unanimous, conformity rates decrease","t":"Social Influence"},{"id":521,"q":"What effect does task difficulty have on conformity? (SI)","a":"When a task is more difficult, conformity rates increase","t":"Social Influence"},{"id":522,"q":"How did Asch explain the increase in conformity when a task became more difficult? (SI)","a":"Participants conformed out of a desire to be right (ISI)","t":"Social Influence"},{"id":523,"q":"How did Asch increase task difficulty in this variation of his experiment? (SI)","a":"Made the lines look more similar in length.","t":"Social Influence"},{"id":524,"q":"Define what is meant by situational variables affecting conformity. (SI)","a":"Features of an environment that affect the degree to which individuals yield to group pressure","t":"Social Influence"},{"id":525,"q":"Define what is meant by individual variables affecting conformity. (SI)","a":"Personal characteristics that affect the degree to which individuals yield to group pressure","t":"Social Influence"},{"id":526,"q":"Explain what a social role is. (SI)","a":"A part an individual plays as a member of a social group, where their behaviour will meet the expectations of that situation","t":"Social Influence"},{"id":527,"q":"Which study demonstrated conformity to social roles? (SI)","a":"Haney et al, Stanford Prison Experiment (Zimbardo)","t":"Social Influence"},{"id":528,"q":"What was Zimbardo trying to study? (SI)","a":"The extent to which people conform to roles of prisoner/guard in a simulated prison – testing if it is disposition or situation that causes ‘evil’ behaviour.","t":"Social Influence"},{"id":529,"q":"What was Zimbardo’s sample? (SI)","a":"75 male university student volunteers, paid $15 a day (assessed as emotionally stable)","t":"Social Influence"},{"id":530,"q":"What was wrong with Zimbardo’s sample? (SI)","a":"Small, androcentric, ethnocentric, same age, volunteers","t":"Social Influence"},{"id":531,"q":"Where was the SPE experimental prison created? (SI)","a":"Psychology basement at Stanford.","t":"Social Influence"},{"id":532,"q":"How were the roles assigned in the SPE? (SI)","a":"Randomly","t":"Social Influence"},{"id":533,"q":"How were the prisoners deindividuated in the SPE? (SI)","a":"Uniform, number","t":"Social Influence"},{"id":534,"q":"How were the guards aided into their social role in the SPE? (SI)","a":"Uniform, dark reflective glasses, billy clubs","t":"Social Influence"},{"id":535,"q":"What happened with the social roles of the guards and prisoners in the SPE? (SI)","a":"Settled quickly, prisoners became steadily more depressed, guards increasingly brutal","t":"Social Influence"},{"id":536,"q":"What happened to the prisoners after around 36 hours in the SPE? (SI)","a":"One had a breakdown","t":"Social Influence"},{"id":537,"q":"How many days did it take before the SPE was stopped? (SI)","a":"6 (instead of running for the full 2 weeks)","t":"Social Influence"},{"id":538,"q":"What were the conclusions of the SPE? (SI)","a":"Individuals readily conform to social roles. Situational variables are more important in ‘evil’ behaviour (given that none of the participants had shown these traits before – can’t be dispositional)","t":"Social Influence"},{"id":539,"q":"The BBC recreated the SPE, what did they find? (SI)","a":"Couldn’t support the SPE, prisoners rebelled and overthrew the guards!","t":"Social Influence"},{"id":540,"q":"What recent criticisms have arisen linked to the SPE? (SI)","a":"That Zimbardo manipulated the behaviour of the guards, encouraging ‘tough guard’ behaviour – investigator effects","t":"Social Influence"},{"id":541,"q":"What is obedience? (SI)","a":"Complying with the demands of an authority figure","t":"Social Influence"},{"id":542,"q":"Why is obedience generally a good thing? (SI)","a":"It helps society to function effectively","t":"Social Influence"},{"id":543,"q":"Who famously researched obedience? (SI)","a":"Milgram","t":"Social Influence"},{"id":544,"q":"What was the sample for Milgram’s study? (SI)","a":"40 male, American volunteers aged 20-50.","t":"Social Influence"},{"id":545,"q":"What was wrong with Milgram’s sample? (SI)","a":"Small, ethnocentric, androcentric, volunteers","t":"Social Influence"},{"id":546,"q":"What were the participants told Milgram’s experiment was testing? (SI)","a":"Memory","t":"Social Influence"},{"id":547,"q":"What were the two roles in Milgram’s experiment and who took on each role? (SI)","a":"Teacher – the real participant, Learner – confederate","t":"Social Influence"},{"id":548,"q":"Who was the authority figure in the study and how could they be identified? (SI)","a":"Experimenter – in a grey lab coat","t":"Social Influence"},{"id":549,"q":"What was the punishment system for the ‘memory task’ in Milgram’s study? (SI)","a":"Increasing levels of electric shocks ‘given’ when the learner gave the incorrect answer. Started at 15 volts, up to a possible 450 volts.","t":"Social Influence"},{"id":550,"q":"How did Milgram make his participants believe the shock machine was real? (SI)","a":"Gave them a 45 volt shock before the experiment started.","t":"Social Influence"},{"id":551,"q":"What percentage of Milgram’s participants went to 450 volts? (SI)","a":"0.65","t":"Social Influence"},{"id":552,"q":"What percentage of Milgram’s participants went to 300 volts? (SI)","a":"1","t":"Social Influence"},{"id":553,"q":"Describe the behaviour of the participants during the Milgram’s study. (SI)","a":"Increasing levels of discomfort, signs of distress like sweating, 3 even had seizures!","t":"Social Influence"},{"id":554,"q":"What does Milgram’s study tell us about obedience? (SI)","a":"People are likely to obey an authority figure even if it distresses us or goes against our moral code.","t":"Social Influence"},{"id":555,"q":"What type of experiment was Milgram’s study? (SI)","a":"Controlled observation.","t":"Social Influence"},{"id":556,"q":"What were the ethical issues in Milgram’s study? (SI)","a":"Psychological harm, questions regarding the right to withdraw (prompt statements), deception","t":"Social Influence"},{"id":557,"q":"How did Milgram try to control some of the ethical issues in his study? (SI)","a":"Participants were reunited with the learner, debrief given, (only 2% of participants regretted taking part)","t":"Social Influence"},{"id":558,"q":"What additional situational factors did Milgram test in variations of his original experiment? (SI)","a":"Proximity, location and uniform","t":"Social Influence"},{"id":559,"q":"How did Milgram alter proximity in his experiment? (SI)","a":"1) Teacher and learner in same room, 2) Teacher forces hand of learner onto shock plate, 3) Experiment instructs teacher by phone","t":"Social Influence"},{"id":560,"q":"How did Milgram alter location in his experiment? (SI)","a":"Completed in a run down office block rather than at Yale","t":"Social Influence"},{"id":561,"q":"How did Milgram alter uniform in his experiment? (SI)","a":"Instead of the lab coat the experimenter was called away and a plain clothes confederate took over","t":"Social Influence"},{"id":562,"q":"What happened to the percentage of fully obedient participants when Milgram changed location to a run down office block? (SI)","a":"Dropped by almost 20% (to 47.5%)","t":"Social Influence"},{"id":563,"q":"What happened to the percentage of fully obedient participants when the instructions were being given by someone in plain clothes? (SI)","a":"Dropped by 45% (to 20%)","t":"Social Influence"},{"id":564,"q":"What happened to the percentage of fully obedient participants when they increased their proximity to the learner (victim)? (SI)","a":"Decreased – 40% when in same room (down 25%), 30% when forcing the hand (down 35%)","t":"Social Influence"},{"id":565,"q":"What is the agentic state? (SI)","a":"A mental state where we feel no personal responsibility for our behaviour because we believe we are acting for an authority figure.","t":"Social Influence"},{"id":566,"q":"What is the opposite of being in the agentic state? (SI)","a":"Autonomous state","t":"Social Influence"},{"id":567,"q":"What is the agentic shift? (SI)","a":"When someone moves from being in an autonomous state to the agentic state – happens when we perceive someone as a legitimate authority.","t":"Social Influence"},{"id":568,"q":"What are binding factors linked to obedience? (SI)","a":"Aspects of a situation that will allow someone to minimise the damaging effect of their behaviour (reduce moral strain) e.g. blaming the victim","t":"Social Influence"},{"id":569,"q":"What research supports the existence of the agentic state? (SI)","a":"Blass and Schmitt showed Milgram’s study to students and asked them who’s fault it was, they all identified the experimenter as he was the legitimate authority.","t":"Social Influence"},{"id":570,"q":"What is legitimacy of Authority? (SI)","a":"We are more likely to obey people who we perceive to have an authority over us, they are perceived as legitimate because of their position within a social hierarchy.","t":"Social Influence"},{"id":571,"q":"What is destructive authority? (SI)","a":"When a legitimate authority abuses their power e.g. Hitler – in Milgram’s study this happened when the experimenter used the verbal prompts","t":"Social Influence"},{"id":572,"q":"What is an authoritarian personality? (SI)","a":"A type of personality that is more susceptible to obeying people in authority.","t":"Social Influence"},{"id":573,"q":"Who developed the authoritarian personality explanation for obedience? (SI)","a":"Adorno","t":"Social Influence"},{"id":574,"q":"Describe the authoritarian personality? (SI)","a":"Very deferent/submissive to those of higher status, extremely obedient to authority figures, dismissive/contemptuous of their inferiors","t":"Social Influence"},{"id":575,"q":"How is the authoritarian personality measured? (SI)","a":"F scale","t":"Social Influence"},{"id":576,"q":"What research supports the relationship between the authoritarian personality and obedience? (SI)","a":"Milgram tested his participants with the F scale, those who were more obedient scored more highly.","t":"Social Influence"},{"id":577,"q":"What is resistance to social influence?","a":"The way an individual attempts to withstand majority influence/group pressures/threats to freedom of choice.","t":"Social Influence"},{"id":578,"q":"What is social support? (SI)","a":"The idea that you have people around you who are resisting conformity or obeying and that this can help you to do the same (they act as role models showing resistance is possible)","t":"Social Influence"},{"id":579,"q":"How did Milgram demonstrate the role of social support in resisting obedience? (SI)","a":"When participants were paired with a disobedient confederate, obedience rates dropped to 10%","t":"Social Influence"},{"id":580,"q":"How did Asch demonstrate the role of social support in resisting conformity? (SI)","a":"If a non-conforming dissenter is present then the participant becomes less likely to conform (it was noted that they didn’t necessarily give the same answer as the dissenter, just needed the role model of someone else going against the majority)","t":"Social Influence"},{"id":581,"q":"What is locus of control? (SI)","a":"The extent to which individuals believe how much control they have over their lives.","t":"Social Influence"},{"id":582,"q":"What is meant by a high internal locus of control? (SI)","a":"The belief that things happen due to our choices and decisions, we have control in our lives and influence within our world.","t":"Social Influence"},{"id":583,"q":"What is meant by high external locus of control? (SI)","a":"The belief that things happen due to fate, luck or other external forces, we have little control in our lives and no real influence on what happens within our world.","t":"Social Influence"},{"id":584,"q":"What type of LOC is most resistant to social pressures? (SI)","a":"High internal LOC","t":"Social Influence"},{"id":585,"q":"What research supports LOC in resisting social pressure? (SI)","a":"Holland – repeated Milgram’s study and measured LOC. 37% of internals did not continue to the highest shock level. Only 23% of externals did not continue – internals showed greater resistance.","t":"Social Influence"},{"id":586,"q":"What research contradicts LOC in resisting social influence? (SI)","a":"Twenge et al – meta analysis over a 40 year period, Americans have become more resistant to obedience over this time, but also more external in their LOC.","t":"Social Influence"},{"id":587,"q":"What is minority influence? (SI)","a":"A type of social influence that motivates individuals to reject established majority group norms.","t":"Social Influence"},{"id":588,"q":"What type of social influence is minority influence most likely to lead to? (SI)","a":"Internalisation","t":"Social Influence"},{"id":589,"q":"What three factors are the main processes involved in minority influence? (SI)","a":"Consistency, flexibility and commitment","t":"Social Influence"},{"id":590,"q":"What is consistency in terms of minority influence? (SI)","a":"The minority will be most effective when they keep to the same beliefs over time (diachronic) and between individuals (synchronic)","t":"Social Influence"},{"id":591,"q":"What is flexibility in terms of minority influence? (SI)","a":"Having relentless consistency could be counter-productive (like Teresa May and her Brexit deal!), minorities are more effective if they show flexibility or the possibility of compromise.","t":"Social Influence"},{"id":592,"q":"What is commitment in terms of minority influence? (SI)","a":"Minorities are more powerful if they show dedication to their position.","t":"Social Influence"},{"id":593,"q":"What research shows the importance of consistency and commitment in minority influence? (SI)","a":"Moscovici – consistent minority judgements in an unambiguous situation (blue and green slides)","t":"Social Influence"},{"id":594,"q":"What was Moscovici’s slide study procedure? (3 marks) (SI)","a":"1) 32 groups of 6, two confederates per group, 2) shown 36 blue slides varying in intensity of shade. 3) Consistent condition – confederates described slides as green. Inconsistent condition – 24 were described as green.","t":"Social Influence"},{"id":595,"q":"What were the findings and conclusions of Moscovici’s slide study? (SI)","a":"32% agreed at least once in consistent condition, only 1.28% in inconsistent condition → consistency is important in minority influence.","t":"Social Influence"},{"id":596,"q":"What is social change? (SI)","a":"When whole societies eventually adopt new attitudes, beliefs and ways of doing things","t":"Social Influence"},{"id":597,"q":"Give an example of a social change? (SI)","a":"Women’s suffrage, environmental movements, Civil rights movement","t":"Social Influence"},{"id":598,"q":"How can social change occur through majority influence? (SI)","a":"Use NSI – if everyone thinks it is the norm then they will alter their behaviour accordingly – leads to a more immediate change to maintain social order e.g. laws like the smoking ban","t":"Social Influence"},{"id":599,"q":"What are the 6 stages of social change when caused by a minority? (SI)","a":"1) Drawing attention, 2) Consistency (of the minority), 3) Deeper processing (by others), 4) Augmentation principle, 5) Snowball effect (resulting in minority to majority), 6) Social cryptomnesia","t":"Social Influence"},{"id":600,"q":"Explain Interactional Synchrony in the context of attachment","a":"Where a parent’s speech/behaviour and infant’s behaviour become finely synchronised so that they happen together.","t":"Attachment"},{"id":601,"q":"Give a finding of a study into interactional synchrony (attachment)","a":"Isabella - Assessed degree of synchrony in 30 mothers and found that there was a higher degree of synchrony in more stable/secure attachments","t":"Attachment"},{"id":602,"q":"Explain reciprocity in the context of attachment.","a":"When behaviour from parent or baby is ‘reciprocated’ eg responded to by the other. e.g. mother smiles, baby smiles back. e.g. baby cries, mother cuddles.","t":"Attachment"},{"id":603,"q":"Grossman (2002) found that the quality of the infant/father was not related to a child’s adolescent attachments, suggesting attachment to the father is less important than the mother. But what did they find the father IS important for?","a":"The quality of the father’s play with infant was related to their adolescent attachment – suggesting play and stimulation is an important role of the father.","t":"Attachment"},{"id":604,"q":"Grossman (2002) did a longitudinal sudy on attachment. What is a longitudinal study and why is it useful?","a":"A study which lasts many years, and can therefore study the development of a child. (As opposed to a cross sectional study which is a short time. Useful because you can see in one child, how early influences impact their later life.","t":"Attachment"},{"id":605,"q":"Give the stages of attachment according to Schaffer and Emerson","a":"Asocial, indiscriminate, specific, multiple","t":"Attachment"},{"id":606,"q":"Where did Schaffer and Emerson conduct their research into attachment?","a":"Glasgow","t":"Attachment"},{"id":607,"q":"Describe Shaffer and Emerson’s procedure used to study stages of attachment","a":"60 babies from Glasgow, 31 male, 29 female, working class, psychologists visited homes once a month for first year and again at 18 months, interviewed mums, asked about separation and stranger anxiety, considered reaction to them in relation to stranger anxiety","t":"Attachment"},{"id":608,"q":"Describe Shaffer and Emerson’s findings from their study into attachment","a":"25-32 weeks old 50% babies showed separation anxiety (usually mum - specific attachment), attachments formed to those most sensitive to baby signals (not who spent most time with), by 40 weeks 80% had specific att., 30% showed multiple","t":"Attachment"},{"id":609,"q":"Who studied attachment in animals?","a":"Lorenz and Harlow","t":"Attachment"},{"id":610,"q":"Outline Lorenz’s research into attachment (method)","a":"Lorenz divided up a clutch of goose eggs, where half were hatched with the mother goose(control) and the other half in an incubator where Lorenz was the first living thing they saw (experimental). He observed their attachment behaviours","t":"Attachment"},{"id":611,"q":"Outline Lorenz’s research into attachment (findings)","a":"He found that the incubator group followed him around everywhere whereas the control group stayed with the mother and ignored him. When there two groups were mixed they would separate to be with their original attachment figure. Lorenz called this imprinting and he suggested that there was a critical period of a few hours depending on the species and if imprinting does not occur then the chicks do not attach to the mother figure.","t":"Attachment"},{"id":612,"q":"Outline Harlow’s research into attachment (method)","a":"16 baby rhesus monkeys were reared with two wire model mothers. In one condition milk was dispensed by the plain wire mother whereas in the second it was dispensed by the cloth covered mother. Behaviour of monkeys was observed when frightened. Social behaviour of moneys observed (including how they treated own offspring)","t":"Attachment"},{"id":613,"q":"Outline Harlow’s research into attachment (findings)","a":"Babies always chose to spend their time with the cloth covered monkey over the wire frame one. This shows that contact comfort was more important to the monkey then drive reduction when it came to attachment. Monkeys reared without real mothers were less sociable, more aggressive and bred less than normal monkeys. Some killed their own offspring. Harlow also suggested that there was a critical period of 90 days, and if an attachment had not been formed by then, then it never could and the damage is irreversible.","t":"Attachment"},{"id":614,"q":"Give a nature and a nurture explanation for attachment","a":"Nurture - learning theory, nature - Bowlby","t":"Attachment"},{"id":615,"q":"How many days is the critical period for monkeys to attach, according to Harlow?","a":"90 days","t":"Attachment"},{"id":616,"q":"Name the two learning theories of attachment","a":"Classical Conditioning and Operant Conditioning","t":"Attachment"},{"id":617,"q":"What does ‘Cupboard Love’ mean in the context of attachment?","a":"The idea that babies learn to attach to their primary caregiver because they provide them with food (learning theory).","t":"Attachment"},{"id":618,"q":"Explain how classical conditioning leads to attachment","a":"Milk provided by the mother is an unconditioned stimulus which provides an unconditioned response in the baby of pleasure/relief from hunger. This response is automatic and does not need to be learnt. The neutral stimulus is the feeder (mother), and through repetition of feeding the feeder becomes associated with the milk and the feeling of pleasure. The mother becomes the conditioned stimulus. Therefore the baby has made an association and will feel pleasure when seeing the mother alone (conditioned response).","t":"Attachment"},{"id":619,"q":"Explain how operant conditioning leads to attachment","a":"When the baby feels uncomfortable because it is hungry they experience a drive state. This drive state motivates the baby to find a way to lessen the discomfort. In the early years the baby can do nothing but cry, and being fed leads to drive reduction as the child is satisfied. The food is the primary reinforcer and the child learns that the food is a reward. The person that feeds the baby becomes the secondary reinforcer and the infant thus seeks to be near to this feeder as they are the source of reward and the attachment is formed. Negative reinforcement also works from the caregiver’s side. Their feeding stops the crying of the baby which was unpleasant. This strengthens the attachment and makes it mutual.","t":"Attachment"},{"id":620,"q":"Is attachment a primary or secondary drive? Explain why.","a":"Secondary. The primary drive is hunger as its an innate, biological motivator for survival. We are motivated to eat for ‘drive reduction’ – to reduce hunger. As caregiver provides the food to reduce hunger, the attachment to them becomes a secondary drive. It's an association is made between the caregiver and the satisfaction of a primary drive.","t":"Attachment"},{"id":621,"q":"Define Monotropy","a":"The relationship an infant forms with one special attachment figure (usually the primary caregiver).","t":"Attachment"},{"id":622,"q":"Define the Continuity Hypothesis within attachment","a":"This holds that the monotropy relationship provides an infant with an internal working model of relationships.","t":"Attachment"},{"id":623,"q":"Is Bowlby’s explanation for attachment a nature or a nurture explanation? Why?","a":"Nature: Evolutionary explanation. The idea that humans have evolved to have infants with an innate tendency to form attachments and adults to respond to their infants (and thereby become attached).","t":"Attachment"},{"id":624,"q":"What is an internal working model in the context of attachment?","a":"By Bowlby, and idea that the relationship with the primary caregiver provides infants with a template/framework of self worth which they will apply to all future relationships.","t":"Attachment"},{"id":625,"q":"What are social releasers according to Bowlby (attachment)","a":"Innate behaviours which ensure interaction takes place between child and caregiver, they are behaviours such as smiling crying etc.","t":"Attachment"},{"id":626,"q":"Explain the law of accumulated separation in attachment","a":"The law of accumulated separation is the idea that separations from the mother add up, and eventually affect the attachment of the child. = the more consistent a child's care = better quality of attachment.","t":"Attachment"},{"id":627,"q":"What is a critical period in the context of attachment?","a":"A biological timeframe for attachment. If an attachment is not formed in this critical period (in humans 2.5 years) then it may not take place at all.","t":"Attachment"},{"id":628,"q":"Give the 7 steps of the strange situation","a":"1) Parent and child explore room, 2) Stranger enters and joins, adults talk, 3) parent leaves, 4) parent returns and stranger leaves, 5) parent settles infant and leaves, 6) stranger returns, 7) parent returns and stranger leaves","t":"Attachment"},{"id":629,"q":"Give Ainsworth’s three attachment types","a":"1) Secure - Upset when put under separation anxiety, avoidant of stranger but curious, instantly soothed when mother returns. Responsive and sensitive caregiver. 2) Insecure Avoidant - Unconcerned by mothers absence, avoidant of both, unresponsive in reunion. Unresponsive caregiver. 3) Insecure resistant - Overly distressed when mother left, fear of stranger, clinginess + rejection on reunion. Inconsistent caregiver.","t":"Attachment"},{"id":630,"q":"What is temperament and how does it come into our learning of attachment?","a":"Temperament is a child’s innate ‘personality’. Psychologists criticise Bowlbys monotropic theory for not accepting the role of the child's temperament. It has been shown that some babies are born more social or more anxious than others. Therefore this could explain later social behaviour rather than the IWM.","t":"Attachment"},{"id":631,"q":"What did Mary Ainsworth do?","a":"Strange situation, sample of 100 middle class American infants, observed through two way mirror. Controlled observation. Observing separation anxiety, stranger anxiety and reunion behavious. Found 3 attachment types - secure 66% insecure avoident 22% insecure resistant 12%","t":"Attachment"},{"id":632,"q":"Give some attachment behaviours tested in the strange situation.","a":"Proximity seeking, stranger anxiety, secure base behaviour and exploration, separation anxiety, reunion behaviour","t":"Attachment"},{"id":633,"q":"Correctly name the three types of attachment and whether they are type A, B or C","a":"Insecure avoidant (A), Secure (B), Insecure resistant (C)","t":"Attachment"},{"id":634,"q":"Why is the strange situation culturally biased?","a":"It uses Western ideas. Different cultures respond to the strange situation differently. EG in Japan babies are rarely away from mothers so showed more separation anxiety.","t":"Attachment"},{"id":635,"q":"Name a fourth type of attachment other than secure, insecure resistant and insecure avoidant.","a":"Disorganised – an odd mix of resistant and avoidant.","t":"Attachment"},{"id":636,"q":"Give the name of a researcher who looked into cultural variations of attachment","a":"Van Ijzendoorn and Kroonenberg (1988), Simonella (2014), Jin et al (2012)","t":"Attachment"},{"id":637,"q":"Which countries did Van Ijzendoorn study in the meta analysis of the strange situation?","a":"Great Britain, USA, Sweden, Japan, Netherlands, Israel, Germany, China","t":"Attachment"},{"id":638,"q":"What research method did Van Ijzendoorn and Kroonenberg use to test cultural variations in attachment?","a":"Meta Analysis (32 studies in 8 countries)","t":"Attachment"},{"id":639,"q":"Give one weakness of Van Ijzendoorn and Kroonenberg’s meta analysis of the strange situation.","a":"1) Imposed Etic – the theory and the method are both devised by Westerners, but applied to non Western cultures. 2) Unrepresentative sample – 8 studies were in USA so not a wide spread. Also samples taken from within countries might not have accurately represented whole countries culture (there were more differences within countries than between!) 3) Temperament could be affecting the results, not attachment. 4) Use of secondary data – they did not quality control the studies they used.","t":"Attachment"},{"id":640,"q":"Give one finding of Van Ijzendoorn and Kroonenberg’s meta analysis of the strange situation.","a":"1) secure always most common type, 2) insecure resistant always least common type, 3) proportions of insecure resistent ranged from 3-30%, 4) insecure avoidant found highest in Germany and lowest in Japan, 5) More variation within cultures than between (150% greater)","t":"Attachment"},{"id":641,"q":"Do the results of Van Ijzendoorn and Kroonenberg’s meta analysis of the strange situation support Bowlby’s theory of attachment?","a":"Yes, because they show that secure attachment is clearly innate, as its always the most common. Also, Bowlby believed that the quality of attachment is influenced by the behaviour of the primary attachment figure towards the baby. If this varies according cultural norms then we would expect some variation between countries and between different groups within a country – which is exactly what we see. However, alternative explanation is that the differences in culture reflect effects of the mass media (‘good parenting’ books, tv etc) which reaches some and not others.","t":"Attachment"},{"id":642,"q":"Define Maternal Deprivation (attachment)","a":"Separation from a primary attachment figure that is prolonged and results in emotional and intellectual deficits","t":"Attachment"},{"id":643,"q":"What is the difference between separation and deprivation in the context of attachment?","a":"Separation is when a child is away from their primary attachment figure temporarily, and it does not cause harm, whereas* deprivation is extended or consistent separations from them, and causes harm. *need comparison word","t":"Attachment"},{"id":644,"q":"Who came up with the idea of maternal deprivation? (attachment)","a":"John Bowlby (1951)","t":"Attachment"},{"id":645,"q":"What did Bowlby believe to be the critical period for psychological development, during which time deprivation would be detrimental? (attachment)","a":"30 months (just over 2.5 years)","t":"Attachment"},{"id":646,"q":"Give two effects of maternal deprivation according to Bowlby (attachment)","a":"Low IQ, Affectionless psychopathy","t":"Attachment"},{"id":647,"q":"Name the study which Bowlby did to back up his theory of maternal deprivation. (attachment)","a":"44 juvenile thieves","t":"Attachment"},{"id":648,"q":"Give two findings of Bowlby’s 44 juvenile thieves study (attachment)","a":"1) 14/44 thieves were affectionless psychopaths, 2) 12/14 had prolonged separation from mum in first 2 years compared to 5 of 30 'non-affectionless' and 2/44 controls","t":"Attachment"},{"id":649,"q":"Give 4 effects of institutionalisation in the context of attachment research.","a":"1) mental retardation/low IQ, 2) delayed language development, 3) quasi-autism, 4) disinhibited attachment, 5) delayed physical development, 6) impaired adult relationships","t":"Attachment"},{"id":650,"q":"Who did the Bucharest Early Intervention Project? (attachment)","a":"Zeanah et al (2005)","t":"Attachment"},{"id":651,"q":"What did Rutter study? (attachment)","a":"The effects of institutionalisation (ERA English Romanian Adoptees)","t":"Attachment"},{"id":652,"q":"Give one real life application that has come as a result of studying the effects of institutionalisation in the context of attachment (such as Rutter and Zeanah’s studies)","a":"Improvement to the way children are cared for in institutions like hospitals and orphanages. Key worker for kids in orphanages, and parents now allowed more visitation in hospitals.","t":"Attachment"},{"id":653,"q":"In Rutter’s ERA project, children could not be randomly allocated to conditions. Explain what is meant by this and what issue it causes. (attachment)","a":"Children were either adopted or not adopted, but the researchers did not manipulate this variable themselves (this would be unethical). The issue with this is that it may have led to a ‘confounding variable’ of the more social children being the ones that were adopted early, and also being the ones that made the most improvements. = It makes it look like there was an effect of the age of adoption, but there might not have been.","t":"Attachment"},{"id":654,"q":"Match the three types of attachment to the role in childhood relationships; bully, victim of bullying, not involved","a":"INSECURE AVOIDANT - Victim, INSECURE RESISTANT - bully, SECURE - not involved","t":"Attachment"},{"id":655,"q":"What did Hazan and Shaver find about adult relationships and attachment in childhood?","a":"Childhood attachment is reflected in the later romantic relationships. = There is an association between secure attachments and long lasting relationships, avoidant attachment and jealousy/fear of intimacy.","t":"Attachment"},{"id":656,"q":"How does attachment style affect your parenting?","a":"The majority of people parent the same way they were, so will have the same attachment classification to their babies as they will their mothers (internal working model).","t":"Attachment"},{"id":657,"q":"What are the two parts of the human nervous system?","a":"Central Nervous System (CNS) and Peripheral Nervous System (SNS)","t":"Biopsychology"},{"id":658,"q":"What structures make up the CNS?","a":"Brain and spinal cord","t":"Biopsychology"},{"id":659,"q":"What is the function of the CNS?","a":"Origin of all complex commands and decisions – connects the nerves of the peripheral nervous system to the brain and spinal cord.","t":"Biopsychology"},{"id":660,"q":"What type of action is controlled from the spinal cord?","a":"Reflex actions","t":"Biopsychology"},{"id":661,"q":"What is the function of the peripheral nervous system?","a":"Sends information from receptors (outside info) to the CNS, and transmits information from the CNS to the effectors (muscles or glands)","t":"Biopsychology"},{"id":662,"q":"What are the two subsections of the peripheral nervous system?","a":"Autonomic Nervous System and Somatic Nervous System","t":"Biopsychology"},{"id":663,"q":"Which part of the nervous system is the autonomic nervous system part of?","a":"Peripheral nervous system","t":"Biopsychology"},{"id":664,"q":"Which part of the nervous system is the somatic nervous system part of?","a":"Peripheral nervous system","t":"Biopsychology"},{"id":665,"q":"What is the function of the somatic nervous system?","a":"Carries sensory and motor information to and from the spinal cord, controls voluntary muscle movement","t":"Biopsychology"},{"id":666,"q":"What is the function of the autonomic nervous system?","a":"Transmits information to and from internal bodily organs, controls automatic involuntary processes like breathing/heart rate etc.","t":"Biopsychology"},{"id":667,"q":"What are the two branches of the autonomic nervous system?","a":"Sympathetic and Parasympathetic","t":"Biopsychology"},{"id":668,"q":"Which part of the nervous system is the sympathetic nervous system part of?","a":"Autonomic nervous system","t":"Biopsychology"},{"id":669,"q":"Which part of the nervous system is the parasympathetic nervous system part of?","a":"Autonomic nervous system","t":"Biopsychology"},{"id":670,"q":"What is the role of the sympathetic nervous system?","a":"Prepares the body to expend energy e.g. for fight or flight","t":"Biopsychology"},{"id":671,"q":"What is the role of the parasymptathetic nervous system?","a":"State in which the body maintains body functions and conserves energy as much as possible","t":"Biopsychology"},{"id":672,"q":"What takes place in the body when it is in the sympathetic state?","a":"Digestion inhibited, saliva production inhibited, blood diverted from surface of the skin, energy release focused on heart and lungs to prepare body for action, pupils dilate","t":"Biopsychology"},{"id":673,"q":"What takes place in the body when it is in the parasympathetic state?","a":"Digestion increases, saliva production increases, heart rate decreases, pupils constrict","t":"Biopsychology"},{"id":674,"q":"What is a neuron?","a":"A nerve cell that transmits messages as an electrical signal","t":"Biopsychology"},{"id":675,"q":"What are the branch like structures that stick out from the cell body and carry impulses from neighbouring neurons towards the cell body?","a":"Dendrites","t":"Biopsychology"},{"id":676,"q":"What is the name of the fatty layer that protects the axon and speeds up electrical transmission?","a":"Myelin Sheath","t":"Biopsychology"},{"id":677,"q":"What is the axon?","a":"The branch extending from the cell body that carries impulses away from it towards the terminal buttons.","t":"Biopsychology"},{"id":678,"q":"What is the purpose of the nodes of ranvier (gaps between the myelin sheath)?","a":"Speeds up the signal transmission","t":"Biopsychology"},{"id":679,"q":"What are the three types of neuron?","a":"Sensory, Relay, Motor","t":"Biopsychology"},{"id":680,"q":"What is the role of the sensory neuron?","a":"Carries messages from the peripheral nervous system (receptors) to the central nervous system","t":"Biopsychology"},{"id":681,"q":"What are the axon and dendrite lengths like on a sensory neuron?","a":"Long dendrites, short axons","t":"Biopsychology"},{"id":682,"q":"What is the role of a relay neuron?","a":"Transfers messages from sensory neurons to other relay or motor neurons","t":"Biopsychology"},{"id":683,"q":"What are the axon and dendrite lengths like on a relay neuron?","a":"Short dendrites, short axons","t":"Biopsychology"},{"id":684,"q":"What is the role of a motor neuron?","a":"Carries messages from the central nervous system to effectors (muscles and glands)","t":"Biopsychology"},{"id":685,"q":"What are the axon and dendrite lengths like on a motor neuron?","a":"Short dendrites, long axons","t":"Biopsychology"},{"id":686,"q":"What are the stages of the reflex arc? Use as many specialist terms as possible.","a":"Stimulus detected by sense organs (receptors) in peripheral nervous system, Sense organs cause signal to be sent along sensory neuron and into the central nervous system, Sensory neuron synapses (connects) with a relay neuron, Relay neuron synapses with a motor neuron, Motor neuron carries signal to an effector, Effector carries out reflex response","t":"Biopsychology"},{"id":687,"q":"How are signals within neurons transmitted?","a":"Electrically","t":"Biopsychology"},{"id":688,"q":"How are signals between neurons transmitted?","a":"Chemically","t":"Biopsychology"},{"id":689,"q":"What is a synapse?","a":"The gap between neurons","t":"Biopsychology"},{"id":690,"q":"Describe the process of synaptic transmission. Use as many specialist terms as possible.","a":"Electrical impulse reaches the terminal button of the axon of the presynaptic neuron. This triggers the release of neurotransmitters from synaptic vesicles. Neurotransmitters diffuse across the synaptic cleft (from high to low concentration). Neurotransmitters bind with the receptor sites on the dendrite of the post synaptic neuron. Influence of excitatory and inhibitory neurotransmitters undergo summation to determine if an electrical signal is generated or stopped in the post synaptic neuron. Neurotransmitters are released from the receptor sites and are broken down or reabsorbed by the presynaptic neuron.","t":"Biopsychology"},{"id":691,"q":"What are neurotransmitters?","a":"Chemical messengers that diffuse across synapses, can be excitatory or inhibitory.","t":"Biopsychology"},{"id":692,"q":"What effect does an excitatory neurotransmitter have?","a":"It increase the positive charge in the neuron making it more likely to fire.","t":"Biopsychology"},{"id":693,"q":"What effect does an inhibitory neurotransmitter have?","a":"It increases the negative charge of the neuron making it less likely to fire.","t":"Biopsychology"},{"id":694,"q":"What is the endocrine system?","a":"Collection of gland and hormones that regulate metabolism, growth and development, sexual function, sleep, mood etc.","t":"Biopsychology"},{"id":695,"q":"What is the main difference between the endocrine system and the nervous system?","a":"Endocrine system controls slow processes, nervous system controls much faster processes.","t":"Biopsychology"},{"id":696,"q":"What is a gland?","a":"An organ in the body that creates a substance such as hormones","t":"Biopsychology"},{"id":697,"q":"Give an example of a gland and its function","a":"Any from; Thyroid gland – produces thyroxine that increases metabolism. Testes – produce testosterone that controls secondary sexual characterstics in males, and sperm production. Ovaries – produce oestrogen and progesterone that controls the menstrual cycle in females. Pancreas – produces insulin that controls blood sugar levels. Pituitary gland – master gland that controls all other glands, produces hormones like follicle stimulating hormone involved in the control of the menstrual cycle. Adrenal glands – adrenaline and cortisol control the fight or flight and stress responses.","t":"Biopsychology"},{"id":698,"q":"What is a hormone?","a":"Chemical substance secreted into the bloodstream that affects target organs (have cells with the correct receptors)","t":"Biopsychology"},{"id":699,"q":"What is the role of the adrenal glands?","a":"Release adrenaline to prepare the body for the fight or flight response, causes constriction of blood vessels in digestive system to divert blood supply to the heart and lungs.","t":"Biopsychology"},{"id":700,"q":"What are the stages of the fight or flight response?","a":"Stressor identified. Hypothalamus triggers autonomic nervous system to change from parasympathetic to sympathetic state. Adrenaline released from the adrenal medulla into the bloodstream. Adrenaline triggers physiological changes in target organs. Once threat has passed the parasympathetic nervous system returns the body to resting state.","t":"Biopsychology"},{"id":701,"q":"Define localisation of function","a":"The theory that different parts of the brain are responsible for different behaviours, processes or activities.","t":"Biopsychology"},{"id":702,"q":"What are the two sides of the brain called?","a":"Hemispheres","t":"Biopsychology"},{"id":703,"q":"What are the four lobes of the brain?","a":"Frontal, parietal, occipital and temporal","t":"Biopsychology"},{"id":704,"q":"What is the outer layer of the brain called?","a":"Cortex","t":"Biopsychology"},{"id":705,"q":"What system is found within the middle of the brain?","a":"Limbic system – made up of amygdala, hypothalamus and thalamus – critical for memory formation and emotional processes","t":"Biopsychology"},{"id":706,"q":"What are the ridges of the brain called?","a":"Gyrus/gyri","t":"Biopsychology"},{"id":707,"q":"What are the troughs/dips in the brain called?","a":"Sulcus/sulci","t":"Biopsychology"},{"id":708,"q":"What is white matter in the brain made up of?","a":"Axons","t":"Biopsychology"},{"id":709,"q":"What is the grey matter in the brain made up of?","a":"Cell bodies of neurons","t":"Biopsychology"},{"id":710,"q":"What is the job of the hippocampus?","a":"One on each side of the brain, responsible for consolidation of learning/memory, and spatial memory/navigation.","t":"Biopsychology"},{"id":711,"q":"What is the hypothalamus?","a":"The structure in the brain that links the nervous system and endocrine system through control of the pituitary gland.","t":"Biopsychology"},{"id":712,"q":"What is the motor area of the brain and where is it?","a":"Back of frontal lobe, involved in regulating movement","t":"Biopsychology"},{"id":713,"q":"What is the somatosensory area of the brain and where is it?","a":"Front of the parietal lobe, processes sensory information such as touch","t":"Biopsychology"},{"id":714,"q":"What is the visual area of the brain and where is it?","a":"In the occipital lobe, receives and processes visual information","t":"Biopsychology"},{"id":715,"q":"What is the auditory area of the brain and where is it?","a":"Temporal lobe, concerned with analysis of spee
