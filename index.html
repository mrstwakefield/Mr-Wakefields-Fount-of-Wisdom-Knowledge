'antagonist' mean in drug therapy?","a":"A drug that blocks receptors and reduces a neurotransmitter's action","t":"Schizophrenia","id":3619},{"q":"What does 'agonist' mean in drug therapy?","a":"A drug that stimulates receptors and increases a neurotransmitter's action","t":"Schizophrenia","id":3620},{"q":"Why can amphetamines produce psychosis?","a":"They increase dopamine activity, mimicking the effects of hyperdopaminergia","t":"Schizophrenia","id":3621},{"q":"Why might cannabis increase the risk of schizophrenia?","a":"It affects dopamine activity and may act as a stressor for vulnerable people","t":"Schizophrenia","id":3622},{"q":"What is the role of stress in relapse?","a":"Stressful life events and high expressed emotion can trigger the return of symptoms","t":"Schizophrenia","id":3623},{"q":"Why is expressed emotion linked to the diathesis-stress model?","a":"High EE is an environmental stressor that can trigger or worsen symptoms in vulnerable people","t":"Schizophrenia","id":3624},{"q":"What is 'emotional over-involvement' in expressed emotion?","a":"Family members being overly protective or intrusive, e.g. sacrificing their own needs","t":"Schizophrenia","id":3625},{"q":"Why might family therapy reduce expressed emotion?","a":"It educates families about schizophrenia and teaches them to communicate more calmly","t":"Schizophrenia","id":3626},{"q":"What is 'coping strategy enhancement' in CBT?","a":"Helping patients develop strategies to manage symptoms, e.g. distraction from voices","t":"Schizophrenia","id":3627},{"q":"Why might CBT for schizophrenia be criticised as reductionist?","a":"It focuses on thoughts and may ignore biological causes","t":"Schizophrenia","id":3628},{"q":"Why might drug therapy be criticised as reductionist?","a":"It treats schizophrenia as a chemical imbalance, ignoring psychological and social factors","t":"Schizophrenia","id":3629},{"q":"Why might drug therapy be criticised as deterministic?","a":"It implies patients have no control over their illness","t":"Schizophrenia","id":3630},{"q":"What did Turkington et al. (2006) argue?","a":"That a combination of drugs and CBT is likely to be more effective than either alone","t":"Schizophrenia","id":3631},{"q":"Why might interactionist treatments be costly?","a":"They combine drugs with therapy, needing more professional time","t":"Schizophrenia","id":3632},{"q":"Why is it important that treatment for schizophrenia is long-term?","a":"Schizophrenia is often chronic and relapse is common if treatment stops","t":"Schizophrenia","id":3633},{"q":"What is 'community care'?","a":"Treating people with mental illness in the community rather than in long-stay hospitals","t":"Schizophrenia","id":3634},{"q":"Why might early intervention help schizophrenia?","a":"Treating symptoms early may improve outcomes and reduce the duration of untreated psychosis","t":"Schizophrenia","id":3635},{"q":"What is 'duration of untreated psychosis'?","a":"The time between the onset of symptoms and starting treatment; longer durations predict worse outcomes","t":"Schizophrenia","id":3636},{"q":"What is the significance of Rosenhan's study for validity?","a":"It suggests clinicians could not distinguish sane from insane, questioning the validity of diagnosis","t":"Schizophrenia","id":3637},{"q":"Why is gender bias in diagnosis important?","a":"It could mean women are under-diagnosed and don't receive treatment","t":"Schizophrenia","id":3638},{"q":"Why might psychiatrists be influenced by the patient's culture?","a":"Unfamiliar beliefs and behaviour may be misread as symptoms","t":"Schizophrenia","id":3639},{"q":"What is the biopsychosocial model?","a":"A model that explains mental illness through the interaction of biological, psychological and social factors","t":"Schizophrenia","id":3640},{"q":"Why is it hard to research the causes of schizophrenia?","a":"It develops over time, and many factors interact, so it is hard to isolate causes","t":"Schizophrenia","id":3641},{"q": ully, leave few clues and may be forensically aware","t":"Forensic Psychology","id":3653},{"q":"What is 'staging' at a crime scene?","a":"When an offender alters the scene to mislead investigators","t":"Forensic Psychology","id":3654},{"q":"Why is the organised/disorganised distinction said to be a continuum?","a":"Most crime scenes show a mix of features","t":"Forensic Psychology","id":3655},{"q":"What is the heritability of antisocial behaviour estimated at?","a":"Around 40–50% according to meta-analyses (e.g. Rhee and Waldman, 2002)","t":"Forensic Psychology","id":3656},{"q":"Why might adoption studies be better than twin studies for offending?","a":"They separate the influence of genes from the environment","t":"Forensic Psychology","id":3657},{"q":"Why might adopted children still share environment with biological parents?","a":"They may have been adopted late or placed with relatives","t":"Forensic Psychology","id":3658},{"q":"What is the role of serotonin in offending?","a":"Low serotonin is linked to impulsivity and aggression","t":"Forensic Psychology","id":3659},{"q":"Why might neural explanations be useful?","a":"They may lead to treatments or early identification of risk","t":"Forensic Psychology","id":3660},{"q":"Why might neural explanations be dangerous?","a":"They could be used to label or detain people who haven't offended","t":"Forensic Psychology","id":3661},{"q":"What is 'the criminal personality'?","a":"Eysenck's idea that offenders share a distinct personality type high in E, N and P","t":"Forensic Psychology","id":3662},{"q":"What is the 'lie scale' in the EPQ?","a":"Items that detect whether respondents are answering dishonestly or in a socially desirable way","t":"Forensic Psychology","id":3663},{"q":"Why might the EPQ be limited in prisons?","a":"Prisoners may answer dishonestly, and personality may be affected by prison life","t":"Forensic Psychology","id":3664},{"q":"What is 'moral development'?","a":"The process by which people develop more sophisticated reasoning about right and wrong","t":"Forensic Psychology","id":3665},{"q":"Why might offenders have lower moral reasoning?","a":"They may not have developed beyond seeking reward and avoiding punishment, often due to limited social experience","t":"Forensic Psychology","id":3666},{"q":"Why is cognitive explanation of offending less deterministic than biological?","a":"It suggests thinking can be changed through therapy","t":"Forensic Psychology","id":3667},{"q":"Why might hostile attribution bias develop?","a":"Through exposure to violence or rejection in childhood","t":"Forensic Psychology","id":3668},{"q":"What is the link between hostile attribution bias and anger management?","a":"Anger management helps offenders reinterpret others' behaviour as non-hostile","t":"Forensic Psychology","id":3669},{"q":"Why might differential association theory explain crime in families?","a":"Children learn pro-criminal attitudes from family members","t":"Forensic Psychology","id":3670},{"q":"Why does DAT struggle to explain impulsive crimes?","a":"It focuses on learned attitudes and techniques, not spontaneous acts","t":"Forensic Psychology","id":3671},{"q":"Why might prison increase reoffending?","a":"Prisoners may lose social ties, jobs and housing, and learn criminal techniques","t":"Forensic Psychology","id":3672},{"q":"What is 'rehabilitation' in practice?","a":"Education, training, therapy and drug treatment to reduce the likelihood of reoffending","t":"Forensic Psychology","id":3673},{"q":"Why is it hard to measure deterrence?","a":"We cannot easily know how many people would have offended without the threat of prison","t":"Forensic Psychology","id":3674},{"q":"Why might some prisoners feel prison is not a deterrent?","a":"They may have poor living conditions outside, or social ties in prison","t":"Forensic Psychology","id":3675},{"q":"What is 'depression' in the context of prison?","a":"A common psychological effect of custody, linked to isolation and loss of control","t":"Forensic Psychology","id":3676},{"q":"Why are young offenders especially vulnerable in prison?","a":"They are still developing and may be more affected by violence, bullying and isolation","t":"Forensic Psychology","id":3677},{"q":"What is a 'baseline' in a token economy?","a":"Measuring behaviour before the programme starts, to compare with later behaviour","t":"Forensic Psychology","id":3678},{"q":"Why must token economy rewards be meaningful?","a":"If prisoners don't value the rewards, behaviour won't change","t":"Forensic Psychology","id":3679},{"q":"What is 'response cost'?","a":"Removing tokens for undesirable behaviour","t":"Forensic Psychology","id":3680},{"q":"Why might token economies not address the cause of offending?","a":"They change behaviour in prison but don't change underlying attitudes or thinking","t":"Forensic Psychology","id":3681},{"q":"What is 'self-talk' in anger management?","a":"Using calming statements to oneself to reduce anger in trigger situations","t":"Forensic Psychology","id":3682},{"q":"Why is anger management based on CBT?","a":"It aims to change angry thoughts (cognitive) and behaviours (behavioural)","t":"Forensic Psychology","id":3683},{"q":"Why might restorative justice reduce reoffending?","a":"Offenders develop empathy by seeing the harm they caused","t":"Forensic Psychology","id":3684},{"q":"Why might restorative justice benefit society?","a":"It can reduce reoffending and costs, and increase public confidence in justice","t":"Forensic Psychology","id":3685},{"q":"Why might restorative justice be seen as a 'soft option'?","a":"Some see it as replacing punishment rather than adding to it","t":"Forensic Psychology","id":3686},{"q":"What role does the mediator play in restorative justice?","a":"They prepare both sides, manage the meeting and ensure it is safe and constructive","t":"Forensic Psychology","id":3687}];
const TOPICS = [
  {key:"Social Influence", name:"Social influence", c:"#E0533D"},
  {key:"Memory", name:"Memory", c:"#3B7DD8"},
  {key:"Attachment", name:"Attachment", c:"#D6478F"},
  {key:"Psychopathology", name:"Psychopathology", c:"#7B5BE0"},
  {key:"Approaches", name:"Approaches", c:"#D98E0F"},
  {key:"Biopsychology", name:"Biopsychology", c:"#1E9E74"},
  {key:"RM", name:"Research methods", c:"#2596B0"},
  {key:"Issues and Debates part I", name:"Issues & debates", c:"#9A7440"},
  {key:"Relationships", name:"Relationships", c:"#6E9E1E"},
  {key:"Schizophrenia", name:"Schizophrenia", c:"#4A58B8"},
  {key:"Forensic Psychology", name:"Forensic", c:"#52525B"}
];
const TMAP = Object.fromEntries(TOPICS.map(t=>[t.key,t]));
const BY_ID = Object.fromEntries(DATA.map(d=>[d.id,d]));

/* ---------- storage ---------- */
const KEY = "rr-psych-v1";
let store = {p:{}, sel:TOPICS.map(t=>t.key), all:TOPICS.map(t=>t.key)};
try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && s.p){ store.p = s.p; if(Array.isArray(s.sel)){ const seen=new Set(Array.isArray(s.all)?s.all:s.sel.concat(["Social Influence","Memory","Attachment","Psychopathology","Approaches","Biopsychology","RM","Issues and Debates part I"])); store.sel = [...new Set(s.sel.map(k=>k.startsWith("Issues and Debates")?"Issues and Debates part I":k))].filter(k=>TMAP[k]).concat(TOPICS.map(t=>t.key).filter(k=>!seen.has(k))); } } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
const status = id => store.p[id] || "";
function mark(id, s){ if(s) store.p[id]=s; else delete store.p[id]; save(); renderMeter(); renderChips(); }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function splitTop(s){ const out=[]; let d=0, cur=""; for(let i=0;i<s.length;i++){const ch=s[i]; if(ch==="(")d++; if(ch===")")d=Math.max(0,d-1); if(ch===","&&d===0&&s[i+1]===" "){out.push(cur.trim());cur="";i++;continue;} cur+=ch;} if(cur.trim())out.push(cur.trim()); return out; }
function fmtAnswer(a,id){
  const parts = splitTop(a);
  if(parts.length>=2 && parts.every(p=>p.length<95 && !/\.\s/.test(p)) && (!(id>=1000) || parts.every(p=>/^[A-Z0-9]/.test(p)))){
    return "<ul>"+parts.map(p=>"<li>"+esc(p.charAt(0).toUpperCase()+p.slice(1))+"</li>").join("")+"</ul>";
  }
  return "<p style='margin:0'>"+esc(a)+"</p>";
}
function pool(){ const s=new Set(store.sel); return DATA.filter(d=>s.has(d.t)); }

/* ---------- meter + chips ---------- */
$("#totalQ").textContent = DATA.length;
function renderMeter(){
  let k=0,l=0; DATA.forEach(d=>{const s=status(d.id); if(s==="k")k++; else if(s==="l")l++;});
  $("#knownCount").textContent=k; $("#learningCount").textContent=l;
  $("#stack").innerHTML = `<i style="width:${k/DATA.length*100}%;background:var(--good)"></i><i style="width:${l/DATA.length*100}%;background:var(--warn);opacity:.7"></i>`;
}
function renderChips(){
  $("#chips").innerHTML = TOPICS.map(t=>{
    const items = DATA.filter(d=>d.t===t.key); const k = items.filter(d=>status(d.id)==="k").length;
    const on = store.sel.includes(t.key);
    return `<button class="chip" style="--c:${t.c}" aria-pressed="${on}" data-key="${esc(t.key)}"><span class="row"><span class="dot"></span>${esc(t.name)}</span><span class="foot2"><span class="bar"><i style="width:${items.length?k/items.length*100:0}%"></i></span><span class="n">${k}/${items.length}</span></span></button>`;
  }).join("");
}
$("#chips").addEventListener("click", e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  const k=b.dataset.key; store.sel = store.sel.includes(k)? store.sel.filter(x=>x!==k) : [...store.sel,k];
  save(); renderChips(); topicsChanged();
});
$("#allTopics").onclick=()=>{store.sel=TOPICS.map(t=>t.key);save();renderChips();topicsChanged();};
$("#noTopics").onclick=()=>{store.sel=[];save();renderChips();topicsChanged();};
function topicsChanged(){ newDeck(); if(quiz.phase!=="run") renderQuiz(); renderBrowse(); }

/* ---------- tabs ---------- */
let tab="cards";
document.querySelectorAll("[role=tab]").forEach(b=>b.addEventListener("click",()=>{
  tab=b.dataset.tab;
  document.querySelectorAll("[role=tab]").forEach(x=>x.setAttribute("aria-selected", x===b));
  document.querySelectorAll(".panel").forEach(p=>p.hidden = p.id!=="p-"+tab);

/* ---------- flashcards ---------- */
let filter="all", deck=[], pos=0, flipped=false, sessionRes={};
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{
  filter=b.dataset.filter; document.querySelectorAll("[data-filter]").forEach(x=>x.setAttribute("aria-pressed",x===b)); newDeck();
}));
$("#shuffleBtn").onclick=newDeck;
function newDeck(){
  let p = pool();
  if(filter==="notknown") p=p.filter(d=>status(d.id)!=="k");
  if(filter==="learning") p=p.filter(d=>status(d.id)==="l");
  deck=shuffle(p).map(d=>d.id); pos=0; flipped=false; sessionRes={}; renderCard();
}
function renderCard(){
  const area=$("#cardArea");
  if(!store.sel.length){ area.innerHTML=`<div class="empty"><h3>Pick a topic to start</h3><p>Tap one or more topics above and your flashcards will appear here.</p></div>`; return; }
  if(!deck.length){
    const msg = filter==="learning" ? ["Nothing marked as still learning","When you mark a card as still learning, it will show up here so you can go over it again."] : ["You know every card here","Every question in these topics is marked as known. Try another topic, or switch to all cards for a refresher."];
    area.innerHTML=`<div class="empty"><h3>${msg[0]}</h3><p>${msg[1]}</p></div>`; return;
  }
  if(pos>=deck.length){
    const vals=Object.values(sessionRes), k=vals.filter(v=>v==="k").length, l=vals.filter(v=>v==="l").length;
    area.innerHTML=`<div class="empty"><h3>Deck finished</h3><p>You marked ${k} as got it and ${l} as still learning.${l?" Go round again on the ones that didn't stick yet.":" Nice work."}</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${l?'<button class="btn" id="againL">Go again: still learning</button>':''}<button class="btn ghost" id="againAll">Shuffle a new deck</button></div></div>`;
    const a=$("#againL"); if(a) a.onclick=()=>{ deck=shuffle(Object.keys(sessionRes).filter(id=>sessionRes[id]==="l").map(Number)); pos=0; sessionRes={}; flipped=false; renderCard(); };
    $("#againAll").onclick=newDeck; return;
  }
  const d=BY_ID[deck[pos]], t=TMAP[d.t], st=status(d.id);
  const stLabel = st==="k"?'<span class="pill k">Known</span>':st==="l"?'<span class="pill l">Still learning</span>':'';
  area.innerHTML=`
    <div class="progressline"><i style="width:${pos/deck.length*100}%"></i></div>
    <div class="stage">
      <div class="card ${flipped?"flipped":""}" id="card" style="--c:${t.c}" tabindex="0" role="button" aria-label="Flashcard. Press to ${flipped?"see the question":"reveal the answer"}">
        <div class="face front" aria-hidden="${flipped}">
          <div class="tag">${esc(t.name)} <span class="muted">Card ${pos+1} of ${deck.length}</span></div>
          <div class="q">${esc(d.q)}</div>
          <div class="hint">Say or write your answer, then tap the card to check. ${stLabel}</div>
        </div>
        <div class="face back" aria-hidden="${!flipped}">
          <div class="tag">Answer <span class="muted">Card ${pos+1} of ${deck.length}</span></div>
          <div class="q-small">${esc(d.q)}</div>
          <div class="a">${fmtAnswer(d.a,d.id)}</div>
        </div>
      </div>
    </div>
    <div class="card-actions">
      <div class="nav"><button id="prevC" aria-label="Previous card" ${pos===0?"disabled":""}>‹</button><button id="nextC" aria-label="Skip to next card">›</button></div>
      <span id="acts" style="display:contents">${actionsHTML()}</span>
    </div>`;
  const card=$("#card");
  card.onclick=flip; card.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();flip();} };
  $("#prevC").onclick=()=>{ if(pos>0){pos--;flipped=false;renderCard();} };
  $("#nextC").onclick=()=>{ pos++;flipped=false;renderCard(); };
  wireActions();
}
function actionsHTML(){ return flipped
  ? `<button class="btn warn" id="learnBtn">Still learning<kbd>1</kbd></button><button class="btn good" id="gotBtn">Got it<kbd>2</kbd></button>`
  : `<button class="btn" id="flipBtn">Show answer<kbd>Space</kbd></button>`; }
function wireActions(){ if(flipped){ $("#learnBtn").onclick=()=>rate("l"); $("#gotBtn").onclick=()=>rate("k"); } else $("#flipBtn").onclick=flip; }
function flip(){
  const c=$("#card"); if(!c) return;
  const hadFocus = document.activeElement && ["flipBtn","gotBtn","learnBtn"].includes(document.activeElement.id);
  flipped=!flipped; c.classList.toggle("flipped",flipped);
  c.querySelector(".front").setAttribute("aria-hidden",flipped); c.querySelector(".back").setAttribute("aria-hidden",!flipped);
  c.setAttribute("aria-label","Flashcard. Press to "+(flipped?"see the question":"reveal the answer"));
  $("#acts").innerHTML=actionsHTML(); wireActions();
  if(hadFocus) $(flipped?"#gotBtn":"#flipBtn").focus({preventScroll:true});
}
function rate(s){ const id=deck[pos]; sessionRes[id]=s; mark(id,s); pos++; flipped=false; renderCard(); const b=$("#flipBtn"); if(b) b.focus({preventScroll:true}); }
document.addEventListener("keydown",e=>{
  if(tab!=="cards" || e.target.matches("input,textarea") || e.metaKey||e.ctrlKey||e.altKey) return;
  if(pos>=deck.length) return;
  if(e.key===" "){ e.preventDefault(); flip(); }
  else if(flipped && e.key==="1") rate("l");
  else if(flipped && e.key==="2") rate("k");
  else if(e.key==="ArrowRight"){ pos++; flipped=false; renderCard(); }
  else if(e.key==="ArrowLeft" && pos>0){ pos--; flipped=false; renderCard(); }
});

/* ---------- quiz ---------- */
const quiz={phase:"setup", size:10, items:[], i:0, shown:false, answers:[], marks:[]};
function renderQuiz(){
  const area=$("#quizArea");
  if(quiz.phase==="setup"){
    const n=pool().length;
    area.innerHTML=`<div class="empty">
      <h3>Quick quiz</h3>
      <p>Get a random set of questions from your chosen topics. Write your answer, check it against the mark scheme, then be honest about whether you got it.</p>
      <div class="size-pick" role="group" aria-label="Number of questions">${[6,8,10].map(s=>`<button aria-pressed="${quiz.size===s}" data-size="${s}" aria-label="${s} questions">${s}</button>`).join("")}</div>
      <button class="btn" id="startQuiz" ${n?"":"disabled"}>Start ${quiz.size}-question quiz</button>
      ${n?"":'<p style="margin-top:14px">Pick at least one topic above first.</p>'}
    </div>`;
    area.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{quiz.size=+b.dataset.size;renderQuiz();});
    const s=$("#startQuiz"); if(s) s.onclick=()=>{ quiz.items=shuffle(pool()).slice(0,quiz.size).map(d=>d.id); quiz.i=0; quiz.shown=false; quiz.answers=[]; quiz.marks=[]; quiz.phase="run"; renderQuiz(); const ta=$("#qAns"); if(ta) ta.focus(); };
    return;
  }
  if(quiz.phase==="run"){
    const d=BY_ID[quiz.items[quiz.i]], t=TMAP[d.t], mine=quiz.answers[quiz.i]||"";
    area.innerHTML=`
      <div class="progressline"><i style="width:${quiz.i/quiz.items.length*100}%"></i></div>
      <div class="quiz-q" style="--c:${t.c}">
        <div class="tag">${esc(t.name)} <span class="muted">Question ${quiz.i+1} of ${quiz.items.length}</span></div>
        <div class="q">${esc(d.q)}</div>
        ${quiz.shown
          ? `<div class="compare"><div><h4>Your answer</h4>${mine?esc(mine).replace(/\n/g,"<br>"):'<span class="muted">You didn\'t write anything.</span>'}</div><div class="model"><h4>Model answer</h4><div class="a" style="font-size:17px">${fmtAnswer(d.a,d.id)}</div></div></div>
             <div class="card-actions"><button class="btn warn" id="qNo">Not quite</button><button class="btn good" id="qYes">I got it</button></div>`
          : `<label for="qAns" class="muted" style="display:block;margin-bottom:6px;font-size:15px">Your answer</label>
             <textarea id="qAns" placeholder="Write what you remember">${esc(mine)}</textarea>
             <div class="card-actions"><button class="btn" id="qShow">Check answer</button></div>`}
      </div>
      <p style="text-align:right;margin-top:10px"><button class="linkbtn" id="qQuit">Quit quiz</button></p>`;
    $("#qQuit").onclick=()=>{quiz.phase="setup";renderQuiz();};
    if(quiz.shown){
      const next=ok=>{ quiz.marks[quiz.i]=ok; mark(d.id, ok?"k":"l"); quiz.i++; quiz.shown=false; if(quiz.i>=quiz.items.length) quiz.phase="done"; renderQuiz(); const ta=$("#qAns"); if(ta) ta.focus(); };
      $("#qYes").onclick=()=>next(true); $("#qNo").onclick=()=>next(false);
      $("#qYes").focus({preventScroll:true});
    } else {
      $("#qShow").onclick=()=>{ quiz.answers[quiz.i]=$("#qAns").value.trim(); quiz.shown=true; renderQuiz(); };
    }
    return;
  }
  const score=quiz.marks.filter(Boolean).length, n=quiz.items.length;
  area.innerHTML=`<div class="empty">
    <p class="score">${score}/${n}</p>
    <p style="margin-top:10px">${score===n?"Full marks. Everything here is now marked as known.":score>=n*0.7?"Solid. The ones you missed are saved as still learning.":"The ones you missed are saved as still learning, so you can drill them in Flashcards."}</p>
    <ul class="results">${quiz.items.map((id,i)=>{const d=BY_ID[id];return `<li class="${quiz.marks[i]?"ok":"no"}"><b>${esc(d.q)}</b>${quiz.marks[i]?"":`<div class="ans">${esc(d.a)}</div>`}</li>`}).join("")}</ul>
    <button class="btn" id="qAgain">New quiz</button>
  </div>`;
  $("#qAgain").onclick=()=>{quiz.phase="setup";renderQuiz();};
}

let bLimit=60;
$("#search").addEventListener("input",()=>{bLimit=60;renderBrowse();});
function hl(text,q){ const e=esc(text); if(!q) return e; const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"); return e.replace(re,"<mark>$1</mark>"); }
function renderBrowse(){
  const q=$("#search").value.trim(); const ql=q.toLowerCase();
  const items=pool().filter(d=>!ql || d.q.toLowerCase().includes(ql) || d.a.toLowerCase().includes(ql));
  $("#browseCount").textContent = items.length+" question"+(items.length===1?"":"s");
  const shown=items.slice(0,bLimit);
  $("#list").innerHTML = items.length ? shown.map(d=>{
    const t=TMAP[d.t], st=status(d.id);
    return `<details class="item" style="--c:${t.c}" data-id="${d.id}" ${ql&&d.a.toLowerCase().includes(ql)&&!d.q.toLowerCase().includes(ql)?"open":""}>
      <summary><span class="num">${d.id}</span><span class="qt">${hl(d.q,q)}</span>${st==="k"?'<span class="pill k">Known</span>':st==="l"?'<span class="pill l">Learning</span>':''}</summary>
      <div class="body"><div class="a">${ql?"<p style='margin:0'>"+hl(d.a,q)+"</p>":fmtAnswer(d.a,d.id)}</div>
      <div class="mini"><button data-s="l" aria-pressed="${st==="l"}">Still learning</button><button data-s="k" aria-pressed="${st==="k"}">Known</button></div></div>
    </details>`;}).join("")
    : `<div class="empty"><h3>No matches</h3><p>${store.sel.length?"Try a different word, or select more topics above.":"Pick at least one topic above to see its questions."}</p></div>`;
  $("#moreWrap").innerHTML = items.length>bLimit ? `<button class="btn ghost" id="more">Show more (${items.length-bLimit} left)</button>` : "";
  const m=$("#more"); if(m) m.onclick=()=>{bLimit+=120;renderBrowse();};
}
$("#list").addEventListener("click",e=>{
  const b=e.target.closest(".mini button"); if(!b) return;
  const det=b.closest(".item"), id=+det.dataset.id, s=b.dataset.s;
  mark(id, status(id)===s? "" : s);
  const st=status(id);
  det.querySelectorAll(".mini button").forEach(x=>x.setAttribute("aria-pressed", x.dataset.s===st));
  const sum=det.querySelector("summary"); const old=sum.querySelector(".pill"); if(old) old.remove();
  if(st) sum.insertAdjacentHTML("beforeend", st==="k"?'<span class="pill k">Known</span>':'<span class="pill l">Learning</span>');
});

/* ---------- reset ---------- */
$("#resetBtn").onclick=()=>{ if(confirm("Clear all your known and still-learning marks? This can't be undone.")){ store.p={}; save(); renderMeter(); renderChips(); newDeck(); renderBrowse(); } };

renderMeter(); renderChips(); newDeck(); renderQuiz();
</script>
